const empty = (title,message,button='') => `<div class="empty"><h3>${E(title)}</h3><p>${E(message)}</p>${button}</div>`;
const ruleButton = id => { const r=byId('rules',id); return r ? `<button data-rule="${E(id)}"><span class="id">${E(id)}</span>${E(r.name)}</button>` : ''; };
const variableButton = id => { const v=byId('variables',id);return v?`<button data-variable="${E(id)}"><span class="id">${E(id)}</span> ${E(v.name)}</button>`:''; };
const relatedVars = rules => D.variables.filter(v => ARR(v.relatedRules).some(id => rules.includes(id)));
const allSources = ids => ARR(ids).map(id => D.sources.find(s => s.id === id)).filter(Boolean);
function sourceLinks(ids){return `<div class="source-links">${allSources(ids).map(s=>s.url?.startsWith('http')?`<a href="${E(s.url)}" target="_blank" rel="noopener noreferrer" title="${E(s.note||s.title)}">${E(s.title)}</a>`:`<button class="text-button" data-action="open-spec">${E(s.title)}</button>`).join('')}</div>`;}
function safeColor(c){return /^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#5267b6';}
function btn(action,label,cls=''){return `<button data-action="${E(action)}" class="${E(cls)}">${E(label)}</button>`;}
function pillTabs(values,key){return `<div class="segmented">${values.map(([id,label])=>`<button data-set="${E(key)}" data-value="${E(id)}" class="${state[key]===id?'active':''}" aria-pressed="${state[key]===id}">${E(label)}</button>`).join('')}</div>`;}
function heading(kicker,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${E(kicker)}</div><h1>${E(title)}</h1><p>${E(description)}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;}
function legend(){return `<div class="legend"><span>阅读口径</span>${['available','conditional','proposal','unsupported','unknown','empirical'].map(statusBadge).join('')}${btn('about','查看定义','text-button')}</div>`;}
function writeHash(){
 const id=state.view==='scenes'?state.goal:state.view==='basics'?(state.basic==='variables'?state.variable:state.basic==='rules'?state.rule:'foundations'):state.view==='compare'?state.compare:state.doc==='spec'?'spec-'+state.chapter:state.doc;
 const p=new URLSearchParams();p.set('langs',state.selected.join(','));if(state.filter!=='all')p.set('filter',state.filter);if(state.includeConditional)p.set('conditional','1');if(state.includeProposals)p.set('proposals','1');if(state.variableFilter)p.set('var',state.variableFilter);if(Object.keys(state.routeChoices||{}).length)p.set('routes',JSON.stringify(state.routeChoices));
 const hash=`#${state.view}/${id}?${p}`;try{if(location.hash!==hash)history.replaceState(null,'',hash);}catch{}
 try{localStorage.setItem('language-atlas-current-v1',JSON.stringify(state));}catch{}
}
function readHash(){
 if(!location.hash)return;
 const [route,query='']=location.hash.slice(1).split('?');const [view,id]=route.split('/');
 if(!['scenes','basics','compare','docs'].includes(view))return;state.view=view;
 if(view==='scenes'&&byId('goals',id))state.goal=id;
 if(view==='basics'){if(id==='foundations')state.basic='foundations';else if(byId('variables',id)){state.basic='variables';state.variable=id;}else if(byId('rules',id)){state.basic='rules';state.rule=id;}}
 if(view==='compare'&&['variables','goals'].includes(id))state.compare=id;
 if(view==='docs'){if(id?.startsWith('spec-')){state.doc='spec';state.chapter=id.slice(5);}else if(['guide','goal','workflow','syntax','sources','changes','verification'].includes(id))state.doc=id;}
 const p=new URLSearchParams(query);if(p.has('langs'))state.selected=p.get('langs').split(',').filter(x=>lang(x));
 if(p.has('filter')&&lang(p.get('filter')))state.filter=p.get('filter');else state.filter='all';
 state.includeConditional=p.get('conditional')==='1';state.includeProposals=p.get('proposals')==='1';state.variableFilter=byId('variables',p.get('var'))?p.get('var'):'';if(p.has('routes'))try{const choices=JSON.parse(p.get('routes'));state.routeChoices={};for(const [key,id]of Object.entries(choices)){const[g,l]=key.split(':');if(rawCov(g,l)?.alternatives?.some(a=>a.id===id))state.routeChoices[key]=id;}}catch{}
}
function renderLanguages(){
 $('language-bar').innerHTML=`<span class="language-label">并排比较</span><div class="language-choices">${D.languages.map(l=>`<label class="language-choice ${state.selected.includes(l.id)?'selected':''}" style="--lang:${safeColor(l.color)}" title="${E(l.scope||l.summary)}"><input type="checkbox" name="language" value="${E(l.id)}" ${state.selected.includes(l.id)?'checked':''}><span>${E(l.name)}</span>${l.id==='zil'?'<span class="mini">设计</span>':l.id==='hylo'?'<span class="mini">研发中</span>':''}</label>`).join('')}</div><div class="language-actions"><span class="count">已选 ${selected().length} / ${D.languages.length}</span>${btn('select-all','全选','text-button')}${btn('select-default','常用三种','text-button')}${btn('clear-selection','清空','text-button')}</div>`;
 document.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view===state.view;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false');});
}
function goalMatches(g){
 const q=state.search.trim().toLowerCase();const fields=[g.id,g.name,g.question,g.category,g.acceptance,g.boundary,...ARR(g.operations)];
 if(q&&!fields.join(' ').toLowerCase().includes(q))return false;
 if(state.category!=='all'&&g.category!==state.category)return false;
 if(state.variableFilter){const v=byId('variables',state.variableFilter);if(v&&!D.coverage.some(c=>c.goal===g.id&&c.rules.some(r=>v.relatedRules.includes(r))))return false;}
 if(state.filter==='all')return true;const c=cov(g.id,state.filter);return c&&(c.status==='available'||state.includeConditional&&c.status==='conditional'||state.includeProposals&&['proposal','empirical'].includes(c.status));
}
function groupedNav(items,type,active){
 let out='';for(const category of [...new Set(items.map(x=>x.category))]){out+=`<div class="group-heading">${E(category)}</div>`;out+=items.filter(x=>x.category===category).map(x=>`<button class="nav-item ${x.id===active?'active':''}" data-nav-type="${type}" data-id="${E(x.id)}" ${x.id===active?'aria-current="true"':''}><span class="id">${E(x.id)}</span><span>${E(x.name)}</span></button>`).join('');}return out;
}
function sceneSidebar(list){return `<aside class="sidebar ${state.catalogOpen?'':'collapsed'}" aria-label="场景目录"><div class="sidebar-top"><div class="sidebar-title"><span>场景目标</span><span class="muted">${list.length} / ${D.goals.length}</span></div><input id="catalog-search" class="search" placeholder="搜索场景，如删除、回调…" value="${E(state.search)}" aria-label="搜索场景"><label class="filter-label" for="language-filter">按已有方案筛选场景</label><select id="language-filter"><option value="all">全部场景目标</option>${D.languages.map(l=>`<option value="${l.id}" ${state.filter===l.id?'selected':''}>${E(l.name)} · 已有方案</option>`).join('')}</select>${state.filter!=='all'?`<label class="check-line"><input type="checkbox" id="include-conditional" ${state.includeConditional?'checked':''}>同时包含有条件 / 局部方案</label>${state.filter==='zil'?`<label class="check-line"><input type="checkbox" id="include-proposals" ${state.includeProposals?'checked':''}>同时包含 ZIL 规范路线与待实测目标</label>`:''}`:''}<label class="filter-label" for="category-filter">目标分类</label><select id="category-filter"><option value="all">全部分类</option>${[...new Set(D.goals.map(g=>g.category))].map(c=>`<option ${state.category===c?'selected':''}>${E(c)}</option>`).join('')}</select>${state.variableFilter?`<div class="filter-chip"><span>关联 ${E(byId('variables',state.variableFilter)?.name)}</span>${btn('clear-variable-filter','×','text-button')}</div>`:''}</div><button class="mobile-catalog" data-action="toggle-catalog">${state.catalogOpen?'收起':'展开'}场景目录（${list.length}）</button><div class="sidebar-list">${list.length?groupedNav(list,'goal',state.goal):'<div class="empty"><p>当前筛选没有匹配目标。</p></div>'}</div></aside>`;}
function noLanguages(){return empty('选择要比较的语言','勾选顶部的多个语言，方案、变量和关系图会同时更新。',btn('select-default','选择 ZIL、Rust、TypeScript/JS'));}
function renderScenes(){
 const list=D.goals.filter(goalMatches);if(list.length&&!list.some(g=>g.id===state.goal))state.goal=list[0].id;const g=byId('goals',state.goal);
 let detail='';
 if(!list.length){detail=state.filter==='zil'&&!state.includeProposals?empty('ZIL 当前按设计规范登记','“已有方案”不包含尚未完成的设计目标。可以查看规范提出的目标及其成立条件。',btn('include-zil-proposals','查看 ZIL 规范路线')):empty('没有匹配的场景','可清空搜索、分类或语言筛选，返回全部场景目标。',btn('clear-filters','显示全部场景'));}
 else detail=`<section class="panel"><div class="scene-head"><div><div class="kicker"><span class="scene-id">${E(g.id)}</span><span>${E(kindNames[g.kind]||g.category)}</span></div><h2>${E(g.name)}</h2><p class="scene-question">${E(g.question)}</p></div>${btn('copy-link','复制定位链接','quiet')}</div><div class="scene-steps"><div><h4>要完成的操作</h4><ul>${ARR(g.operations).map(o=>`<li>${E(textOf(o))}</li>`).join('')}</ul></div><div><h4>怎样才算满足这个目标</h4><p>${E(g.acceptance)}</p></div></div><div class="boundary"><b>判断边界：</b>${E(g.boundary)}</div></section>${selected().length?`<div class="section-heading"><h3>同一个目标，不同语言的方案</h3>${pillTabs([['flow','关系图'],['cards','方案并排'],['rules','规则明细表']],'sceneMode')}</div>${state.sceneMode==='flow'?flowDiagram(g):state.sceneMode==='rules'?sceneRuleTable(g):''}${state.sceneMode==='flow'?'<div class="section-heading"><h3>方案细节与代价</h3><span class="small muted">同一列中的规则和前提需要共同成立</span></div>':''}<div class="route-scroll"><div class="route-grid">${selected().map(l=>routeCard(cov(g.id,l.id),l)).join('')}</div></div>${examplesFor(g.id)}`:noLanguages()}`;
 return heading('目标 → 方案 → 规则组合','从一个目标，看清语言的设计选择','先选你想完成的场景，再比较各语言如何实现。顶部多选语言可同步改变方案、关系图和对照表。',btn('show-goal-matrix','查看全部目标矩阵','quiet'))+`<div class="workspace">${sceneSidebar(list)}<div class="content">${detail}</div></div>`;
}
function routeCard(c,l){
 if(!c)return empty(l.name,'此目标尚未登记。');const vars=relatedVars(c.rules),base=rawCov(c.goal,l.id),key=c.goal+':'+l.id;
 const choices=base.alternatives?.length?`<label class="filter-label" style="margin:0 0 6px">选择该语言的路线</label><select data-route-choice="${E(key)}" aria-label="${E(l.name)}的实现路线" style="width:100%;margin-bottom:12px"><option value="primary">${E(base.mechanism)}</option>${base.alternatives.map(a=>`<option value="${E(a.id)}" ${state.routeChoices?.[key]===a.id?'selected':''}>${E(a.mechanism||a.name)}</option>`).join('')}</select>`:'';
 return `<article class="route-card" style="--lang:${safeColor(l.color)}"><div class="route-lang"><strong>${E(l.name)}</strong>${statusBadge(c.status)}</div>${choices}<h3>${E(c.mechanism)}</h3><p class="summary">${E(c.summary)}</p><div class="route-section"><h4>采用的规则组合</h4><div class="rule-chips">${c.rules.length?c.rules.map(ruleButton).join(''):'<span class="muted">尚无已核实组合</span>'}</div></div><div class="route-section"><h4>这些规则怎样共同起作用</h4><ol class="step-text">${ARR(c.steps).map(x=>`<li>${E(x)}</li>`).join('')}</ol></div><div class="route-section"><h4>前提与适用范围</h4><ul>${ARR(c.premises).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div class="route-section"><h4>实际代价</h4><p class="cost">${E(c.cost)}</p><h4 style="margin-top:11px">限制</h4><p>${E(c.limit)}</p></div><details class="route-section"><summary>关联的设计变量（${vars.length}）</summary><div class="variable-chips">${vars.map(v=>variableButton(v.id)).join('')}</div><p class="small muted" style="margin-top:9px">变量页展示该语言提供的选项；本方案实际采用的机制以上文为准。</p></details>${sourceLinks(c.sources)}<button class="detail-button" data-route="${E(c.goal+':'+c.language)}">展开这条方案</button></article>`;
}
function wrapText(s,n){const a=Array.from(String(s));const out=[];for(let i=0;i<a.length;i+=n)out.push(a.slice(i,i+n).join(''));return out;}
function svgLines(text,x,y,n=18,lineHeight=17,maxLines=3,attrs=''){
 const lines=wrapText(text,n);return `<text x="${x}" y="${y}" ${attrs}>${lines.slice(0,maxLines).map((t,i)=>`<tspan x="${x}" dy="${i?lineHeight:0}">${E(t)}${i===maxLines-1&&lines.length>maxLines?'…':''}</tspan>`).join('')}</text>`;
}
function flowDiagram(g){
 const ls=selected();const rows=ls.map(l=>({l,c:cov(g.id,l.id)})).filter(x=>x.c);const ids=[...new Set(rows.flatMap(x=>x.c.rules))].sort();const height=Math.max(330,rows.length*112,ids.length*54)+60;
 const ruleYs=new Map(ids.map((id,i)=>[id,65+i*(height-105)/Math.max(1,ids.length-1)]));const routeYs=rows.map((_,i)=>58+(i+.5)*(height-80)/rows.length);const goalY=height/2;
 let edges='',nodes='';const focus=rows.some(x=>x.l.id===state.focus)?state.focus:'all';
 rows.forEach(({l,c},i)=>{const y=routeYs[i],color=safeColor(l.color),dim=focus!=='all'&&focus!==l.id;const cls=dim?'dim':focus!=='all'?'emphasized':'';const dash=c.status==='proposal'?' stroke-dasharray="5 4"':'';
 edges+=`<path class="flow-edge ${cls}" data-flow-language="${l.id}" d="M245,${goalY} C282,${goalY} 298,${y} 341,${y}" stroke="${color}"${dash}/>`;
 c.rules.forEach(id=>{const ry=ruleYs.get(id);edges+=`<path class="flow-edge ${cls}" data-flow-language="${l.id}" data-flow-rule="${id}" d="M611,${y} C673,${y} 692,${ry} 753,${ry}" stroke="${color}"${dash}/>`;});
 nodes+=`<g class="flow-node ${dim?'dim':''}" data-route="${g.id+':'+l.id}" role="button" tabindex="0" aria-label="${E(l.name+'：'+c.mechanism+'，'+statusNames[c.status])}"><title>${E(l.name+' · '+c.mechanism+' · '+statusNames[c.status])}</title><rect x="341" y="${y-43}" width="270" height="86" rx="9" fill="#fff" stroke="${color}" stroke-opacity=".65"/><rect x="341" y="${y-43}" width="4" height="86" rx="2" fill="${color}"/><text x="356" y="${y-21}" font-size="12" font-weight="700" fill="${color}">${E(l.name)}</text><text x="595" y="${y-21}" text-anchor="end" font-size="9" fill="#7d8596">${E(statusNames[c.status])}</text>${svgLines(c.mechanism,356,y+1,21,17,2,'font-size="12" fill="#334257"')}</g>`;
 });
 ids.forEach(id=>{const y=ruleYs.get(id),r=byId('rules',id);const active=focus==='all'||rows.find(x=>x.l.id===focus)?.c.rules.includes(id);nodes+=`<g class="flow-node ${active?'':'dim'}" data-rule="${id}" role="button" tabindex="0" aria-label="${E(id+' '+r.name)}"><title>${E(r.definition||r.why)}</title><rect x="753" y="${y-20}" width="273" height="40" rx="7" fill="#f8faff" stroke="#d9e0ef"/><text x="765" y="${y+4}" font-size="10" fill="#7b89a5">${id}</text><text x="799" y="${y+4}" font-size="11" fill="#344660">${E(r.name)}</text></g>`;});
 return `<section class="panel flow-panel"><div class="flow-toolbar"><p>点击语言方案或规则节点，展开说明。</p><div class="flow-focus"><span class="small muted">聚焦</span><button data-focus="all" class="${focus==='all'?'active':''}">全部</button>${ls.map(l=>`<button data-focus="${l.id}" class="${focus===l.id?'active':''}">${E(l.name)}</button>`).join('')}</div></div><div class="flow-scroll" aria-label="可横向滚动的规则关系图"><svg class="flow-svg" viewBox="0 0 1050 ${height}" role="img" aria-label="${E(g.name)}：场景到语言方案再到规则的依赖图"><text x="25" y="22" font-size="11" fill="#7c889c">场景目标</text><text x="342" y="22" font-size="11" fill="#7c889c">各语言的一条代表性路线（可以择一）</text><text x="753" y="22" font-size="11" fill="#7c889c">该路线依赖的机制（需要共同成立）</text>${edges}<g><rect x="25" y="${goalY-59}" width="220" height="118" rx="12" fill="#edf1ff" stroke="#c6d0f1"/><text x="42" y="${goalY-35}" font-size="10" fill="#6478b4">${g.id} · ${E(g.category)}</text>${svgLines(g.name,42,goalY-9,12,23,3,'font-size="16" font-weight="700" fill="#30457f"')}</g>${nodes}</svg></div><p class="flow-caption">等宽线条表示依赖关系，不表示比例或性能。实线为已登记路线，虚线为设计目标；具体可用性仍以状态、前提和边界为准。共享规则节点只表示同类机制，不表示语言语义完全相同。</p></section>`;
}
function sceneRuleTable(g){const rows=selected().map(l=>cov(g.id,l.id));const rules=D.rules.filter(r=>rows.some(c=>c?.rules.includes(r.id)));return `<div class="table-wrap compact"><table><caption>${E(g.name)} · 方案所依赖的规则明细</caption><thead><tr><th scope="col">规则名称 / 解决的问题</th>${selected().map(l=>`<th scope="col">${E(l.name)}<br>${statusBadge(cov(g.id,l.id).status)}</th>`).join('')}</tr></thead><tbody>${rules.map(r=>`<tr><td><button class="cell-link" data-rule="${r.id}"><span class="id">${r.id}</span> ${E(r.name)}</button><div class="cell-text">${E(r.why)}</div></td>${rows.map(c=>`<td>${c.rules.includes(r.id)?'<span class="mark-yes">采用</span>':'<span class="mark-none">本路线未采用</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="table-note">“本路线未采用”不等于该语言不存在这项能力。此表对应上面的具体方案，不能按规则数量判断优劣。</p>`;}
function examplesFor(goal){
 const examples=ARR(D.examples).filter(e=>ARR(e.goals).includes(goal));if(!examples.length)return '';
 return `<details class="examples"><summary>相关操作示例（用于理解机制，${examples.length} 组）</summary><div class="examples-body"><p class="example-note">示例可能只涉及本场景的部分机制；是否满足完整目标，仍以上方前提、边界和证据为准。</p>${examples.map(e=>`<h3>${E(e.name)}</h3>${e.intent?`<p class="example-note">${E(e.intent)}</p>`:''}<div class="code-compare">${selected().map(l=>`<div class="code-card"><h4>${E(l.name)}</h4><pre><code>${E(e.code?.[l.id]||'此例尚未补充该语言片段；可查看上方机制与官方来源。')}</code></pre></div>`).join('')}</div><p class="example-note">${E(e.note)}</p>`).join('<hr style="border:0;border-top:1px solid #e1e6ef;margin:20px 0">')}</div></details>`;
}
function basicNav(items,type,active){const q=state.search.trim().toLowerCase();const list=items.filter(x=>!q||[x.id,x.name,x.question,x.why,x.definition].join(' ').toLowerCase().includes(q));return `<aside class="sidebar ${state.catalogOpen?'':'collapsed'}" aria-label="基础规则目录"><div class="sidebar-top"><div class="sidebar-title"><span>${type==='variable'?'设计变量':'实现机制'}</span><span class="muted">${list.length} / ${items.length}</span></div><input id="catalog-search" class="search" value="${E(state.search)}" placeholder="搜索名称或要解决的问题…" aria-label="搜索基础规则"></div><button class="mobile-catalog" data-action="toggle-catalog">${state.catalogOpen?'收起':'展开'}目录（${list.length}）</button><div class="sidebar-list">${list.length?groupedNav(list,type,active):'<div class="empty"><p>没有匹配条目。</p></div>'}</div></aside>`;}
function foundationPage(){return `<div class="intro-strip"><div class="intro-cell"><span class="num">01 / 义务</span><h3>必须成立的条件</h3><p>例如读取时，存储中仍有一个合法对象。</p></div><div class="intro-cell"><span class="num">02 / 变量</span><h3>可以选择的维度</h3><p>例如让谁保证存活，按什么粒度回收。</p></div><div class="intro-cell"><span class="num">03 / 机制</span><h3>选择怎样落实</h3><p>例如静态借用、域保活、引用计数或追踪。</p></div><div class="intro-cell"><span class="num">04 / 场景</span><h3>哪些目标得以满足</h3><p>例如构造循环图、独立删除、跨任务借用。</p></div></div><div class="foundation-grid">${D.foundations.map(f=>`<article class="panel foundation-card"><span class="eyebrow">${E(f.id)} · 基础义务</span><h3>${E(f.name)}</h3><p>${E(f.statement)}</p><pre><code>${E(f.example)}</code></pre><p class="non-implication"><b>不能顺带推出：</b>${E(f.nonImplication)}</p><div class="variable-chips">${ARR(f.variables).map(variableButton).join('')}</div></article>`).join('')}</div>`;}
function settingContent(s,v){
 if(!s)return '<span class="not-applicable">尚未登记</span>';const options=ARR(v.options);const values=ARR(s.values).map(id=>options.find(o=>o.value===id)?.label||id);

function inlineMD(text){
 const saved=[];let x=String(text).replace(/`([^`]+)`/g,(_,s)=>{saved.push(`<code>${E(s)}</code>`);return `\u0001${saved.length-1}\u0002`;});
 x=E(x).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,t,url)=>{const raw=url.replace(/&amp;/g,'&');if(/^https?:\/\//.test(raw))return `<a href="${E(raw)}" target="_blank" rel="noopener noreferrer">${t}</a>`;if(raw.startsWith('#'))return `<a href="#docs/spec-${E(raw.replace(/^#s/,''))}" data-spec-anchor="${E(raw)}">${t}</a>`;return t;});return x.replace(/\u0001(\d+)\u0002/g,(_,i)=>saved[+i]);
}
function markdown(text){
 const lines=String(text||'').split(/\r?\n/);let out='',i=0;const cells=l=>{const a=[];let s='',inCode=false;const body=l.trim().replace(/^\|/,'').replace(/\|$/,'');for(const ch of body){if(ch==='`')inCode=!inCode;if(ch==='|'&&!inCode){a.push(s.trim());s='';}else s+=ch;}a.push(s.trim());return a;};
 while(i<lines.length){const l=lines[i];if(!l.trim()||/^<a id=/.test(l)){i++;continue;}if(/^```/.test(l)){let b=[];const kind=l.slice(3).trim();i++;while(i<lines.length&&!/^```/.test(lines[i]))b.push(lines[i++]);i++;out+=`<pre><code>${E(b.join('\n'))}</code></pre>`;continue;}
 const h=/^(#{1,6})\s+(.+)$/.exec(l);if(h){const level=Math.min(h[1].length,4);out+=`<h${level}>${inlineMD(h[2])}</h${level}>`;i++;continue;}
 if(/^\s*\|/.test(l)&&/^\s*\|?[ :|\-]+\|?\s*$/.test(lines[i+1]||'')){const heads=cells(l);i+=2;let rows='';while(i<lines.length&&/^\s*\|/.test(lines[i]))rows+='<tr>'+cells(lines[i++]).map(c=>`<td>${inlineMD(c)}</td>`).join('')+'</tr>';out+=`<div class="table-wrap"><table><thead><tr>${heads.map(c=>`<th scope="col">${inlineMD(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;continue;}
 if(/^[-*]\s/.test(l)){let li='';while(i<lines.length&&/^[-*]\s/.test(lines[i]))li+=`<li>${inlineMD(lines[i++].slice(2))}</li>`;out+=`<ul>${li}</ul>`;continue;}
 if(/^\d+\.\s/.test(l)){let li='';while(i<lines.length&&/^\d+\.\s/.test(lines[i]))li+=`<li>${inlineMD(lines[i++].replace(/^\d+\.\s/,''))}</li>`;out+=`<ol>${li}</ol>`;continue;}
 if(/^>\s?/.test(l)){out+=`<blockquote>${inlineMD(l.replace(/^>\s?/,''))}</blockquote>`;i++;continue;}
 if(/^---+$/.test(l.trim())){out+='<hr style="border:0;border-top:1px solid #dde3eb;margin:22px 0">';i++;continue;}
 let p=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|\s*\||[-*]\s|\d+\.\s|>)/.test(lines[i]))p.push(lines[i++]);out+=`<p>${inlineMD(p.join('\n'))}</p>`;
 }return out;
}

 else content=`<article class="panel doc"><div class="doc-toolbar"><p>此页由对应源文件生成，不另行维护规则。</p>${btn('download-doc','下载本页 Markdown')}</div>${markdown(DOCS[state.doc]||'暂无内容。')}</article>`;
 return heading('可追溯 / 可离线阅读','语言设计、判断口径与来源','完整规范随 HTML 内嵌，也单独放在压缩包中。来源按具体方案和语言设置关联，不把设计目标显示成已有实现。')+nav+content;

}
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-action],[data-view],[data-set],[data-nav-type],[data-rule],[data-variable],[data-route],[data-focus],[data-open-goal],[data-variable-goals],[data-chapter],[data-spec-anchor]');
 if(e.target.closest('#dialog-close')){closeDialog();return;}
 if(!target)return;const a=target.dataset;
 if(a.action){handleAction(a.action);return;}
 if(a.rule){openRule(a.rule);return;}if(a.variable){openVariable(a.variable);return;}if(a.route){openRoute(a.route);return;}
 if(a.specAnchor){e.preventDefault();const id=a.specAnchor.slice(1);const chapter=specChapters.find(c=>c.text.includes('id="'+id+'"'))||specChapters.find(c=>c.id===id.replace(/^s/,''));if(chapter){state.view='docs';state.doc='spec';state.chapter=chapter.id;render({top:true});}return;}
 if(a.view){state.view=a.view;state.search='';state.catalogOpen=false;render({top:true});return;}
 if(a.set){state[a.set]=a.value;if(a.set==='basic'||a.set==='compare')state.search='';render();return;}
 if(a.navType){if(a.navType==='goal')state.goal=a.id;if(a.navType==='variable')state.variable=a.id;if(a.navType==='rule')state.rule=a.id;state.catalogOpen=false;render();return;}
 if(a.focus){state.focus=a.focus;render();return;}
 if(a.openGoal){closeDialog();state.view='scenes';clearFilters();state.goal=a.openGoal;state.catalogOpen=false;render({top:true});return;}
 if(a.variableGoals){closeDialog();state.view='scenes';clearFilters();state.variableFilter=a.variableGoals;render({top:true});return;}
 if(a.chapter){state.chapter=a.chapter;state.doc='spec';state.catalogOpen=false;render({top:true});}
});
document.addEventListener('change',e=>{
 const t=e.target;if(t.dataset.routeChoice){state.routeChoices={...state.routeChoices};if(t.value==='primary')delete state.routeChoices[t.dataset.routeChoice];else state.routeChoices[t.dataset.routeChoice]=t.value;render();return;}if(t.name==='language'){state.selected=t.checked?[...new Set([...state.selected,t.value])]:state.selected.filter(x=>x!==t.value);render();return;}
 if(t.id==='language-filter'){state.filter=t.value;state.includeConditional=false;state.includeProposals=false;render();}
 if(t.id==='category-filter'){state.category=t.value;render();}
 if(t.id==='include-conditional'){state.includeConditional=t.checked;render();}
 if(t.id==='include-proposals'){state.includeProposals=t.checked;render();}
 if(t.id==='only-differences'){state.differences=t.checked;render();}
});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){state.search=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if((e.key==='Enter'||e.key===' ')&&e.target.closest('g[role="button"]')){e.preventDefault();e.target.closest('g[role="button"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
window.addEventListener('hashchange',()=>{readHash();state.search='';render();});
$('detail-dialog').addEventListener('click',e=>{if(e.target===$('detail-dialog')){const r=$('detail-dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
globalThis.DesignAtlas={data:D,state,render,goalMatches,comparisonRows,csvData,markdown,specChapters};
state.selected=ARR(state.selected).filter(x=>lang(x));readHash();render();
})();
</script>
</body>
</html>
