//github.com/swiftlang/swift-evolution/blob/main/proposals/0413-typed-throws.md","kind":"official","note":"已核官方说明；具体接口的安全和表示范围按所引合同限定。"},{"id":"SRC-RUST-ERROR","title":"Rust 官方书：错误处理","url":"https://doc.rust-lang.org/book/ch09-00-error-handling.html","kind":"official","note":"已核官方说明；具体接口的安全和表示范围按所引合同限定。"},{"id":"SRC-RUST-CLOSURE","title":"Rust 官方书：闭包捕获与调用","url":"https://doc.rust-lang.org/book/ch13-01-closures.html","kind":"official","note":"已核官方说明；具体接口的安全和表示范围按所引合同限定。"},{"id":"SRC-ATTR-RUST","title":"Rust Reference · Attributes","url":"https://doc.rust-lang.org/reference/attributes.html","kind":"official","note":"属性有不同类别与阶段；ZIL只参考机制，不复制完整语义。"},{"id":"SRC-ATTR-CS","title":"C# specification · Attributes","url":"https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/language-specification/attributes","kind":"official","note":"裸[]属性可行；C#运行时元数据模型未被自动采用。"},{"id":"SRC-LEAN-SYNTAX","title":"Lean · Notations and Macros","url":"https://lean-lang.org/doc/reference/latest/Notations-and-Macros/","kind":"official","note":"语法、宏、卫生与elaboration分层参考。"}],"meta":{"version":"ZIL-LANG-1.3","date":"2026-10-23","languages":8,"goals":42,"variables":28,"rules":40,"sourceSpec":"_zil_design.md","scope":"Current normative ZIL routes; other language survey preserved from input, not reverified","specSha256":"792a1146bb1ac3c2c1283dd630c491396174a83311982cd892f848c488e65c76"}}</script>
<script id="atlas-docs" type="application/json">{"spec":"# ZIL 语言与编译器规范\n\n\u003e 本次采纳：Ante-R1，2026-10-28。完整原始修订稿及其173/Wire20状态说明保存在 `docs/research/208/Ante-R1-input.md`；其规范条文保持。208实际集成基线为语言主线174–177交付 `08cb9e6ff57492e11eec6c8592d37d601ee71f10`（schema/Wire21），移植204、206、207，并接入可选LLVM文本解析API对象后端。完整设计仍是终态义务，不表示来源路径精化、结构化分区、稳定身份、缓存或直接Builder已经实现；本次不发布新Wire。能力与结果分别见 `docs/research/208/INTEGRATION.md` 和实测报告。\n\n规范标识：ZIL-LANG-1.3。语言规则、编译器架构不变量、永久拒绝边界和产品验收条件以本文件为唯一文字定义源。`spec/grammar.ebnf` 定义文法产生式，`spec/attributes.json` 定义属性注册表，`validation/product-gates.json` 定义量化测试配置；它们是本规范的具名附件，不允许另设同名条件的第二份定义。`spec/diagnostics.json` 登记稳定诊断标识；`spec/interfaces.json` 固定阶段间的数据与可信构造边界；`policy/dependencies.json` 固定编译器依赖边。派工同时锁定正文与全部附件的摘要。\n\n本文只描述终态要求。“必须”是实现义务，不是实现完成或证明通过的声明。实施顺序属于 `_zil_goal.md`，单项执行与证据属于 `.task/` 和 `evidence/`，变更理由属于 `changes/`。HTML 是这些源文件生成的阅读视图，不是另一份可编辑规范。\n\n\u003ca id=\"ZIL-TARGET\"\u003e\u003c/a\u003e\n\n## 0. 目标、适用范围与可信边界\n\n在相同可信边界下提供 Rust 同类内存安全；运行与内存、源代码与全项目维护、编译成本保持同级，至少一项具有实质突破。安全不得以少量 safe UB 折算；关键场景的结构性退步不得用平均数掩盖。产品数字由具名验收配置管理，不能在排期或工单另定更宽标准。\n\n普通描述可以共享；执行资格和真实清理责任不得由复制产生。普通值保持内联；不默认引入 GC、RC、世代、锁、堆盒或全局责任表。稳定图、独立可删身份、真实地址和共享拥有按各自协议提供，不统一成最大成本表示。\n\n安全覆盖类型与初始化、范围和对齐、对象与子对象有效性、重复回收、地址失效、相交访问及非原子数据竞争。不保证任意程序终止、无死锁、无泄漏、设备准时响应或业务事务正确。显式泄漏不得使借入栈和短命 allocator 虚假延长。\n\n类型/来源规则核、可信原语、FFI/驱动适配、lowering 与后端属于声明的可信基础；证书检查不使这些实现自动正确。实现进度与证明证据独立记录，规范覆盖不得计作实现通过。\n\n独立语言必要性是立项与退出门，不是第五个最大化目标。差异必须影响真实语义、接口、编译边界或总成本，并能解释四目标之一的净收益。合理 Rust 基线允许 Cell/GhostCell、索引、Arena、安全封装与作用域执行；普通拥有值与借入描述不能交叉比较。相同能力可由库表达，不自动否定新语言；仅更换词汇也不构成收益。\n\n### 0.1 本次修订的采用边界\n\n吸收 Ante 的“来源路径与失效依赖分离”、按项/递归分量查询和可替换的机器码生成接口；不照搬其共享引用、隐式复制成本、隐式实例选择或代数效应运行时。具体借鉴依据见随附比较报告，不以外部项目的设计文字替代 ZIL 证明。\n\n四个问题必须分别回答：**对象是否存活、地址/投影是否有效、当前访问是否有资格、清理责任由谁承担**。某一答案为真不授予其余答案。数据环能安全访问，不等于强引用环能自动回收；本规范仍不保证任意程序无泄漏，也不引入追踪 GC。\n\n本次不新增与 `Desc`、`\u0026T`、`\u0026mut T` 平行的第五引用模式。`\u0026T` 仍是强共享只读窗口，`\u0026mut T` 仍是强独占窗口。来源和失效精化用于既有模式内减少无关拒绝，不将地址稳定解释成允许写入共享窗口。\n\n\u003ca id=\"ZIL-CORE\"\u003e\u003c/a\u003e\n\n## 1. 一个核心场景：复制描述，不复制责任\n\n```zil\nfn inspect_then_destroy(read: Ref\u003cNode\u003e, end: Ref\u003cNode\u003e) {\n    let value = read.value\n    report(value)\n    end.destroy()\n}\nlet node = Node.create(alloc, 7)?\nlet alias = node\ninspect_then_destroy(node, alias)\n// inspect(node.value) // 拒绝：目标有效事实已撤销\n```\n\n前提：report 接收独立数值，不保存 Node 地址；destroy 是该 Node 的无可恢复失败销毁协议；当前上下文有管理资格。\n\n创建引入新实例 r、初始化事实、执行资格和一次责任 d。node/alias 的来源都为 r。顺序调用允许两参数实际同源：读取完成后才进入 Closing。结束时失效事实覆盖两个描述，但机器只调用 r 的析构/free 一次并履行 d。作用域退出看到 d 已履行，不重复释放。\n\n不是 free 时搜索全部别名；静态判定在后续使用点查询来源和已撤销范围。若字段/闭包保存了描述，来源规则继续传递它；若保存了真实地址或 Cleanup 将读取目标，销毁入口会受到该依赖的约束。\n\n若把函数改成先 destroy 后 read，有序合同要求二者不相交；同源调用被拒绝。若把某个引用从函数返回，返回来源必须来自仍受保护输入，或者随完整责任包转交；局部栈地址不能凭描述返回自动延长。\n\nRust 的 owner/lifetime/borrow 组织约束，与这里的来源/执行资格/责任组织解决同类危险。真正责任的不可复制性并未消失；它不再支配所有描述的普通赋值。\n\n\u003ca id=\"ZIL-MODES\"\u003e\u003c/a\u003e\n\n## 2. 源语言类别必须唯一\n\n### 2.1 四个内部类别\n\n| 类别 | 源面/语义 | 赋予及实际表示 |\n|---|---|---|\n| Value\u003cT\u003e | 数值、struct、enum、普通聚合 | 可结构 Copy 者复制，否则消费移动；内联布局 |\n| Managed\u003cR\u003e | 实际资源头和责任 | 由工厂建立，give 转交；不因描述复制再产生一项 |\n| Desc\u003cR\u003e | 资源名义类型的借入入口、Ref\u003cT\u003e | 共享同一身份/位置；通常是指针或既定索引 |\n| Address\u003cm,T\u003e | \u0026T / \u0026mut T | 持续地址窗口；不可被改写成逻辑重查 |\n\n`resource R { ... }` 声明具有名义资源描述与管理位置两种已定模式的资源类型；其构造/转交结果模式由接口声明。`package P { manages field: R; ... }` 是含明确责任字段的名义拥有聚合。普通 `struct` 不因字段名或方法名自动变成 resource。\n\n局部 ticket 可不可复制，取决于一次初始化/执行行为，不扩展成“所有值都线性”。普通值中含 Ref 仍然是浅连接复制，不能宣传为深复制。let/var 的绑定性与目标访问权限分开。\n\n工厂结果的 create、give、from 模式在类型形状及导出接口确定。`id\u003cT\u003e` 不能从调用者后来需要关闭，反向猜测其参数应该拥有资源。泛型约束说明类别；递归/外部接口缺形状时要求声明，而不是尝试多种借用模式。\n\n### 2.2 构造位置与资源头\n\nFile/Buffer 工厂成功在指定局部或返回槽构造管理头。`let b=a` 取同一资源描述，不复制 pointer/len/cap 成两个独立头，也不默认装箱。借入头地址存续时，外壳不能移动；指向稳定 payload 的描述与头地址分开。\n\n工厂临时值借入函数，调用方在完整表达式期间持责任；被调返回该临时的裸描述不能在该边界后使用。需要返回完整资源则通过 create/give 返回模式。\n\n### 2.3 责任消费的源面\n\n`give place` 要求 place 是当前上下文实际持有的 Managed 位置；它将这一真实载体的责任、实例和必要内部关联转入目标槽，原位置变为已移出。`give alias` 在 alias 仅为 Desc 时拒绝：执行资格或管理 route 不等于载体所有权。`move` 闭包对实际 Managed 捕获使用同一转交规则，不存在第二种绕过责任核验的转移。\n\n资源参数 `r: R` / `r: Ref\u003cR\u003e` 是描述入口；`give r: R` 是接收完整载体的参数，调用处写 `take(give r)`。工厂直接产生的 create 结果可直接进入拥有结果槽，不能为了省写而把一个既有 Desc 反向猜成拥有者。返回既有载体用 `return give r` 并满足 `result(give)`；新资源返回满足 `result(create)`。普通不可 Copy Value 与完整 `package` 按值移动，不要求额外 `give`，也不隐式退化为描述；`give` 不接受普通 Value 作为另一个可选移动拼写。\n\n消费接收者 `give self: Self` 用 `(give r).method(...)` 或 `R.method(give r, ...)`，不把普通 `r.method(...)` 静默改成载体转交。普通 Value 的 `self: Self` 仍按普通 Copy/Move 规则调用；资源类型的 `self: Self` 是该资源默认描述模式，拥有模式必须写 `give self`。`self: Ref\u003cSelf\u003e` 始终明确为描述。\n\n`close` / `destroy` 通过借入管理路由履行原载体的责任，不等于 `give`。成功清理、部分失败、移出和存活是不同状态。给出责任后，原有 Desc 是否仍可访问由实际存储、来源和当前资格决定；真实头地址或旧记录借用不能靠移动自动修复。\n\n### 2.4 不可变的基本行为\n\nUTF-8、名义类型、确定名字解析、固定求值顺序、穷尽 match。数值转换、完整访问宽度、对齐与初始化按安全语义验证；不能因 release 开 UB。 内建 u8 为 0..255 的一字节无符号值，u16 为 0..65535 的二字节无符号值；普通整数不隐式宽化，u8(expr)、u16(expr)、i32(expr)、i64(expr) 是恰一整数参数、保留数学值的显式检查转换原语，越界按 checked 失败处理。这四个裸转换名不得被值或函数声明遮蔽，成员名不受此限制。wrapping 显式。原始 union 重解释、指针伪造、未约束 FFI 位于明确 unsafe 边界。\n\n赋值先各求值一次目标和 RHS；可能失败的准备完成后提交，旧值清理也具有实际合同。RHS 已发生副作用不回滚。部分移动带 Drop 的值必须通过已核 decompose，不能让 teardown 看到缺字段。\n\n\u003ca id=\"ZIL-ORIGIN\"\u003e\u003c/a\u003e\n\n## 3. 具体语义与抽象信息分别定义\n\n实际状态包括：分配/子对象、字段值和初始化、真实动态身份、执行权限、唯一责任载体、地址窗口、任务/设备使用者。它是数学语义，不要求在运行时存在一个全局管理表。\n\n静态状态采用有限的类型/来源/绑定/状态集合/权限/窗口/责任形状/潜在行为模板。实际目标必须被候选覆盖；必然事实不得超过实际保证；可能影响不得小于实际影响。\n\n### 3.1 抽象位置基数\n\n根除了来源，还带 One / Many：\n- One：在当前证明激活下指代一个确定的真实位置；参数未知身份仍可为 One，但不同参数不因此不交。\n- Many：一个 Store 家族、循环历史集合、未知容器元素汇总等，可能包含多个实例。\n\n**候选集合只有一个元素不是强更新的充分条件。** 强更新要求候选确为一个稳定的精确位置，且其基数为 One；任何别名指向同一位置时，通过同一内存事实更新/失效依赖。Many 或多个候选必须弱更新。\n\n反例：`Q(p)={Store.nodes}` 只说明目标属于一个集合，不说明初始化 p 就初始化所有节点。相同错误还会误判关闭状态和字段来源。\n\n### 3.2 有限位置图，避免“无限长的有限 DAG”\n\nSSA 定义点、phi、可寻址字段、调用投影、分配成功点，在分析开始时建立节点。循环回边增加有限节点之间的边/事实，不在每次固定点迭代重新构造 `Union(old,new)` 产生新语法节点。\n\n递归名义结构的未知路径归入声明存储族。返回包内部存在根使用签名模板；不能每次递归展开成新静态资源列表。当前迭代的新鲜对象过回边前须清理、给出到真实 carrier，或由 Option/槽携带一个显式存在包。实际实例仍彼此不同。\n\n### 3.3 字段来源怎样从源码产生\n\n- 参数：从导入接口初始化来源变量和已声明外界。\n- 工厂：只在实际成功边引入 fresh；失败边不发布完整对象。\n- 复制/投影：复制来源；取字段从当前内存位置事实或已声明类型上界读取。\n- 精确写：以 RHS 来源更新该字段；未知写：与旧来源并合，不能更改全部候选。\n- 选择/phi：并合来源并保存一层同源 SSA 条件；循环重定义和非同源合流不能沿用旧条件。\n- 捕获：环境逐字段使用同样规则，不设特殊“捕获可忽略”的通道。\n- 返回：逐返回字段建立来源等式；不能从未交出的局部管理位置产生可在调用后使用的地址。\n- 外部函数：没有来源合同即没有 safe 直接调用资格；wrapper 的假设属于可信边界。\n\n固定捕获/字段上界不意味着全部字段同时指向全部根；它是安全上界。丢失精度可以拒绝，但不能制造同源、不交或“全部已经更新”的事实。\n\n### 3.4 来源路径、投影依赖与实例身份\n\n一个使用点的静态信息至少区分 `OriginSet`、`Projection`、`Requirements`、`AccessMode` 与 `ResponsibilityRoute`。这些是编译期信息，不要求在每个运行时引用中增加字段：\n\n```text\nViewFact = {\n    origins: 有限实际来源上界,\n    projection: 已登记的字段/固定槽/容器元素族/变体载荷投影,\n    requires: 本次使用依赖的有效事实,\n    mode: Desc短访问 | SharedAddress | ExclusiveAddress,\n    route: 可选且已核的管理路径\n}\n```\n\n`requires` 可包括：实例仍活、某字段已初始化、存储映射仍稳定、当前变体仍匹配、容器窗口仍被保护。成员资格只在接口语义确实需要时成为条件；从集合移出但仍被合法拥有的对象，不因此自动变成悬垂对象。反过来，仍有内存字节不证明其类型、初始化、实例或管理资格有效。\n\n稳定性是“某种投影对某类事件的依赖”，不是整个类型的单个 `stable` 布尔值。持有容器头地址、元素地址、元素内的动态字节地址，可能依赖不同映射。稳定头不能替代稳定 payload；稳定 payload 也不允许移动仍被借入的头。\n\n字段投影与依赖边必须来自实际布局/接口合同。通过可重分配容器、可更换变体或可替换拥有字段，记录相应失效边。公共类型的私有实现用有限抽象投影导出，不扫描下游不可见的全部字段来猜不交，不把“某类型不出现于另一类型”当别名证明。\n\n同一物理槽换入新资源时，旧实例描述不得重新指向新实例；原第8章规则不变。此处实例身份是已有静态来源/实际责任语义，不是重新引入默认运行时世代句柄。符号的稳定编译身份也不等同于资源的动态实例身份。\n\n路径节点仍服从3.2的预建有限图、One/Many和预算。递归/未知索引归入既定投影族；不得因链式访问或固定点迭代无限追加路径。无法证明精确性时扩大影响上界或拒绝，不凭字符串不同就判定不交。\n\n\u003ca id=\"ZIL-ACCESS\"\u003e\u003c/a\u003e\n\n## 4. 访问安全：足迹和执行资格不由描述复制\n\n每次真实读取验证：合法类型、实际初始化、范围/对齐、目标存活及映射、当前读资格、无冲突的写窗口和外部使用者。写入还要排除相交共享窗口，并保持字段类型/变体与已声明来源上界。\n\n普通 Desc 只提供目标线索，执行资格来自当前上下文。单线程上下文可以通过多个别名顺序执行短操作；调用只是委托所需资格，不能复制一份相交执行权。\n\n真实共享地址允许并存读，禁止相交写/移空/搬迁；独占地址暂停冲突的父资格。重借形成有父子关系的窗口，不把同一 \u0026mut 机器地址复制成两份可独立使用的权限。\n\n只有实际字段/区间/独立分配/受检分区能建立不交。两个 root 名字、两个类型参数和两个图根不是不交证据。向量宽度、halo、packed 位字段、零长度与算术溢出一起核验。\n\n窗口需要的见证绑定真实映射；操作的撤销历史 H 不能被结束时重新建立同名事实抵消。一次 reserve 之后新 Address 成立，旧切片仍然失效。\n\n### 4.1 操作效果不能退化为一个“可变”标志\n\n检查器至少在内部区分以下可观察动作；它们可以由同一原语同时产生，但不能互相代替：\n\n| 动作 | 必须检查的条件 |\n|---|---|\n| Read / Write | 当前读写资格、实际足迹、初始化与值有效性 |\n| Relocate | 依赖旧映射的地址/投影窗口是否已结束 |\n| ReplaceInstance / ChangeVariant | 旧实例、旧载荷与相应初始化事实是否仍被依赖 |\n| MoveCarrier | 真实头、管理记录和外壳投影的地址依赖与责任转交 |\n| EndLifetime | 实例存活、所有实际使用者、Closing/清理责任 |\n| RetireMembership | 接口规定的成员/遍历条件；不直接等同于 free |\n| Reenter / Suspend / ExternalRetain | 当前及未来调用者、帧与关闭协议的额外义务 |\n\n这是内部效果分类，不是在源语言 `effects(...)` 中未经注册增加可调用关键字。某次写入不导致重分配，仍是 Write；不改变指针的变体切换，仍可能使旧载荷投影失效。只检查“会不会悬垂”不足以替代访问权限、有效值和数据竞争检查。\n\n判断顺序的概念形式为：\n\n```text\ncheck_access(op, state):\n    检查 op 自身所需的来源、初始化、范围、资格和责任\n    对每个可能相交的活动依赖：检查权限冲突和对应事件失效\n    检查调用中实际激活的接收者、实参、重借和外部使用者\n    按每个结果边更新来源、初始化、失效历史与剩余责任\n```\n\n普通 Desc 的潜在失效与必须保持的窗口分开处理：没有保活承诺的描述可以被登记为失效/休眠，之后任何需要有效目标的使用必须拒绝；它仅因仍存于变量中，不应自动阻止关闭。Address、管理记录借入和明确 Hold 则必须在依赖存续时阻止相应破坏，不允许先破坏再补救。\n\n未来使用点判定和活动窗口判定共同参与；不能因返回后没有再使用变量，就忽略它在当前调用期间仍作为实参/捕获被使用。共享/独占窗口的权限冲突不能由“此次未搬迁”消除。\n\n### 4.2 容器只读窗口的首个可实施合同\n\n动态索引的安全窗口必须绑定实际 Store 实例、当前初始化前缀和本次真实元素位置；先做运行时范围检查，再形成地址。范围检查只解决索引，不建立存活、排他或来源事实。不能按 capacity 展开静态槽，也不能将两个未知索引默认判为不同元素。\n\n首片只开放同步、不逃逸的共享读取，并保留现有元素形状限制。建立窗口后，相关 reserve、pop、give、drop和元素替换受到阻挡；仅因 reserve 可能失败或实际剩余容量充足，不能跳过其已发布的 may 效果。最后一次实际使用结束后，才可再次执行相应失效操作。\n\n独立字段更新可在证明真实足迹和依赖不交后通过。例如读取 `state.items` 的元素同时更新独立 `state.stats`，不应仅因共享同一个 State 根而必然被拒绝；但泛型参数名字不同不构成这种证明。\n\n后续可另行核验“不重分配的尾部追加”等更精确接口。它仍须证明写入与现有窗口不交、初始化前缀和迭代条件不被破坏，且不引入隐藏扩容；不能把该后续精度承诺倒记为首片已支持。\n\n### 4.3 使用点精度不改变强引用语义\n\n对普通 Desc，复制只传播来源；读取/写入的短权限在实际操作时核验。因此同源“读完再写”可合法，而“先失效再读”拒绝。对 `\u0026T`，窗口期间相交写仍拒绝，即使对象地址保持不变。对 `\u0026mut T`，相交的另一个可独立使用窗口仍拒绝。\n\n本轮不开放对任意普通 Value 建立可共享可写的新引用模式。将来若确有必要，应单独给出其源面、内存模型、线程规则、FFI及优化属性，而不是悄悄重解释现有 `\u0026`。\n\n\u003ca id=\"ZIL-CONTRACT\"\u003e\u003c/a\u003e\n\n## 5. 有序合同与一般协议：两条算法，一套意义\n\n### 5.1 固定资源快路径\n\n序列片段的摘要为 U（入口使用）、K（可能关闭）、D（先关后用所需分离）。close 自身也属于 U。\n\n```\nU(A;B) = U_A ∪ U_B\nK(A;B) = K_A ∪ K_B\nD(A;B) = D_A ∪ D_B ∪ (K_A × U_B)\n```\n\n只让正常继续出口进入 B；错误等保留各自路径。已有的 D 不因后面 K 为空消失。最大稳定片段先合并，避免反复制造相同关系。\n\n所有函数都有 prefix 和逐 tag exits。无正常返回的递归仍有 prefix；不能以“不返回”抹掉第二次 close 的危险。合同实例化检查真实来源，不把形式参数名当不同资源。\n\n### 5.2 一般协议\n\n每个协议声明有限状态、角色、真实投影、合法原语及每结果转换。单角色按状态关系作正向检查；可能状态的全部成员都要满足前提。状态变化与初始化/地址权限/清理同时保持，单纯修改一个 Ready 标志不能授信。\n\n多角色：已证同源而声明为单一角色时联合检查；有序快路径保留顺序别名；其它状态变化角色与相关角色需实际 apart，或使用接口预定义且已核的 alias-case。没有自动枚举全部别名划分。\n\n不同资源分量采用安全笛卡尔抽象而不枚举联合状态积；丢失关系只降低精度。权限与实际责任的守恒独立检查，不能因为分量状态看起来允许而同时造出两份权限。\n\n一般多状态/递归协议入口不能唯一推导时，接口作者明确给定入口上界，定义方检查；不搜索任意最弱前置条件。普通用户调用一次接口，不抄写协议表。\n\n### 5.3 可组合的失效与高阶调用合同\n\n第5.1的 U/K/D 快路径继续处理资源关闭顺序；新增投影失效事实不能以一个无序 `writes_everything` 集合替换它。一般合同在既有有限协议中记录事件的目标投影、每个结果边及必要顺序。若使用压缩关系，必须证明它覆盖实际先后发生的失效—使用对，而不是只检查最终状态。\n\n公共调用合同至少区分：来源关系、访问/失效上界、真实责任与结果路由、捕获/恢复依赖、机器 ABI。它们是同一合同的不同投影，不是五个可互相矛盾的真相源。调用方使用已核公开摘要；内联、CT和真实特化按实际读取的实现另建依赖。\n\n高阶参数的调用效果在既有 `effects(call(f))` 位置按参数合同实例化，不在回调创建时提前执行。保存回调的 Hold、实际 Call 和 Cleanup 分别组合。回调可能被调用多次时，要检查状态与责任能否再次满足调用前提；仅有 Fn/FnMut 类型不证明外部资源可重复销毁或重复消费。\n\n显式合同是上界，不是用户自行授信的声明；定义方验证全部实际效果被包含。导出的推导摘要变化是 API 变化。私有实现若在既定抽象投影上仍满足原上界，不应只因新增内部字段而迫使调用方重写或重查无关安全条件。\n\n未知外部、动态目标或尚未实现的效果组合，不解释为空集合。使用受支持的保守上界；没有足够合同则报告相应拒绝/未支持，不转为运行时借用检查或隐藏保活。\n\n\u003ca id=\"ZIL-ROUTE\"\u003e\u003c/a\u003e\n\n## 6. 来源集合与实际管理路径\n\n管理路由规则覆盖参数、返回、保存和类型擦除：\n\n```zil\nfn pick(a: Ref\u003cNode\u003e, b: Ref\u003cNode\u003e, flag: bool) -\u003e Ref\u003cNode\u003e {\n    return if flag { a } else { b }\n}\n```\n\n`from(a|b)` 只说明可能来源；它不能单独告诉调用者，返回的原生地址应该配哪个清理记录，尤其不能默认依赖地址相等来区分零尺寸、内嵌资源或特殊表示。\n\n接口可观察能力分开固定：\n- 只返回访问描述：发布来源和访问条件；不承诺有可执行的管理路由。\n- 返回允许管理的入口：合同同时导出与结果同步的 BindingRoute；ABI 携带必要记录入口或已经存在的选择见证。\n- 单一来源：路由可静态恢复，不必增加结果字段。\n- 自带责任包：从当前包位置取得内部记录。\n- 动态管理器：通过已核 Store 操作定位和消费，承担实际查找。\n\n概念合同项称 `manage(result)`，不是新的默认 Ref 类型。是否提供它由公开接口固定，不可随调用者后来是否关闭而改变 ABI。私有内联优化可以删去不用项，不能偷偷改变发布符号。\n\nRef 的名义数据布局仍是既定入口。额外 route 是调用 ABI 的附加结果/当前证明上下文，不能因为后来某处调用 close，偷偷改变一个已经公布的 `struct { ref: Ref\u003cT\u003e }` 的布局。跨持久存储或类型擦除继续提供管理能力时，使用有明确布局与 Hold 合同的借入管理视图/闭包环境，或内部拥有完整责任的包；仅保存裸 Ref 不承诺保存管理路线。库可以封装这种视图，但其字段和借入记录成本必须可见。\n\n路径描述由有限语法组成：输入记录、包内当前投影、与数据相同的 SSA 选择、Store 的已核管理准入。不能用任意运行脚本恢复责任。管理路由本身不创造 Manage 权限，仍需当前上下文有授权；持有借入的记录地址会约束记录自身存活和移动。\n\n\u003ca id=\"ZIL-CLEANUP\"\u003e\u003c/a\u003e\n\n## 7. 准确清理、初始化和析构\n\n每个真实分配单位/外部资源由一个实际载体持清理义务，或明确处于共享协议/永久泄漏状态。普通描述和实际分配责任不同；节点内部地址不拥有底层整页的 free 权。\n\n静态一次清理直接发射；条件关闭用已有控制流/tag/flag；跨函数关闭传固定管理 ABI；动态数量使用明确容器。作用域结束先处理依赖它的真实使用者和协议，再按固定顺序清理。\n\n关闭不是简单 `flag=false; destructor()`：\n1. 确认管理资格、正确绑定、无冲突使用。\n2. 转入 Closing，暂停普通重入，临时清理动作持实际义务。\n3. 执行已核 teardown 和字段清理。\n4. 根据正常、可恢复失败或 panic 的真实结果，提交 Discharged 或带明确剩余义务的合法状态。\n\n清理记录的存储自身也受保护：若记录位于将要释放的分配中，必须先将剩余责任移入仍活的清理激活，或者在最后一个不可失败 dealloc 之前提交记录，之后不得再读取原记录。不能 free(payload) 后向 payload 内的 flag 写 Done。\n\nclose 返回错误不必意味着资源仍然 Live；例如外部关闭结果含不确定性时，wrapper 必须给出 Uncertain/需要隔离的状态，不得自动重试实际 free/close。普通内存 dealloc 成功后的责任不可复活。\n\n局部按逆成功构造顺序，完整聚合按固定字段顺序；部分构造只清理已初始化部分，不调用完整 teardown。自动 Drop 不挂起/不返回可恢复错误，允许其合同声明的 I/O、分配、阻塞或 panic；使用上下文必须允许。\n\n资源的用户清理入口由内建 `Drop` trait 显式绑定：`impl Drop for R { fn drop(self: Self) { ... } }`。在资源实现中，`Self` 按资源的默认类别表示 Desc；此入口只由持有实际清理义务的清理激活调用，激活提供 Closing 期间所需的目标访问资格，不允许普通方法调用或函数值绕过该入口。它不转交一份可再次自动清理的 Managed 参数。未实现 Drop 的资源只执行其字段的规定清理；同一资源最多一个绑定，不能按普通方法名 close/destroy 推断绑定。普通 Value 的析构签名与资源责任模式分别核验，不从这个资源入口推导一般 Value 可复制。\n\n数据环合法，不保证互相读取的析构环可排序。先做显式 Live 期 shutdown，或提供有正确阶段划分的群协议。不得自动改变可观察析构顺序、无限延后或扫描全图。\n\nprepare/slot/publish/abort 是同一责任规则的实例：构造 RHS 先成功，再写槽与提交完成记录；中间没有可恢复失败/回调/挂起；不完整发布拒绝；异常出口清理实际完成内容。with 由控制流激活持责，用户 ticket 丢弃不取消这项义务。\n\n\u003ca id=\"ZIL-PACKAGE\"\u003e\u003c/a\u003e\n\n## 8. 资源包、替换与返回\n\n包显式列出真正 `manages` 根，重复 Ref 可合法，重复责任不合法。内部管理关联记录“同一实例的当前投影”，不是旧栈记录指针。包移动保持实例、更新外壳投影；replace 改变字段实例，旧值捕获不能重定向成关闭新资源。\n\n打包分为可失败准备、逐字段初始化、无失败提交。责任按实际完成步骤转交；后续失败只清理仍由本侧持有者。give 不扫描可达图，不隐式接管包外 Ref 指向的对象。\n\n拆包必须使每个输出闭合，或者显式导出合法外借。含用户析构的部分移动通过已核 decompose。外部地址或记录借入仍指旧外壳时阻止移动；稳定 payload 不因外壳移动而重新分配。\n\n每次打开包给内部实例一个局部存在名字。不同名字不证明实际不同；动态集合元素通过真实索引/保护取得局部名字，同一次取得的证据可以保留，脱离保护后不能假装身份不变。\n\n### 8.1 用责任形状组织拥有组合，而非永久维护类型组合白名单\n\n前端和 lowering 使用结构化的“拥有形状”描述同一份类型的真实责任。概念构造包括普通值、单个 Managed、按字段组合的 Product、按真实 tag 选择的 Sum、完整固定数组、初始化前缀、具具体环境身份的 Closure，以及显式间接载体。它不是新增用户类型系统，也不表示所有递归组合立刻受支持。\n\n每个构造必须明确：布局、完整/部分初始化状态、可用移动/借入/替换操作、责任路由、每个退出的清理顺序。普通 Copy 字段没有独立释放义务，但它们的地址和有效值仍须检查。Product 按字段声明顺序；数组和 Store 前缀按现有规范顺序；Sum 只清真实活动分支；Closure 保留原捕获及 Fn/FnMut/FnOnce 合同。\n\n动态 Store 只对 `[0,len)` 持有元素责任，尾部无责任；pop 后旧尾槽不能再次析构，失败 push 必须归还完整未插入值。放入父字段后由字段责任指向实际 Store 头，不能因没有用户 teardown 而跳过内建前缀清理。\n\n前端生成形状建议，独立 Verify 从名义声明、原始指令、控制边和真实操作合同核验其每个构造及组合。允许共用无语义 schema/遍历格式，不允许多个阶段调用同一个“判定安全”的辅助函数来假装独立审核。lowering 只消费核验后的形状与清理计划，不能通过 `supported()` 扩大安全接受集。\n\n施工按构造逐个开放：先 Store 直接拥有字段、现有完整元素、具体自含回调字段；再增加新的组合及原样近邻反例。每次开放同时覆盖 Types、Analyze、Verify、Lower、机器布局与清理，不把一层成功推广到任意深度、递归拥有、异构/dyn或借入逃逸。\n\n闭包字段的源 opaque 身份、具体环境布局、调用模式及责任必须同时保留；两个工厂环境恰好同布局不意味着源类型相同。替换先准备新值，成功后按原规则清旧值和提交；失败不恢复已经显式转交的其他责任。\n\n\u003ca id=\"ZIL-CAPTURE\"\u003e\u003c/a\u003e\n\n## 9. 闭包、可变高阶捕获与动态抽象\n\n闭包为真实环境值和调用入口。捕获决定环境保存什么，调用模式决定怎样使用环境，Call 合同决定目标操作及其状态变化；三者分别记录。Hold（持续地址/清理依赖）、Call、Cleanup、Resume 都由同一类型与合同语义解释。\n\n### 9.1 自动捕获与按值捕获\n\n闭包写 `x =\u003e expr`、`(x: T) =\u003e expr`、`() =\u003e { ... }`，可在参数前加 `move`。裸形式只允许一个未标类型的名字；带类型、零个或多个参数使用括号。参数后可写返回类型 `-\u003e R`，如 `(x: i32) -\u003e i64 =\u003e ...` 或 `x -\u003e bool =\u003e ...`；不写时从闭包结果约束推导，不套用具名 fn 的缺省 void。没有强制捕获列表。\n\n参数和返回类型可从显式注记、唯一已解析期望 callable 形状、正文的有限类型约束及同一词法作用域内已解析的调用约束推导；每个闭包表达式得到一个固定签名，不按每次调用重新选型或自动产生多个泛型实例。无法得到唯一签名或约束冲突时诊断，不能通过安全失败改换签名、捕获、clone 或装箱。\n\n表达式体返回表达式。闭包块最后一个未加分号的表达式为结果；其后的逻辑换行和注释不丢弃结果，真实分号丢弃结果。最后一个未加分号的 if/else 的既有分支块递归处于同一返回值位置；缺失 else 是 Unit 继续路径。空块、绑定/赋值等普通语句尾以及以分号结束的值路径产生 Unit。显式 return 与这些尾路径按同一结果类型检查，不把不可到达路径算成额外返回。\n\n尾规则只进入闭包自身以及上述最后 if/else 分支，不传播到非末尾分支、循环、defer、with 或编译期块；普通具名函数仍显式 return。独立裸块语句不属于当前源面。尾路径可正规化为明确 Return，保留分支作用域、求值顺序和源位置。\n\n先解析名字、类别与调用参数模式，再按正文用途推导捕获；返回、存储或异步目的地只检查所得环境，不反向选择另一种捕获策略。\n\n| 自由路径类别及用途 | 普通闭包的环境 | `move` 闭包的环境 |\n|---|---|---|\n| 只读普通 Value，包括 Copy | 共享借入最小合法位置；不默认创建快照 | Copy 复制；非 Copy 移动 |\n| 修改 Value 或重新绑定外部变量 | 独占借入对应位置，父方相交使用暂停 | 修改环境拥有的值，不重新绑定外部原位置 |\n| 正文按值消费非 Copy Value | 在创建闭包时移动该值 | 同左 |\n| 普通使用 Desc，包括修改其目标 | 复制描述与来源，目标操作进入 Call；不凭此建立长期地址窗口 | 同左，不接管目标责任 |\n| 普通使用实际 Managed | 保存 Desc；管理操作另保存合法 route 与必要 Hold | 将真实 Managed 载体转交环境 |\n| 正文 `give r` 且 r 是实际 Managed | 创建闭包时先转交到环境；调用时再按正文给出 | 同左 |\n| 已有 Address | 按正文需要借用/重借已有窗口；不复制独占资格 | 复制共享地址值或移动独占地址值，原始寿命上界不变 |\n\n因此 `let f = () =\u003e count` 不保证快照；`let f = move () =\u003e count` 对 Copy count 保存快照。`move` 捕获实际 File 载体与捕获 `alias: Ref\u003cFile\u003e` 是不同操作；不能沿 alias 追溯并夺取另一个位置的责任，也不遍历可达图。\n\n`\u0026mut` 默认捕获建立父窗口的共享或独占重借。独占重借存续期间暂停相交父资格；结束条件包含闭包、派生返回值、已提交任务及其他真实使用者，不只看最后一条字面调用。只读重借不升级权限，`move` 地址不延长被引用对象存活。\n\n### 9.2 精确路径和三个执行时点\n\n普通内联结构/元组字段可精确捕获；同源前缀合并，不能移动同一字段两次或制造两份相交独占资格。动态索引、自定义投影、未知解引用、packed/union、需完整 teardown 的位置，提升到最近合法前缀或要求明确的已核视图。不能为提高精度提前执行 getter、索引计算、allocator 或用户代码。\n\nAddress 的捕获在首次地址解引用处截断，包括 `move`；例如 `self: \u0026Self` 内的 `move () =\u003e .x` 保存 self 地址及其 Hold，不提前读取 x，不取得 Self 所有权。普通 Value 聚合仍可精确捕获字段。Desc 路径在描述值处截断：`() =\u003e node.value` 捕获 node 的描述，读取 value 发生在每次调用；不把它变成创建时读取 value，也不无故捕获长期 `\u0026node.value`。`() =\u003e nodes[next()]` 中的 next 每次调用才执行。用户要固定目标时先写 `let selected = nodes[next()]`。\n\n创建时建立捕获、窗口和真实责任转交；调用时执行正文；销毁/取消/消费时按 Cleanup 结算。嵌套闭包逐层传递所需捕获，不能隔一层藏掉来源与责任。捕获字段按绑定完成后自由路径首次出现的源码顺序排序；合并/提升保留最早出现位置，展开代码按规范化源映射顺序。析构依第7章聚合规则，不取哈希表遍历次序。\n\n环境按实际字段初始化并提交；失败只清理已经成功交入的字段。移动带用户 teardown 的值必须遵守已核 decompose；不能留下缺字段而仍调用完整 teardown。\n\n### 9.3 调用能力与可重复性\n\n编译器提供统一 callable 合同族，源面写 `Fn(A, B) -\u003e R`、`FnMut(A) -\u003e R`、`FnOnce() -\u003e R`；空参是空列表，单参不要求元组标点。一个元组实参写 `Fn((A, B)) -\u003e R`。内核仍保存 Args 参数元组与结果类型；旧 `Fn\u003c(A,), R\u003e` 等源面以迁移诊断拒绝，不作为另一套规范拼写。这些是已核闭包协议的名义入口，普通空 impl 不制造能力。\n\n| 调用模式 | 环境上的实际要求 | 典型情形 |\n|---|---|---|\n| Shared / Fn | 只读环境及其中共享能力 | 拥有普通值但仅只读；复制 Desc 后按 Call 操作外部目标 |\n| Exclusive / FnMut | 独占环境，可修改其字段或使用其独占能力 | 修改计数捕获、通过捕获的 `\u0026mut` 写入、修改环境拥有的内联资源头 |\n| Consume / FnOnce | 消费环境并结算未给出的剩余字段 | 移出非 Copy 捕获、给出捕获的 Managed、履行直接拥有且未恢复完整形状的责任 |\n\n满足 Fn 的环境也可经独占/消费适配调用，满足 FnMut 的环境也可经消费适配调用；适配不减少 Hold、效果和状态前提。普通 `f(...)` 按静态接口当前可见的 Fn、FnMut、FnOnce 优先顺序确定一次调用模式，再检查其前提；检查失败不消费回退。具体 FnMut 闭包不能因绑定是 let 就自动改走 FnOnce；需要消费适配时显式使用 `FnOnce.call_once(f, argsTuple)`，或将 f 按值传给只声明 FnOnce 的泛型入口。调用 FnMut 需要可写闭包位置，通常为 `var f`；FnOnce 调用消费闭包，即使绑定是 let 也可以移动一次。FnOnce 只表示至多一次调用接口，不承诺一定调用；从未调用的拥有环境仍准确清理。\n\n拥有捕获不等于 FnOnce-only：`move () =\u003e text.length()` 可以保有 text 并重复只读。相反，`move () =\u003e file.close()` 在 file 为直接 Managed 时会修改环境内真实责任记录并履行责任，必须取得消费环境资格，不能宣称通过共享 `\u0026Env` 写 cleanup flag。若显式槽协议在每个出口重新建立完整形状、初始化与新责任，可以提供 FnMut；新实例不得冒充旧实例。\n\n`() =\u003e alias.close()` 若只捕获外部 Desc 与借入 route，环境本身可为 Shared，但 Call 把外部目标由 Live 变 Done，第二次调用必须拒绝。重复调用还需每个允许出口的 Call 后态满足下一次入口；`Fn` 不隐含任意次数、无重入、纯函数或线程安全。泛型 twice/map 等接口必须导出其真实调用次数、顺序或循环不变入口义务；不能只凭 trait 名称批准重复调用。\n\n对外部 Desc 修改目标可不修改环境，但仍需要当前目标写资格；共享闭包环境不能让两个线程复制相交写资格。Cleanup、Resume、allocator 与借入依赖共同决定 Transfer/Share。\n\n### 9.4 函数值、返回与擦除\n\n函数类型的 `-\u003e` 右侧取得完整返回 Type：`fn(i32) -\u003e E!i32` 返回错误联合，`fn() -\u003e i32?` 返回 Option。对函数指针整体应用 `?`、`!`、`|` 或地址前缀时先用括号，如 `(fn() -\u003e i32)?`；不依类型期望改换箭头结合。\n\n`fn(A, B) -\u003e R` 是无环境函数指针；只允许无捕获且调用/错误/恢复 ABI 兼容的函数或闭包转换。有捕获闭包保持具体环境类型；参数采用 `F: Fn(A, B) -\u003e R` 等泛型或显式借入/拥有 dyn 存储。不能把捕获闭包默默装箱以塞进 fn 指针。Fn 约束不改变参数传递：`f: F` 按 Value 的 Copy/Move 传环境，`f: \u0026F` 共享借入，`f: \u0026mut F` 独占借入；要保留调用者的非 Copy 环境必须使用合法借入接口。\n\n普通函数及 inherent 方法的返回位置可写 `-\u003e impl Trait`，包括 `-\u003e impl Fn() -\u003e i64`：每个定义及类型/常量实例对应一个隐藏的具体返回类型，所有可达 return 必须为该同一类型；不同闭包表达式是不同类型，不能自动联合或堆盒合并。该形式不用于参数位置、trait/dyn 方法返回槽或开放关联类型。隐藏布局依赖仍进入真实编译/ABI指纹，不等于稳定 ABI。\n\nopaque 返回只隐藏具体类型名；Hold、Call、Cleanup、Resume、来源、错误、调用模式与管理 route 仍在导出接口中。定义方推导的这些关系可成为 API；复杂递归形状必须先声明。返回借用局部的闭包拒绝，显式 move 借来的地址同样不能延寿。公开消费者只用导出关系，不能依赖 callee 私有正文重算。\n\n返回值借自调用参数与借自闭包环境分开；后者使用明确的来源/lending 关系，并在结果存续时保持环境。消费环境不能返回指向已销毁环境内部的裸地址。\n\n可能挂起的调用遵守 Direct/Suspend 和 SABI：环境与一次调用的任务帧是两个真实载体。帧借用环境时，任务/取消完成前保持借用；前次任务占有独占环境时拒绝第二次相交调用。move 闭包可重复创建任务的前提是每次真实取得独立载荷或合法借用，不能复制同一责任。\n\n### 9.5 容器、替换与动态合同\n\n借入回调不逃出其已声明调用边界；拥有回调的实际资源随环境包给出；异构回调选择明确 Box/arena/调用者槽。所谓非逃逸不推导纯、无挂起、无重入或无限可重复。\n\n动态可变容器三条路径固定：固定外借上界；每项自带存在资源包；或独立 Key 经活 manager 准入。每次写入同时满足既定来源/潜在行为边界，共享后不偷偷扩大。循环每次拿到新的完整包可以逐项消费，但轮次不同不证明借入 Ref 实际不同。\n\n替换同时检查新 Hold 与旧 Cleanup；正在 Call 的环境不能普通销毁。明确 HandlerSlot 可在 Active 期登记有界移除/替换请求并在 Settling 后结算，这是已核库协议，不是任意赋值默认延期析构。\n\nlazy map 构造不执行回调，推进才合并 Call，取消/析构合并 Cleanup。dyn 固定所有外借、调用模式、结果形状、效果、管理路由和线程合同。未声明的槽不能按空行为处理；类型擦除不得抹去任一依赖。\n\n\u003ca id=\"ZIL-BYTE-STORAGE\"\u003e\u003c/a\u003e\n\n### 9.6 显式拥有字节存储\n\n`ByteBuffer` 是无公开字段的内建资源类型，描述与载体分别遵守 Desc/Managed、give 和 create/give 结果规则。`bytes_new()` 构造空载体，不分配。`bytes_reserve(b, capacity: i64)` 请求绝对容量并返回 bool；负容量或分配失败返回 false，保留原有头、内容、长度、容量与责任。`bytes_push(b, value: u8)` 不隐式分配；容量足够时先写一个字节再提交长度，否则返回 false 且不改变存储。`bytes_len`、`bytes_capacity` 返回 i64；`bytes_view`、`bytes_view_mut` 分别建立已初始化前缀的共享/独占借片。以上裸原语名及类型名保留，用户成员名不受影响。\n\n`bytes_truncate(b, length: i64)` 将已初始化前缀缩短，仅当 `0 \u003c= length \u003c= bytes_len(b)` 时提交长度并返回 true；否则返回 false，头、内容、长度、容量与责任均不变。它不分配、不改变容量、不增长长度，不保证清零被截断字节；后续 push 必须先写入再扩长。该裸原语名保留，所有调用均按潜在写处理，即使长度不变或运行时将失败；相交活动窗口不能跨越该操作。\n\n\n载体内联保存指针、长度和容量；始终保持 `0 \u003c= len \u003c= cap \u003c= i64::MAX`，只有 `[0,len)` 已初始化。源程序不能构造、读写或重解释内部头。分配/释放是明确的可信原语，不隐式使用RC、全局对象表或世代句柄。分配准备失败不回滚此前用户实参副作用；成功才发布完整头，准备/提交/释放间不调用用户代码。清理先结算外部载体中的唯一责任，再释放payload，释放后不能访问payload内记录。\n\n借片依赖实际载体及其分配映射。reserve、push、give、drop及相交写必须排除活动窗口冲突，即使某次运行恰好不扩容或返回false。元数据读取同样要求合法资源和当前资格。两个同源Desc参数、普通helper和跨函数返回不能绕过来源与窗口规则；来自Desc参数的结果借片映射回调用方实际来源，局部载体不能裸片逃逸。重新分配到相同地址或重新建立同名事实不会恢复旧片。原语只维持存储不变量；容器增长策略、算法和字符串编码合同由显式普通接口组织。\n\nByteBuffer可作为Package的直接manages字段，或沿既有拥有捕获规则进入闭包环境；包含该字段的完整Package同样可以整体移动、返回和拥有捕获。内部头随实际载体转交，原位置的唯一责任同时结算。字段或捕获Desc产生的窗口保持真实载体来源；取走、补入、替换、整个载体移动和清理均检查相交活动窗口。当前有限实现可以保守地以整个Package或环境为来源，不能把不同字段名直接视为分离证明。内建字段清理遵守先结算外部责任、后释放payload的顺序，失败准备仍只清理已成功取得的责任。ByteBuffer Desc借入捕获与借自环境的裸slice返回需要各自完整的外部效果及lending合同，在该合同实现前不开放。\n\n### 9.7 逐捕获来源与效果的闭合\n\n含 Desc 与 Address 的混合捕获使用逐捕获合同，而不是把“模块中出现真实资源头”作为终态语言的统一拒绝理由。对每个捕获记录来源、依赖、Call 的实际读写/失效、重借关系，以及 Cleanup/Resume 会访问的内容。当前实现可在该合同尚未贯通时报告 Unsupported，不能直接删除保护条件。\n\n调用时先实例化所有捕获和显式实参的来源，再共同核验当前调用窗口；只看闭包外部最后一次出现位置会漏掉本次调用中的使用。Desc-only helper 内部再创建并调用闭包，也必须向外传播实际效果。\n\n调用模式只描述环境访问：Fn 不等于全局纯，FnMut 不自动拥有捕获的外部对象，FnOnce 不允许忽略未消费字段的清理。具体自含回调存入字段、固定数组或已支持容器，必须使用同一条身份/形状/清理路径，不为每种外壳另造特例。\n\n\u003ca id=\"ZIL-CFG\"\u003e\u003c/a\u003e\n\n## 10. 控制流、递归与可终止判定\n\n所有求值、getter、allocator、临时值、Drop、panic 和取消点显式进入 TypedCFG。不可达源码仍检查类型形状；实际效果只沿可达路径传播。\n\n分支 may 并、must 交，结果 tag 可保留对应事实。只有同一 SSA 条件的一层选择关联；不展开任意布尔树。权限分支通过互斥选择交接一份实际权限，不能在合流处把两条互斥路径的资格相加。\n\n循环节点和来源节点预分配；固定点只增加有限关系。每次动态 fresh 的身份与物理槽复用分开；跨轮保存由真实 carrier 承担。循环证书检查入口与每条回边；break/error不冒充完整初始化 publish。\n\n递归组先声明形状、资源投影和必要的一般状态合同。may prefix 与返回可达性求最小不动点。递归调用按接口假设检查，用有限返回调用栈的归纳支撑部分正确性；不需要证明终止，但不能凭递归契约凭空分配 fresh。有限执行前缀也必须符合状态要求。\n\n类型/常量/特化的无限增长与运行递归分开，使用锁定规则的逻辑配额。ResourceLimit 不产生可执行产物，也不被叫作已证不安全；缓存冷热和墙钟不改变规则接受集。\n\n\u003ca id=\"ZIL-CONCURRENCY\"\u003e\u003c/a\u003e\n\n## 11. 并发：描述共享不等于执行权共享\n\n内核以实际字节资源的执行资格组织冲突：\n- 读资格可分份，但任何非原子写需要没有相交读/写持有者。\n- 单线程短操作复用同一执行资格；复制描述不拆分该资格。\n- 子任务取得的独占范围在父上下文暂停；join/协议归还后才能恢复。\n- Mutex 把资源资格放进锁不变量；锁定取得，解锁交回，并有真实 acquire/release。\n- Atomic 提供专门操作，不使包围它的非原子 payload 自动安全。\n- RCU/hazard/epoch 是有额外证明义务的库原语，不从“版本相等”推导对象不会随后释放。\n\n非原子数据竞争的排除是：任何两个未同步的相交访问，若一方写，就会要求同一份无法复制的执行资格同时存在于两处；规则禁止这个状态。同步交接还必须通过实际 happens-before，不能只写一个 acquire 标签。\n\nTransfer/Share 由所有被迁移或共同操作的数据、环境、Cleanup、Resume、allocator、TLS 与 driver 合同组成；Pinned 不推导线程安全。仅在父线程保活且不被子线程操作/清理的对象，不虚构成子线程载荷。\n\n标准同步库的实现须有弱内存论证。仅 SC 交错通过不构成该论证；RustBelt 的弱内存扩展就是这类边界的既有经验。\n\n\u003ca id=\"ZIL-ASYNC\"\u003e\u003c/a\u003e\n\n## 12. 挂起、异常、取消与驱动的最终共同边界\n\n### 12.1 Direct 与 Suspend 两种接口\n\n无 suspend 用普通调用 ABI；可能 suspend 的实例用明确 SABI。泛型效果改变调用模式就是真实代码需求，不是纯 ghost。没有执行根的同步入口不能直接进入 Suspend，也不偷偷阻塞。\n\n静态子帧依赖无环时按实际并存区间布局。挂起递归环必须有显式 BoxTask/arena/调用者存储/Stack 边界；不默默装箱。普通同步递归用正常栈并具有栈保护。\n\nSABI 保留 init/poll/request_cancel/poll_close/finish_destroy。poll/poll_close 同一帧不并发重入。Ready 只一次移出结果；之后可以观察完成标签但不能再次取值。返回借自帧的结果会阻止该帧销毁，除非随拥有包给出。\n\n### 12.2 异常与待退出状态\n\n**不能先展开一个直接调用栈，再声称其局部缓冲已经转移给异步 draining。**\n\n发布给外部的地址必须已经在稳定 frame、稳定包或同步结构化 run 覆盖的真实存储内。直接 helper 的栈地址若要超出 helper 返回/展开，必须先经显式转交或使用符合模式的挂起帧；不是事后把字节复制出来。\n\nSuspend 边界将源 panic 转为拥有载荷的 PendingExit(Panic)，跟 Error/Cancel 走同一收口；Direct 目标可以使用本机 unwind，但在已公布的 ABI 边界转换为受管理结果，或者按目标固定 abort 策略。不能让仍在栈上的平台 unwinder 状态悬挂后换线程恢复。\n\nPendingExit 不是延后检查的通行证：return RHS 的读取/移动在源位置仍须合法。要给出一个仍被子任务借用的可移动头，先显式 join；不能先非法移动，再用稍后的 draining 补救。独立成功值可以先存在真实结果槽，最终失败时清理。\n\nSABI 内的清理若再次 panic，按固定策略进入 Faulted/abort；不得重新公开部分清理对象。FFI 未声明的 longjmp、外部异常跨界、强制线程杀死不是 safe 取消手段。\n\n### 12.3 所有外部用户必须包括唤醒入口\n\n不能只数“数据设备”和“完成回调”。实际使用者包括：submit 当前调用、poll/poll_close 当前调用、已进入 callback、仍可开始的 raw callback、timer、保留的 waker、DMA、OS 登记和返回借用。\n\n用户票据不是最后根。借入 scoped 模式由不可遗忘的完成根覆盖父存储；脱离模式真实持有所需包和外部依赖。只给外壳装箱不延长外借栈。\n\n原始 userdata 路线保持其记录直到完整静止；消息路线携带独立 ID，先通过活 registry 取得保护，再读任务/对象。waker 不得以已经可能被释放的裸 frame 指针作为“稍后再判断是否过期”的入口。\n\n关闭准入和已经进入用户的登记必须线性化：在同一锁/正确原子协议内决定“允许进入并登记”或“拒绝进入”。不能先看 open、随后才无保护计数，使关闭在二者之间误见零用户。active=0 不证明未来无新回调；还需要后端 no-future 保证或稳定注册根拒绝旧消息。\n\n回收条件是所有真实使用者归还、后端不再直接访问记录、结果责任已处理、窗口已结束。submit-returned、data-done、callback-quiescent 仅是这个完整条件的具体分量。\n\n正常退出等待；主体异常优先，随后按创建序选未观察子错误。成功返回值先存待退出槽，最终改为失败时也准确清理。取消界和最终回收有环境前提，不以提前 free 换时限。\n\n### 12.4 设备与 FFI\n\nCPU release/acquire 只解决相应 CPU 同步；DMA map/unmap、方向、cache 和设备屏障由平台适配器保证。 任意原始设备字节必须经过初始化/类型有效性转换才能成为 bool、enum、引用。\n\nFFI 导入只给布局和符号。wrapper 说明 noescape/retained、线程、重入、取消、完成、异常与实际资源责任。 当前有限同步借入 profile 使用 `provides(noescape(parameter)); effects(ffi);`，地址参数必须完整、唯一列出；它要求不保留地址、无跨界异常或挂起并遵守范围/可变权限；默认无回调/重入，只有显式 `provides(static_callbacks());` 才允许下述有限静态回调。`ffi` 不表示纯性、无 IO 或无阻塞；声明真实性仍是显式 unsafe 承诺，不能制造来源、活性、初始化或独占资格。该 profile 不支持地址返回和异步 retained。\n\n有限外部值 profile（schema15）：仅在 x86_64-unknown-linux-gnu 与 x86_64-pc-windows-msvc、64位、小端、LLVM、checked算术目标开放。c_handle 是Copy不透明指针宽度令牌，c_null()构造空值；只支持值传递、存储、相等/不等，无解引用、算术、整数转换或Address/Desc转换，也不证明OS资源活性或唯一释放。允许借用保存handle的槽。c_wstr 是只读程序静态UTF16字符串指针或NULL；c_wstr(\"字面量\")编码合法UTF16并追加唯一末尾NUL，内嵌NUL拒绝，c_wstr_null()表示NULL。编码单元按实际数量收费；它可由外部留存但不可写，不可从借出地址/整数/handle制造，不可作为外部结果或可变C载荷字段。空字符串不是NULL。\n\nextern \"C\" fn(...) -\u003e T 是独立ForeignCallback类型；c_callback(静态普通函数符号)仅指向实际定义、无环境、非foreign、非teardown、非closure入口的精确签名目标。参数仅i32/i64/c_handle，结果再加Unit；代码地址可以留存，没有数据环境，不能普通CallIndirect或转普通FunctionPointer。c_*构造无外部效果且裸名称不可被值/函数遮蔽；外部调用仍需unsafe。static_callbacks()同时允许传入/留存静态回调与外部反调已注册回调；直接或共享载荷含回调的声明必须标记它。回调不得访问本次借出的ZIL存储，外部本身仍可按声明权限读写该存储。外部不得将借出地址传给回调或留存，也不得跨边界unwind/longjmp/挂起。该合同不引入全局注册表，不放宽栈借用或赋予原始令牌释放权限。\n\n本有限C值ABI接受u8/u16/i32/i64/c_handle/c_wstr/上述静态callback参数，返回仅Unit/u8/u16/i32/i64/c_handle；窄整数使用真实目标C ABI。单层共享Address载荷允许这些静态值及递归非空数组/非空Record，可变载荷仅允许全位模式有效的u8/u16/i32/i64/c_handle及递归非空数组/Record。Bool/Unit/enum/普通函数指针/资源/Package/嵌套Address拒绝。此Record子集按声明顺序、自然C对齐和尾部补齐布局，只通过地址借入；无按值聚合、packing、union、bitfield和变参ABI。padding不是语言字段值，外部仅可读取已初始化声明字段，可以在对象范围内写padding。所有地址仍需完整唯一noescape索引，并独立核验同期活性、来源、初始化及读写冲突；静态字段可被复制留存不等于其外层record地址可留存。新外部值、回调和嵌套组合不进入本片CT执行；u16按普通整数规则执行CT。外部违反合同属于可信边界破坏，与 Rust 同类；不宣称静态语言隔离恶意外部任意写。\n\n\u003ca id=\"ZIL-LOWERING\"\u003e\u003c/a\u003e\n\n## 13. 目标表示：规定主路径，不让每个后端重新发明\n\n普通值内联，稳定描述用原始指针或既定索引，不默认 RC/世代/租约。只有真实管理接口传路由；管理参数和结果路由的 ABI 固定。具体闭包内联环境，dyn 才保存实际入口。包从当前基址解析内部关系。\n\n主原生路径采用在工具链清单中锁定的 LLVM 目标语义。普通 Desc 不转换成带活对象保证的 Rust \u0026T，不默认 noalias/dereferenceable。实际读取时才有相应动态范围证据。Dormant 不比较、哈希、序列化、恢复身份；只是不可解引用的 opaque 描述。LLVM 对不解引用指针有独立规则。\n\nC profile 不接受其未证明合法的失效原生指针搬运；这是后端支持范围，不是全语言能力的虚构完成。若要扩展必须提供合法 typed encoding，不能把 LLVM 规则套用到 C。Cranelift/Wasm 同理按 profile 验证。\n\nLIR 必须显式保留初始化、责任转交、所有结果清理、真实同步和帧固定；优化不能根据普通 Desc 附加排他属性。强窗口首先产生精确范围证据，没有充分目标映射时宁可保留较弱优化。noalias 的使用需要目标专项规则，源程序安全本身不依赖优化成功。\n\n无堆/无任务 profile 不链接无关 runtime。必要越界/对齐检查不会因关闭优化变成 UB；目标缺原子/异常/栈保护能力明确报告，不伪造语义一致。\n\n### 13.1 机器生成策略与源语义解耦\n\nLLVM 文本、LLVM API 或其它受支持后端必须消费同一已核 LIR 和同一份显式目标/ABI/优化配置。调用 LLVM API 不是安全证明；LLVM IR verifier 只负责 LLVM 结构约束，不能替代 ZIL 的来源、借用和责任核验。\n\n错误必须关闭产物发布：LLVM 结构核验失败、对象生成失败、链接失败或取消时，不返回可运行的新产物，也不把旧成功文件当本次结果。优化级别、是否输出 IR、CGU 数和线程数不得改变语言规则。\n\nDebug/Release可以选择不同实例和分区策略，但必须保持类型选择、溢出/错误语义、责任与析构顺序。运行时类型信息共享泛型体属于明确机器策略，不属于另一种 trait 选择规则。当前不将存在化/类型擦除设置为默认；引入前先证明无隐式堆分配、布局和管理 ABI 正确，并把实际间接调用/栈空间/类型信息成本计入验收。\n\n\u003ca id=\"ZIL-MODULE\"\u003e\u003c/a\u003e\n\n## 14. 类型、模块、comptime 和工具\n\n名义类型、唯一 impl、具名关联类型、有限 life 模板、lending/HRTB 支持按声明检查。类型关系与机器布局分离；纯品牌和效果不独立实例化。具体类型、常量、Drop、帧或真实调用不同仍有相应代码实体。\n\n完整类型证据由规则核验器检查；不能因为 trait 求解器返回 true 就授予原语权限。unsafe impl/同步原语属于显式审计点。表面宏只产生未核 AST，不能制造 VerifiedProgram。\n\n文件即模块，默认私有，明确导入，包依赖无环；普通递归在模块内可用。公开合同区分输入条件、may 行为、must 后置、管理路由和真实 ABI。替换不得加强前提、扩大破坏、削弱保证或错配布局。改变 alias 顺序可能仅改语义；新增返回管理路由可能改 ABI。\n\ncomptime 执行有逻辑配额和显式输入，不从未完成安全查询反向修改 impl。IDE/check/build 共享同一判定；不完整代码可以显示未知，不把未知变为安全。自动修复不重排有副作用语句，不收窄真实效果以消除错误。\n\n\n\n\u003ca id=\"ZIL-SYNTAX\"\u003e\u003c/a\u003e\n\n## 15. 固定源面与歧义消除\n\n### 15.1 词法、语句和名字\n\n源文件为 UTF-8，标识采用 Unicode XID_Start/XID_Continue 加 `_`，ASCII 关键字保留，名字区分大小写且不作隐式规范化合并。允许 `//` 行注释与可嵌套 `/*…*/` 块注释；`#` 不是注释起始符。数值默认十进制，`0x/0o/0b` 为显式基数；`010` 是十进制十。分隔下划线不得首尾或连续出现。值先解析为目标类型合法数值，再发射规范表示，不把原始数字拼写直接交给目标 C。\n\n分号和逻辑换行均可终止语句。圆括号、方括号或模板参数列表内的换行不是终止符。行末为二元运算符、`,`、`.`、`=`、`-\u003e`、`=\u003e`、前缀 `\u0026`/`give` 或 `|\u003e` 时视为续行；行首的 `(`、`[`、`.` 不反向拼接上一条已经完整的语句。需要跨行后缀调用/索引时将完整表达式放入圆括号。`return` 与其操作数必须在同一逻辑行开始；`return` 后换行就是无值返回，后续表达式不是隐含返回值。普通具名函数块无隐式尾表达式返回，使用 `return`；闭包块仅按第9章的值位置规则处理尾值，编译期块使用 `yield`。\n\n`import std.io as io` 使用点分隔的逻辑模块路径，每段为标识符；值或类型成员同样使用 `.`。不接受路径字符串、斜杠分隔、相对路径段或 glob。逻辑名不按物理文件名解释：`import a.zil` 表示 `a`、`zil` 两段，不会剥去末尾段。文件即模块，默认私有。导入在模块声明区固定，不由任意运行代码改变。\n\n逻辑模块 `a.b` 从项目根解析到 `a/b.zil` 或目录入口 `a/b/mod.zil`；二者同时存在时拒绝歧义，不设隐式优先级。目录只有显式入口文件才成为可导入模块，不扫描、合并或自动导出目录内其它文件；入口通过普通导入与公开声明组成接口。解析后的真实路径不得逃出项目根；指向同一真实文件的导入共享模块身份。默认别名取最后一段。\n\n类型实参用 `Buffer\u003cu8\u003e`；表达式中的显式泛型调用统一写 `make::\u003cu8, 32\u003e(alloc)`，`::` 在此只引入值位置的泛型实参，不作为另一种模块路径写法。解析无需查询类型即可区分它与 `\u003c`/`\u003e` 比较。类型上下文的连续 `\u003e\u003e` 可拆成两个闭合 `\u003e`；表达式上下文仍是移位。泛型类型的静态方法和构造在表达式位置同样写 `Buffer::\u003cu8\u003e.new(alloc)`、`Pair::\u003cu8\u003e { ... }`，不因看到 `\u003c` 就试探类型再回退比较。\n\n### 15.2 绑定、模式和表达式\n\n`let` 不允许重新绑定普通位置；普通 Value 的直接内容写入和 `\u0026mut` 要求 `var`。已有资源描述可通过当前执行资格操作其目标，不从 `let` 推导目标只读。Managed 位置的完整替换也要求该位置可写。不存在 `:=`、隐式 clone 或“移动失败改借用”的第二套解释。\n\n`=` 为语句，不产生值。目标接收者与索引从左到右各求值一次，再计算 RHS，RHS 成功后写入并按规则处理旧值。复合赋值先确定目标并读取原值，再求 RHS、计算和提交；短读不制造两个同时独占窗口。目标预约不能跨未知重入、挂起或相交失效，需要时先将 RHS 显式计算为局部值。\n\n`T?` 是 Option；`E!T` 是错误联合；表达式后缀 `?` 只沿实际错误出口传播。数组类型 `[T; N]`、切片类型 `[T]`、数组值 `[a, b]`、索引 `a[i]`、半开范围 `a[lo..hi]` 各按上下文唯一解析。`\u0026[T]`/`\u0026mut [T]` 是地址窗口。`a ? b : c` 不属于语法，使用 `if` 表达式。`a[]` 非法，完整切片写 `a[..]`；区间端点采用非区间表达式，复杂比较或逻辑端点须用括号。`if/while/for/match/with` 的控制头在顶层遇到 `{` 即开始主体；头部需要结构构造字面量时写成 `(Node { ... })`，不得依赖类型查询判断大括号归属。\n\n有限借入切片 profile（schema16）：一层 `\u0026[T]`/`\u0026mut [T]` 从已有固定数组或切片窗口建立，T 为现有有限 Copy 值；裸 `[T]` 不可按值加载、存储或传递。`\u0026a[lo..hi]`/`\u0026mut a[lo..hi]` 按对象、显式 lo、显式 hi 的顺序各求值一次，缺省端点为0/当前长度，先核 `0 \u003c= lo \u003c= hi \u003c= len` 再计算偏移。空区间合法，索引仍要求 `0 \u003c= i \u003c len`。`\u0026*s`/`\u0026mut *s` 可整体重借。切片地址的零实参 `.len()` 返回 i64，仍要求窗口活性和访问资格；其它接收者同名调用不改义。共享复制、独占转交/重借、普通跨模块函数参数与参数来源返回沿现有地址规则；来源保守覆盖整个后备对象，不推导区间互斥。子范围投影不制造新的独占资格，显式重借才建立父子关系。机器表示为指针与 i64 长度，不分配；只开放既有 x64 小端 checked LLVM Linux/Win64 profile。切片进入闭包捕获/显式 callable/helper 参数结果、聚合/错误载荷、FFI 或 CT 执行仍关闭；资源/地址/拥有元素、无来源制造、局部窗口逃逸、动态分配/扩容和外部长期留存不能由此获得许可。所有 raw 类型、范围 operand、来源、预算与权限由 Verify 独立检查。\n\n在明确期望类型`E!T`的上下文中，表达式本身已是同一联合类型时直接传递；否则表达式类型恰好与E/T中的一侧相同时注入该侧。两侧同时匹配或均不匹配时拒绝，不以运行值猜测分支。没有其它明确类型约束的整数字面量仍采用默认i32，错误联合的两个备选分支不各自反向试探并选择类型。`?`要求操作数为错误联合，且错误类型与所在函数的错误类型相同；成功时得到T，错误时先确定待返回载荷，再按真实责任和退出顺序清理并返回。不隐式转换错误类型，也不把普通`return`一律解释为成功分支。\n\n闭包的产生式见第9章；参数和调用能力在类型/合同阶段决定，parser 不猜捕获。元组为 `()`、`(x,)`、`(x,y)`，`(x)` 只分组；元组投影写 `.0`、`.1` 等非负十进制整数字面量，不把它识别成浮点小数。\n\n从高到低的运算优先级为：字段/调用/索引/`?`，前缀 `! - ~ * \u0026 \u0026mut give`，乘除余，和差（含 wrapping），移位，位与/异或/或，范围，比较/相等，`\u0026\u0026`，`||`，管道 `|\u003e`。闭包箭头体延伸到当前表达式边界；其优先级低于管道，在管道右侧直接使用匿名函数时加括号。二元运算按组左结合；比较和范围不允许隐式连锁。`#(...)`、`#{...}` 是原子表达式，不改变外层优先级。\n\n### 15.3 函数与合同的唯一承载形式\n\n函数头顺序固定为：可见性、`fn`、名字、泛型参数、参数表、可选 `-\u003e` 返回类型、可选 `where`、可选 `contract`、正文或外部声明分号。返回类型不采用冒号同义写法。正文可为普通块、`=\u003e { ... }` 块或 `=\u003e expr`；箭头后遇大括号固定取块，表达式形式等价于 `return expr`，并按声明的返回类型检查。函数省略返回类型仍为 void，表达式体不会反向改变签名。未写返回类型表示 `void`；没有 `!` 表示无可恢复错误。完整声明示例：\n\n```zil\npub fn pick(a: Ref\u003cNode\u003e, b: Ref\u003cNode\u003e, first: bool) -\u003e Ref\u003cNode\u003e\ncontract {\n    result(from(a, b));\n    provides(manage(result));\n} {\n    return if first { a } else { b }\n}\n```\n\n合同正文是有限声明 DSL，不执行普通表达式：`result(create)`、`result(give)`、`result(from(paths...))` 三种互斥结果模式；`requires(read(path), write(path), manage(path), apart(a,b), state(path,Tag))` 给前提；`provides(manage(result))` 要求导出管理路由；`effects(alloc,io,block,suspend,spawn,ffi,reenter,panic,call(f),cleanup(T))` 给已核上界；`resume(local)`/`resume(transfer)` 固定恢复上界。参数/结果路径必须在接口有限投影表中，不能是任意运行表达式。没有声明的其它关键字拒绝。\n\n有正文定义可推导合同，导出的推导结果是可观察 API；显式 `contract` 的各项是必须核验的固定上界。无正文/dyn/FFI/递归形状环需足够合同，遗漏不解释为空行为。已固定合同不因正文改动悄悄加强前提；要求更精细的导出属于接口变更。不得同时提供另一套尾随 `from(...) effects(...)` 作为规范写法；迁移工具可转换，编译器默认仅接受这一套。\n\n`trait` 方法中的 `self` 模式、关联类型、常量和合同槽在签名中确定；实现可减少效果、减少前提、增强保证，不能改变已发布实际 ABI。安全错误不会触发改选另一重载。\n\n\n\u003ca id=\"ZIL-RECEIVER\"\u003e\u003c/a\u003e\n\n### 15.4 接收者默认值与 `.name`\n\n接收者在读正文前确定：方法显式首参数 `self: Type` / `give self: Type` 优先；其次是 inherent impl 的组默认；trait impl 则从对应 trait 签名继承；其余为静态关联函数。没有按正文是否使用字段决定 receiver 的路径。receiver 类型别名展开后只接受 `Self`、`\u0026'a Self`、`\u0026'a mut Self`、`Ref\u003cSelf\u003e`（life 可省）；`give self` 只用于实际 Managed 资源 Self。其它包装类型需要普通关联函数显式传参，不根据首参数名把任意 i32 等类型变成该类型的方法。\n\n```zil\nstruct Point { x: i32; y: i32 }\nimpl Point(self: \u0026Self) {\n    fn sum() -\u003e i32 =\u003e .x + .y\n    fn shift(self: \u0026mut Self, dx: i32) { .x += dx }\n}\nimpl Point {\n    fn origin() -\u003e Self =\u003e Point { x: 0, y: 0 }\n}\ntrait Measure { fn measure(self: \u0026Self) -\u003e i32; }\nimpl Measure for Point {\n    fn measure() -\u003e i32 =\u003e .x + .y\n}\n```\n\n组默认写 `impl Type(self: ReceiverType)`，也可 `impl Type(give self: Self)`。它只补入缺省的首参数，不改变参数类别。组内方法显式 receiver 覆盖组默认，静态函数写在无组默认的 impl 中；无组默认的 impl 仍允许显式 self 方法。trait 定义显式声明每个 receiver，trait impl 不接受组默认，省略 self 时只能继承接口；显式写出必须与接口模式、ABI和可替换合同一致。\n\n`.name` 在名称绑定阶段直接成为当前实例方法 `self.name` 的同一绑定，不是运行时 this。普通字段用法、访问资格和自动借入与显式 self 完全相同；匿名闭包沿用这一词法 binding，随后使用第9章捕获规则。self 为接收者保留名字，局部/闭包参数不得遮蔽；普通块不允许声明具名 fn，提取 helper 用模块函数或闭包。静态函数/顶层没有 receiver 时 `.name` 报错。\n\n前导点不表示 enum 变体、管道输入或 with 对象。枚举值使用 `Alignment.Center`；若当前 receiver 确实有名为 Center 的成员，`.Center` 仍是普通成员访问。\n\n`object.method(args)` 降为关联函数调用，receiver 求值一次且先于普通参数。只在已确定的 receiver 类型允许时自动产生短地址借入；不尝试多种权限直到安全检查成功。冲突 trait 候选使用显式 `Trait.method(receiver, args)` 指定，未消歧时报名字错误。\n\n`Type.method` 是含显式首参数的无绑定函数项；`object.method` 若指方法本身而非数据字段则拒绝取值。绑定回调显式写 `(args) =\u003e object.method(args)`，让捕获、存储和逃逸使用同一套闭包规则。具名 callable 字段可以普通取值。同一名义类型的固有字段与固有方法禁止重名，所有 impl 合并后检查；若字段与已导入 trait 方法同名，点号先解析现有字段，调用非 callable 字段会报类型错误，不回退 trait。调用该 trait 方法使用 `Trait.method(object, args)`；多个 trait 候选冲突也需显式路径。\n\n\u003ca id=\"ZIL-RECORD\"\u003e\u003c/a\u003e\n\n### 15.5 记录构造与更新\n\n`Point { x: 1, y: 2 }` 为名义类型构造；`let p: Point = { x: 1, y: 2 }` 可从已经确定的期望类型省略类型名。参数、字段和返回位置同理。没有期望名义类型的 `let p = { x: 1 }` 拒绝，不能按字段集合搜索结构或悄悄创建匿名结构类型。\n\n只有表达式位置允许无名记录字面量；函数/闭包 `=\u003e { ... }` 始终为块，返回记录写 `=\u003e ({ x: 1, y: 2 })` 或 `=\u003e .{ x: 1, y: 2 }`。`.{...}` 明确引入记录，仍必须有已确定的期望名义类型，与裸记录使用相同的字段、布局、初始化与清理规则，不创建匿名结构类型。独立块、控制主体不因存在冒号而变成记录。字段简写 `{x,y}` 引用当前同名绑定，重复或未知字段拒绝，隐私规则正常生效。显式字段从左到右求值一次；遗漏字段必须有合法声明默认值，默认值在显式字段成功后按字段声明序求值，不能读取未完成 self。\n\n更新写 `Point { ...base, x: 4 }` 或有期望类型的 `{ ...base, x: 4 }`。仅允许一个位于第一项的 spread；base 和目标为相同名义类型/实参，覆盖字段各一次。更新不新增字段、不更换名义类型、不访问私有字段，未提及字段来自 base；不重新执行它们的默认值。\n\n求值顺序固定：先将 base 依既定 Copy/Move 规则取得到一个临时完整值，再从左到右求覆盖表达式，全部准备成功后装配结果。不可 Copy base 在第一步即移出；其后读取原 base 拒绝，要复用数据须先显式取出。已准备但未提交的字段和临时 base 在失败时依第7章清理，已发生副作用不回滚。被覆盖的旧字段在提交期间依原声明序清理一次，未覆盖字段各转交一次；清理失败/重入须纳入 CFG 和合同。\n\n通用 spread 限于没有自定义整体 teardown 的普通 struct。resource、package、含 manages 字段的载体和自定义整体 Drop 类型使用构造器、replace 或已核 decompose；不能靠 spread 重复或隐式分拆真实管理责任。普通 struct 中已有不可 Copy Value 字段仍可整体移动并按字段规则清理，不引入 clone 或新堆分配。\n\n\u003ca id=\"ZIL-PIPE\"\u003e\u003c/a\u003e\n\n### 15.6 管道与元组展开\n\n`left |\u003e target` 先求 left 一次，再求 target 一次，然后将前者作为唯一实参调用后者；管道左结合。target 是可产生一元 callable 的表达式，不是函数调用的占位模板。`x |\u003e f(a)` 的含义是先取得 `f(a)` 的结果，再用 x 调用这个结果；如果该结果不是一元 callable 则类型错误，不改写为 `f(x,a)` 或 `f(a,x)`。\n\n```zil\nlet n = raw |\u003e parse |\u003e normalize\nlet m = raw |\u003e ((x) =\u003e adjust(x, limit))\nlet pair = (left(), right())\nlet sum = add(...pair)\n```\n\n管道左侧取得遵守目标已确定参数模式：Value 的 Copy/Move、Desc 复制、Address 重借和显式 give 各按原规则。对需要借入的 place 保存一次求值的定位，不为了临时名无条件移动或延长到作用域结束。RHS 求值若重入/挂起/失效这个定位，必须按同一预约与窗口规则拒绝；必要时用户先显式准备 callable 或独立值。不得用错误求值顺序规避这种冲突。\n\n管道不自动展开 tuple、不传播错误、不插入 await、不柯里化、不 clone，也不把 `.name` 绑定到左侧。错误传播写 `(raw |\u003e parse)?`；`raw |\u003e parse?` 的后缀属于 parse 表达式。匿名函数 target 加括号，`x |\u003e (v) =\u003e ...` 为语法错误。\n\n调用实参允许 `...tuple` 显式展开：按源顺序求 tuple 一次，按索引序产生确定个数的实参。元组形状在类型阶段已知，Value/Desc/Address/Managed 模式逐元素核验；没有数组、迭代器或运行长度 variadic 展开。展开不是复制；不可 Copy 元组值移出，部分失败清理真实已准备元素。单参 tuple 默认仍是一个实参。\n\n\u003ca id=\"ZIL-SCRIPT\"\u003e\u003c/a\u003e\n\n### 15.7 运行入口与托管扩展边界\n\nNative 源文件保持同一模块文法；`zil run path.zil` 是驱动的检查、构建和执行入口，不改变绑定、捕获、责任或 import 语义。模块顶层只声明，不执行任意语句；程序从唯一显式 `fn main()` 开始。声明的 main 返回 void、i32 或相应错误联合；成功的void映射为进程退出码0，成功的i32映射为该整数退出码，错误联合的错误结果映射为退出码1且入口不隐式打印。错误退出先完成合法清理。没有隐式 module initializer，也不把导入模块的变量变成全局脚本环境。需要脚本式短程序仍写 main，后续前端糖必须明确降为同一入口。\n\n托管宿主/GC 不进入 Native 默认模型。本语言的第一施工闭环覆盖 Native CLI 与显式宿主 ABI；请求尚未实现的 managed profile 返回 Unsupported，不能悄悄改为 GC/RC。未来托管扩展必须明确自己的对象类型、根注册、可移动性和暂停点、跨界值/地址转换、异常、回调注销及线程合同，并通过同一 verifier 可表达的桥接；不能把普通 Ref 重新解释成自动保活引用。\n\nGC 存活不代替文件/锁/订阅等责任结算，不代替原生地址窗口、并发资格或完成根。新增 managed profile 是单独的语言/运行时变更，当前 Native 的安全和产品验收不以它为隐含前提。\n\n\u003ca id=\"ZIL-COMPTIME\"\u003e\u003c/a\u003e\n\n## 16. `#` 编译期入口\n\n`#` 是显式编译指令族的共同前缀，不是可变全局编译器对象，也不为其内部表达式提供额外安全权限。相邻语法由其后的定界符或保留字确定；这里的统一是阶段入口和基础设施统一，不要求全部形式都调用同一函数执行器。\n\n| 形式 | 输入、结果和位置 |\n|---|---|\n| `#(expr)` | 表达式或类型位置求编译期值；Syntax 结果仅是数据，不自动插入 |\n| `#{ statements; yield value }` | 编译期块表达式；`yield` 只结束本块，不能 return 外层运行函数 |\n| `#[name(args)]` | 附着于下一声明/字段/参数的属性请求，规则见第17章 |\n| `fn fixed\u003cT, #N: usize\u003e(...)` | 显式编译期值参数；使用 N 时不重复写 # |\n| `#if (cond) { ... } else { ... }` | 声明或语句位置的编译期分支；两支均词法/语法正确，只物化并检查选中分支 |\n| `#for (x in values) { ... }` | 声明或语句位置的有限生成；按迭代序发射，导出同名冲突报错 |\n| `#emit expr` | 插入带卫生与类别信息的声明或语句列表；完整产物重新检查 |\n\n不接受裸 `#call()`、把 `#[1,2]` 当数组、空 `#[]` 或 `#![...]`。编译期数组写 `#([1, 2])`。`#` 后的分发 token 必须在同一逻辑行，定界符内部允许换行。普通字符串中的 `#` 无特殊含义。编译期表达式不隐式发射语法，普通函数运行成功也不授予已核 IR 的构造权。\n\n```zil\nfn square(x: u64) -\u003e u64 { return x * x }\nlet n = #(square(12))\nlet table = #{\n    let x = square(8)\n    yield [x, x + 1]\n}\nfn repeat\u003cT, #N: usize\u003e(value: T) -\u003e [T; N] where T: Copy {\n    return array_repeat::\u003cT, N\u003e(value)\n}\n```\n\n### 16.1 编译期类型、执行和产物\n\n`Type` 与 `Syntax\u003cCategory\u003e` 是编译期数据类别，不能作为任意运行值。类型可作编译期参数和结果；名义身份由生成器声明、规范化参数和生成位置构成，不按字段相同合并。可读反射遵守可见性：形状查询依赖字段/接口，布局查询另依赖 target/ABI，二者不混成全包哈希。\n\n编译期函数使用同一语言的已核控制流和数值规则，以受限 CTIR/VM 执行。宿主 usize/浮点和机器地址不能自动代替目标语义。临时分配受预算，允许输出可序列化常量、TypeRef、卫生 Syntax、明确可重定位静态数据；禁止泄出 VM 临时地址、运行时资源身份、权限和 Debt。\n\n纯编译期不读网络、时钟、系统随机、未声明环境或任意文件；构建驱动提供显式资产与配置快照。记录输入内容、实际查询、生成器实现、目标相关信息和规则版本。逻辑步骤、临时字节、生成节点、嵌套与实例数分别计量。预算不足为 ResourceLimit，不改变到运行时执行，不把部分生成声明授信。\n\n普通受约束泛型依据符号 bound 检查；反射器按具体形状生成的不同代码分别完整检查。生成器检查通过不代表所有产物通过。品牌/纯证明不独立生成机器实例；实际布局、调用、常量、Drop 或 SABI 不同仍有真实实例成本。\n\n### 16.2 阶段依赖与封闭 impl 集\n\n调度状态至少区分 TokensReady、ConfigReady、ShapeReady、ImplIndexReady、LayoutReady、ContractReady、VerifiedCTBody。查询只读取已完成且获允许的层级。句法扩展不需要类型；类型辅助生成可读取完成形状；trait 求解不能回入生成器改变当前候选 impl 集。\n\n`derive(Debug)` 可读取已完成的原类型字段并生成普通 impl，然后统一检查；不得先假设本类型实现 Debug，再据此运行生成器证明 Debug。生成与自身布局相互依赖时报告阶段环。任务按实际依赖 DAG 分批，不要求全项目全部展开，也不允许靠反复重试未完成查询形成隐式固定点。\n\n每批生成后封存对应声明/impl 索引供其消费者检查。改变输入允许启动新批次并使真实依赖失效，但活动查询不得看到可变候选集。VM、原生展开器和缓存命中必须遵守相同可观察结果及逻辑配额；来源位置和调试信息可以另行更新。\n\n\n\u003ca id=\"ZIL-ATTRIBUTE\"\u003e\u003c/a\u003e\n\n## 17. `#[...]` 属性与编译阶段\n\n### 17.1 语法和作用对象\n\n一个属性段只包含一个属性：`#[path]`、`#[path(args)]` 或 `#[doc = string]`；多个属性逐段书写。`path` 使用命名空间点号，不是字符串。属性只附着到紧随其后的声明、字段、enum变体或形参；具体许可目标由 `spec/attributes.json` 固定。不能悬空、不能附着任意值表达式、不能改变相邻语句的含义。模块级策略由 `zil.toml` 和显式模块声明提供，不使用内属性 `#![]`。\n\n```zil\n#[repr(C)]\n#[align(16)]\nstruct Packet {\n    code: u32\n    size: u32\n}\n\n#[cfg(target.os == \"windows\")]\nextern \"C\" fn platform_open(code: u32) -\u003e i32;\n\n#[derive(Debug, Eq)]\nstruct Point { x: i32; y: i32 }\n\n#[inline]\nfn square(x: u32) -\u003e u32 { return x * x }\n```\n\n`repr` 的 C/transparent 是注册表规定的枚举参数，`derive` 的 Debug/Eq 是 trait 路径，`align` 的参数是可编译期求值整数。它们不是任意无类型函数调用。属性参数所在位置自动要求编译期已知，不必再套 `#(...)`；嵌套 # 求值若使用，按同一规则处理而不增加权限。\n\n裸 `[Attr]` 不作为属性写法，保留给数组、切片、下标和其它既定类型语法。与 `#(...)` 没有语法冲突：`#` 后是 `[` 进入属性产生式，是 `(` 进入求值，是 `{` 进入块。\n\n### 17.2 分类、阶段和重复规则\n\n| 类别 | 例子 | 消费阶段及限制 |\n|---|---|---|\n| 配置裁剪 | `cfg` | 仅读取构建/目标/feature 的封闭配置表达式；在名称、类型和生成之前裁剪 |\n| 句法变换 | 显式导入的 `ui.component` | 读定界 Syntax；只输出未核 CoreAST，不能读取当前未完成类型 |\n| 类型辅助生成 | `derive` | 读完成的原声明形状；只能追加生成项，不回写原类型字段/基类 |\n| 表示约束 | `repr`、`align` | 类型与目标布局检查，失败即拒绝；不会自动保证外部 ABI 合同 |\n| 生成提示 | `inline` | 已核代码的生成提示，不改变源程序安全接受集或实际语义 |\n| 文档、lint、测试登记 | `doc`、`allow`、`test` | 只作用于注册的元数据/诊断/测试入口，不能关闭安全错误 |\n\n所有属性先做词法、定界及参数结构解析。配置裁剪为 false 的项不进入名字/类型/其他属性解析执行；不能因此接受未闭合 token。未知属性只在保留的项上解析报错。重复 cfg 逻辑与；doc 按源码顺序拼接；其他单次属性重复报错，即使参数相同。derive 列表中的重复 trait 报错。\n\n同一阶段内，句法变换按源码顺序接收上一次结果并保留未消费属性；阶段先后由注册表决定，不依赖把 `#[derive]` 写在 `#[repr]` 上面还是下面。生成属性读取同一个冻结形状，产物汇总后检查重名与 impl 冲突；不让生成器先后顺序决定 trait 成功。生成的新项重新进入相应阶段，配额计入且依赖环拒绝。\n\n`#[inline(always)]` 是尽力提示，不是安全事实；`#[inline(never)]` 与其他 inline 同附着时冲突。align 必须满足目标的正二次幂和最大对齐限制；repr(C) 不验证某个 C 头与声明完全一致。未知属性、错误目标、错误参数类型、冲突属性都有不同错误码。\n\n### 17.3 属性不等于任意编译器访问\n\n第三方属性清单必须预注册：输入类别、作用目标、阶段、可查询接口、输入依赖、输出类别与资源预算。导入清单是构建输入，不由属性执行偷偷加载。\n\n不存在 safe `#[alive]`、`#[unique]`、`#[noalias]`、`#[trusted]` 来直接授予事实；标准低层符号/段/内联汇编属性若需要外部承诺，必须在显式 unsafe/FFI 合同中接受审计。`#[allow(...)]` 仅接受 lint 注册表中的名称，安全错误码不属于 lint。\n\n默认不把自定义属性实例保留到运行时，不强制生成反射表。程序确需运行时元数据时，由显式生成或库接口选择相应存储，计入二进制和初始化成本。\n\n\n\u003ca id=\"ZIL-TRAIT\"\u003e\u003c/a\u003e\n\n## 18. trait 与语法扩展的固定边界\n\n### 18.1 普通抽象\n\n一个名义 trait 系统统一方法、关联类型、常量和有限关联合同。impl 头为一阶名义模式；要求 trait 或 Self 的最外层名义定义归本包，且已发布实现不重叠。普通 wrapper 不作为绕过所属检查的隐形特例。默认不提供按安全失败回溯、负条件试探或 impl specialization；代码生成专门化不改变 impl 选择。\n\n```zil\ntrait Measure {\n    fn length(self: \u0026Self) -\u003e usize;\n}\nimpl Measure for Point {\n    fn length() -\u003e usize { return 2 }\n}\nfn measured\u003cT: Measure\u003e(value: \u0026T) -\u003e usize {\n    return value.length()\n}\n```\n\n匹配 impl 头只找到候选配方，全部前提满足后才发布证据。候选关联等式不得证明自身前提。泛型正文使用独立已有 bound 支持的符号投影；不要求为常见迭代器组合写手工字典。名义字段递归在声明身份停止；实际关联展开环错误，非重复增长按确定配额停止。\n\nlending 使用 `\u003clife a\u003e` 和 `\u0026'a T`，每次调用绑定与环境固定依赖分开。可写字段与相关内容参数不变型，不能通过缩短表面借期把短命对象写入长命容器。结构性质 Copy/Transfer/Share 由结构规则或明确审计点建立，空 impl 不造权限。\n\n静态目标保持直接路径；`dyn` 明确固定实际参数、结果、环境、管理路由、错误和恢复 ABI。不兼容的泛型方法不能塞入 vtable。实例共享须保持合法值、布局、Drop、错误、调用和别名合同；同尺寸不是等价证明。语义检查一次不等于所有机器生成都只发生一次。\n\n### 18.2 可替换的表面层\n\n```zil\nsyntax use zui.syntax as ui\nlet panel = ui! { column { text(\"Ready\") } }\n```\n\n固定 parser 识别命名扩展的外层定界，扩展内部规则由锁定清单提供。没有全局 token 抢占和导入顺序改变优先级。第三方只能生成未核 Syntax/CoreAST；新分配、回收、挂起或权限语义不是糖，不能通过扩展绕过核。\n\n名字使用作用域身份：输入保持调用点绑定，新名字带新卫生作用域，引用库声明使用定义点身份。扩展必须提供源映射、展开预览和格式化输入；未知扩展仍保留原 token，不吞掉源码。\n\n标准糖可以由受限 VM、预编译或编译器内置展开器实现。替换要求规范化 CoreAST 的绑定、求值次数、效果顺序、退出边和错误类别一致，临时 ID 与位置编码单独归一化。普通未使用扩展的代码不启动扩展 VM。展开产物仍按正常流程检查；内置化不绕过验证，也不代表任意生成程序零成本。\n\n\n\u003ca id=\"ZIL-ARCH\"\u003e\u003c/a\u003e\n\n## 19. Rust 编译器架构与依赖约束\n\n编译器主实现为 Rust，稳定工具链与依赖精确锁定，不使用 rustc_private，不把 ZIL 转成 Rust 后用宿主借用检查器代替本语言核。Cargo workspace 管理编译器自身构建；ZIL 的模块、包清单、缓存与目标是独立产品接口。\n\n主要数据使用类型化 ID、紧凑表、不可变阶段快照。每张大表有唯一写入阶段；禁止跨模块共享任意可写 CompilerContext。内部普通调用不因为解耦增加 RPC、JSON 或逐操作虚派发。crate 按可信边界、独立状态、替换点和重依赖划分，小算法先用 module。\n\n| 模块 | 主要职责与输出 | 禁止项 |\n|---|---|---|\n| base / ir | ID、span、诊断及 Core/TypedCFG/合同/证据/LIR schema | 不含求解、driver 或平台状态 |\n| syntax / expand | 无损树、固定语法、卫生、未核 CoreAST | 不构造 Verified，不调用安全求解 |\n| ct | 已核 CTIR 的受限执行 | 不递归进入未完成类型/impl 查询 |\n| types | 名字、类别、trait、有限投影与类型证据 | 不按安全失败换目标 |\n| analyze | 来源、One/Many、绑定、前缀合同、窗口与责任计划 | 不展开运行时堆，不读私有 callee 正文 |\n| verify | 独立核验转移、证据、调用与所有控制边 | 不依赖 types/analyze 的求证实现 |\n| lower | 实际布局、ABI、初始化、清理和帧 | 不按 parser 关键字补安全语义 |\n| backend | 消费共同 LIR 与合法目标属性 | 不擅添 noalias 或降低错误合同 |\n| db / driver | 查询、结果指纹、阶段调度与组件组合 | 叶模块不得反向依赖 driver |\n| runtime | 内存、同步、完成根、平台适配 | 不依赖编译器、ZUI 或业务对象 |\n| cli / ide | 同一语义查询入口 | 不维护第二个安全检查器 |\n\n允许的内部依赖见 `policy/dependencies.json`。verify 强制 `forbid(unsafe_code)`；其他 unsafe 限于申明并审计的原语/FFI。模式求解和独立核验可以共享 schema、格式解码和算术定义，不共享得出安全结论的求证函数。\n\n阶段数据流为 Syntax→CoreAST→TypedCFG→候选计划→VerifiedIR→LIR→目标产物。crate 依赖不是这条流水线的简单串联；driver 传入已完成形状快照，以避免 expand/types/ct 互相递归 import。\n\n语义、ABI、私有实现、源位置和真实构建输入分别产生结果指纹。私有体变化不重查未使用其语义变化的调用方；内联、comptime、布局、真实特化依赖必须传播。序列化成功与内容哈希只证明完整性，不证明对象码与接口语义一致。\n\n必需判定与可选优化分开计费。记录源码操作、事实/边、来源节点与展开条目、trait目标、实例、证书、核验、生成与链接成本；不得预建 CFG×来源×对象的笛卡尔积。未知普通 safe 行为不能降为默认动态保活。\n\n\n### 19.1 查询粒度：先建立语义边界，再选择调度库\n\n查询的逐步目标为：文件 Parse → 声明形状/名字与导出 → 单项类型/合同 → 必要的递归强连通分量 → 单函数候选/核验 → 实例/LIR/代码生成单元。声明递归或效果互相依赖时使用真实 SCC，不强行把环拆成独立查询，也不把整个项目长期视为一个查询。\n\n返回值变化只传播到真实依赖相应指纹的消费者。存在 Semantic/ABI/Private 等枚举，不等于实现已具备这种粒度；必须用无关私有体修改、公开合同修改、布局/CT/内联修改和插入未用声明的对照测试证明失效范围。\n\n查询执行期间输入不可变；取消/超预算不发布半成品，未知和诊断不能被缓存为已核成功。驱动、IDE与CLI共用这些查询和同一规则。缓存命中不得绕过规范要求的预算与资格检查。反向依赖队列、逐项结果比对和缓存淘汰策略属于可测实现选择，不以“换一个框架”代替粒度修复。\n\n### 19.2 独立核验不要求复制不可变数据\n\nTypedCFG、名义声明和候选计划可以由不可变共享快照承载。Verify 必须独立计算/核对安全事实，但不必为了独立性深复制这些原始输入。快照不得含可在核验后被另一个阶段修改的内部状态；capability 绑定精确快照、规则、目标与已核合同。\n\n当前每次完整请求独立 Verify 的要求保持。反序列化、指纹相同或对象缓存命中，都不能直接构造 Verified。共享原始表示与共用安全求证实现是两件事：前者允许，后者禁止。\n\n可另行研究“检查归纳证书而非重复搜索固定点”：候选提供有限块不变量；检查器独立核验入口覆盖、全部控制边的转移闭合、每个实际操作的安全前提，以及调用/递归合同的一致性。缺失错误、取消、清理或不返回前缀都必须拒绝。满足这些条件的归纳上界不必是最小固定点，但必须足以证明当前程序安全。\n\n该证书路径在与现有独立重算核对之前不是生产捷径。证书大小、解码、逐边核验、摘要绑定和预算全部计入成本；禁止假设证书验证总比重算便宜，也不能把分析器给出的安全结论直接当证书。\n\n### 19.3 稳定编译身份与结构化 CGU\n\n区分局部紧凑 ID、稳定声明身份、泛型/闭包实例身份、运行时资源实例和当前验证授权。跨请求符号不能仅由遍历中的全局递增序号决定；插入无关私有声明不应机械地改写所有已有符号。\n\n稳定声明身份基于包/模块/声明绑定及必要的生成/名义来源；实例身份另含真正影响实现的类型、常量和选择。源码字节偏移、内存地址、随机 HashMap 顺序不能单独承担跨请求身份。匿名项匹配歧义或名义身份变化时保守失效，不能为了命中缓存合并不同实体。\n\n代码生成单元从结构化实体/符号引用图形成，再分别输出文本或 API Module。引用图包括调用、取地址、全局初始化、函数表、Drop/closure helper和必要数据；本地链接属性与身份一致性必须保持。导入别的单元的声明不要求传递导入被调函数的所有正文依赖；内联/LTO实际消费正文时另计。\n\n分区首先满足语义与链接要求，再在稳定性、负载均衡和优化质量间作可测选择。不把按函数大小重排的贪心分箱直接当细粒度增量方案。旧文本扫描分区可保留为过渡与差分基线；遇未知格式仍保守回退，不把临时扫描器扩张成第二套 LLVM 语义实现。\n\n### 19.4 验证授权、对象 action key 与产物身份分离\n\n完整验证授权绑定当前程序，是允许生成/发布的条件；机器码复用键描述一个单元实际读到的代码生成输入；产物内容哈希描述输出字节。三者不可互换。全局验证摘要不应仅以诊断注释的形式污染所有单元的机器输入身份，但不能删除其与当前请求的授权绑定。\n\n规范化不得抹去求值、捕获字段、析构、效果和链接可观察的顺序；只消除已证无关的表示差异。语义查询命中时，诊断和调试来源仍须绑定当前快照，不复用过期源码位置。\n\n对象 action key 至少覆盖规范化单元 LIR、实际布局/ABI与被消费依赖、目标三元组/CPU/features/data-layout、算术/异常模式、编译器与后端版本、优化 pipeline、调试/重定位/代码模型和相关运行时输入。链接键覆盖对象内容、顺序与链接器/选项/运行库。常量、CT、内联或LTO依赖按实际消费补入，不能只对函数正文哈希。\n\n缓存来自明确可信的构建环境，损坏或不匹配时按 miss 重建；错误、取消和半成品不缓存。内容哈希不能证明不可信对象文件与 LIR 语义一致。共享/远端缓存的真实性与权限必须单独纳入供应链可信边界；本轮不因有 SHA256 就默认信任任意缓存对象。\n\n每次请求先满足当前语言核验，再按正确机器键复用对象。缓存命中不恢复一张过期安全许可，不抹掉当前源码的错误。局部机器输入未变而全局验证摘要变化，可以在上述条件下合法复用。\n\n### 19.5 LLVM API 的独立边界与分阶段接入\n\n后端入口接收不可变、已绑定核验结果的 CodegenUnit/目标配置，输出对象或结构化失败。安全核与前端不接触原生 LLVM 指针。LLVM FFI放在明确登记、最小化并审计的后端边界；现有 workspace 禁 unsafe 的实现设置必须显式处理，不能在随意模块解除。\n\n并行单元各自管理 Context/Module/Builder 生命周期，不能跨 Context 搬用值或共享可变原生句柄。统一初始化、目标支持、诊断回传、取消、释放和错误产物清理由适配层负责。进程隔离是可评估方案，不要求为每条指令引入 RPC；生产接口粒度为单元/对象，不是逐语句远程调用。\n\n迁移顺序为：对象/链接接口对齐 → 同 LLVM 版本的文本解析 API 对照 → 逐类 LIR 直接 Builder → 功能/运行质量/完整成本门通过后切默认。文本解析 API仍支付文本生成和解析，不得称其已完成直接 Builder。原文本/Clang路径保留为回归对照，不将后端接入设为类型化分区或对象缓存的硬前置。\n\n不复制外部项目的宿主目标假设、逐次创建开销或仅打印 verifier 错误后继续生成的路径。O0分块和O2整体/ThinLTO分别验证；冷启动、常驻、串行、并行、缓存命中和失效分别报告。\n\n### 19.6 泛型、traits 与控制效果的取舍\n\n保留第18章名义 trait 与固定 impl 选择。需要多个算法策略时优先使用普通显式策略参数/包装类型，不为追求隐式语法引入另一套作用域实例搜索；任何未来改变 coherence 的方案单独立项。\n\n可借鉴按需求传播“泛型真正需要的布局/操作”来减少无意义实例，不据同尺寸合并不同 Drop、名义身份、错误或调用合同。存在化可作为后续独立开发构建实验，不和当前 ZUI 所需语言缺口捆绑交付，也不预设比单态化更快。\n\n访问/失效效果分析与用户可捕获/恢复的代数效应不是同一功能。本轮只精化前者及现有高阶合同，不引入隐式协程栈、多次恢复或新的动态分派。若未来引入后者，必须与第12章的存储、取消、清理、重入及帧责任共同证明。\n\n\u003ca id=\"ZIL-ACCEPT\"\u003e\u003c/a\u003e\n\n## 20. 规范拒绝边界与产品验收\n\n### 20.1 不得由实现放宽的边界\n\nSafeReject、ResourceLimit、Unsupported、基础设施失败是不同结果；未完成必需检查不得生成可运行产物。支持矩阵可以声明某实现尚未提供的 profile，但不得把原始目标自动删为非目标。错误例不得通过隐藏 RC、锁、装箱、全局表或延期关闭变成成功。\n\n下面是规范验收族；实例、输入和工具链由测试夹具定义，工单仅引用 ID，不复制或放宽这里的条件。\n\n| 验收ID | 必须成立的正例与最近反例 | 所依据规则 |\n|---|---|---|\n| V01 | 普通值、Copy/Move/Describe/Create/Give 明确；拒绝未转交责任复制与临时描述逃逸 | ZIL-MODES |\n| V02 | 选择/字段/闭包来源完整；拒绝 family singleton 强更新和跨轮身份合并 | ZIL-ORIGIN |\n| V03 | 同源先读后关接受，先关后读拒绝；隐藏 Drop 和不返回前缀不遗漏 | ZIL-CONTRACT |\n| V04 | 跨模块选择返回的 payload/route/authority 对应；缺 route、错记录、释放后写 flag 拒绝 | ZIL-ROUTE |\n| V05 | 稳定环、包返回、移动和内部回调成立；旧字段捕获不重定向新实例 | ZIL-PACKAGE |\n| V06 | 自动捕获、move/give、函数值、opaque返回、短回调及容器合法；拒绝隐式夺责、错误重调、丢失Hold与悬垂返回 | ZIL-CAPTURE |\n| V07 | 分支/loop/递归与错误出口保持责任；必须拒绝未初始化发布及坏回边 | ZIL-CFG |\n| V08 | `#(...)`/`#{...}`/`#[...]` 唯一解析；错误附着、非法阶段、重复/冲突属性拒绝 | ZIL-COMPTIME,ZIL-ATTRIBUTE |\n| V09 | 生成的常量/类型/impl 统一重检；生成—求解环、伪造 Cap、未声明输入拒绝 | ZIL-COMPTIME |\n| V10 | 常见泛型/关联投影/lending 可组合；候选等式自证、未完成布局和隐式派发拒绝 | ZIL-TRAIT |\n| V11 | receiver补入、词法点号、记录/管道/展开与Native入口确定；同义前端保持绑定、求值、清理与错误 | ZIL-SYNTAX,ZIL-RECEIVER,ZIL-RECORD,ZIL-PIPE,ZIL-SCRIPT,ZIL-TRAIT |\n| V12 | 稳定追加、分区地址与正确失效；跨 realloc、变体和 detach 的错误窗口拒绝 | ZIL-ACCESS |\n| V13 | 一般 Drop 与部分构造准确，记录自身寿命合法；重入关闭与漏失败清理拒绝 | ZIL-CLEANUP |\n| V14 | 静态帧、显式递归间接、PendingExit 与结果一次转交；提前展开/回收拒绝 | ZIL-ASYNC |\n| V15 | 发布前登记、准入线性化、全部用户静止；cancel、active=0、旧通知不得单独授予释放 | ZIL-ASYNC,ZIL-CONCURRENCY |\n| V16 | 共享读、不交写、真实同步与迁移；普通原子/Pin 不授予额外权限 | ZIL-CONCURRENCY |\n| V17 | 同一已核 LIR 保持布局、清理、指针与同步；C/LLVM profile 不混同 | ZIL-LOWERING |\n| V18 | 缓存变更依赖准确、损坏重建、CLI/IDE一致；不可反序列化伪造已核值 | ZIL-MODULE,ZIL-ARCH |\n| V19 | 静态路径没有强制动态管理层，构造/清理/转换全部计费，Rust基线同语义 | ZIL-TARGET,ZIL-LOWERING |\n| V20 | 冷检查/构建/增量/元程序/核验/宿主构建分别测，n/2n/4n记录真实工作量 | ZIL-TARGET,ZIL-ARCH |\n| V21 | 多类完整演进同时计应用、库、适配和可信代码；普通拥有输入与借入描述不得错比 | ZIL-TARGET |\n| V22 | 空测试、零命中、错误基线、过期证据、未支持或超时都不能记为通过 | ZIL-ACCEPT |\n\n### 20.2 性能与演进的唯一计量源\n\n`validation/product-gates.json` 是数值预算和场景协议的权威来源。目标规则、输入规模、错误/资源合同、候选与基线版本、工具链、线程和分配器必须在取结果前固定。来源记录表明预算来自何处，不代表已经达到。\n\n运行比较包含构造、访问、关系维护、删除/暂存、转换、析构、任务和取消；分别报告吞吐、P50/P95、峰值、稳定态、保留时间、分配与同步。Rust 使用预先固定的合理最快已知实现，并可另列同布局归因；未验证更快实现不能冒称全局最快。\n\n编译分别测冷 check、冷开发 build、私有编辑、公开合同编辑、布局/生成输入变化和发布优化；Rust 构建 ZIL 本身另列。计入生成器首次准备、核验证书、缓存哈希与序列化，不把成本移出计时区。最小值可附录，主判据不得只取五次最小。\n\n演进固定树到环、独立删除、指针到索引/SoA、并行、同步到挂起、helper到泛型/dyn等完整起点；原来无需改变的业务不应因为内部选择受到无关重写。语义确实变化的身份、失败、地址、同步和ABI边界必须修改，不承诺只改一行。\n\n### 20.3 证据状态\n\n规定、手工论证、模型执行、手工 lowering、生产前端贯通、目标实现和产品验收为不同等级。证据绑定源码、规则版本、工具链、profile、输入、实际产物及命令结果。未执行不能记为 Pass；有限穷举只说明给定域，SC调度不替代弱内存和真实driver证明。\n\n独立核验器、业务oracle和测试生成器不得共用被测安全求证实现以自证。可以复用数据格式，但共享错误的测试侧代码必须单列信任范围。对可信原语的声明必须有实现审计与目标义务，不由标准库名字授信。\n\n\n### 20.4 Ante-R1 的新增近邻反例（沿用原验收族）\n\n以下为必须新增的验证规格，**不是本次已执行测试**；不新增或降低产品数值门槛。\n\n| 所属族 | 必须接受的合法情形 | 必须拒绝或明确未支持的近邻 |\n|---|---|---|\n| V02/V12 | 独立 stats 字段更新不破坏 items 读取；最后使用结束后可 reserve | 只按参数名判 apart；把 Many 单元素候选当 One；当前调用仍借入时搬迁 |\n| V05/V12 | 合法迁移完整包保持同实例的受支持描述 | 同地址替换后旧 Desc 管理新实例；保留变体载荷窗口后改 tag |\n| V06 | 逐捕获合同使安全的 Desc/Address 组合可核验 | helper隐藏写效果；Fn 捕获外部资源后被错误视为纯或任意重复 |\n| V07/V13 | Store拥有字段、完整失败返回、部分构造及逐项释放 | 满 push 丢元素；pop后重复析构；没有用户teardown就跳过内建Drop |\n| V17 | 文本/API后端在同合同下保持布局、溢出、清理和目标差异 | LLVM结构核验失败仍发布产物；把Desc标为noalias；错误使用宿主布局 |\n| V18 | 插入无关私有函数不强迫全部机器单元改变；当前验证通过后复用匹配对象 | 全局序号扰动所有符号；忽略ABI/工具链输入；哈希或缓存命中直接构造Verified |\n| V18/V20 | 共享不可变原始快照且独立核验；真实私有/公开变更传播不同 | 核验后修改快照；把多个指纹名称当成已完成细粒度；隐藏证书/序列化成本 |\n| V22 | 每项结果绑定173、207或新的明确集成提交 | 将173语言能力与207优化冒称已在同一二进制通过；把本次设计检查当编译器测试 |\n","guide":"# 阅读与使用\n\n## 从目标查看方案\n\n顶部多选语言；场景页保留原42个目标及其验收原文。点击关系节点可查看规则、前提与成本；线宽只表示依赖，不表示性能。\n\n## 当前规范与资料范围\n\nZIL数据、变量选择、代码示例和完整正文同步来自当前规则。所有ZIL路线标为设计或待实测，不把规范中的“必须”显示成已实现。其余七种语言的原有方案与来源沿用用户输入，没有在本次逐项重新研究。\n\n## 施工文件的分工\n\n终态规范只定义规则；施工总计划定义阶段；工单定义单项实现与状态。变更审查、实际检查记录有单独页。HTML是生成视图，不手工维护另一份规范。\n\n## 可下载内容\n\n页面下载规范与独立Markdown字节一致。设计/来源页提供施工计划、协作规程、语法与属性附件。完整ZIP另含任务单、门禁工具和证据；单文件HTML离线阅读无需网络。\n\n## 比较口径\n\n参数模式、错误、回收与并发合同必须一致。拥有值对拥有值、借入描述对借入描述；Rust允许合理Cell/GhostCell、索引、Arena和封装。不同机制能实现同一业务，不等于语言没有差异；省几个token也不自动证明净收益。\n","goal":"# ZIL 施工总计划\n\n## 依据与状态\n\n终态语言行为、架构不变量、永久拒绝和验收族只由 `_zil_design.md` 及其具名附件定义；量化条件只引用 `validation/product-gates.json`。本文件安排阶段、依赖和交付归属，不重复定义语义。`spec/interfaces.json` 规定阶段输入输出、生产者/消费者和可信访问方式；工单状态只维护在主工作区 `.task/\u003cID\u003e.md`。\n\n本仓已有Rust编译器和标量源码至原生程序的实际证据；完整公共schema尚未交接，B0仍在实施。其余正式工单保留原依赖和Done条件，独立准备代码不等于整单完成。当前状态只读主树工单，受测范围与未通过项引用`evidence/final-summary.json`；未实现能力返回Unsupported，不得静默接入旧Zig/世代机制。\n\nB0内部编号切片继续推进：001多模块源码贯通、002状态路径探索、003施工交接闭环、004独立标量语义oracle、005多模块接收者诊断回归修复；第三轮增加006 Rust原生Roam、007交付瘦身与可恢复审计、008点路径/目录模块、009历史规范核验、010整数范围循环、011运行产物生命周期、012原生状态门整合；第四轮013源面校准、014局部Copy闭包、015旧夹具迁移；第五轮016局部共享捕获、017持续质量队列、018问号候选实验（按用户最新要求不合入）。派工与往来见主树`.task/impl/\u003c号\u003e.md`，切片不另建正式语言验收门，也不解除父任务的schema义务。冷启动运行`node tools/handoff.mjs --check`，机器摘要只提供当前入口，不覆盖工单。\n\n本轮025–041进一步贯通跨函数共享引用、Copy聚合与枚举、普通泛型与别名、FnMut与函数指针、编译期函数/聚合和多模块应用；内部schema/wire升至4。精确范围见docs/IMPLEMENTATION-STATUS.md，部分实现不替代完整schema.v1交接。\n\n046–049贯通有限Managed/Desc/give/create与正常清理（历史schema6），051–054完成本地资源闭包和有限生命周期hunt（历史schema7）。056–058在schema/wire8上贯通有限Copy错误联合、同步传播、显式存储scope、独立核验及真实错误清理；拥有聚合部分初始化、逃逸/高阶保存、unwind和取消仍待完成。055把独立图研究推进到真实TypedIR抽取、带标记图和may-liveness影子核对，一般联合状态尚未实现；19源3192样本未建立优于块基线的完整成本收益，当前恒等点候选暂不入核。正式B0状态不变。精确能力与后续分工见docs/RESOURCE-HANDOFF.md。\n\n\n060–062在schema/wire9上贯通有限完整package：真实准备临时、原子构造、普通Value转交/参数/返回、精确字段Desc及声明序销毁，附四模块有界UI事件环、逐准备点失败与真实双fd行为对照。更一般的部分移动/替换、嵌套拥有结构和可保存高阶环境仍未完成。059继续独立研究完整相关关系与有序切割，接受性和成本结论必须绑定其实际报告，不能把论文类比直接当生产证明。\n\n064–066 在 schema/wire10 上接通一个静态具体环境参数的同步非逃逸 helper；结构化公共合同由独立 Verify 核验，普通调用点只消费该合同的外部 callback 效果，机器层保留环境位置与固定清理。五模块 helper_ui 把它纳入真实消费者；完整语言及产品门仍未完成。063 独立研究 Rust/Zig 实际成本、BDD 回收/顺序/融合关系消元，按冻结报告区分精确性、预算、研究收益与生产工程收益。后续保存回调、拥有组合和平台 FFI 按真实前置并行推进，不把平台图形闭环提前记为完成。\n\n\n069–070 在 schema/wire11 接通有限自包含 callable 工厂返回，真实拥有环境跨函数、同步事件保存/调用/销毁。067 实现 token 位置编码并保留完整关系精确性及性能回归；当前研究候选NoGo。068 将不可变raw语法、Typed引用和请求身份跨阶段复用，独立Verify和逻辑配额保持，未宣称普遍编译提速。下一片继续拥有组合/容器与平台接口的真实前置，完整语言NotSatisfied、产品门NotRun、B0 Doing不变。\n\n072–074在schema/wire12贯通直接Managed字段取走、条件清理/补入和有限Copy字段更新；部分形状只留局部，完整SSA/参数/返回边界保持。真实组件更新、失败准备和Linux句柄关闭形成当前切片闭环。071在冻结schema10上取得局部域+直接联合态的有限完整成本收益，仍为影子研究，不替换生产安全核。下一片以容器/字符串、拥有环境组合和平台接口的实际前置并行；完整语言NotSatisfied、产品NotRun、B0 Doing保持。\n\n077–079在schema/wire13接通完整有限Package的显式move捕获、真实环境视图、普通工厂返回与反复同步调用。FnMut正常及错误返回恢复完整，FnOnce部分消费后的剩余责任由调用方清理；独立Verify不消费前端证明。该组件保存片仍不是动态容器、平台GUI或异步生命周期完成。076补充强dense-direct与整态共享控制，修正071性能归因：直接转移收益成立，局部域/整态共享相对强显式基线未建立稳定净优势，生产NoGo。下一研究关注事件支持与可证明分解，主线依真实前置继续并行；完整语言NotSatisfied、产品NotRun、B0 Doing不变。\n\n080在冻结schema13上完成生产资源效果依赖调度、完整请求成本及非作者复核，已按有限热点优化合入；076联合关系候选仍NoGo。081–083发布schema/wire14，贯通u8、显式保值整数转换、同步noescape固定缓冲区C调用与真实read/write/pipe消费者。独审发现并修复move Copy捕获经可变地址更新缺回写的真实问题，普通/外部调用、提前/错误/Unit退出均按实际原生行为核对；原退回候选与失败保留。语言仍是有限原生资源语言研究编译器，完整动态容器/字符串、一般高阶、异步和平台GUI未完成；当前正式身份只读evidence/final-summary.json，B0及产品门未因此升级。下一阶段以单平台可见窗口的输入—状态—绘制—失败—关闭闭环约束语言增量，三条可证伪编译研究见docs/research/DRAFT17-ARCHITECTURE.md。\n\n084在冻结schema14完成新键失效shortcut的完整成本研究，研究和控制合入，生产NoGo并恢复基线。085–088发布schema/wire15，接通u16、静态外部值/回调、严格按地址C record、真实Win64 LLVM/PE及纯ZIL首窗；公开CT的先计费后复制/队列界定由独审继续闭环。Wine兼容层O0/O2真实键鼠/状态/Unicode绘制/resize/失败/退出证据与原生Windows验证分开。下一阶段以ZUI长期状态、事件订阅关闭/排空、必要字符串/动态容器和平台/布局API为消费者；图研究优先实际解析/预算身份和摘要/投影完整成本，无前置项继续独立写集并行。完整语言/产品门及B0状态保持，具体裁决只读精确收据与工单。\n\n089继续冻结schema15的B/K/L/KL完整成本研究；解析次数减少成立，但冷/完整进程及真实Build退化使三候选均NoGo，研究和完整负结果保留。090–092发布schema/wire16，接通有限Copy借入切片及普通函数、来源返回、闭包局部窗口、独立raw/wire和Linux/Win64机器闭环。按用户本轮明确指示，以ZIL语言为主体，ZUI只用于识别通用前置，不直接开发框架。下一主线优先分配/动态容器与字符串的生命周期不变量、一般拥有组合和泛型符号检查；长期外部回调关闭按独立真实前置推进。原生Windows、并发取消与全语言产品条件仍未完成。\n\n093在冻结schema16上完成图输出下界、受限分解论证、原Boundary Lab复用及实际生产接口反馈；H流式摘要完整成本NoGo，生产恢复强基线，研究交付保留全部反例和原始样本。094–096发布schema17，贯通显式u8 ByteBuffer的分配、失败保持、唯一清理、动态借片与泛型正文组合；Linux及Win64/Wine机器路径独立留证。设计优化和施工按docs/DESIGN-IMPLEMENTATION-LOOP.md共同反馈；下一主线优先拥有容器与Package/闭包/错误载荷组合、字符串不变量及一般元素容器的真实前置。ZIL仍为主体；完整语言NotSatisfied、产品NotRun、B0 Doing保持。\n\n## 2026-10-26 恢复接续\n\n保存的draft22历史已独立核回；120固定ByteBuffer字段借用精度、121跨模块名义callable组合、122纯CT/runtime Drop共存已重新实施并独审合入。语言主线并行优先，Roam只作为低优先级伴随发现工具，图编译保持独立支线。当前workspace1195项通过，但完整语言及产品门未因此升级；旧未恢复draft23进展不计作可用源。后续按docs/DRAFT23-RECOVERY.md列出的真实终态缺口继续，不以平台或研究归档阻塞已有语言前置。\n\n## 2026-10-26 draft24并行接续\n\n124/125/126/127分别补齐有符号位移与普通文本解码、工厂内部helper、有限长回调序列、helper直接调用局部工厂环境；真实实例来源由Types/Analyze/Verify独立处理，未修改schema17与默认额度。最终工作区1232项通过，五模块和四模块原生消费者组合闭环；完整语言与产品门保持。123研究完成两候选与全部固定确认，未证明整体编译提速，生产净回退，原候选/反例/全部采样保留。实际归因把下一研究优先级放到重复结构编码和参数效果闭包，不能继续把理论图遍历次数等同于生产耗时。\n\n独立会话研究通过`docs/research/EXTERNAL-CODEX-HANDOFF.md`约定共同基线、分支、精确实验和bundle交接；当前未配置remote。Roam维持伴随发现角色。继续以ZUI真实消费者识别普通库可实现能力与编译器缺口，语言主线优先；实际接续入口及Rust四目标差距见`docs/DRAFT24-LANGUAGE-GRAPH.md`。\n\n## 阶段与退出产物\n\n| 阶段 | 交付范围 | 工单 | 退出证据 |\n|---|---|---|---|\n| M0 共同接口和最小正式链 | 冻结schema、实际工具链、真实算术/错误源到正式产物、统一runner | B0 | 最小正常流水线及失败链；不是独立演示编译器 |\n| M1 固定语法、类型和工具链入口 | 语法/名字/类型/receiver/闭包形状、查询驱动与native脚本、独立核验、受限编译期生成 | T01、T02、T04、T05；前置满足后T03 | 每模块的实际接口、正反例和夹具等级；CT消费实际核验结果 |\n| M2 资源源码贯通 | 来源/顺序/route/责任、LLVM布局和清理、两模块工厂与完整包 | T06、T07、W1 | 真实源码→接口→独立核验→机器产物；关闭与失败清理一致 |\n| M3 高阶和完整图 | 一般CFG、闭包返回/保存/替换/析构、动态容器、最终语法与图演进 | T08、W2 | 跨模块闭包、所有表面糖、图演进与生成缓存的实际源码案例 |\n| M4 并发和挂起 | 类型/核验/帧/runtime同批支持SABI、取消、同步及全部真实完成根 | T09、W3 | 真实OS操作、晚通知、错误/panic/drain及平台范围记录 |\n| M5 产品验收 | 同语义Rust基线、完整成本、冷/增量/运行/内存/维护计量 | W4 | 按批准profile逐项裁决V19–V22，未达项不记完成 |\n\n阶段是交付分类，不是必须整阶段串行。精确依赖和artifact交接以工单及 `spec/interfaces.json` 为准，排程说明见 `docs/PARALLEL-PLAN.md`。\n\n## 并行关系与关键边界\n\nB0独立建立正式最小链并冻结公共schema后，可同时开放T01/T02/T04/T05；T03必须等待T01/T02/T05，T06等待T02/T05，T07等待T05。W1等待语法、类型、驱动、核验、分析和后端的真实交付，贯通两模块资源路径。\n\nW1不包含闭包保存：该能力明确属于T08/W2，避免“T08依赖W1而W1需要T08”的实际环。T08在W1后接手types/analyze/verify/lower中列出的高阶功能目录；T09在T08后接手挂起/并发目录，避免相交写集同时施工。W2和T09在各自前置满足后可以并行。W4等待W2/W3。\n\n模块可以消费明确标记的规范IR夹具独立开发；生产贯通必须从真实源代码开始。类型/schema存在、手填来源、手写C、属性入口测试和文档检查不能替代语言能力完成。\n\n## 派工和公共变更\n\n一单一分支一worktree，每树独立target/cache/output。B0完成后，公共schema、根Cargo/依赖锁、工具链及共享模块注册入口由集成者单写；消费方通过列明影响者的变更记录对接，不能各自复制定义或跨写集修补。\n\nReady必须具备精确base_revision、当前spec_hash/normative_hash、固定输入与全部Done前置。工单列出required/provided artifacts、写集、实际命令契约、现有源样本和待实现协议夹具。`tools/check-plan.py`检查DAG、交接、并行写集与状态；检查通过只表示计划一致。\n\n## 验收和覆盖\n\n`conformance/index.json`保存规范源样本与固定预期，不以其中的登记状态冒充执行成绩；`validation/task-test-plans.json`逐条记录协议/运行/故障夹具的实现状态。统一runner已存在，原始成绩按RunId写入out/runs；集成验收显式晋升紧凑结果到evidence；零选择、缺fixture、零执行/断言、Unsupported、ResourceLimit、超时和工具失败都不能记Pass。\n\n模块完成需要实际接口与正反例；贯通完成需要从同一源码到真实机器产物及对应失败路径；产品完成需要V19–V22与批准profile。新增规则必须有任务和最近反例，修改排期不得改变语言语义或放宽门槛。生成索引和HTML从定义源重建，不另维护状态。\n\n097完成固定四臂真实生产比较，A/B/AB按原规则全部NoGo，生产crate净恢复，研究/失败与原候选历史保留。098把独立C字节参考、Rust模型与ZIL/C各O0/O2接入原Roam队列；099在schema17完成ByteBuffer直接拥有Package字段和可保存拥有闭包的完整纵切。100以已合入098/099为强基线，独立检验按收敛状态切换调度；440进程/1760请求虽有反向链收益，三个API单元触发原冻结退化条件，生产NoGo并恢复，研究交付按精确提交独审。四目标产品状态、规范与正式父任务保持。\n","workflow":"# 设计、总计划与工单协作规程\n\n## 1. 唯一定义源\n\n| 信息 | 维护位置 | 引用方式 |\n|---|---|---|\n| 语言行为、架构不变量、拒绝边界和验收族 | `_zil_design.md`及其具名附件 | 稳定规则ID；不在工单重写条件 |\n| 量化预算与场景协议 | `validation/product-gates.json`及批准manifest | 只引用profile，不抄出第二套阈值 |\n| 阶段和覆盖分工 | `_zil_goal.md` | 引用阶段和工单 |\n| 阶段schema与生产者/消费者 | `spec/interfaces.json` | 具体schema与artifact ID |\n| 工单状态、写集、交付与裁决 | 主树`.task/\u003cID\u003e.md` | worktree只持派工快照 |\n| 规范源样本、未来协议夹具 | `conformance/index.json`、`validation/task-test-plans.json` | case ID，不把登记当执行 |\n| 实际执行证据 | `out/runs/`原始运行，`evidence/`精简收据与反例 | 绑定提交/输入/工具链/profile，大型原始产物独立归档 |\n| 变更原因与历史 | `changes/`和Git | 不覆盖当前规范正文 |\n| 当前工程决策 | `.agent/` | 一点一文件，只留当前规则与边界 |\n| 编号实施切片和往来 | 主树`.task/impl/\u003c号\u003e.md` | 只引用正式父任务，不替代其Done门 |\n| 冷启动摘要 | 生成的`data/handoff.json` | 快照而非权威；接续时重新运行handoff检查 |\n\n## 2. 输入快照和工单状态\n\n正式状态为Planned→Ready→Doing→Review→Done；返修回Doing，取消必须记录原因及能力的新承接者。本仓已有实际编译器与标量证据，完整公共schema仍由B0交接；状态只从主树工单读取，设计检查和独立准备代码均不触发整单完成。\n\n`spec_hash`是设计正文原始字节的SHA256。`normative_hash`覆盖`spec/interfaces.json`列出的全部规范输入，算法为按路径排序后拼接`path + NUL + SHA256(file bytes) + LF`，再对UTF-8结果取SHA256；`python3 tools/check-plan.py --print-hashes`输出当前值。派工还记录任务revision、实际Git基线和案例/工具链输入哈希。\n\nReady必须有实际base_revision、当前两个hash、明确产物与写集、全部Done前置和所需接口；Planned允许空基线。Doing/Review不能因等待期间的规范变更自行猜测新语义。完成状态只能由验收方根据真实结果和集成裁决回写。已合入实施切片保留当时的规范摘要；handoff从精确implementation_commit读取接口声明的必需规范集合，核对注册表集合完全一致，并逐项读取全部输入字节核验，不能把旧hash追改成新规范。在途切片仍锁当前规范，变更须由集成者记录迁移与影响范围。正式任务仍以当前规范维护；其整单完成门没有因子切片合入解除。\n\n## 3. 任务字段与交接\n\n`required_artifacts`引用已完成生产者的交接项，`provided_artifacts`由本单唯一生产；接口字段和消费者在interfaces中登记。交接包含实际源码提交、输入摘要、schema版本和验证证据，artifact名字本身不证明存在实现。\n\n`case_ids`指向已有`.zil`规范样本；`plan_case_ids`指向本单必须实现的测试夹具要求。后者的required_fixture路径和观察要求在task-test-plans中给出。工单的test_commands固定统一runner的调用契约，done_when细化交付判据，不能新增或放宽规范。\n\n规范表面语法、类型/捕获、分析、核验和lowering必须对同一节点有真实消费者。stage接口不允许用同名mock冒充；测试可以使用夹具，但证据注明等级。所有缺失必需阶段返回Unsupported并停止生成可运行产物。\n\n## 4. 并行与写权\n\n一单一枝一树，正式任务使用`task/\u003cID\u003e`，编号实施切片以编号命名分支、目录`../zil-\u003c号\u003e`。每树使用独立target、缓存和临时产物；共享仅限只读下载缓存。验收方独占发号、状态、集成及根共享配置，施工方只写分派范围和本单证据。\n\nB0串行持有建立正式最小链所需的临时广写权；完成后移交各模块，不能仍与模块施工并行修改。T01/T02/T04/T05在接口冻结后互不相交，可并行；后继任务只有在前驱Done后接手相交功能目录。`tools/check-plan.py`对无祖先关系的任务保守检查写集重叠；冲突时缩小写集或显式串行，不能忽略告警。\n\n公共schema、根Cargo/锁、工具链和共享模块注册入口由集成者单写。改变接口先提交影响生产者/消费者、最近反例和迁移步骤，再同批发布新快照；不要求整仓停工，未受影响任务继续。T08/T09虽然横跨多个crate，也只在所列功能分区接手；对父级注册文件的修改由集成者提交。\n\n## 5. 统一runner与证据\n\n现有`tools/run-cases.py --task ID --manifest PATH --out-root evidence/ID`支持conformance/index和task-test-plans两个manifest，创建新的RunId目录，不覆盖旧日志。只把真实执行结果用于裁决，不把登记的预期或空选择改成Pass。\n\n`expected.exit_code`只比较真实main进程退出状态；`expected.entry`加`expected.return_value`由原生harness调用具名函数并读取完整类型值，包括超过255的值。二者不得互换，也不能以常量解析代替执行。\n\n每次至少记录任务/提交/规范和输入hash、精确命令、工具链与profile、实际选择/执行/断言数量、逐case预期与实际、stdout/stderr、退出码及阶段/机器产物hash。预期拒绝需要匹配注册的阶段和理由；任何编译器崩溃或工具失败都不能代替正确拒绝。零选择、缺fixture、零执行/断言、Unsupported、ResourceLimit、超时和基础设施失败均非Pass。\n\nDone需要`acceptance_record`及真实result.json定位；所有规定case都有实际执行。不同证据等级分别记录：规范、模型、合成工具输入、手工lowering、生产源贯通、目标机器行为、产品比较；不得相互冒充。模型/压力调度不替代弱内存和真实OS/驱动证据。\n\n## 6. 复核、合入与复用\n\n施工方执行限定测试并提交请验报告，不自行合入或跑正式全量。验收方固定候选提交，先核输入/写集/依赖，再按风险跑受影响闭包；规范、schema、安全核、清理、构建规则改变属于高风险。普通局部cargo check不因全量锁而全部串行。\n\n复用证据必须说明源码、测试输入、feature、target、规则、工具链和产物依赖未变或已证明不受影响；“刚测过”不是依据。相交分支依次集成，后合分支吸收已合变化后才固定候选。正式计时独占资源，不与构建/压力测试竞争。\n\n验收方更新主树工单状态；worktree里的工单副本不读不改，派工信息提供主树权威位置。未派工任务保持Planned，施工方不得自己把缺实现状态标Done。已有旧证据归档到对应旧版本；新规范下不沿用旧截图/检查计数冒充本次执行。\n\n## 7. 变更和阻塞\n\n不改变接受性/行为的文字澄清可以轻量处理；影响模式、错误、求值/清理顺序、来源、ABI或支持范围的变更必须在changes列出具体差异和最近反例，同批更新规范、接口和案例。性能数字不得在排期或工单另改。\n\n发现冲突只暂停受影响任务，引用具体规则/案例与最小复现；集成者在既有授权范围内修正规范或实现，明确发布revision。未完成的终态能力仍有责任单，不能通过取消任务或标Unsupported把它从发布条件中删除。\n\n## 8. Codex冷启动与编号切片\n\n先运行`node tools/handoff.mjs --check`。脚本从Git工作树中查找main，输出当前主树位置和相对工单路径；不依赖工单内保存的旧机器绝对路径。无法唯一定位时显式传`--main-tree PATH`，并验证它属于同一仓库的main分支。只有源码ZIP也可直接构建；要核验历史和继续原分支，另取配套历史bundle，使用其实际路径执行`git clone --branch main \u003chistory.bundle路径\u003e zil-checkout`，再从恢复的checkout接续。主源码包只含按 Git 收录规则导出的源码、测试、工具和文档，不放证据、执行产物或 Git 目录；精简审计与可恢复历史另置附件，详见交付 manifest 和 docs/DELIVERY.md。\n\n切片首行状态为施工、待验、退回、已合入或卡住，与JSON一致；JSON保存编号、正式父任务、完整基线、规范摘要、写集、实施者、交付提交、独立审核和合入提交。正文只由集成者调整。末节只追加开工、交付、退回/验收、合入的必要往来，不复制完整对话。\n\n待验必须有`implementation_author`、`implementation_commit`和结构化evidence引用。已合入还要求`review = {reviewer, verdict: \"Pass\", implementation_commit, evidence}`，审核者与实施者不同、审核绑定精确交付提交，且`implementation_commit`和`integration_commit`都已进入main历史。本轮使用`git merge --no-ff`保留已审核原提交，保证仅携带main/HEAD的bundle也能恢复审核对象。至少一份审核JSON须包含与工单一致的reviewer、verdict和implementation_commit。证据必须是主树已提交的JSON结果，或交付提交中可读取的JSON结果；聊天、未跟踪日志和文件名本身不构成证据。合入后的工单记录也须提交。\n\nhandoff检查记录完整性，不验证审核者身份真实性、审查质量或语言安全，不替代check-plan和正式测试。Git子进程使用临时文件描述符捕获输出以兼容受限环境；任何进程基础设施错误都明确失败，即使同时报告退出状态零。施工只运行本单限定测试；独立审核由另一代理承担；全量由集成者统一执行。当前会话不搬入Cursor专用常驻监听机制，等待和重派由当前可用协作工具管理。\n\n主树集成完成后执行`node tools/handoff.mjs`生成`data/handoff.json`；分树只允许`--check`。摘要不保存绝对工作目录，记录受测提交与实际当前HEAD而不要求它们相等，避免文档/证据提交造成自身哈希循环。接续时重新检查实时记录，不能用旧摘要直接判断完成。之后仍按`python3 tools/check-plan.py --self-test`与工单命令执行相应门。\n","syntax":"# 语法与属性实施入口\n\n规范性解释见完整规范第15—18章。以下附件由同一构建过程嵌入，不是另一套语法。\n\n## 文法产生式\n\n```ebnf\n(* ZIL-LANG-1.3 normative surface. This EBNF fixes productions, not a soundness proof.\n   ZIL-SYNTAX fixes lexical NEWLINE, control-head braces and arrow-block priority.\n   IDENT includes contextual words; self binding is checked by ZIL-RECEIVER.\n   A bare identifier or balanced parameter-list followed by =\u003e or -\u003e selects Closure, without a type query.\n   TUPLEINDEX is an unsigned decimal integer token after a dot, not a float. *)\nModule = { ImportDecl | SyntaxImport | Item | MetaItem | Terminator } ;\nImportDecl = \"import\", ModulePath, [\"as\", IDENT], End ;\nSyntaxImport = \"syntax\", \"use\", ModulePath, \"as\", IDENT, End ;\nModulePath = IDENT, {\".\", IDENT} ;\nQualified = IDENT, {\".\", IDENT} ;\nItem = {Attribute}, [\"pub\"], (Function | Struct | Resource | Package | Enum | Trait | Impl | TypeAlias | ConstDecl | ExternDecl) ;\nStruct = \"struct\", IDENT, [Generics], \"{\", {Field | Method | Terminator}, \"}\" ;\nResource = \"resource\", IDENT, [Generics], \"{\", {Field | Method | Terminator}, \"}\" ;\nPackage = \"package\", IDENT, [Generics], \"{\", {ManagedField | Field | Method | Terminator}, \"}\" ;\nManagedField = {Attribute}, \"manages\", IDENT, \":\", Type, [\"=\", Expr], FieldEnd ;\nField = {Attribute}, [\"pub\"], IDENT, \":\", Type, [\"=\", Expr], FieldEnd ;\nFieldEnd = \",\" | Terminator | BeforeClose ;\nEnum = \"enum\", IDENT, [Generics], \"{\", {Variant | Terminator}, \"}\" ;\nVariant = {Attribute}, IDENT, [(\"(\", TypeList, \")\") | (\"{\", {Field}, \"}\")], FieldEnd ;\nTrait = \"trait\", IDENT, [Generics], [\":\", Bounds], \"{\", {Method | Associated | Terminator}, \"}\" ;\nImpl = InherentImpl | TraitImpl ;\nInherentImpl = \"impl\", [Generics], Type, [ReceiverDefault], [Where], ImplBody ;\nTraitImpl = \"impl\", [Generics], Type, \"for\", Type, [Where], ImplBody ;\nReceiverDefault = \"(\", [\"give\"], \"self\", \":\", Type, \")\" ;\nImplBody = \"{\", {Method | Associated | Terminator}, \"}\" ;\nAssociated = \"type\", IDENT, [Generics], [\":\", Bounds], [\"=\", Type], End\n           | \"const\", IDENT, \":\", Type, [\"=\", Expr], End ;\nMethod = {Attribute}, [\"pub\"], Function ;\nFunction = \"fn\", IDENT, [Generics], \"(\", [Parameters], \")\", [\"-\u003e\", ReturnType], [Where], [Contract], FunctionBody ;\nFunctionBody = Block | \"=\u003e\", Block | \"=\u003e\", Expr, End | \";\" ;\nExternDecl = \"extern\", STRING, Function ;\nParameters = Parameter, {\",\", Parameter}, [\",\"] ;\nParameter = {Attribute}, [\"give\"], IDENT, \":\", Type ;\nGenerics = \"\u003c\", GenericParameter, {\",\", GenericParameter}, [\",\"], \"\u003e\" ;\nGenericParameter = IDENT, [\":\", Bounds] | \"life\", IDENT | \"#\", IDENT, \":\", Type ;\nWhere = \"where\", BoundClause, {\",\", BoundClause} ;\nBoundClause = Type, \":\", Bounds | LIFEIDENT, \":\", LIFEIDENT ;\nBounds = Type, {\"+\", Type} ;\nTypeList = Type, {\",\", Type}, [\",\"] ;\nReturnType = \"impl\", Bounds | Type ;\nType = ForeignFunctionType | FunctionType | ErrorType ;\nForeignFunctionType = \"extern\", STRING, \"fn\", \"(\", [TypeList], \")\", \"-\u003e\", Type ;\nFunctionType = \"fn\", \"(\", [TypeList], \")\", \"-\u003e\", Type ;\nErrorType = UnionType, [\"!\", Type] ;\nUnionType = OptionalType, {\"|\", OptionalType} ;\nOptionalType = TypePrimary, [\"?\"] ;\nCallableName = \"Fn\" | \"FnMut\" | \"FnOnce\" ;\nCallableType = CallableName, \"(\", [TypeList], \")\", \"-\u003e\", Type ;\n(* Reserved callable-family names require CallableType, not Qualified TypeArgs. *)\nTypePrimary = CallableType | Qualified, [TypeArgs]\n            | \"\u0026\", [LIFEIDENT], [\"mut\"], TypePrimary\n            | \"[\", Type, [\";\", Expr], \"]\"\n            | TupleType\n            | \"dyn\", (CallableType | Qualified, [TypeArgs])\n            | \"for\", \"\u003c\", \"life\", IDENT, \"\u003e\", TypePrimary\n            | MetaEval | MetaBlock ;\nTupleType = \"(\", \")\" | \"(\", Type, \")\" | \"(\", Type, \",\", [TypeList], \")\" ;\nTypeArgs = \"\u003c\", GenericArg, {\",\", GenericArg}, [\",\"], \"\u003e\" ;\nGenericArg = Type | NUMBER | \"true\" | \"false\" ;\nTypeAlias = \"type\", IDENT, [Generics], \"=\", Type, End ;\nConstDecl = \"const\", IDENT, [\":\", Type], \"=\", Expr, End ;\nContract = \"contract\", \"{\", {ContractClause, End}, \"}\" ;\nContractClause = (\"result\" | \"requires\" | \"provides\" | \"effects\" | \"resume\"), \"(\", [ContractTerms], \")\" ;\nContractTerms = ContractTerm, {\",\", ContractTerm}, [\",\"] ;\nContractTerm = Qualified, [TypeArgs], [(\"(\", [ContractTerms], \")\") | (\"[\", ContractTerm, \"]\")] ;\nBlock = \"{\", {Statement | MetaStatement | Terminator}, \"}\" ;\nStatement = Binding | Return | Yield | Break | Continue | Defer | IfStmt | WhileStmt | ForStmt | LoopStmt | MatchStmt | WithStmt | UnsafeBlock | (Expr, [AssignOp, Expr], End) ;\nBinding = (\"let\" | \"var\"), Pattern, [\":\", Type], \"=\", Expr, End ;\nPattern = IDENT | Literal | \"_\" | \"ref\", [\"mut\"], Pattern | \"(\", [PatternList], \")\" | Qualified, \"(\", [PatternList], \")\" ;\nPatternList = Pattern, {\",\", Pattern}, [\",\"] ;\nReturn = \"return\", [Expr], End ;\nYield = \"yield\", Expr, End ;\nBreak = \"break\", End ;\nContinue = \"continue\", End ;\nDefer = \"defer\", Block ;\nIfStmt = \"if\", Condition, Block, [\"else\", (Block | IfStmt)] ;\nCondition = Expr | \"let\", Pattern, \"=\", Expr ;\nWhileStmt = \"while\", Condition, Block ;\nForStmt = \"for\", Pattern, \"in\", Expr, Block ;\nLoopStmt = \"loop\", Block ;\nMatchStmt = \"match\", Expr, \"{\", {Pattern, \"=\u003e\", (Block | Expr), FieldEnd}, \"}\" ;\nWithStmt = \"with\", IDENT, \"=\", Expr, Block ;\nUnsafeBlock = \"unsafe\", Block ;\nAssignOp = \"=\" | \"+=\" | \"-=\" | \"*=\" | \"/=\" | \"%=\" | \"\u0026=\" | \"|=\" | \"^=\" ;\nExpr = Closure | Pipeline ;\nClosure = [\"move\"], (IDENT | \"(\", [ClosureParams], \")\"), [\"-\u003e\", Type], \"=\u003e\", (ClosureBlock | Expr) ;\n(* ZIL-CAPTURE normalizes closure tails and final if/else branches to Return; ordinary Block is unchanged. *)\nClosureBlock = Block ;\nClosureParams = IDENT, [\":\", Type], {\",\", IDENT, [\":\", Type]}, [\",\"] ;\nPipeline = Or, {\"|\u003e\", Or} ;\nOr = And, {\"||\", And} ;\nAnd = Compare, {\"\u0026\u0026\", Compare} ;\nCompare = Range, [(\"==\" | \"!=\" | \"\u003c\" | \"\u003c=\" | \"\u003e\" | \"\u003e=\"), Range] ;\nRange = BitOr, [\"..\", BitOr] ;\nBitOr = BitXor, {\"|\", BitXor} ;\nBitXor = BitAnd, {\"^\", BitAnd} ;\nBitAnd = Shift, {\"\u0026\", Shift} ;\nShift = Add, {(\"\u003c\u003c\" | \"\u003e\u003e\"), Add} ;\nAdd = Multiply, {(\"+\" | \"-\" | \"+%\" | \"-%\"), Multiply} ;\nMultiply = Prefix, {(\"*\" | \"/\" | \"%\" | \"*%\"), Prefix} ;\nPrefix = (\"!\" | \"-\" | \"~\" | \"*\" | \"give\"), Prefix | \"\u0026\", [\"mut\"], Prefix | Postfix ;\nPostfix = Primary, {(\".\", Member) | (\"::\", TypeArgs) | (\"(\", [Arguments], \")\") | (\"[\", SliceIndex, \"]\") | \"?\"} ;\nMember = IDENT | TUPLEINDEX ;\nSliceIndex = BitOr, [\"..\", [BitOr]] | \"..\", [BitOr] ;\nArguments = Argument, {\",\", Argument}, [\",\"] ;\nArgument = [\"...\"], Expr ;\nPrimary = Literal | IDENT | GroupOrTuple | ArrayValue | Construct | ContextRecord | ReceiverMember | IfExpr | MetaEval | MetaBlock | SyntaxIsland ;\nLiteral = NUMBER | STRING | CHAR | \"true\" | \"false\" ;\nGroupOrTuple = \"(\", \")\" | \"(\", Expr, \")\" | \"(\", Expr, \",\", [ExprList], \")\" ;\nExprList = Expr, {\",\", Expr}, [\",\"] ;\nArrayValue = \"[\", [ExprList], \"]\" ;\nValueTypePath = IDENT, {(\".\", IDENT) | (\"::\", TypeArgs)} ;\nConstruct = ValueTypePath, RecordBody ;\nContextRecord = [\".\"], RecordBody ;\nRecordBody = \"{\", [RecordFields], \"}\" ;\nRecordFields = \"...\", Expr, [\",\", FieldValues] | FieldValues ;\nFieldValues = FieldValue, {\",\", FieldValue}, [\",\"] ;\nFieldValue = IDENT, [\":\", Expr] ;\nReceiverMember = \".\", IDENT ;\nIfExpr = \"if\", Expr, \"{\", Expr, \"}\", \"else\", \"{\", Expr, \"}\" ;\nAttribute = \"#\", \"[\", Qualified, [(\"(\", [AttrArguments], \")\") | (\"=\", STRING)], \"]\" ;\nAttrArguments = Expr, {\",\", Expr}, [\",\"] ;\nMetaEval = \"#\", \"(\", Expr, \")\" ;\nMetaBlock = \"#\", Block ;\nMetaItem = MetaIfItems | MetaForItems | MetaEmit ;\nMetaStatement = MetaIfStatements | MetaForStatements | MetaEmit ;\nMetaIfItems = \"#\", \"if\", \"(\", Expr, \")\", \"{\", {Item | MetaItem | Terminator}, \"}\", [\"else\", \"{\", {Item | MetaItem | Terminator}, \"}\"] ;\nMetaIfStatements = \"#\", \"if\", \"(\", Expr, \")\", Block, [\"else\", Block] ;\nMetaForItems = \"#\", \"for\", \"(\", IDENT, \"in\", Expr, \")\", \"{\", {Item | MetaItem | Terminator}, \"}\" ;\nMetaForStatements = \"#\", \"for\", \"(\", IDENT, \"in\", Expr, \")\", Block ;\nMetaEmit = \"#\", \"emit\", Expr, End ;\nSyntaxIsland = Qualified, \"!\", TokenTree ;\nTokenTree = \"(\", {Token | TokenTree}, \")\" | \"[\", {Token | TokenTree}, \"]\" | \"{\", {Token | TokenTree}, \"}\" ;\nToken = NonDelimiterToken ;\nEnd = Terminator | BeforeClose ;\nTerminator = \";\" | NEWLINE ;\nBeforeClose = (* zero-width boundary immediately before '}', after a complete statement *) ;\n\n```\n\n## 属性注册表\n\n```json\n{\n  \"schema_version\": 1,\n  \"source_section\": \"ZIL-ATTRIBUTE\",\n  \"attributes\": [\n    {\n      \"name\": \"cfg\",\n      \"kind\": \"configuration\",\n      \"phase\": 0,\n      \"targets\": [\n        \"item\",\n        \"field\",\n        \"variant\",\n        \"parameter\"\n      ],\n      \"repeat\": \"and\",\n      \"args\": \"config-expression\",\n      \"output\": \"keep-or-remove\"\n    },\n    {\n      \"name\": \"repr\",\n      \"kind\": \"layout\",\n      \"phase\": 3,\n      \"targets\": [\n        \"struct\",\n        \"enum\",\n        \"package\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"enum(C,transparent)\",\n      \"output\": \"layout-constraint\"\n    },\n    {\n      \"name\": \"align\",\n      \"kind\": \"layout\",\n      \"phase\": 3,\n      \"targets\": [\n        \"struct\",\n        \"enum\",\n        \"package\",\n        \"field\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"positive-power-of-two-const\",\n      \"output\": \"layout-constraint\"\n    },\n    {\n      \"name\": \"derive\",\n      \"kind\": \"generate\",\n      \"phase\": 2,\n      \"targets\": [\n        \"struct\",\n        \"enum\",\n        \"package\"\n      ],\n      \"repeat\": \"merge-unique-traits\",\n      \"args\": \"trait-path-list\",\n      \"output\": \"unchecked-items\"\n    },\n    {\n      \"name\": \"inline\",\n      \"kind\": \"codegen\",\n      \"phase\": 5,\n      \"targets\": [\n        \"fn\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"optional-enum(always,never)\",\n      \"output\": \"hint\"\n    },\n    {\n      \"name\": \"doc\",\n      \"kind\": \"metadata\",\n      \"phase\": 1,\n      \"targets\": [\n        \"item\",\n        \"field\",\n        \"variant\",\n        \"parameter\"\n      ],\n      \"repeat\": \"concat\",\n      \"args\": \"string\",\n      \"output\": \"documentation\"\n    },\n    {\n      \"name\": \"allow\",\n      \"kind\": \"diagnostic\",\n      \"phase\": 4,\n      \"targets\": [\n        \"item\",\n        \"field\",\n        \"variant\",\n        \"parameter\"\n      ],\n      \"repeat\": \"union\",\n      \"args\": \"registered-lint-list\",\n      \"output\": \"lint-policy\"\n    },\n    {\n      \"name\": \"test\",\n      \"kind\": \"test\",\n      \"phase\": 4,\n      \"targets\": [\n        \"fn\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"none\",\n      \"output\": \"test-entry\"\n    }\n  ],\n  \"custom\": {\n    \"must_be_declared\": true,\n    \"qualified_name\": true,\n    \"allowed_kinds\": [\n      \"syntax\",\n      \"generate\",\n      \"metadata\"\n    ],\n    \"cannot_produce_verified_ir\": true\n  },\n  \"incompatible\": \"duplicate nonrepeatable attributes fail; no safe capability-granting attribute\"\n}\n\n```\n","changes":"# 收尾裁决与施工审查\n\n日期：2026-10-22。本文解释来源和决策；当前规则只读 `_zil_design.md` 与具名附件。\n\n## 1. 恢复基线\n\n实际下载并读取上一轮 `zil-design-workflow-complete.zip`，包内规范为 ZIL-LANG-1，含 design→goal→14工单→worktree、文法/属性附件及离线 designer。单独同名 zil-design-final.md 的日期早于这个 ZIP，因此不将该同名旧文档当最新基线。\n\n原私有会话网址不能作为公开网页完整抓取；交付之后的意见由会话上下文检索恢复，覆盖自动捕获、撤回强制捕获表/Copy快照、词法 .name、组默认 receiver，以及记录/管道/脚本候选。本包没有声称逐字读取整轮冗长对话。末轮意见原本仍是讨论；以下是按本次“确定设计并准备施工”的要求作出的明确裁决。\n\n保留当前描述/执行资格/责任核心、四目标、Rust实现架构和产品预算；不导入更早版本的通用世代、隐式保活、自动归属提升或已完成历史成绩。\n\n## 2. 最终选择及理由\n\n| 主题 | 选择 | 原因与边界 |\n|---|---|---|\n| 闭包捕获 | 正文用途推导；move显式按值 | 避免要求用户重写编译器能局部得出的捕获清单；逃逸失败不反向改变模式 |\n| Copy | 普通闭包默认只读借入；move拍快照 | 保留“观察原变量”与“固定值”的区别，避免默认偷偷记旧值 |\n| Desc | 继续复制描述 | 不将ZIL图操作重新变为默认长地址借用；访问进入Call合同 |\n| Managed | move实际载体或正文give推导转交 | 复制alias不夺取owner，close不等于give；责任在创建时落实 |\n| 调用能力 | 环境访问与目标状态分开 | 拥有捕获可重复只读；外部close仍可能因状态阻止二次调用 |\n| 接收者 | impl Type(self:...)、显式覆盖、trait继承 | 节省重复首参，又在读正文前确定合同；保持普通关联函数内核 |\n| .name | 词法self成员 | 不引入运行时this、不复用作enum标签或管道占位 |\n| 函数值 | fn指针无环境；Fn族具体闭包；受限opaque返回 | 补齐捕获闭包跨函数接口，避免默认Box或擦除依赖 |\n| 记录 | 期望类型省略；单base首位spread | 不引入结构类型搜索；Copy/Move及失败清理可确定 |\n| 管道 | 左先右后，一元调用 | 不通过插参、柯里化、传播错误改变原调用的含义 |\n| 脚本 | Native统一main/run；托管扩展单独协议 | 当前施工不承担隐含GC，未来桥接也不能绕过原生责任 |\n\n保留 `-\u003e` 作为返回类型标记，支持 `=\u003e` 表达式体；不导入讨论示例中偶见的冒号返回同义拼写。箭头后裸大括号固定为块；函数指针箭头取得完整返回类型；方法名与字段名冲突、普通调用Fn选择、Address捕获截断都已明确，避免实现者按各自直觉补完。\n\n## 3. 修复的工程阻断\n\n- W1原本包含闭包保存，T08又依赖W1：将闭包保存归T08/W2，W1只闭合资源管理纵切片。\n- B0原本要源码到退出码但无修改相关模块的写权：授予一次性正式引导写集，随后移交模块。\n- T03的CT执行依赖独立核验器却未依赖T05：补齐任务和产物前置。\n- T02补全名字/类别/trait到TypedCFG；T08/T09取得真实跨types/analyze/verify/lower功能目录，防止无人承接。\n- 所有工单补充具体输入、输出、写集、正反例要求、命令契约、完成条件；公共schema仍由集成者单写。\n- 输入摘要覆盖正文及全部具名附件；检查器不再要求施工期间永远Planned。\n- Verified包装的构造权放在verify crate私有字段，schema在ir中可序列化但不能反序列化得到已核对象。\n\n## 4. 证据边界\n\n三个独立审查任务分别检查闭包、接收者/文法、施工依赖，再进行了跨主题一致性复核。这是设计审查，不能作为形式化证明或实际编译器验收。\n\n87条源码预期与63项后续夹具要求都明确标记未执行/未实现。旧包的浏览器截图、运行日志和下载缓存不沿用为当前证据。当前实际检查、浏览器复测限制和全部未验证事项统一见 `evidence/REPORT.md`。\n\n未访问用户现有Windows仓库；本计划以新Rust实现的实际B0基线为起点。复用旧Zig代码、指定准确工具链/LLVM版本、性能测量及生产安全证明由相应施工门实际完成，不能在此捏造提交、日期或成绩。\n","verification":"# 检查范围\n\n文档与阅读系统检查记录由构建生成，不代表语言实现。"}</script>
<script>(() => {
'use strict';

const cov = (g,l) => { const base=rawCov(g,l);const id=state.routeChoices?.[g+':'+l];const alternative=base?.alternatives?.find(a=>a.id===id);return alternative?{...base,...alternative,goal:g,language:l}:base; };
const setting = (v,l) => D.settings.find(x => x.variable === v && x.language === l);

const defaults = {view:'scenes',goal:'G09',basic:'variables',variable:'V01',rule:'R01',compare:'variables',doc:'guide',chapter:'0',selected:['zil','rust','ts'],filter:'all',includeConditional:false,includeProposals:false,category:'all',search:'',differences:false,sceneMode:'flow',focus:'all',variableFilter:'',catalogOpen:false,routeChoices:{}};
let state = {...defaults};
try { const s=JSON.parse(localStorage.getItem('language-atlas-current-v1')||'null'); if(s) state={...state,...s,search:'',catalogOpen:false}; } catch {}
const selected = () => D.languages.filter(x => state.selected.includes(x.id));
