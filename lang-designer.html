<script id="atlas-data" type="application/json">{"variables":[{"id":"V01","name":"值语义与对象身份","category":"值与存储","question":"复制得到的是一个独立的值，还是同一对象的另一个名字？","why":"编辑器节点、文件和任务往往需要保持身份；坐标、颜色和计算结果通常更适合作为独立的值。两者影响赋值后的修改是否互相可见。","definition":"值语义关注内容：复制后，修改副本不应意外改变原值。身份语义关注同一个对象：多个入口可以观察到对它的修改。同一语言可以按类型提供两种语义。","options":[{"value":"value","label":"独立值","meaning":"复制后得到逻辑上独立的值；实现可以在不改变可观察结果时共享底层存储。","cost":"真正分离内容时可能复制；写时复制还需要唯一性判断或其他协议。"},{"value":"identity","label":"共享对象身份","meaning":"复制入口仍指向同一个对象；通过一个入口修改，其他入口随后可见。","cost":"需要另行解决存活、别名修改和并发访问；对象身份本身不承担这些工作。"},{"value":"immutable-value","label":"不可变值","meaning":"创建后内容不再改变；多个入口共享同一不可变存储通常不会造成修改干扰。","cost":"更新需构造新值或持久化结构；分配、结构共享和回收仍有成本。"}],"contrast":"V02 讨论赋值实际复制还是转移；本项讨论复制之后应当表现为独立内容还是共享身份。值语义不等于所有时候都深复制，身份语义也不等于引用计数。","example":"// 教学伪代码：两种不同的对象模型\nlet a = value({ n: 1 }), b = copy(a);\nb.n = 2; print(a.n);       // 独立值：1\nlet x = object({ n: 1 }), y = x;\ny.n = 2; print(x.n);       // 共享身份：2","relatedRules":["R08","R17"],"boundary":"含共享身份字段的普通浅复制，不会自动成为整张图的独立深复制。先写清比较的是外层结构、内部缓冲，还是可达的整张图。"},{"id":"V02","name":"复制、移动与清理责任","category":"值与存储","question":"赋值、传参和返回时，资源由谁接手；原来的变量还能不能使用？","why":"文件句柄、内存块等资源不能靠复制几个机器字就产生两份独立的释放权，否则可能重复关闭或释放。","definition":"复制保留原值可用；移动转移值及其清理责任，使原位置不能再当成完整值使用；克隆执行类型定义的真实复制操作。共享拥有则登记另一份共同保活责任。","options":[{"value":"implicit-copy","label":"隐式复制普通值","meaning":"允许符合条件的值在赋值和传参时自动复制。","cost":"大值复制可能产生数据搬运；哪些类型可复制必须由语义说明。"},{"value":"affine-move","label":"仿射移动","meaning":"拥有值可以转移，但不能把唯一清理责任任意复制；未再使用的值仍按清理合同处理。","cost":"需要跟踪移动和部分初始化，部分写法需要调整拥有边界。"},{"value":"explicit-clone","label":"显式克隆","meaning":"调用 clone 等操作创建另一个值，实际是否分配、深复制或共享由类型决定。","cost":"复制、分配和失败都是真实工作，不能仅凭名字认为它很便宜。"},{"value":"shared-owner-copy","label":"复制共享拥有","meaning":"复制入口时按共享协议增加一份共同保活责任。","cost":"可能需要计数、原子操作或控制块；最后一份结束时仍要清理。"},{"value":"description-copy","label":"描述复制、责任不复制","meaning":"复制对象入口；管理责任仍由原位置、包或管理器准确持有。","cost":"后续读写与关闭仍需权限、有效事实和准确管理路由。"}],"contrast":"V01 决定复制后的语义是否独立；V05 决定谁维持存活；本项只讨论赋值和传递时如何交接。没有重复释放，不代表没有提前释放或泄漏。","example":"// 教学伪代码：移动与克隆是两种操作\nlet a = own(openFile());\nlet b = move(a);            // 清理责任交给 b\nuse(a);                    // 移动路线应拒绝\nlet c = clone(b);           // 只有类型提供此操作才成立\n// b 与 c 的共享/独立关系必须由 clone 合同说明","relatedRules":["R03","R17","R21","R38"],"boundary":"仿射通常允许值未被消费；它不等于保证资源最终一定释放。异常、取消、部分移动和失败路径都要遵守各自的清理合同。"},{"id":"V03","name":"有效值与构造阶段","category":"值与存储","question":"一块已分配的内存，什么时候可以作为完整的 T 被读取？","why":"分配了字节并不等于已经有合法对象；循环结构、批量构造和失败退出尤其容易暴露半初始化状态。","definition":"区分原始存储、已初始化字段和可对外发布的完整值。类型还可以限制合法位模式，例如枚举必须有合法标签，非空引用不能由任意整数构造。","options":[{"value":"whole-construction","label":"完整构造后可见","meaning":"构造表达式成功后才得到完整值，外部无法看到半成品。","cost":"构造失败仍需清理已经完成的子资源；复杂循环可能需要其他构造接口。"},{"value":"definite-assignment","label":"逐位置跟踪初始化","meaning":"允许先声明再赋值，但每次读取都要确认相关位置在所有到达路径上已初始化。","cost":"增加控制流分析；复杂合流可能要求用户显式整理状态。"},{"value":"staged-publication","label":"预留、初始化、发布","meaning":"可以先预留身份以建立互指，全部必需内容合法后统一发布。","cost":"动态批量构造可能需要初始化位、计数和失败清理记录。"},{"value":"raw-storage","label":"显式原始存储","meaning":"允许操作尚未构成 T 的字节，只有满足类型契约后才能转成可读对象。","cost":"底层实现承担初始化与有效位模式责任；不能把任意字节直接授信为 T。"},{"value":"default-initialized","label":"合法默认初值","meaning":"新建位置按语言规则取得规定的合法初值，例如零值、空选项或允许的 undefined；仅适用于初值确实属于该位置允许状态的情况。","cost":"可能需要清零或初始化存储；默认合法不等于满足业务必填条件，不同类型与创建方式的规则也可能不同。"}],"contrast":"V02 处理值的转移；V04 处理访问是否在范围内。本项要求读到的是合法值，即使地址没有越界、内存仍然存在，也不能省略。","example":"// 教学伪代码：预留身份不等于可以读取\nlet p = reserve\u003cNode\u003e();\nprint(p.value);            // 拒绝：还没有合法 Node\ninitialize(p, { value: 1, next: null });\nlet node = publish(p);\nprint(node.value);         // 现在才允许","relatedRules":["R01","R21","R35"],"boundary":"保留一块已经析构的字节，不等于保留了原来的合法 T。可恢复失败只清理成功构造的部分；数据外部写入后还可能需要合法值验证。"},{"id":"V04","name":"访问范围与边界准入","category":"值与存储","question":"访问从哪里开始、读写多宽；系统怎样知道没有越过对象或缓冲范围？","why":"对象活着也可能发生越界；同一个起始地址，读 1 字节和读 16 字节需要不同的范围证明。","definition":"一次访问必须属于允许的存储范围，并满足该访问方式需要的对齐和表示约束。切片、长度和受检分区可以把这些条件变成可传递的接口信息。","options":[{"value":"static-range","label":"静态证明范围","meaning":"通过数组长度、循环范围或已经成立的条件，证明这次访问位于合法区间。","cost":"需要分析和可用的边界事实；证明不出来不一定说明程序实际越界。"},{"value":"checked-access","label":"每次访问检查","meaning":"在下标或地址运算的访问点检查范围，失败时按接口报错或终止。","cost":"未被合法消除的比较和分支需要执行；失败行为属于程序语义。"},{"value":"checked-view","label":"先检查再取得窄视图","meaning":"通过一次受检切分或构造获得有限范围视图，后续操作使用该范围保证。","cost":"视图仍须防止底层存储失效；一次准入不会证明视图内任意下标都合法。"},{"value":"caller-range-contract","label":"调用者保证范围","meaning":"接口把地址、宽度、长度和对齐责任交给调用者或可信包装。","cost":"调用者一旦违反合同，可能出现无效访问；不因此成为安全路线。"}],"contrast":"V15 决定各类条件由静态检查、动态检查还是可信代码承担；本项专门解释空间范围的证据。V11 的地址稳定不能代替边界检查。","example":"// 教学伪代码：起点在缓冲内仍可能越界\nlet bytes = buffer(8);\nread(bytes, 4, 1);          // 读取 [4,5)，在范围内\nread(bytes, 4, 8);          // 读取 [4,12)，必须拒绝\nlet [left, right] = splitChecked(bytes, 4);\n// 两个视图只覆盖各自区间","relatedRules":["R02","R18","R35"],"boundary":"长度单位、整数溢出、访问宽度和对齐都要核对。读取 4 个字符不等于读取 4 个字节；SIMD 或设备访问也不能仅检查起始下标。"},{"id":"V05","name":"谁维持对象存活","category":"存活与回收","question":"对象仍被合法使用时，究竟由谁承担让它继续存在的责任？","why":"有一个名字或一条连接，不自动表示目标有人保留。必须找到实际存储和资源的保活依据。","definition":"保活是让对象及其必要资源在使用期间继续有效。它可以来自唯一拥有者、多个共享拥有者、一个共同的域，或从根出发的可达性；也可以完全由程序员管理。","options":[{"value":"unique-owner","label":"唯一拥有者","meaning":"一个实际拥有者承担资源责任，借用依赖这个拥有者继续有效。","cost":"跨结构共享时需要借用关系、封包或其他连接机制。"},{"value":"shared-owners","label":"多个共享拥有者","meaning":"多份拥有入口共同维持对象存活，任何一份仍有效时都不能过早销毁。","cost":"需要协议维护全部拥有入口，可能承担计数、控制块或同步成本。"},{"value":"region-owner","label":"域或存储拥有者","meaning":"一个拥有者保留一组对象，组内连接可以不单独承担拥有责任。","cost":"组中一个长期使用可能使其他对象或底层块一起滞留。"},{"value":"tracing-roots","label":"根与可达关系","meaning":"由可访问的根及被识别的连接决定哪些对象不能回收。","cost":"需要正确识别根和边，并执行相应回收协议。"},{"value":"manual-lifetime","label":"程序员管理","meaning":"语言不自动证明对象的保活关系，由调用约定和实现者保证。","cost":"灵活但安全责任分散；仍需避免未登记的长期使用者。"},{"value":"accurate-carrier","label":"准确责任载体","meaning":"真实责任由控制流位置、完整包或明确管理协议承担，不与每个描述变量绑定。","cost":"条件消费可能需要状态，跨管理接口可能需要实际记录关联。"}],"contrast":"V06 问何时回收，V07 问多少对象共同保活，V08 问一条连接是否参与保活。本项只确定存活责任的来源。","example":"// 教学伪代码：连接本身可以不拥有目标\nlet storage = ownRegion();\nlet a = storage.newNode();\nlet b = storage.newNode();\na.next = b; b.next = a;    // 连接可成环\n// 保留整组的是 storage，不能仅凭 a.next 推断谁负责释放","relatedRules":["R03","R07","R15","R16","R38","R40"],"boundary":"保活必须包含内部缓冲、分配器、外借资源及清理环境，不能只留下对象外壳。保活也不提供读写权限。"},{"id":"V06","name":"回收由什么触发","category":"存活与回收","question":"哪个事件发生后，可以开始销毁对象或归还存储？","why":"同样安全的对象模型，可能在离开作用域、最后拥有者结束、对象不可达或显式删除后回收；资源时机和运行成本因此不同。","definition":"回收触发是开始清理的条件，不等于实际清理已经完成。语言或库必须说明对象析构、底层存储释放和外部资源关闭的时机。","options":[{"value":"explicit-release","label":"显式释放","meaning":"程序执行指定的释放或关闭操作。","cost":"需要正确安排全部使用者；提前释放危险，遗漏释放可能泄漏。"},{"value":"scope-exit","label":"作用域或拥有者退出","meaning":"在约定的作用域、拥有者或域结束时执行清理。","cost":"可能保留到较晚边界；大量对象的析构工作仍然需要执行。"},{"value":"last-owner","label":"最后拥有者结束","meaning":"最后一份共享拥有结束后，协议允许析构对象。","cost":"拥有入口变化有维护成本；强拥有环需要额外处理。"},{"value":"unreachable","label":"确认不可达","meaning":"回收机制确认对象不能从有效根合法到达后，选择时机回收。","cost":"发现不可达和执行回收有成本；通常不能从失去业务用途推出立即回收。"},{"value":"retire-boundary","label":"已证明的退役边界","meaning":"逻辑删除后保留完整资源，到旧入口和外部使用都结束的边界再回收。","cost":"需要传递保留依赖并承担滞留空间；必须有实际资源承担者。"}],"contrast":"V05 说明谁承担存活责任；V09 说明 remove 的业务与失效语义。删除一个成员、最后引用结束、析构 T 和 free 底层块，可能是四个不同事件。","example":"// 教学伪代码：同一业务删除的不同回收时机\nset.remove(id);             // 不再属于集合\n// 方案 A：删除时立即关闭资源\n// 方案 B：最后拥有者结束后关闭\n// 方案 C：旧访问结束后的退役边界关闭\n// 方案 D：确认不可达后再择机回收","relatedRules":["R07","R09","R15","R16","R21","R38"],"boundary":"改变可观察的析构、关闭或分配失败时点，需要源合同允许；不能仅因更易证明存活就任意延后。自动回收不等于保证所有程序最终不泄漏。"},{"id":"V07","name":"共同保活的粒度","category":"存活与回收","question":"为了让一个对象继续有效，必须连带保留多大的一组对象？","why":"把更多对象放在同一个存活范围内可以简化证明，却可能让少量旧入口拖住大量不再使用的数据。","definition":"本项描述共同存活安排的大小。对象可以独立结束，也可以受同一个容器、域或推导分组约束；这与访问权限覆盖多大范围、物理地址是否连续分别建模。","options":[{"value":"per-object","label":"按对象","meaning":"每个对象的存活责任可分别结束。","cost":"管理数量可能随对象数增长；共用分配块仍可能限制实际释放。"},{"value":"owner-group","label":"按拥有结构","meaning":"一组成员随共同的拥有容器或封包保持有效。","cost":"单个成员的使用可能牵连整个拥有结构或其依赖。"},{"value":"declared-region","label":"显式域","meaning":"程序明确建立共同存活边界，域内对象通常在该边界统一清理。","cost":"需要选择边界；不合适的长命域会积累历史数据。"},{"value":"inferred-region","label":"编译期推导分组","meaning":"在源合同允许的范围内，由分析选择足够长命的共同存储安排。","cost":"推导和诊断有成本；保守合并可能增加保留或拒绝合法但难证明的写法。"}],"contrast":"V13 是访问冲突的粒度：一起保活的对象仍可只借其中一个字段。物理分配单位还可能比逻辑对象大，不能把 sizeof(Node) 当成全部滞留量。","example":"// 教学伪代码：只留下一个入口，可能保留整域\nlet region = newRegion();\nlet nodes = repeat(1000, () =\u003e region.newNode());\nlet keep = nodes[0];\n// keep 活着时，若共同域不能结束，其他 999 个节点也可能仍占存储","relatedRules":["R07","R09","R24"],"boundary":"保留 K 个节点不证明只保留 K × sizeof(Node) 字节；还要计算内部缓冲、共享块、任务帧和分配器依赖。粒度变粗也不允许越过固定关闭或线程边界。"},{"id":"V08","name":"连接是否参与保活","category":"存活与回收","question":"把 b 存进 a.next，会不会因此阻止 b 被回收？","why":"数据结构的连边与资源拥有并不必然是一回事。混淆它们会使循环图的表达和回收结论都出错。","definition":"同样一条逻辑连接，可以登记强拥有、参与追踪、仅记录受寿命约束的非拥有来源，或允许目标失效后再验证。连接的保活作用必须由类型或接口说明。","options":[{"value":"strong-edge","label":"强拥有连接","meaning":"保存连接就登记一份共享拥有责任，解除连接会交还这份责任。","cost":"赋值和清理维护拥有协议；全部强边形成的环可能持续保活。"},{"value":"traced-edge","label":"追踪连接","meaning":"连接被回收器识别；从有效根沿这些边可达的目标被保留。","cost":"需要维护或扫描可达关系；孤立环是否保留取决于根，不只取决于环自身。"},{"value":"borrowed-edge","label":"受约束的非拥有连接","meaning":"连接不拥有目标，但其保存和使用范围必须被某个真实保活安排覆盖。","cost":"需要静态关系或接口限制；不能任意保存到更长命的位置。"},{"value":"weak-edge","label":"可失效的弱入口","meaning":"不阻止目标结束；访问前尝试取得仍然有效且受保护的访问。","cost":"需要失效识别、升级或查找，访问可能失败。"},{"value":"raw-edge","label":"无自动保护的原始连接","meaning":"只保存地址或定位信息，不自动保活，也不自动验证失效。","cost":"实现者必须保证每次访问合法；连接仍存在不代表可安全使用。"}],"contrast":"V05 讨论整个对象靠谁存活，本项只看一条连接是否贡献保活。V12 决定能否读写；强连接、弱连接和非拥有连接都不自动授予独占修改权。","example":"// 教学伪代码：三种边的语义不同\na.next = strong(b);         // 新增一份保活责任\na.next = borrowLink(b);     // 不拥有；要求 b 活得足够久\na.next = weak(b);           // b 可以先死\nlet p = a.next.upgrade();   // 弱入口必须处理失败","relatedRules":["R08","R10","R14","R15","R16"],"boundary":"非拥有连接并非都可失效：受静态寿命约束的借用在合法使用期间必须有效。弱入口允许保留过期身份，但不能不经准入直接访问。"},{"id":"V09","name":"删除与旧入口的语义","category":"存活与回收","question":"删除一个节点后，之前拿到的入口还能做什么？","why":"“从集合移除”“对象失效”“资源关闭”“槽位复用”是不同事件；只写一个 remove 无法说明旧引用是否安全。","definition":"删除操作必须规定成员资格、完整对象、拥有责任和旧入口的变化。延后销毁只有在真正保留完整资源且满足全部访问约束时才成立。","options":[{"value":"unlink-only","label":"只解除成员或连接","meaning":"对象不再属于集合或不再被某条边连接；自身存活另由已有机制负责。","cost":"若没有另外触发回收，内存仍会占用；还可能需要维护关系索引。"},{"value":"move-out","label":"移出完整拥有值","meaning":"把完整值和清理责任交给返回结果，由接收者决定后续用途。","cost":"可能需要移动、固定输出槽或保留原存储；已有地址依赖必须先处理。"},{"value":"retire-valid","label":"退役但保持有效","meaning":"逻辑删除后，旧入口在已证明的范围内仍可访问完整旧对象；稍后再销毁。","cost":"滞留、断边、责任交接和新连接限制都要计入，不能只延迟 free。"},{"value":"invalidate-now","label":"立即结束有效性","meaning":"删除结束对象或位置的有效性；旧入口必须已不可使用，或之后解析为失败。","cost":"需要提前排除旧使用，或采用显式失效检查；槽位复用还需防止误认新对象。"}],"contrast":"V06 是清理触发，V08 是边的保活作用，V10 是身份如何定位。本项说明删除对已有程序行为的承诺，不能根据方法名字猜机制。","example":"// 教学伪代码：同一段调用，取决于 remove 合同\nlet p = graph.get(id);\ngraph.remove(id);\nuse(p);\n// unlink：由原保活方案决定是否可用\n// retire：只在受保护的旧使用范围内可用\n// invalidate：应静态拒绝，或重新 resolve 并处理失败","relatedRules":["R05","R09","R10","R14","R21"],"boundary":"旧对象仍活着，不代表仍是活成员；允许读旧对象不自动允许把它重新挂回活图。延后析构也不能消除活动借用与断边写入之间的权限冲突。"},{"id":"V10","name":"对象身份如何定位","category":"值与存储","question":"连接里保存地址、下标还是可验证的身份；位置被复用时怎样区分旧对象？","why":"数组位置、内存地址和对象身份并非永远一致。删除、密集重排和跨池使用会暴露只存一个整数的不足。","definition":"定位表示决定如何从入口找到目标。稳定存储可以直接使用地址或本域索引；允许目标失效、槽位复用或跨管理实例保存时，需要相应的身份区分与准入协议。","options":[{"value":"direct-address","label":"直接地址","meaning":"入口保存实际对象地址，在合法使用期间由其他规则保证地址对应目标。","cost":"通常可直接寻址，但搬迁或释放会影响入口；地址本身不证明存活。"},{"value":"scoped-index","label":"本域索引","meaning":"入口保存受限定的索引，基址从所属存储取得；槽到对象的关系在使用期间保持。","cost":"需要基址寻址和域约束；不能直接支持不受保护的删除复用。"},{"value":"checked-key","label":"可验证身份键","meaning":"通过仍有效的管理入口确认实例与对象身份，例如实例、槽和代的组合。","cost":"需要检查和身份历史元数据；耗尽、回绕与验证后的保护必须有明确协议。"},{"value":"logical-id-map","label":"逻辑 ID 与位置映射","meaning":"对象身份独立于当前位置，通过映射找到实际存储位置。","cost":"有映射、查找和更新成本；身份是否复用及旧入口行为仍需规定。"},{"value":"managed-reference","label":"受管理对象引用","meaning":"程序持有由运行时解释的对象引用，能观察对象身份，但普通引用接口不提供可依赖的原生地址；运行时维护引用与目标的关系。","cost":"具体实现可能使用带标记指针、可修补引用或间接入口；需要按实际实现计费，不能从源引用推断固定大小或必定搬迁。"}],"contrast":"V08 说明连接是否保活，本项说明怎么找到目标；V11 说明实际地址能否改变。对象内容版本、对象生命周期身份和容器当前下标不能混成一个版本号。","example":"// 教学伪代码：槽号相同，不保证还是同一对象\nlet old = pool.insert({ name: \"A\" }); // 某个身份\npool.remove(old);\nlet now = pool.insert({ name: \"B\" }); // 可能复用原槽\nresolve(old);              // 必须失败或已被禁止使用，不能变成 B\nresolve(now);              // 才能得到 B","relatedRules":["R13","R14"],"boundary":"世代是处理可复用身份的一种机制，不是所有引用的必备成本，也通常不是字段每修改一次就加一。普通受约束的域内索引，不应被当成显式可失效 Key。并发时核验成功后还要保护实际使用。"},{"id":"V11","name":"地址稳定与搬迁","category":"值与存储","question":"对象还活着时，存储能不能移动；此前借出的真实地址怎么办？","why":"增长容器、换内部缓冲或改成密集布局，可能不结束外层对象，却使旧切片和字段地址失效。","definition":"地址稳定要求某个真实地址在规定的访问期间仍对应同一有效存储。逻辑入口可以允许搬迁，但必须保证后续定位正确；这不自动允许已经借出的原生地址跨越搬迁。","options":[{"value":"stable-storage","label":"稳定存储","meaning":"对象在相关生命周期内不移动，例如稳定块或非搬迁分配。","cost":"可能增加分块、碎片或间接寻址；稳定不代表不被销毁。"},{"value":"pinned-window","label":"借用窗口内固定","meaning":"平时可移动，存在相关地址借用、固定对象或外部访问时禁止搬迁。","cost":"需要识别全部地址依赖；某些扩容或交换操作会被延迟或拒绝。"},{"value":"logical-relocation","label":"只让逻辑入口跨搬迁","meaning":"入口通过更新后的基址或映射定位；搬迁时不存在未保护的原生地址。","cost":"搬迁、映射更新及瞬时双份存储都要计费。"},{"value":"tracked-references","label":"搬迁时更新受管理入口","meaning":"由运行系统找到并修正受管理引用，或通过稳定间接层保持访问。","cost":"需要额外的引用管理或间接层；未登记的外部指针仍需单独处理。"}],"contrast":"V10 是逻辑身份的表示；本项关心实际字节地址。V07 的共同保活不能防止内部缓冲被替换；同一个对象身份也不保证每个字段都有连续原生地址。","example":"// 教学伪代码：保留父对象不保留旧缓冲地址\nlet list = vector([1, 2, 3]);\nlet view = borrowSlice(list);\nlist.grow(10000);           // 若会搬旧缓冲，活动 view 必须阻止它\nprint(view[0]);             // 不能靠 list 还活着来证明安全","relatedRules":["R05","R13","R23"],"boundary":"移动拥有者句柄不一定移动对象；移动对象也不一定改变逻辑身份。SoA 等布局没有真实连续 Node 时，不能偷偷构造临时值来冒充 \u0026Node。"},{"id":"V12","name":"共享修改与访问权限","category":"访问与并发","question":"多个入口指向同一对象时，谁可以读取、写入或建立长期借用？","why":"保活只能避免对象过早消失，不能防止相交写入、被重入调用破坏的活动访问或跨线程数据竞争。","definition":"访问规则决定哪些同时或交错发生的操作可以共存。它可以禁止修改、要求独占借用、将操作限制为受控短访问，或通过动态 guard、锁和原子协议保护。","options":[{"value":"immutable-sharing","label":"共享不可变内容","meaning":"允许多个读取入口，但内容在共享期间不发生不相容修改。","cost":"修改需要新值、重新取得权限或结束共享；不自动允许外部隐藏写入。"},{"value":"exclusive-borrow","label":"独占借用修改","meaning":"修改期间持有覆盖实际范围的独占借用，其他相交访问被排除。","cost":"未知别名时可能拒绝；借用范围过大会限制函数拆分和组合。"},{"value":"short-permission","label":"短操作使用权限","meaning":"连接可以别名，每次读写按顺序取得已有权限；长期地址借用另行受检。","cost":"必须约束回调、重入和失效；连接不能因此获得长期 noalias。"},{"value":"dynamic-guard","label":"动态访问 guard","meaning":"进入读写窗口时检查冲突，成功后由 guard 保护访问，退出时归还。","cost":"检查和 guard 管理有成本，冲突可能显式失败。"},{"value":"synchronized-access","label":"锁、原子或同步协议","meaning":"共享访问按照具体内存模型和同步协议建立互斥或可见性。","cost":"有同步、争用或排序成本；原子字段不自动组成多字段事务。"},{"value":"mutable-aliases","label":"自由可变别名","meaning":"语言允许多个可变入口，不以独占借用规则限制普通对象修改。","cost":"跨回调状态可能改变；多线程安全和业务不变量仍须由其他规则保障。"}],"contrast":"V05/V08 管存活，本项管此刻能做什么。V13 决定权限覆盖的范围。单线程也可能重入；没有数据竞争也不等于转账等多步操作具有业务原子性。","example":"// 教学伪代码：同一对象的两个入口\nlet a = node, b = node;\na.count += 1; b.count += 1; // 可以是合法的顺序短操作\nlet p = borrowMut(a.count);\nb.count += 1;              // p 活动时的相交写必须按协议排除\ncallback();               // 还要检查回调是否会访问同一范围","relatedRules":["R06","R08","R18","R19","R32"],"boundary":"允许可变别名不代表允许两份长期相交的独占引用。原子引用计数只处理其计数协议，不自动保护 payload 修改；noreenter、nosuspend 和跨线程安全也是不同条件。"},{"id":"V13","name":"权限覆盖的范围","category":"访问与并发","question":"借用一个 helper 需要的数据时，会限制整个对象，还是只限制某个字段或区间？","why":"过宽的权限范围容易把互不相关的操作判成冲突；过细却未经证明的范围会漏掉真实重叠。","definition":"权限足迹是一个操作可能读取、写入或使之失效的实际范围。可按整个对象或域保守处理，也可使用字段、连续区间和已核分区缩小。","options":[{"value":"whole-owner","label":"整个对象或域","meaning":"访问权限覆盖一个完整拥有对象或保守域。","cost":"规则较直接，但无关字段也可能被一起借走。"},{"value":"known-fields","label":"已知字段","meaning":"依据同一真实根下的字段结构或已核抽象投影区分权限。","cost":"需要保留字段来源和可见性；私有字段不能无约束泄露给调用者。"},{"value":"continuous-ranges","label":"连续区间","meaning":"用已知边界或受检切分证明两个实际字节区间不重叠。","cost":"动态切分可能检查；宽访问、溢出和边界扩展都要纳入。"},{"value":"verified-partitions","label":"受检分区","meaning":"接口提供经过核验的分区关系，允许各分区分别操作。","cost":"建立分区和维护关系有成本；不能仅靠不同名字授予独占权。"}],"contrast":"V07 讨论多少对象一起存活，本项讨论哪些访问会冲突。共同保活可以较粗，同时访问权限较细；两条不同图路径也可能汇入同一对象。","example":"// 教学伪代码：两个 helper 是否真的冲突？\nlet view = borrow(engine.messages);\nrecord(engine.stats, \"seen\"); // 只写 stats，可能与 view 共存\nrecordAll(engine);           // 若接口只暴露整对象写，必须保守\n// 改 helper 正文去写 messages 后，原不交结论必须失效","relatedRules":["R06","R18","R19","R34"],"boundary":"不同变量名、域名或图根不是不相交证明；字段打包、位域和共享底层存储也可能让表面分开的字段重叠。精度、封装和私有重构自由之间需要明确取舍。"},{"id":"V14","name":"借用来源与寿命关系","category":"接口与函数","question":"一个返回的视图来自哪些输入，它最多能被使用到什么时候？","why":"仅看返回类型是 \u0026T，无法知道目标属于调用者、临时局部对象还是某个闭包环境；函数拆分后需要继续保留这些关系。","definition":"来源说明结果依赖哪个对象或存储；寿命关系说明这些依赖必须覆盖哪些使用。路径、具名寿命参数、局部推导和公开摘要是不同表达方式，不负责凭空延长实际对象存活。","options":[{"value":"lexical-restriction","label":"固定词法边界","meaning":"把借用限制在规定的块或调用范围内，越界保存被禁止。","cost":"较容易解释，但可能拒绝实际已经不再使用的借用组合。"},{"value":"named-lifetimes","label":"具名寿命或区域关系","meaning":"接口用参数表达覆盖关系，让调用者选择满足条件的使用范围。","cost":"公共接口可能需要注解；寿命参数不代表分配器会自动保留对象。"},{"value":"origin-paths","label":"输入来源或投影路径","meaning":"接口直接标明结果来自 input.field 或多个候选输入，并保留相应约束。","cost":"需要处理多源、嵌套字段、可写容器和抽象接口；不是仅取一个词法最小值。"},{"value":"inferred-contract","label":"推导并发布关系","meaning":"从正文和调用关系推导缺省来源，作为可供消费者检查的接口信息。","cost":"增加分析与失效传播成本；隐式合同变化仍可能改变 API。"},{"value":"no-static-relation","label":"接口不表达静态借期","meaning":"通过托管保活、拥有结果或人工合同等其他路线处理结果有效性。","cost":"可能付出保活或复制成本，或把责任留给调用者；不能据此说寿命义务不存在。"}],"contrast":"V05 是实际谁保活，本项是如何描述和检查依赖。投影到某个字段还可能涉及 V13 的权限范围，不能把所有“投影”都解释成一个寿命公式。","example":"// 教学伪代码：来源关系约束使用，不延长目标生命\nfunction choose(a, b, first) -\u003e View from(a, b) {\n  return first ? view(a) : view(b);\n}\nlet x = choose(longLived, shortLived, flag);\n// x 的每次使用都必须被它可能依赖的来源覆盖\n// 不能返回局部临时地址后，仅写 from 就让临时对象继续活着","relatedRules":["R04","R05","R20","R30","R34","R39","R40"],"boundary":"寿命有效点不一定是简单的词法区间；from(a,b) 常是可能来源的保守并集，不表示同时拥有两者。非逃逸、返回借用、借用环境自身以及持久字段保存也必须分别处理。"},{"id":"V15","name":"安全条件由谁检查","category":"检查与边界","question":"一项安全条件，是编译器证明、入口检查、每次访问检查，还是交给实现者负责？","why":"两种语言都能避免某类错误，却可能把成本放在完全不同的地方；“有检查”还不足以判断使用限制和运行代价。","definition":"检查责任需要逐机制、逐路径描述。静态证明可以排除一类不合法程序；运行准入可以保护某段使用；可信边界依靠实现审计；不受检查的操作仍有必须满足的有效性条件。","options":[{"value":"static-proof","label":"编译期证明","meaning":"编译器必须取得足够依据，才能允许相关操作进入安全程序。","cost":"有分析成本并可能保守拒绝；证明不能依赖未检查的隐藏假设。"},{"value":"checked-entry","label":"受检入口保护一段使用","meaning":"进入时验证身份、范围或权限，并建立覆盖实际使用期间的保护。","cost":"有准入与保护管理成本；验证后立即撤销保护会留下竞态。"},{"value":"checked-each-use","label":"每次使用动态检查","meaning":"每次相关操作检查仍然有效，失败按约定返回错误或终止。","cost":"检查频率可能较高，但允许更多运行时决定的结构。"},{"value":"trusted-boundary","label":"受审计的可信边界","meaning":"安全接口依赖少量低层实现满足明确前后条件。","cost":"需要审计、测试或单独证明；放入标准库不会自动消除可信责任。"},{"value":"caller-obligation","label":"调用者承担未检查责任","meaning":"语言或接口不自动核验某项条件，由调用者保证正确。","cost":"灵活且可能没有对应检查成本，但违反条件可能产生无效行为。"}],"contrast":"本项说明落实方式，不直接规定安全策略；V12 的权限政策、V04 的空间边界可以各自采用不同方式。同一语言不能只贴一个“全静态”或“全动态”标签。","example":"// 教学伪代码：三条访问路线\nread(borrowProven(node));   // 已有静态依据\nwith (pool.resolve(key)) { p =\u003e read(p); } // 准入并保护\nunsafeRead(rawAddress);    // 调用者承担完整合同\n// resolve 成功后若已解除保护，不能继续把裸地址当作安全结果","relatedRules":["R02","R06","R14","R22","R31","R36","R39"],"boundary":"动态检查是否可以替代静态拒绝，必须是语言或用户明确选择的路线；不能在分析失败时偷偷添加计数、锁或 GC。检查未完成和已经发现不安全是不同结果。"},{"id":"V16","name":"错误如何表示和传播","category":"接口与函数","question":"一次操作可能失败时，失败是返回值的一种情况、非局部异常，还是单独的状态码？","why":"错误路线影响调用组合、穷尽检查、资源清理和 ABI，也决定哪些失败必须由调用者显式处理。","definition":"错误表示描述成功与失败如何穿过接口。它不自动提供事务回滚；失败发生前已经完成的写入、移动、I/O 和资源构造仍按实际合同处理。","options":[{"value":"error-union","label":"类型化结果或错误联合","meaning":"成功值和明确的错误分支共同构成返回类型，调用者匹配或显式传播。","cost":"可能需要标签或错误 ABI；类型能表达不代表语言一定强制处理每个错误。"},{"value":"exceptions","label":"异常传播","meaning":"失败沿异常控制流离开当前操作，到匹配的处理器或终止边界。","cost":"需要相应栈展开或其他异常机制；清理和不可跨越的边界必须规定。"},{"value":"status-code","label":"状态码与输出参数","meaning":"状态和成功数据分开返回，调用者按约定判断输出何时有效。","cost":"容易遗漏检查或误读未完成输出，需要工具或封装补强。"},{"value":"termination","label":"不可恢复终止","meaning":"某类失败直接结束当前规定的执行范围或进程，不作为普通返回结果。","cost":"无法继续局部恢复，也未必承诺执行普通析构和外部关闭。"}],"contrast":"V03 说明失败后哪些字段仍是合法值；V02/V06 说明谁清理。本项只说明错误通道，不保证全有或全无，也不决定是否允许隐式忽略错误。","example":"// 教学伪代码：显式错误不等于回滚\nfunction transfer(a, b, n) -\u003e Result {\n  a.balance -= n;\n  if (!canCredit(b)) return Error(\"blocked\");\n  b.balance += n;\n  return Ok();\n}\n// 失败时 a 已经扣款；要原子性还需 prepare/commit 等协议","relatedRules":["R21","R32","R35"],"boundary":"错误类型、异常安全保证和业务事务是不同维度。最终结果没有返回成功，也不能推断外部设备未开始使用缓冲。"},{"id":"V17","name":"类型兼容如何判定","category":"类型与分发","question":"两个结构看起来一样时，能否传给同一个参数；根据名字、结构还是运行时行为判断？","why":"这决定接口复用是否需要显式声明，也决定同形但含义不同的数据会不会被误混用。","definition":"类型兼容描述某个值在需要另一类型或接口的位置能否被接受。可以依赖声明身份、可见结构，或运行时操作检查；同一语言常对不同种类的类型采用不同规则。","options":[{"value":"nominal","label":"名义关系","meaning":"以声明身份和显式实现、继承或约定的转换关系建立兼容。","cost":"同形结构可能仍需适配，但能明确隔离语义不同的类型。"},{"value":"structural","label":"结构关系","meaning":"按要求的成员、签名和相关约束判断兼容，不一定要求事先声明实现关系。","cost":"方便复用，也需要精确处理可写成员、变型和隐藏依赖，避免误判。"},{"value":"runtime-shape","label":"运行时检查行为或形状","meaning":"编译期不完整确定兼容性，执行时查找操作或检查类型。","cost":"错误可能晚出现，并有相应查找、检查或统一表示成本。"}],"contrast":"本项回答能不能作为该类型使用；V19 回答调用哪个实现，V20 回答生成几份代码。名义类型不必使用虚表，结构类型也不必动态派发。","example":"// 教学伪代码：字段相同也可能不兼容\ntype UserId  = { value: number };\ntype OrderId = { value: number };\nfunction loadUser(id: UserId) {}\nloadUser(orderId);\n// 名义路线：可要求不同类型不能混用\n// 结构路线：若可见约束相同，可能直接兼容","relatedRules":["R17","R25","R34","R35"],"boundary":"接口成员相同还不够：可写性、拥有模式、来源、错误和调用效果也可能影响兼容。教学示例中的 type 是抽象声明，不声称这些伪代码在 TS 中具有名义类型语义。"},{"id":"V18","name":"泛型正文何时检查","category":"类型与分发","question":"泛型函数写好时就能检查其操作，还是必须看到具体类型再检查？","why":"只知道 T 是任意类型时，不能凭空调用 T 的任何成员。语言需要选择依赖明确约束，还是把更多判断延后到具体实例。","definition":"泛型语义检查决定函数正文的合法性何时、依靠哪些信息确定；这与后面是否为每个类型生成机器码是两件事。","options":[{"value":"definition-bounds","label":"按声明约束检查定义","meaning":"用类型参数和声明约束检查泛型正文，具体调用再验证实参满足约束。","cost":"需要表达足够的接口与关系；实际布局和部分代码工作仍可能等到实例阶段。"},{"value":"instantiation","label":"按具体实例检查","meaning":"依赖具体类型的表达式在实例化时检查，允许从实参获得更多操作信息。","cost":"不同实参可能重复工作，错误也可能在较远的调用点才出现。"},{"value":"staged-checking","label":"定义与实例分层检查","meaning":"先检查与参数无关的部分，再检查需要具体类型、常量或表示的部分。","cost":"需要清楚区分每层负责什么；不能把所有实例工作都算作“只检查一次”。"}],"contrast":"V20 决定机器代码共享方式；本项只讨论语言合法性。泛型按约束检查一次，不代表不生成多个实例，也不代表编译总成本与实例数无关。","example":"// 教学伪代码：泛型不能无来源地获得能力\nfunction speak\u003cT\u003e(x: T) { x.speak(); }\n// 按约束检查：需要 T: Speaker 等依据\n// 按实例检查：实例的 T 必须真有合法 speak\n// 即使正文已按 Speaker 检查，Dog/Cat 仍可能需要不同机器代码","relatedRules":["R25","R31","R34"],"boundary":"类型/实现选择、借用检查与布局生成应区分。不能因某个候选的借用检查失败，就悄悄改选另一个重载实现。没有泛型语法的语言应标为不适用，而不是伪造一种泛型检查路线。"},{"id":"V19","name":"调用目标何时确定","category":"类型与分发","question":"执行 speak(x) 时，目标函数是在编译期确定，还是运行时从入口信息找到？","why":"类型接口能否复用，与每次调用需不需要查表或间接跳转并非一回事；静态分发和动态分发也可以在不同边界组合。","definition":"分发决定实际调用哪个实现。直接调用、函数指针、接口表、标签分支和带守卫的特化，是不同的目标选择方式。","options":[{"value":"static-direct","label":"静态直接调用","meaning":"在该机器代码实例中，调用目标已经固定。","cost":"有利于内联和专门优化；若目标变化很多，可能需要更多实例。"},{"value":"function-pointer","label":"函数指针间接调用","meaning":"通过运行时提供的函数入口调用，环境或数据另行传递。","cost":"有间接调用及环境表示成本，编译器不一定能内联。"},{"value":"interface-table","label":"接口表或虚表","meaning":"对象或接口入口关联一组方法地址，按固定槽取得实现。","cost":"需要接口表示和一次或多次寻址；具体成本取决于 ABI 与优化。"},{"value":"tag-dispatch","label":"按标签分支","meaning":"检查类型或变体标签，再选择对应实现。","cost":"分支数量和代码体积可能增长；闭合类型集合通常更容易穷尽分析。"},{"value":"guarded-specialization","label":"带守卫的直接快路径","meaning":"先确认运行时条件，常见情况执行直接特化路径，其他情况走合法后备路径。","cost":"需要守卫、后备代码以及可能的运行期优化；收益依赖真实分布。"}],"contrast":"V17 决定类型能否被接口接受，V18 决定泛型是否合法，V20 决定代码生成与共享。一次点号调用可能落在任何路线，语法不能说明分发成本。","example":"// 教学伪代码：同样写 x.speak()\nspeakKnownDog(dog);             // 目标已确定\nlet call = runtimeChoose();\ncall(data);                    // 函数指针\nlet view = { data, table };\nview.table.speak(view.data);    // 接口表","relatedRules":["R23","R25","R26","R30"],"boundary":"直接调用不保证一定内联，间接调用也不保证永远不能去虚化。必须比较目标是否可知、实际指令和完整工作负载，不能给所有虚表调用指定固定损耗百分比。"},{"id":"V20","name":"泛型机器代码如何共享","category":"编译与成本","question":"多个具体类型调用同一泛型时，哪些部分各生成一份，哪些部分可以共用？","why":"按类型全部展开可能增加代码与编译工作；全部共用又可能需要统一表示、装箱或运行时操作参数。","definition":"代码共享由实际表示和操作需求决定，不应合并源类型的身份或安全规则。共享发生在昂贵生成之前与链接之后，能节省的工作也不同。","options":[{"value":"per-type","label":"按具体类型实例化","meaning":"不同具体类型或常量产生相应机器代码实例，后续仍可做合法合并。","cost":"容易针对具体布局优化，但实例、优化和代码体积可能增长。"},{"value":"shape-dictionary","label":"按表示形状共享并传字典","meaning":"具有合适表示的类型共享正文，差异操作通过显式字典或入口提供。","cost":"可减少部分代码，但字典、间接调用和适配是真实成本。"},{"value":"uniform-erasure","label":"统一运行表示与擦除","meaning":"泛型类型信息不直接产生每类型机器实例，正文操作统一的运行时值或接口。","cost":"可能依赖标签、动态操作或装箱；如果本来已是统一表示则不必额外装箱。"},{"value":"proved-code-need","label":"按已证明的代码需求共享","meaning":"在 ABI、实际操作和相关观察相同的前提下，提前归并机器代码需求。","cost":"需要构建和核验等价依据；未知差异应保留合法实例，不能只比大小。"},{"value":"shared-core","label":"具体外壳加共享核心","meaning":"各类型外壳处理真实类型与资源交接，大段公共逻辑使用固定接口共享。","cost":"多一层接口设计或适配；外壳的清理、错误和转换成本不能遗漏。"},{"value":"metadata-shared","label":"共享正文与类型元数据","meaning":"共享泛型正文通过运行时类型和布局元数据、值操作或协议见证处理不同具体类型；源类型身份仍然保留。","cost":"可能增加元数据传递、间接操作和表示适配；具体化优化可以消除部分开销，不能预先视为全部免费。"}],"contrast":"V18 的“一次检查”属于语义层；本项属于表示与代码层。V19 的动态派发可以支持共享，但共享也可能通过静态等价归并实现。","example":"// 教学伪代码：相同大小不表示同一机器工作\nfunction plusOne\u003cT\u003e(x: T) { return x + 1; }\nplusOne\u003cInt32\u003e(x);          // 整数运算及其溢出规则\nplusOne\u003cFloat32\u003e(y);        // 浮点运算\n// 都可能占 4 字节，仍不能仅凭大小合并\n// 只读取一个统一长度字段的正文，则可能有更多共享机会","relatedRules":["R23","R25","R26","R36"],"boundary":"要核对 ABI、布局、算术、调用目标、析构、错误、原子序和可观察身份。先全部生成再由链接器合并，不等于省去了前面的实例化与优化工作。"},{"id":"V21","name":"函数合同如何表达和组合","category":"接口与函数","question":"一个函数保存了什么、访问哪里、可能失败或挂起，调用者从哪里知道？","why":"只记录参数和返回类型，会漏掉保存回调、返回来源、隐式析构或挂起带来的依赖；每层手工重复又会增加接口负担。","definition":"合同是消费者实际依赖的接口事实。它可以由作者写明、从正文推导，或通过泛型参数与被调用方法的合同组合；省略文字不等于没有效果。","options":[{"value":"declared-contract","label":"显式声明合同","meaning":"作者固定来源、访问、错误或效果上界，正文必须满足这些承诺。","cost":"边界稳定且可审阅，但复杂组合可能带来重复注解。"},{"value":"inferred-export","label":"推导并导出合同","meaning":"定义模块从正文和已核依赖推导缺省事实，发布为消费者可用的接口。","cost":"减少手写，但增加推导和 API 差异管理；正文改动可能改变隐式合同。"},{"value":"parameterized-contract","label":"参数化组合合同","meaning":"高阶函数的效果或来源依赖它实际调用的参数和方法，调用时按已核合同代入。","cost":"需要有限且可组合的关系表示；不能无限展开所有可能的函数体。"},{"value":"informal-contract","label":"文档或约定合同","meaning":"部分行为由文档说明，类型或检查器不完整强制这些事实。","cost":"实现与文档可能偏离，消费者需要人工审计或运行期防护。"},{"value":"ordered-effects","label":"有序操作合同","meaning":"将先失效后使用的关系和全部可执行前缀纳入公开合同。","cost":"关系可能平方增长，公开合同变化影响相关消费者。"}],"contrast":"V14 专门解释借用来源，V13 专门解释访问范围；本项决定这些事实怎样通过函数边界发布和组合。保存闭包、执行闭包和清理闭包不是同一个效果。","example":"// 教学伪代码：保存和调用必须分开\nfunction lazyMap(items, f) { return { items, f }; }\nlet seq = lazyMap(data, x =\u003e writeFile(x));\n// 构造 seq 要保留 data/f 的依赖，但尚未执行 writeFile\nnext(seq);                 // 这里才真正承担调用 f 的效果\ndrop(seq);                 // 清理实际拥有字段，不等于调用 f","relatedRules":["R04","R20","R30","R32","R33","R34","R37"],"boundary":"无挂起不等于无阻塞，无阻塞不等于执行时间有界，非逃逸也不等于无重入。公开推导结果变化属于接口变化；不能只看源码签名文字是否改变。"},{"id":"V22","name":"回调环境如何存放","category":"接口与函数","question":"函数值捕获的局部数据，存在哪里，由谁保留，可以保存到调用结束之后吗？","why":"函数入口地址本身通常不能表达捕获环境；把回调存进容器后，调用者的栈变量可能早已结束。","definition":"闭包由可调用入口及所需环境组成。环境可以被短期借用、由闭包值拥有、由共享机制保留，或根本不存在；调用次数和可变性继续受相应权限合同约束。","options":[{"value":"borrowed-environment","label":"非逃逸借用环境","meaning":"本次调用借用现有环境，不能把入口或环境依赖保存到允许范围之外。","cost":"可以避免某些堆装箱，但仍可能存在函数指针和环境地址。"},{"value":"owned-environment","label":"拥有环境","meaning":"闭包按值拥有捕获内容，随着闭包移动并按合同清理。","cost":"环境需要真实存储；能否在栈上或必须堆分配取决于使用与表示。"},{"value":"shared-environment","label":"共享保留环境","meaning":"多个回调入口通过共享拥有或托管机制保留环境。","cost":"可能产生计数、追踪、控制块和延长存活的成本。"},{"value":"no-environment","label":"无捕获入口","meaning":"没有需要保留的捕获数据，可以只提供函数入口或静态上下文。","cost":"运行时仍可能间接调用；无捕获也不保证纯函数或无全局依赖。"}],"contrast":"V19 是调用目标选择，V22 是环境如何保持有效。非逃逸可以与直接调用或间接调用组合，也不自动等于只调用一次、不会挂起或不修改环境。","example":"// 教学伪代码：立即借用与长期保存\nlet config = localConfig();\nforEach(items, x =\u003e use(config, x)); // 若不逃逸，可借 config\nregistry.save(x =\u003e use(config, x));  // 必须让捕获及依赖覆盖保存期\n// 不能把第二行降成指向短命调用栈的环境地址","relatedRules":["R04","R20","R24","R30"],"boundary":"拥有闭包只拥有实际捕获的内容；捕获内容内部仍可能借用外部资源。返回借自本次临时环境的结果，需要额外寿命关系，不能凭非逃逸拼写放行。"},{"id":"V23","name":"等待与挂起如何表示","category":"任务与并发","question":"一次调用等待外部结果时，它的局部变量和调用链保存在什么地方？","why":"同步、协程和任务可能看起来执行同样的业务，但栈空间、状态帧、调度和可迁移性要求并不相同。","definition":"执行表示决定等待时保留哪些真实状态。可以阻塞当前线程，也可以保存任务栈、生成状态机帧，或显式把后续计算包装成回调；借用和清理义务不会随语法改变而消失。","options":[{"value":"blocking-stack","label":"阻塞线程与普通栈","meaning":"调用在当前线程等待，局部状态留在普通调用栈。","cost":"实现直观，但阻塞会占用线程及其栈，影响并发规模。"},{"value":"stackful-task","label":"有栈挂起任务","meaning":"保存任务栈和执行上下文，等待时让出执行权，恢复后继续调用链；物理栈能否搬迁另由地址与引用管理协议决定。","cost":"需要任务栈、调度和保护空间；栈的预留与驻留应分别计费。"},{"value":"state-machine","label":"状态机或固定状态帧","meaning":"把跨挂起状态保存在明确帧中，恢复入口根据当前状态继续执行。","cost":"有状态转换、帧布局和组合成本；未知调用或递归可能需要额外表示。"},{"value":"explicit-continuation","label":"显式后续回调","meaning":"把下一步工作和所需环境交给回调或 continuation 对象。","cost":"需要维护回调环境与完成路径；嵌套、分配和取消协调可能增加复杂度。"}],"contrast":"V24 决定任务何时结束及谁等待它；V12 决定共享访问权限。本项只决定执行状态放在哪里。同一调用语法不等于同一调度、空间或 ABI。","example":"// 教学伪代码：业务相同，等待表示可不同\nfunction readPair(io, a, b) {\n  let x = io.read(a);\n  let y = io.read(b);\n  return combine(x, y);\n}\n// 阻塞：线程等；有栈：保留任务栈；状态机：保存 x 等活跃状态\n// 选择表示不能抹掉真实的等待和存储","relatedRules":["R11","R13","R23","R24","R33"],"boundary":"跨挂起仍需同时满足存活、地址、权限与结束使用者的条件。能挂起不代表能跨线程恢复；无挂起不保证无阻塞，也不保证固定完成时间。"},{"id":"V24","name":"任务、取消与完成边界","category":"任务与并发","question":"父函数要结束时，谁确认子任务和设备已停止使用它们借走的资源？","why":"发起取消或丢弃任务句柄，都可能发生在实际操作完成之前；此时释放缓冲会破坏仍在进行的访问。","definition":"任务收口把完成确认、结果交接、权限归还和资源清理关联起来。取消通常只是请求；只有协议确认使用已经结束，才能解除相应保留。","options":[{"value":"structured-join","label":"结构化等待","meaning":"子任务归属于明确边界，该边界结束前等待全部使用者完成，再清理。","cost":"需要登记和等待；若子任务或设备永不完成，边界可能无法退出。"},{"value":"owned-detached","label":"拥有资源的独立任务","meaning":"任务携带覆盖完整执行期的拥有资源，允许比创建者活得更久。","cost":"需要长期状态和清理责任；不能仍依赖已经结束的父栈借用。"},{"value":"registered-operation","label":"显式登记与取回","meaning":"操作在提交前登记，完成后由 join/reap 等入口取回结果和资源责任。","cost":"有操作状态与同步管理成本；重复通知不能重复转移或释放。"},{"value":"manual-completion","label":"调用者手工收口","meaning":"调用者按 API 约定管理等待、取消、结果提取及清理。","cost":"容易遗漏失败或提前返回路径，需要封装或检查补强。"}],"contrast":"V23 是挂起状态表示，本项是使用者生命周期协议。任务是否并行、能否迁移线程，还需额外能力；join 不能反向证明之前的冲突写入合法。","example":"// 教学伪代码：取消请求不等于使用结束\nlet op = device.startWrite(buffer);\nop.requestCancel();\nfree(buffer);              // 此时可能仍被设备读取，应禁止\nawait op.reap();            // 协议确认不再使用\nfree(buffer);              // 且满足其他依赖后才允许","relatedRules":["R11","R12","R19","R21","R33"],"boundary":"结构化等待不保证取消在固定时间内完成，也不保证无死锁。强行终止要有独立的隔离与资源合同，不能把仍在使用的内存直接归还。"},{"id":"V25","name":"外部代码的安全边界","category":"检查与边界","question":"调用 C、系统接口或设备时，本语言的存活、别名和初始化保证怎样继续成立？","why":"生成了函数声明或匹配了 ABI，只说明如何传参数，不说明外部代码是否保存地址、稍后回调或继续使用缓冲。","definition":"外部契约至少覆盖表示、范围、初始化、保留、线程、重入、完成和清理。包装可以验证一部分输入，但真实外部实现仍必须满足无法从接口验证的承诺。","options":[{"value":"declarations-only","label":"只有布局与调用声明","meaning":"工具导入类型、符号和调用约定，安全责任由调用方或文档承担。","cost":"接入直接，但没有自动获得保活、别名或完成保证。"},{"value":"audited-wrapper","label":"受审计安全包装","meaning":"少量可信实现核对前提并暴露安全接口，限制原始能力的使用范围。","cost":"需要审计和验证，也可能需要显式生命周期或类型适配。"},{"value":"checked-bridge","label":"受检或复制桥接","meaning":"在边界验证长度、标签和状态，必要时复制到独立存储并管理异步完成。","cost":"有验证、复制、分配和状态管理成本；无法靠输入检查证明任意外部行为。"},{"value":"isolated-message","label":"隔离后消息交换","meaning":"外部代码在隔离环境中运行，通过序列化消息或受控共享存储交互。","cost":"有进程、沙箱、序列化或共享内存协议成本；业务错误仍需处理。"}],"contrast":"V15 说明哪些实现被信任，本项列出外部边界需要传递的具体合同。ABI 兼容不等于内存安全；同一个 C 函数名也不保证行为符合声明。","example":"// 教学伪代码：调用返回了，外部使用未必结束\nextern function submit(ptr, len, callback);\nsubmit(buffer.ptr, buffer.len, onDone);\n// 如果 submit 保存 ptr，buffer 必须覆盖外部实际使用期\n// 不能仅凭 submit 已返回就释放 buffer\n// onDone 是否表示真正完成，也要由协议明确","relatedRules":["R01","R02","R12","R13","R22"],"boundary":"声明“不保存地址”不会证明 C 实现真的不保存。字符串编码、布局、回调重入和异步完成要分别核对；安全包装不能伪造来源或独占权限。"},{"id":"V26","name":"语法扩展与编译期生成","category":"编译与成本","question":"重复代码是在文本层替换、语法树层生成，还是由编译期程序计算出来？","why":"宏和 comptime 可以减少手写，但名字捕获、隐藏输入和生成结果绕过检查会让含义、缓存和安全边界失真。","definition":"生成机制负责把声明输入转换成代码或类型。它决定表达能力和工具支持成本，但生成的结果仍必须满足其所处语言的语义与安全规则。","options":[{"value":"textual-macro","label":"文本或 token 替换","meaning":"按预处理或宏规则拼接、替换输入片段。","cost":"机制直接，但绑定、求值次数和诊断位置需要额外小心。"},{"value":"hygienic-syntax","label":"卫生语法生成","meaning":"在语法结构上生成，保留调用点绑定并隔离新名字。","cost":"需要语法对象、作用域和来源映射，工具必须理解展开关系。"},{"value":"compile-time-program","label":"编译期执行程序","meaning":"执行受允许的常量、类型或代码构造逻辑来生成结果。","cost":"增加编译期执行成本和终止/配额问题；输入必须进入依赖。"},{"value":"external-generator","label":"外部生成工具","meaning":"单独工具读取声明输入并产生普通源码或其他受检产物。","cost":"构建需管理工具版本、输入、输出与诊断；隐藏文件或环境会破坏复现。"},{"value":"syntax-generation","label":"按语法结构生成代码","meaning":"编译器或插件读取、构造语法结构，再把生成结果送回检查流程；名称如何绑定另由具体宏规则决定。","cost":"需要稳定的语法与诊断接口、插件执行和展开缓存；操作语法树本身不保证名称隔离或避免捕获。"}],"contrast":"V18 负责泛型语义检查，V28 负责求解或执行超限。本项是代码从哪里来，不能把生成能力当成创建安全证据的权限。","example":"// 教学伪代码：生成代码仍要检查\ngenerate(\"function bad() { return borrow(localTemp()); }\");\n// 即使语法生成成功，返回短命局部借用仍必须按正常规则处理\nmacro twice(expr) { expr + expr }\n// 若 expr 有副作用，还要说明它是否被执行两次","relatedRules":["R23","R29","R31"],"boundary":"语法糖定型后内置或预编译可以减少展开工作，但不能由此保证整体编译时间变快。卫生绑定、求值顺序和输入依赖必须在不同执行方式下保持一致。"},{"id":"V27","name":"增量编译的复用边界","category":"编译与成本","question":"改一行私有实现后，哪些已有检查和代码还有效，依据是什么？","why":"按文件全部重做会浪费工作；错误地复用旧结果则可能保留已经失效的安全结论、布局或内联假设。","definition":"复用需要知道某个结果实际依赖哪些输入。语义合同、ABI、函数正文和优化前提可以有不同依赖边；结果相同也要更新已经变化的依赖集合。","options":[{"value":"whole-rebuild","label":"整体重新计算","meaning":"从当前输入重新检查和生成相应完整目标，几乎不依赖细粒度缓存。","cost":"实现较简单，但小改动可能重复大量工作。"},{"value":"file-module-cache","label":"文件或模块依赖缓存","meaning":"以文件、模块或编译单元记录输入变化与缓存有效性。","cost":"可减少部分重建，但边界较粗，公开与私有变化可能一起传播。"},{"value":"query-fingerprint","label":"真实查询与结果指纹","meaning":"记录细粒度语义查询的依赖，重算后的相关结果不变时停止传播。","cost":"查询、哈希、依赖管理和缓存读取本身有成本。"},{"value":"used-contract","label":"复核消费者实际前提","meaning":"接口改变后，检查新合同仍满足消费者原证明依赖的前提，合格时转移证据。","cost":"需要完整记录使用过的事实并核验蕴含；证据可复用不代表旧机器码也可复用。"},{"value":"shared-semantic-cache","label":"检查与构建共享语义产物","meaning":"IDE、check 和 build 在相同有效输入下共用已核语义结果，后续只补缺少阶段。","cost":"必须绑定目标、配置和真实输入；还需维护产物可信性与版本。"}],"contrast":"V20 处理同一次构建中的实例共享，本项处理修改前后的工作复用。函数体改了、合同改了、ABI 改了，会触发不同种类的后续工作。","example":"// 教学伪代码：不同变化影响不同消费者\nold: function count(x) -\u003e number { return slowCount(x); }\nnew: function count(x) -\u003e number { return fastCount(x); }\n// 定义方必须重查；若合同和 ABI 不变，普通调用者可能复用\n// 内联了旧正文、在 comptime 调用了它的消费者仍有实现依赖","relatedRules":["R23","R27","R28","R34","R36"],"boundary":"文件时间、源码签名文字或一个 verified 标签都不足以证明缓存可用。类型、来源、错误、布局、目标和内联依赖不能遗漏；热缓存速度也不代表冷构建速度。"},{"id":"V28","name":"求证未完成时如何处理","category":"检查与边界","question":"编译器在预算内无法证明条件时，是拒绝、要求更多信息、改用明确受检入口，还是放弃优化？","why":"安全判断和可选优化承担不同责任。把“不知道”当成“安全”会出错，把“优化未证明”都当成程序非法又会不必要地限制语言。","definition":"分析和编译期执行必须有明确的可处理范围与超限结果。必需条件没有证据就不能授予能力；仅用于删检查或选更快表示的证据不足，则应保留合法实现。","options":[{"value":"stop-required","label":"停止未完成的必需证明","meaning":"必需安全或类型条件未建立时，不生成自称已经满足该条件的产物。","cost":"可能拒绝实际安全但难证明的程序；应区分冲突、缺信息与资源超限。"},{"value":"request-evidence","label":"要求更具体的可核信息","meaning":"用户通过注解、分区、容量上界或更明确接口补充信息，再由系统检查。","cost":"增加少量手写和设计工作；提供文字声明不等于证明它成立。"},{"value":"explicit-runtime-route","label":"改用显式受检路线","meaning":"用户或源合同明确选择运行时验证、拥有容器或其他可行机制。","cost":"多出实际检查或管理成本；必须公开，不应秘密改变源语义。"},{"value":"skip-optional","label":"保留合法实现并跳过优化","meaning":"未取得优化证据时保留检查、原布局或直接实例，不影响已经成立的源程序合法性。","cost":"可能失去性能或代码体积收益，但不会把未知当作正确。"}],"contrast":"V15 决定一项条件平时由谁落实，本项处理得不到所需结论的结果。有限抽象域、求解燃料和深度上限都是实现停止边界的手段，不自动证明所有安全程序都可被接受。","example":"// 教学伪代码：两种未证明必须分开\nproveAlive(p);              // 必需证据：未完成则不能授予安全读取\nproveIndexInside(i, n);     // 若动态边界检查本来就是合法后备\n// 删检查证明失败：保留 if (i \u003e= n) fail()\n// 泛型求解超限：报告 ResourceLimit，不把它缓存成“没有实现”","relatedRules":["R23","R28","R31","R36"],"boundary":"预算应明确计量范围并保持结果分类一致；不承诺解决任意程序等价或任意终止问题。少执行安全步骤、关闭析构或边界检查，不属于同等语义下的编译优化。"}],"foundations":[{"id":"F01","name":"读取前必须是合法的值","statement":"每次把存储当作 T 读取时，对应内容必须已经初始化，并满足 T 的合法状态。预留地址、原始字节和部分构造对象都不能直接冒充完整 T；失败只处理已经成功构造的部分。","example":"// 教学伪代码\nlet p = reserve\u003cNode\u003e();\nread(p.value);             // 不合法：只有位置，还没有 Node\ninitialize(p, { value: 1 });\nread(p.value);             // 初始化与发布条件满足后才可读\nlet x = None;\nread(x.value);             // 仍需先确认是有值的分支","nonImplication":"这不要求禁止所有未初始化存储；可以允许预留和分阶段构造，只要不把半成品暴露为合法值。对象还占着字节，也不代表已析构字段仍可读取。","variables":["V02","V03","V16","V17","V25"]},{"id":"F02","name":"访问必须落在合法存储范围内","statement":"一次读写的完整范围、对齐、类型表示和来源都要合法。对象存活只能说明没有过早销毁，不能替代边界检查，也不能把任意整数变成有权访问的地址。","example":"// 教学伪代码\nlet bytes = buffer(8);\nread(bytes, 7, 1);         // [7,8)：在范围内\nread(bytes, 7, 4);         // [7,11)：越界\nlet k = keyFromOtherPool;\npool.resolve(k);          // 数字看似相同，也必须验证所属身份","nonImplication":"地址非空、起始下标合法、长度相等和机器宽度相同都不是充分条件。该义务可以由静态证明、受检视图、动态检查或可信接口共同落实。","variables":["V03","V04","V10","V11","V13","V15","V25"]},{"id":"F03","name":"完整资源必须覆盖全部合法使用","statement":"对象、内部缓冲、分配器和清理所需依赖必须持续有效，直到全部相关使用结束。使用需求包括字段中保存的入口、派生视图、闭包、返回值、子任务和外部设备；只检查局部变量的最后一次出现不够。","example":"// 教学伪代码\nlet list = makeVector();\nlet old = borrowSlice(list);\nlist.replaceBuffer();     // 即使 list 还活着，也会影响 old\nread(old[0]);              // 必须被禁止或由真实存储保护\n// 同理：return 指向局部对象的地址，不能靠改注解延长对象生命","nonImplication":"这不要求必须使用 GC、引用计数、域或世代。延长保活只能在合同允许时安排，也不自动保证及时回收、固定内存上界或地址始终不变。","variables":["V05","V06","V07","V08","V09","V11","V14","V22","V23","V24"]},{"id":"F04","name":"资源责任必须合法交接","statement":"复制几个机器字不能凭空复制独立释放权。每次移动、删除、返回、失败和取消，都要保留实际资源责任的正确归属；履行清理合同时，同一分配单位不能被重复释放，仍负责保留它的拥有值也不能被静默丢弃。","example":"// 教学伪代码\nlet a = own(block);\nlet b = move(a);           // 责任交给 b\ndrop(a);                  // 不得再按完整拥有值释放\ndrop(b);                  // 只履行这份实际责任\n// 把一个 Arena 节点地址移出，并不自动得到独立 free 整块的权利","nonImplication":"内存安全本身不保证无泄漏或所有清理都能完成；这些需要另立目标。共享拥有可以合法存在，但必须通过共同协议管理，不能复制两份都认为自己独占的释放责任。","variables":["V02","V05","V06","V07","V09","V16","V22","V24"]},{"id":"F05","name":"相交访问必须满足权限与同步规则","statement":"多个入口访问同一存储时，要按其读写、失效和并发规则判断是否相容。权限只能来自合法的拥有、借用、分区或运行时协议；复制连接不复制独占权。回调、析构和重入带来的访问也必须计入。","example":"// 教学伪代码\nlet a = node, b = node;\nlet view = borrowRead(a.payload);\nb.replacePayload();       // 会破坏 view 时必须排除\n// 并发时，两次 value++ 也不能因对象由共享指针保活就免于同步\n// 两个不同图根仍可能最终指向同一节点","nonImplication":"这不强制所有语言采用独占借用；受控短访问、动态 guard、锁、原子或隔离都可能承担不同部分。无数据竞争不等于业务事务正确；一起保活也不等于必须一起独占。","variables":["V08","V11","V12","V13","V15","V21","V23","V24"]},{"id":"F06","name":"接口不能漏掉真实依赖与外部使用","statement":"跨函数、泛型、闭包、模块和 FFI 边界时，必须继续传递消费者实际需要的类型、来源、访问、保存、调用、清理和完成条件。合同由真实实现承担；取消请求、返回或通知只有在协议规定的意义下才说明使用已经结束。","example":"// 教学伪代码\nlet op = device.submit(buffer);\nop.requestCancel();\nfree(buffer);              // 请求已发出，不代表设备已停止\nawait op.reap();            // 确认完成并取回责任\n// 只有其他依赖也结束后，才能释放\n// 外部函数声明“不保留指针”，也需要实现真的履行","nonImplication":"签名存在不证明外部实现正确；未写效果也不表示纯函数。保存闭包不等于调用闭包，非逃逸不等于无重入，无挂起不等于固定时间完成。","variables":["V14","V15","V16","V18","V21","V22","V23","V24","V25"]},{"id":"F07","name":"编译和缓存必须保持已承诺的语义","statement":"展开、检查、代码共享、布局变换、优化和缓存复用都必须保持源合同允许的行为，包括结果、合法访问、真实资源交接、错误和清理。能够消去证明信息，不意味着能够消去实际拥有者、帧、检查或调用。","example":"// 教学伪代码\ntype A = { bits: Int32 };\ntype B = { bits: Float32 };\n// 大小可能相同，但运算、位模式或清理不同，不能直接共用错误实现\n// 同样：私有正文变化后，旧的“不会写入”假设必须按真实依赖复核","nonImplication":"后端同为机器码、测试暂时通过或缓存带有 verified 标签，都不构成语义保持证明。开发构建可以少做优化，不能把原本受保证的非法访问改为未定义行为。","variables":["V01","V02","V10","V11","V17","V18","V19","V20","V21","V23","V26","V27","V28"]},{"id":"F08","name":"不同结论必须分别给出前提和证据","statement":"宣称安全、最终回收、内存有界、性能更快或已经实现时，必须分别说明场景条件、适用路线和证据。未证明、未实现、没有提供与不适用分开记录；强制安全证据不足时不能放行，可选优化证据不足时保留合法实现。","example":"// 教学伪代码\na.next = strong(b); b.next = strong(a);\n// 没有悬空访问，不代表这个强拥有环会被自动回收\nlet retired = keepAtMost(4, nodeWithHugeBuffer);\n// 责任数量 ≤ 4，不代表保留字节数已知\n// 规范要求支持某场景，也不等于当前编译器已通过该场景验收","nonImplication":"能力不能由规则数量、图上连线数量或未经解释的百分比计算。性能需在相同能力与完整工作量下测量；内存安全不要求所有程序终止、无泄漏、无死锁或硬实时。","variables":["V05","V06","V07","V09","V15","V19","V20","V23","V24","V26","V27","V28"]}],"rules":[{"id":"R01","name":"初始化后才能读取","category":"值与存储","why":"分配内存只得到空间，空间中的旧字节还不一定构成合法的值。","definition":"把预留存储、写入合法值、允许其他代码访问这三步分开；初始化失败时仅清理已经构造完成的部分。","how":"可以用编译期确定赋值检查、默认零值、构造函数或运行时状态维护；不同语言对未初始化空间的暴露程度不同。","example":"伪代码：p = reserve(Node); p.name = \"A\"; p.next = null; publish(p)。只有两个必需字段都合法后，外部才可读取 p。","counter":"只给 name 赋值就把 p 交给回调，回调读取尚未初始化的 next；即使地址和分配大小都正确，也不满足规则。","formula":"可读对象 ⇒ 所有必需部分均已初始化且表示有效","boundary":"内存已初始化不保证字符串编码、业务约束或外部资源状态正确；零填充也不是所有类型的合法构造。"},{"id":"R02","name":"访问范围与对齐合法","category":"值与存储","why":"对象还活着，并不表示从它的地址出发可以读任意位置或任意宽度。","definition":"每次实际读写的字节区间都必须落在允许的存储中，并满足该访问所需的对齐要求。","how":"数组长度检查、切片、静态范围证明、对齐分配与显式非对齐访问可以承担不同部分；裸指针接口往往将义务交给调用者。","example":"伪代码：a = [10,20,30]; a[3] 不能变成任意内存读取。语言可返回安全结果（如 JS 的 undefined）、检查失败或由明确的不安全合同承担；读取 u64 还要覆盖完整 8 字节。","counter":"只证明起始地址位于分配内部，却从最后一个字节读取 8 字节；或者把任意字节地址当作已对齐的整数指针。","formula":"访问区间 ⊆ 允许区间；地址满足所用操作的对齐合同","boundary":"普通数组的缺失下标可有安全的语言定义，与越界读取裸内存不同。“提供切片”不等于所有访问途径都安全，FFI 和不安全操作需单独评估。"},{"id":"R03","name":"释放责任随移动转移","category":"存活与回收","why":"一个必须释放一次的文件或堆分配，不能因为变量赋值就产生两个互不知情的释放者。","definition":"移动转交值及其清理责任，原位置随后不能再次消费该资源；可复制值、显式共享拥有与移动值必须区分。","how":"通过所有权类型和移动后检查，或由库的唯一拥有包装与使用纪律实现。仿射通常允许不再使用，不等同于强制每条路径都释放。","example":"伪代码：a = openFile(); b = move(a); close(b)。此后 close(a) 不允许，否则同一个文件被关闭两次。","counter":"复制两个变量中的同一地址，再让它们各自在离开作用域时 free；复制地址不会复制底层分配。","formula":"move(a→b)：责任(a)=0，责任(b)=1","boundary":"这是避免重复清理的一条路线；GC 和引用计数可以用其他方式管理。唯一责任本身也不能证明所有借用都已结束。"},{"id":"R04","name":"依赖必须沿派生值传播","category":"存活与回收","why":"原变量不再使用后，从它派生的切片、闭包或返回值仍可能访问同一块存储。","definition":"把值所依赖的来源跟随字段保存、分支选择、闭包捕获、返回值和任务一起传播，不能只查看变量的表面作用域。","how":"静态系统记录可能来源与寿命关系；动态系统也可以通过实际引用图或保活字段承接依赖。合并路径时不能丢失某个可能来源。","example":"伪代码：view = buffer.slice(1); task = () =\u003e read(view); save(task)。即使 view 的局部名字结束，保存的 task 仍依赖 buffer 的存储。","counter":"只看 buffer 在当前函数中最后一次直接出现的位置就释放它，遗漏了返回闭包里保存的 view。","formula":"实际需要的来源 ⊆ 分析或表示中保留的来源","boundary":"知道来源不等于已满足保活；还要安排实际存储寿命、访问权限及内部缓冲有效性。静态分析可以保守拒绝部分安全程序。"},{"id":"R05","name":"会使视图失效的操作受约束","category":"存活与回收","why":"保住外层对象还不够，扩容、换枚举分支和替换字段都可能结束内部视图的有效性。","definition":"仍有派生访问需要某段存储时，不能在缺少其他协议的情况下销毁、移空、搬迁、替换或复用该存储。","how":"可拒绝冲突操作、缩短借用、复制所需数据、使用稳定分配，或在访问时重新解析受检身份；必须与具体失效原因匹配。","example":"伪代码：v = \u0026list[0]; list.push(x); use(v)。如果 push 可能扩容，系统必须阻止旧地址继续被当作有效视图。","counter":"list 对象本身仍在栈上，因此声称 v 安全；实际上其旧堆缓冲已经被释放。","formula":"某视图的使用期间 ⊆ 该视图所指存储的有效期间","boundary":"并非任何修改都使视图失效；只修改不相交字段与替换整个对象应有不同合同，过宽约束会增加使用负担。"},{"id":"R06","name":"共享与独占访问互斥","category":"访问与并发","why":"一段操作若依赖对象保持不变，别名写入会破坏其判断；独占访问也不能被复制地址偷偷绕开。","definition":"同一受保护位置可以有多个兼容读取；活动的独占访问排除其他不兼容访问，共享访问排除不兼容写入。","how":"可在编译期检查借用，或用动态借用检查、锁及其他访问协议实现。允许重借时还需规定上层权限何时暂停和恢复。","example":"伪代码：r = borrowRead(x); read(r); borrowWrite(x) 在 r 仍活动时不通过。结束 r 后再取得写权限，可以修改 x。","counter":"把一个可变引用的位模式复制为 p、q，就宣称得到了两份独占权；它们仍指向同一位置。","formula":"不相容且范围相交的访问 ⇒ 不得同时有效","boundary":"这里是访问协议，不是所有语言的默认语法。内部可变类型可提供另一套受控协议，但不能仅因改名就跳过冲突。"},{"id":"R07","name":"按组保留完整资源","category":"存活与回收","why":"共享图中的许多对象可以共同存活，但保住节点外壳不足以保住它依赖的缓冲、分配器和清理环境。","definition":"用区域、Arena、拥有封包或其他真实拥有者覆盖一组对象及其必要依赖，在允许的边界统一结束它们的有效性。","how":"确定哪些对象需要共同存活，再让实际拥有安排覆盖需求；静态系统可推导区域关系，库也可显式传入区域或容器。","example":"伪代码：with arena { a = allocNode(); b = allocNode(); a.next=b; b.next=a; use(a); }。退出时由 arena 负责存储，边本身不递归承担释放。","counter":"给节点贴上“长寿命域”标签，却让它内部的 name 切片继续指向已经结束的临时缓冲。","formula":"实际需求 ⊆ 保守需求 ⊆ 实际保留范围 ⊆ 合同允许范围","boundary":"统一保留可能增加峰值内存；Arena 单独并不防止逃逸指针、数据竞争或错误析构顺序，也不保证任意节点可提前 free。"},{"id":"R08","name":"对象连接与访问权限分开","category":"访问与并发","why":"“我能找到哪个对象”和“我此刻能读写什么”是两件事；图中需要多个连接，不等于需要多个同时有效的独占引用。","definition":"连接或句柄负责定位对象，拥有协议负责存活，访问协议负责当前操作；三种职责可以用不同类型，也可以由同一容器的不同接口承担。","how":"先通过索引、连接、共享拥有引用等找到对象，再在具体读写期间取得所需权限。例如容器 ID 加容器借用、引用计数加动态借用检查。","example":"伪代码：a = nodeId; b = nodeId; graph.update(a, +1); graph.update(b, +1)。两次顺序访问可指向同一节点，每次权限窗口分别结束。","counter":"因为 a、b 是两个变量，就把它们同时转换为两个具有排他保证的可变引用；同一对象并未变成两个对象。","formula":"定位能力 ≠ 保活责任 ≠ 独占访问权","boundary":"这是可选择的分层机制，不要求所有语言出现 Link 关键字；ZIL Link 是一种具体设计，Rust 索引容器等也可表达这种分离。"},{"id":"R09","name":"移出集合与销毁对象分开","category":"存活与回收","why":"界面删除节点或遍历时移除成员后，当前读者可能还需要旧对象；立即析构会使这些访问失效。","definition":"逻辑移出只改变成员资格，完整对象及清理责任进入退役状态，等待既有使用者结束后才真正销毁。","how":"可采用静态退役拥有值、引用计数保活、epoch 或 hazard 等协议；每条路线都必须保留完整的有效对象及必要依赖。","example":"伪代码：old = graph.remove(id); finishCurrentRead(old); destroy(old)。remove 后查询集合不再返回它，但当前持有者还可按合同读取。","counter":"先运行析构释放节点的字符串，再只延迟节点外壳的 free；旧读者访问 name 时仍然错误。","formula":"活成员 → 已移出且仍有效 → 可销毁 → 已销毁","boundary":"退役会延迟回收，可能增加内存；要求立即关闭的资源不能擅自延后，也不能把“仍可读”当成“仍是成员”。"},{"id":"R10","name":"回收前处理所有剩余入口","category":"存活与回收","why":"删除索引中的一个节点，不会自动删除其他对象、回调或旧退役对象里保存的入口。","definition":"旧入口尚在时，可以断边、让其安全解析失败，或继续真实保活以延后回收；实际销毁必须等全部可用入口和派生使用不再需要对象。","how":"采用断边、反向边索引、所有权转交、弱句柄验证或完整可达性追踪；不能仅依据当前局部变量已不用就回收。","example":"伪代码：a.next = b; removeFromIndex(b)。如果之后还能读取 a.next，系统还需清掉该边、让它安全失效，或继续保留 b。","counter":"只清理活成员中的入边，却漏掉先前已退役对象 old.next 中仍保存的 b。","formula":"可回收 ⇒ 无未受保护的可用入口，且所有派生使用已结束","boundary":"任意图的所有入边并不天然可在 O(1) 找到；若容器维护反向索引，其更新时间和存储也属于真实成本。"},{"id":"R11","name":"子任务在边界内收口","category":"任务与失败","why":"任务可能在父函数返回后继续执行；如果仍使用父栈或区域数据，父方就不能先清理。","definition":"任务被纳入明确的拥有范围；范围离开前，所有借用其资源的子任务都完成并被 join，之后才清理资源。","how":"在发布子任务前登记责任，正常、错误和取消出口都执行收口；借用线程作用域、任务组等是不同具体接口。","example":"伪代码：scope { spawn(() =\u003e read(local)); joinAll(); }。只有任务确实结束，local 才离开作用域。","counter":"异常路径跳过 join，父函数已返回，而子任务仍读取父栈数组。","formula":"子任务最后一次使用 ≺ 确认完成 ≺ 父资源清理","boundary":"结构化收口保证资源关系，不自动保证任务会终止、无死锁或在固定毫秒数内结束；后台独立任务需要不同拥有合同。"},{"id":"R12","name":"取消请求与完成确认分开","category":"任务与失败","why":"取消通常只是通知对方停止，对方或设备可能仍在读写已提交的资源。","definition":"发出取消、收到取消、停止实际访问、回收任务结果是不同状态；资源结束必须依据真正的完成或可核验的撤销确认。","how":"接口公开 cancel 和 awaitCompletion/join/reap 的关系；等待期间保持缓冲、回调环境和相关拥有者有效。","example":"伪代码：request.cancel(); await request.completed; free(buffer)。只有 completed 保证设备不再访问 buffer 时，释放才安全。","counter":"发出网络或 DMA 取消请求后立即释放缓冲，对方下一次写入落在已复用的内存上。","formula":"cancelRequested ≠ accessFinished；回收须晚于最后实际访问","boundary":"有些接口能同步撤销，但必须有该接口的真实保证。完成安全和取消响应时限是两项独立目标。"},{"id":"R13","name":"地址或身份映射保持稳定","category":"值与存储","why":"对象逻辑上仍是同一个，不代表之前交出的机器地址仍然指向它。","definition":"外界持有可直接访问的地址时，要保持相应存储稳定；若允许搬迁，则通过能正确更新的间接映射或重新解析协议访问。","how":"可用稳定堆分配、固定地址约束、句柄表、移动 GC 的引用更新等方式；选择取决于外部是否保存不可修补的裸地址。","example":"伪代码：cLibrary.save(\u0026node); moveOwnerHandle() 可以合法，但 compactNodes() 只有在不破坏该地址合同时才能执行。","counter":"槽号 7 被删除后给新对象使用，旧 ID 7 随后静默访问了新对象；这保持了槽位置，却丢失了实例身份。","formula":"活动裸地址依赖 ⇒ 地址稳定；间接访问 ⇒ 映射保持实例身份","boundary":"稳定地址不等于对象永生或访问独占；固定地址机制也需要清理、别名与线程规则。"},{"id":"R14","name":"失效身份经验证才能访问","category":"存活与回收","why":"编辑器选中项、缓存键或外部索引常需在对象删除后继续保存，但旧标识不能静默落到新对象上。","definition":"允许保存非保活身份；每次把身份解析成可访问对象时，验证目标仍是要求的活实例，并保护验证到使用的区间。","how":"可用不复用的 ID、槽号加世代、弱引用升级、对象表锁或其他实例验证协议；管理入口本身也必须活着。","example":"伪代码：saved = idOf(node); erase(node); resolve(saved) 返回 None。若槽被新节点复用，旧 saved 仍不能取得新节点。","counter":"检查世代相同后释放锁，再返回未受保护的裸指针；另一个线程可在实际使用前删除该对象。","formula":"resolve 成功 ⇒ 匹配的活实例 ∧ 使用期间受到保护","boundary":"世代是可选实现，不是所有语言或图机制的默认。弱引用、ID 表与 ZIL Key 的成本和回收保证需分别说明。"},{"id":"R15","name":"用计数共享拥有","category":"存活与回收","why":"多个独立持有者都需要让对象存活，而最后一个持有者离开后希望触发清理。","definition":"强拥有引用的创建和结束更新计数；最后一个强拥有结束时析构对象，弱引用不维持对象内容存活。","how":"语言可插入 retain/release，也可通过 Rc、Arc、shared_ptr 等显式库类型完成；并发共享时还需满足相应计数原子协议。","example":"伪代码：a = shared(new Node); b = a.cloneOwner(); drop(a) 后 b 仍可访问；drop(b) 后对象可被析构。","counter":"a 强拥有 b、b 强拥有 a，外部入口都没了却仍各有计数 1；单纯引用计数不会自动识别这种环。","formula":"强拥有计数归零 ⇒ 按协议销毁对象","boundary":"计数只解决拥有关系，不保护并发字段修改；强环、控制块寿命和外部裸指针必须另行处理。"},{"id":"R16","name":"从完整根与边追踪存活","category":"存活与回收","why":"共享和成环结构难以用单一父节点安排逐边清理，可以让运行时依据实际可达性决定保留对象。","definition":"从所有有效根出发遍历引用边，保留仍可合法到达的对象；不可达对象按回收器协议处理。","how":"维护栈/全局/任务等根以及准确引用表示；并发或分代回收还需要满足相应写屏障和同步协议。","example":"伪代码：a.next=b; b.next=a; root=a。root=null 且没有其他根后，追踪回收能把 a、b 作为不可达环回收。","counter":"本地原生代码保存了堆地址却没有向运行时登记根；GC 看不见该入口，可能回收仍被使用的对象。","formula":"仍可合法到达的对象 ⊆ 回收器保留的对象","boundary":"不可达不等于立刻释放；峰值内存、停顿、终结器和外部资源关闭需单独分析，永久根会让对象一直被保留。"},{"id":"R17","name":"复制得到独立可变值","category":"值与存储","why":"将集合赋给新变量后，开发者有时希望修改新值不会意外改变原值。","definition":"独立值在可观察语义上互不共享可变状态；可以共享不可变实现存储，但写入必须保持其他值的观察不变。","how":"可通过实际复制、移动加显式复制、写时复制和受控投影实现；包含引用成员时，要区分容器值独立和其对象成员共享。","example":"伪代码：a=[1,2]; b=copyValue(a); b[0]=9; 此后 a[0] 仍为 1。实现可先共享缓冲，到 b 写入时才分离。","counter":"复制只有一个 next 对象引用的结构，然后修改 b.next.name；浅复制仍可能让 a.next.name 一起变化。","formula":"a、b 是独立值 ⇒ 修改 b 不改变 a 的可观察值","boundary":"独立值语义不是任意身份图的免费深复制；共享对象、指针或逃逸视图会引入额外合同。"},{"id":"R18","name":"访问权限按不交部分拆分","category":"访问与并发","why":"只修改一个字段或半段数组，却占用整个对象，会阻止本可安全并行或组合的操作。","definition":"将读取与写入权限限定在实际字段、区间或已证明的分区上，允许互不冲突的访问同时存在。","how":"编译器可识别结构体字段；动态索引需边界/不同性检查；图分区则需保证实际可到达的写入范围不交。","example":"伪代码：left = data[0..mid]; right = data[mid..n]; parallel(sort(left), sort(right))。两个区间相接但不重叠。","counter":"分别从 rootA 和 rootB 开始遍历就宣称可并行写；两个根可能经不同路径抵达同一节点。","formula":"对 i≠j：写入(i) ∩ [读取(j) ∪ 写入(j)] = ∅","boundary":"字段级拆分不自动扩展到任意动态图；过强的 helper 接收者合同、未知别名和不透明调用仍可能需要保守处理。"},{"id":"R19","name":"同步建立互斥与可见性","category":"访问与并发","why":"多个线程都能看到一个活对象时，仍需规定相互读写的顺序和哪些更新可见。","definition":"通过锁、原子操作、消息传递或隔离执行，约束冲突访问，并在需要处建立跨线程的先发生关系。","how":"选择与操作匹配的协议：锁保护一组字段，原子保护规定的操作，消息传递交接数据或拥有者；不能仅给计数加原子就视为对象安全。","example":"伪代码：with mutex { counter += 1 }。所有访问 counter 的线程使用同一保护协议，读者才能依合同看到更新。","counter":"把对象放进原子引用计数容器后，两个线程直接执行非原子的 value++；对象不会提前释放，但字段仍可能竞争。","formula":"并发冲突访问 ⇒ 有兼容的同步或隔离协议","boundary":"无数据竞争不保证多步业务原子性、无死锁或公平调度；单次原子操作也不自动使整个算法正确。"},{"id":"R20","name":"保存、调用与清理分别建模","category":"接口与抽象","why":"一个闭包即使还没执行，也可能已保存借用；调用时的行为和丢弃时的行为又可能不同。","definition":"分别记录构造或保存值产生的依赖、调用值产生的效果，以及清理值需要的资源和效果。","how":"类型、捕获方式和接口摘要共同表达这三部分；推导与缓存必须区分“保存了函数”和“已经调用函数”。","example":"伪代码：cb = () =\u003e write(file, view); queue.save(cb)。save 未写文件，但从此必须保留 cb 捕获的 file 与 view。","counter":"因为 cb 从未调用就认定没有寿命依赖；或在编译期分析时把它的 I/O 当成已经执行。","formula":"保存依赖、调用效果、清理效果是三个独立集合","boundary":"并非所有语言都静态导出这些集合；缺少显式效果系统不等于没有相应运行行为，需说明由何种机制承接。"},{"id":"R21","name":"全部可恢复出口交接清理责任","category":"任务与失败","why":"函数可能正常返回、抛错或取消，资源责任不能只在最顺利的路径上得到处理。","definition":"每个可恢复出口都保持合法状态并清理或转交已构造资源；赋值等操作可先准备新值，成功后再提交。","how":"可由析构、defer、try/finally、结构化资源管理与显式错误返回完成；部分初始化只清理已经成功的部分。","example":"伪代码：f=open(); try { b=allocate(); work(f,b) } finally { close(f) }。allocate 或 work 失败也会经过文件清理。","counter":"RHS 写了日志后抛错，目标未被赋新值，于是声称日志也被自动回滚；普通赋值清理不提供这种事务。","formula":"每条可恢复出口：已构造资源的责任均被清理或转交","boundary":"进程强制终止、abort 和设备故障通常不保证普通清理；语言也未必禁止程序显式泄漏或丢弃释放机会。"},{"id":"R22","name":"外部调用依赖真实合同","category":"接口与抽象","why":"跨 C ABI、系统调用和原生扩展时，编译器通常无法从本语言代码推导对方是否保存指针或异步回调。","definition":"描述外部调用的 ABI、有效范围、拥有转交、地址保留、回调和完成行为，并由受审实现满足这些约定。","how":"用窄的不安全封装验证输入并维护所需存活；可核验部分交给工具，外部实现真实性保留为明确的信任前提。","example":"伪代码：c_async_read(buffer, callback) 保存 buffer。封装须一直拥有 buffer 和 callback 环境，直到外部确认完成。","counter":"在绑定里写“不会保存地址”，就把实际会保存地址的 C 函数包装成可安全借用临时数组。","formula":"前置合同成立 ∧ 外部实现守约 ⇒ 可依赖后置合同","boundary":"声明是边界描述，不是对外部机器码的自动证明；安全封装只在其底层可信实现正确时成立。"},{"id":"R23","name":"降低表示必须保持语义","category":"编译与成本","why":"静态证明可让运行时少做检查，但删除证明元数据与删除真实资源操作完全不同。","definition":"从源代码到低层表示再到机器码，优化后的可观察行为必须落在源语义允许范围内；证明成功才可去掉对应检查。","how":"保留实际需要的拥有者、基址、析构、任务帧和错误行为；权限或寿命标签若只服务于证明，则可不进入运行时。","example":"伪代码：编译器证明 i 始终在数组范围内后，删除循环里的重复检查；数组自身的存储与最终释放仍保留。","counter":"删除域标签时顺带删除实际维持分配存活的拥有值，或者为了提速省略可观察的析构。","formula":"低层程序的可观察行为 ∈ 源合同允许的行为","boundary":"同一语义可有不同布局和优化程度；“零成本抽象”必须限定具体操作，不能由标签被擦除推出全应用零成本。"},{"id":"R24","name":"保留预算统计完整物理资源","category":"编译与成本","why":"一个小节点可能拖住整个 Arena 页、外部缓冲与任务帧，只数节点本体会低估内存。","definition":"峰值与额外保留量覆盖同一时刻所有相关分配单位及依赖；单位数量上界和单个单位大小上界都必须有依据。","how":"记录同时活跃的区域、退役批次、内部容量、共享块和控制结构，明确是否计入分配器碎片、栈与外部资源。","example":"伪代码：保留一个 32 字节节点使 1 MiB 页暂不能释放，且节点持有 4 MiB 图片；该保留的物理成本不是 32 字节。","counter":"测得每轮最多留下 8 个节点，就声称内存常数有界，却允许每个节点的缓冲无限增长。","formula":"额外保留 ≤ 同时保留单位数 K × 单位完整上界 B + 其他开销 H","boundary":"该式只有 K、B、H 的定义和上界成立时才有意义；不自动证明及时回收、运行速度或硬实时行为。"},{"id":"R25","name":"泛型语义与机器表示分层","category":"接口与抽象","why":"泛型函数的逻辑是否成立，与为哪些具体类型生成机器码，是可以分别处理的问题。","definition":"先确定泛型约束下允许的操作及语义，再选择单态化、字典传参、类型擦除或混合表示实现调用。","how":"某些语言按约束检查泛型函数体，另一些主要在实例化时检查；代码生成还需考虑类型布局、调用方式和具体操作。","example":"伪代码：fn max\u003cT: Comparable\u003e(a:T,b:T)。约束说明可比较；最终可以生成 max_Int，也可以传入比较函数与类型信息。","counter":"两个类型都满足接口，就直接使用同一份将参数当 8 字节整数比较的机器码；满足语义接口不等于底层表示相同。","formula":"泛型是否合法 与 泛型如何生成代码 是两个决策维度","boundary":"分层是设计思路，不代表所有语言都采用“泛型体只检查一次”；Zig/C++ 等实例化规则需按各自模型说明。"},{"id":"R26","name":"按机器代码需求共享实现","category":"编译与成本","why":"泛型实例过多会增加编译工作和二进制大小，但合并不等价的实例会改变行为。","definition":"只有观察相关的布局、ABI、运算、析构、调用目标等需求兼容时，才直接共享代码；否则需要参数化或保留不同实例。","how":"可用字典或见证表传入差异，也可按表示形状共享、链接时折叠等价函数，并对热点另行特化。","example":"伪代码：统一排序骨架接收 elementSize 与 compare，可让多个类型复用；省掉 compare 参数而把所有同宽类型当整数比较则不成立。","counter":"Dog 和 Cat 都是 16 字节，因此复用同一析构或 speak 实现；大小相同并未说明字段含义和调用目标相同。","formula":"相关代码需求等价 ⇒ 可直接共享；存在差异 ⇒ 保留差异或显式传入","boundary":"共享可能引入间接调用或降低内联，特化可能增加代码量；这是编译时间、体积和运行性能之间的具体权衡。"},{"id":"R27","name":"增量按真实依赖失效","category":"编译与成本","why":"修改一个私有函数不应总使所有文件重编，但漏掉真实依赖会让旧结果错误复用。","definition":"记录编译结果依赖的输入与结果；输入变化时重新检查受影响节点，相关结果不变时可停止向消费者传播。","how":"区分源码、接口、ABI、常量求值、内联正文与生成输入等依赖，并为缓存建立可靠身份与版本。","example":"伪代码：修改 privateHelper 的局部变量名；若公开接口和消费者依赖的正文结果都没变，可复用无关模块的检查结果。","counter":"公开签名未变，就复用依赖旧 const 值或旧内联正文的消费者机器码。","formula":"消费者依赖的全部相关结果未变 ⇒ 允许复用","boundary":"缓存粒度与性能是实现事实；声明支持模块或增量构建，不等于任意私有修改都没有传播，也不保证冷构建快。"},{"id":"R28","name":"复用时重新核对消费者前提","category":"编译与成本","why":"一个接口整体变了，某个调用者未必受影响；但复用必须基于调用者实际用过的前提。","definition":"保存消费者检查或优化依赖的条件，新接口仍满足这些条件时才转移旧证据；不能只比较表面签名。","how":"记录借用来源、保留关系、效果、ABI 与优化假设等实际使用集合，分别判断语义检查和机器码是否可复用。","example":"伪代码：调用者只依赖函数不保存参数且返回整数；新增一个与它无关的可见方法，不必使这项证据失效。","counter":"被调函数开始长期保存传入视图，但名字、参数和返回类型不变，于是继续使用旧的临时借用调用证明。","formula":"新合同满足消费者曾使用的全部前提 ⇒ 可复用对应证据","boundary":"这比简单文件哈希更细，但需要实现和核验。不能据此宣称所有成熟编译器都提供等价的细粒度证据复用。"},{"id":"R29","name":"生成代码仍受检查且输入可追踪","category":"接口与抽象","why":"宏和编译期执行会产生新代码；如果它们能绕过安全检查或暗中读取输入，类型安全与可复现缓存都会受影响。","definition":"展开结果进入正常检查流程，绑定规则清晰，影响结果的输入被声明或追踪；卫生、可复现和类型检查是相关但不同的属性。","how":"采用卫生标识绑定、显式捕获/混入规则、受控编译期执行与依赖记录；传统文本宏则需要按其实际限制描述。","example":"伪代码：宏内部声明 tmp，应避免意外覆盖调用方 tmp；若生成器读取 schema.json，缓存键必须包含该文件变化。","counter":"宏生成一个不合法的可变别名却因“来自生成器”跳过检查；或读取环境变量后仍复用不包含该输入的旧结果。","formula":"生成代码 → 正常检查；生成结果 = 已追踪输入与生成规则的函数","boundary":"卫生不自动保证可复现，类型正确也不自动保证无 I/O；不同宏系统、comptime 和外部生成器需分项比较。"},{"id":"R30","name":"短回调借用环境且不逃逸","category":"接口与抽象","why":"同步执行的一次短回调，可以只借用调用方局部数据，无需为长期保存建立堆拥有对象。","definition":"接口保证回调及其借用环境不会活过允许的调用窗口；若需保存或后台执行，则改用足以覆盖未来调用的拥有合同。","how":"使用非逃逸参数、泛型闭包、栈环境加函数入口，或借用的函数对象接口；根据表示选择直接或间接调用。","example":"伪代码：count=0; each(items, x =\u003e count+=x)。若 each 返回前完成全部调用且不保存回调，count 可留在调用方栈上。","counter":"each 把回调塞进全局队列，返回后再调用；此时借用的 count 可能已经不存在。","formula":"环境有效期间 ⊇ 每一次允许的回调调用期间","boundary":"不逃逸不等于必然被内联，也不保证每种闭包都零分配；捕获值本身可能分配，异步回调需要不同分析。"},{"id":"R31","name":"复杂求解有明确资源出口","category":"编译与成本","why":"类型展开、编译期循环和复杂分析可能不断增长，工具需要在无法继续时给出可靠结果。","definition":"有限抽象分析正确收敛；可能无限扩张的实例化、递归或编译期执行设置明确预算，耗尽时报告限制而非假定证明成功。","how":"设计有限状态、单调转移、工作列表及递归/步数/内存预算；保守近似或资源错误都须维持可靠性。","example":"伪代码：生成 T\u003cT\u003cT\u003c...\u003e\u003e\u003e 超过限制时返回 ResourceLimit，并指出触发的实例化链；不能输出“类型安全”后继续生成错误机器码。","counter":"声称 worklist 有限，但处理一个条目时可无界创建新类型；当前队列有限并不能证明整个过程终止。","formula":"结果为已证结论、保守拒绝或明确资源限制；未证不得当成已证","boundary":"有界求解会拒绝部分安全程序；固定预算也不能单凭一项检查推出整个编译进程绝不会挂起或崩溃。"},{"id":"R32","name":"多步更新以一致状态提交","category":"访问与并发","why":"内存安全且没有数据竞争的程序，仍可能让观察者看到“扣款成功但入账失败”。","definition":"为跨字段或跨对象的业务不变量定义准备、提交、失败处理和通知协议，使允许观察的状态满足要求。","how":"可用锁保护事务范围、不可变快照、日志与回滚、数据库事务或先构造完整新状态再发布；方案需匹配业务语义。","example":"伪代码：prepareTransfer(a,b,n); commitBoth(); notify()。观察者收到通知时，两个账户已处于一致的新状态。","counter":"两个账户的单次余额更新都各自加锁，但在两个锁之间通知用户，仍会暴露不完整的转账结果。","formula":"准备 → 一致提交 → 对外通知；失败路径保持规定不变量","boundary":"业务事务不由借用、GC、原子引用计数或无数据竞争自动推出；外部不可回滚副作用还需要补偿或更强协议。"},{"id":"R33","name":"执行方式作为显式能力选择","category":"接口与抽象","why":"同一业务流程可能需要阻塞 I/O、事件循环或模拟执行；直接把某种调度写死会增加复用成本。","definition":"通过执行器、I/O 能力参数或其他抽象选择操作如何执行，同时保留其真实阻塞、挂起、重入与取消合同。","how":"把执行机制传给算法，或采用语言效果机制；编译器与调用者依据实际能力处理帧、借用与调度，不靠改名字消除效果。","example":"伪代码：load(io, path) 调用 io.read。BlockingIo 可以阻塞线程，AsyncIo 可以挂起任务，两条实现都需明确完成语义。","counter":"把 read 改写成 io.read 后声称不会阻塞且无需任务帧；实际实现仍可能挂起并保存所有活动局部值。","formula":"函数效果包含自身操作、所选执行能力与回调的实际效果","boundary":"调用形状能复用多少取决于语言设计；库封装不一定消除 async 标记，也不保证同步与异步具有相同机器成本。"},{"id":"R34","name":"推导结果成为真实接口合同","category":"接口与抽象","why":"减少用户注解时，消费者仍需要知道函数返回值依赖谁、会保存什么以及可能执行什么操作。","definition":"有正文时推导可公开的类型、来源或效果摘要；跨模块消费者读取该合同，缺省注解不能被解释为没有依赖或效果。","how":"在定义处分析全部相关路径，将摘要规范化并记录依赖；无正文接口在无法唯一推导时要求明确声明。","example":"伪代码：prefix(input) 返回 input 的切片。即使源码省略寿命标注，导出的合同仍必须让调用者知道结果依赖 input。","counter":"函数后来改为返回两个输入中的任意一个，消费者仍按旧的“只依赖第一个”合同使用结果。","formula":"函数正文 → 受检摘要 → 消费者使用与兼容性判断","boundary":"可推导的范围因语言而异，推导不是任意跨模块全程序分析；注解省去后，相应接口变化和编译依赖仍然存在。"},{"id":"R35","name":"错误与变体按合法分支处理","category":"值与存储","why":"同一结果可能是成功值或错误；在没有确认分支时读取成功载荷会把错误表示误当正常对象。","definition":"用可区分的结果、枚举或相应控制流描述状态，访问载荷前确认合法变体，并明确错误传播及部分构造清理。","how":"可用 Option/Result、错误联合、带类型的异常与穷尽模式匹配；穷尽检查能力需与具体错误机制分别核对。","example":"伪代码：match parse(text) { Ok(n) =\u003e use(n), Err(e) =\u003e report(e) }。只有 Ok 分支可以把载荷作为数值 n 使用。","counter":"把解析失败返回的字节按正常 T 读取，或切换枚举分支后继续使用旧分支内部字段的地址。","formula":"使用变体载荷 ⇒ 已确定当前合法变体","boundary":"列出错误类型不保证处理策略正确；异常机制、错误码和穷尽代数类型并非等价设计，未受检转换仍需单独限制。"},{"id":"R36","name":"同一语义比较构建与运行成本","category":"编译与成本","why":"开发模式可减少优化来加快反馈，但不能通过删安全检查或清理行为冒充同等能力的提速。","definition":"在相同可观察合同与任务范围下比较后端、优化预算及端到端构建；所有完成目标所需工作都计入时间。","how":"分别记录冷构建、增量、语义检查、代码生成和链接；运行比较注明检查、失败模式、分配与清理是否一致。","example":"伪代码：开发后端与优化后端都拒绝同一个非法借用，执行合法程序也保留相同析构；两者只是优化投入不同。","counter":"A 计时到生成 C 为止，B 计时到可运行程序；或者 A 关闭边界检查后与开启检查的 B 比速度。","formula":"相同任务与语义合同 → 比较不同实现和优化预算的总成本","boundary":"语言可能明确规定不同构建模式的安全行为；此时应分组比较。设计目标与实测达标必须明确分开。"},{"id":"R37","name":"操作顺序决定同源调用条件","category":"合同与编译","why":"同样的读和关闭集合，不同顺序会产生不同的同源合法性。","definition":"定义方推导前缀及逐结果的使用/失效关系；调用方代入真实来源。","how":"固定use/kill片段用U/K/D；一般状态使用有限角色和已核分区。","example":"use(a); close(b) 可以允许a=b；close(b); use(a)需要apart。","counter":"遗漏错误Drop或不返回递归前缀会放行坏访问。","formula":"先失效后使用 ⇒ 对应角色必须不相交","boundary":"不枚举所有运行轨迹，不把顺序合同当任意业务正确性证明。"},{"id":"R38","name":"描述与准确清理责任分开","category":"存活与回收","why":"复制入口不应产生第二份释放责任，保守别名集合不能代替实际清理。","definition":"数据描述、当前操作资格和真实清理载体独立表示且在管理处关联。","how":"关闭时只消费实际选中目标；退出按真实记录处理剩余责任。","example":"a与b是两个资源；关闭选中的p只履行其中一项责任。","counter":"把may-kill全部标记Done会泄漏；全部再清理会重复释放。","formula":"描述复制不增加责任；实际责任恰好转交/履行","boundary":"条件位、记录、路由和管理器是真实成本，不是全局隐形账本。"},{"id":"R39","name":"汇总位置只允许弱更新","category":"值与存储","why":"一个抽象家族可代表多个对象，单个候选项未必是单个位置。","definition":"只有唯一、精确且One的位置才能强更新；Many或多个候选保留旧事实。","how":"源图固定，写入同位置的别名事实共同更新；循环实例不按源码点合并。","example":"p属于Store.nodes，初始化p不能宣布整个Store.nodes已经初始化。","counter":"把singleton family当One会漏掉旧来源或未初始化对象。","formula":"StrongUpdate ⇒ exact ∧ One ∧ singleton","boundary":"弱更新会降低精度，不能以静态不确定代替真实执行状态。"},{"id":"R40","name":"管理路径与数据身份配对","category":"存活与回收","why":"知道结果可能来自谁，不等于知道应该更新哪份清理记录。","definition":"管理调用同时核对payload、record、authority对应同一实际资源。","how":"包移动重算当前投影；字段替换撤销旧绑定；多源返回同步选择路由。","example":"pick返回原生入口；若还承诺manage(result)，须带可执行关联。","counter":"闭包捕获旧文件却从新字段取Debt，可能关闭错误资源。","formula":"Target(payload)=Responsible(record)=Managed(authority)","boundary":"管理型接口可能有额外ABI；普通Ref布局不按消费者后续行为变化。"}],"goals":[{"id":"G01","name":"不访问已失效对象","category":"内存与访问安全","boundary":"局部名字结束不等于派生使用结束；可失效 ID 本身也不要求目标永生。","question":"函数返回一个字段视图或保存一个闭包后，原对象能否被过早释放？","operations":["创建带缓冲的对象","返回视图或保存捕获它的闭包","结束原局部作用域并尝试使用派生值"],"acceptance":"在选定安全范围内，访问要么有有效对象覆盖，要么在失效时被拒绝/安全失败，不能读已释放或已复用的对象。","kind":"safety"},{"id":"G02","name":"不重复释放","category":"内存与访问安全","boundary":"唯一拥有只是其中一条路线；GC、引用计数等可能通过不同协议达成。","question":"同一资源传给两个变量或跨函数移动后，谁负责最终释放？","operations":["创建文件或堆对象","赋值、移动或共享给另一个持有者","分别结束两个持有者"],"acceptance":"每个实际资源的清理责任有明确协议，重复消费被拒绝或被共享管理正确合并，不能对同一分配重复 free。","kind":"safety"},{"id":"G03","name":"不读取未初始化或错误变体","category":"内存与访问安全","boundary":"字节已分配或已清零不代表构成合法的任意类型；不安全构造需单列。","question":"对象只构造了一半，或结果实际为错误时，代码还能读取正常字段吗？","operations":["构造含多个必需字段的对象","让中间步骤失败或得到错误分支","尝试读取未完成字段/成功载荷"],"acceptance":"正常安全代码不能读未初始化值或不匹配的变体载荷；失败路径只清理已构造的合法部分。","kind":"safety"},{"id":"G04","name":"不越界或误对齐","category":"内存与访问安全","boundary":"拥有权不代替范围与对齐；越界可选择编译错误或安全的运行失败。","question":"下标来自用户输入，或把字节缓冲解释成较宽类型时，非法访问会怎样？","operations":["创建固定长度数组或字节缓冲","输入边界外的下标或不满足对齐的地址","执行一次读写"],"acceptance":"每条被比较的安全访问途径都证明或检查完整访问宽度与对齐；无法证明时不执行非法内存访问。","kind":"safety"},{"id":"G05","name":"内部缓冲变化不留下失效视图","category":"内存与访问安全","boundary":"保住父对象不能自动保住已替换的缓冲；复制值和借用视图要区分。","question":"已经取出列表元素的视图后，再扩容列表或更换枚举分支，会发生什么？","operations":["取得内部元素或变体字段的视图","尝试扩容、替换、移空或换变体","再次使用旧视图"],"acceptance":"系统拒绝冲突、保持旧存储或令访问安全失败；不能因为外层对象仍活着而继续使用无效内部地址。","kind":"safety"},{"id":"G06","name":"没有未同步数据竞争","category":"内存与访问安全","boundary":"保活、内存模型有定义和业务原子性都不等同于自动排除数据竞争。","question":"两个线程同时修改同一节点的普通字段时，语言或库如何约束？","operations":["把同一对象交给两个线程/任务","同时读写普通字段","选择锁、原子、消息或隔离路线"],"acceptance":"在声明的安全范围内，不相容并发访问被静态拒绝或由完整同步/隔离协议保护；不能只保证引用计数是原子的。","kind":"safety"},{"id":"G07","name":"重入不破坏活动访问","category":"内存与访问安全","boundary":"同步回调也可能重入；安全拒绝、动态失败与成功支持重入是不同结果。","question":"遍历或借用节点期间调用用户回调，而回调再次修改同一容器，能否出错？","operations":["开始读取或独占访问一个字段","调用可能再次进入容器的回调","在回调中删除、替换或修改相关对象"],"acceptance":"活动访问的有效性与权限仍成立，或冲突被明确拒绝/安全阻止；不能因代码没有 await 就假定不会重入。","kind":"safety"},{"id":"G08","name":"FFI 不突破安全封装边界","category":"内存与访问安全","boundary":"结论依赖外部实现遵守真实合同，声明文本不能自动证明 C/系统库正确。","question":"外部函数保存了指针并稍后回调，怎样保证传入缓冲和闭包环境一直有效？","operations":["把本语言缓冲和回调传给外部 API","让外部 API 在调用返回后继续使用","确认完成后清理环境"],"acceptance":"安全封装明确并维持 ABI、范围、拥有、保存、回调与完成合同；必要信任边界可被定位和审计。","kind":"safety"},{"id":"G09","name":"图内允许共享和成环","category":"图与资源管理","boundary":"能保存环与能回收环是两项目标；可用库路线不等于语言原生默认。","question":"两条父路径共用一个子节点，再让节点反向连回祖先，能否直接表达？","operations":["创建 A、B、C 三个节点","让 A、B 都指向 C","令 C 连回 A 并遍历/修改图"],"acceptance":"可在所选安全路线内保存共享身份与循环边，不需把同一对象复制成多个逻辑值；具体回收和访问协议另列。","kind":"expressiveness"},{"id":"G10","name":"移出集合后短期使用旧对象","category":"图与资源管理","boundary":"移出成员资格不等于立即析构；明确要求立刻关闭的资源不能擅自延后。","question":"列表正在显示一个节点时，业务将它删除，当前渲染还能读完旧节点吗？","operations":["取得当前节点的受保护访问","从活成员集合中移除节点","完成现有访问并释放最后保留"],"acceptance":"删除后新查询不再得到该成员，现有合法访问仍看到完整有效对象；最后使用结束后进入对应回收流程。","kind":"expressiveness"},{"id":"G11","name":"独立删除的节点最终回收","category":"图与资源管理","boundary":"必须说明残留入口和共享分配块；不要求任意图的断边工作天然为 O(1)。","question":"图长期运行时反复删除单个节点，怎样避免已无需要的节点一直积累？","operations":["构造有入边的共享节点","删除该节点并处理剩余入口","让所有读者和退役持有者结束"],"acceptance":"在路线列明的前提下，节点及其独占资源最终可回收，或明确指出为何仍被块/根/读者保留。","kind":"resource"},{"id":"G12","name":"对象死后仍可保存外部身份","category":"图与资源管理","boundary":"身份解析需要活管理入口；ID 不能默认为仍指向活对象，也不能静默命中新实例。","question":"编辑器保存的选中项 ID 对应节点已删除，后来还需要用这个 ID 查询，该返回什么？","operations":["保存对象 ID 或弱句柄","删除目标并可能复用槽","使用旧身份重新查询"],"acceptance":"查询返回匹配的活实例或明确失败；旧身份不会误认新对象，成功解析后的实际使用也受保护。","kind":"expressiveness"},{"id":"G13","name":"从函数返回完整循环图","category":"图与资源管理","boundary":"返回根入口还不够，所有真实存储与外部依赖都必须获得足够长的有效期。","question":"函数内部构造一个双向循环链表，怎样把整张图返回给调用方？","operations":["在函数中分配多个节点","连接成环并选择一个根","返回后在调用方遍历，再结束拥有者"],"acceptance":"返回值具有覆盖整图的拥有或保活安排；内部连接保持正确，最终清理责任明确，不能留下指向局部已结束存储的边。","kind":"expressiveness"},{"id":"G14","name":"额外保留内存有可说明的上界","category":"图与资源管理","boundary":"上界要包含页、内部缓冲、任务帧和同时激活数量；不能只给节点数量。","question":"为了简化图寿命而延迟回收后，最坏会额外占用多少内存？","operations":["定义最大并发区域/退役批次数","约束各完整分配单位的最大容量","在最坏合法保留组合下计算或测量峰值"],"acceptance":"给出带明确前提、计费范围和单位的额外保留界；容量无上界时明确说明该路线没有这一保证。","kind":"resource"},{"id":"G15","name":"清理和失败顺序明确","category":"图与资源管理","boundary":"不保证进程被强制终止时普通析构完成，也不自动禁止有意泄漏或永久等待。","question":"连续打开文件、分配缓冲、启动任务，中途失败时哪些对象先清理？","operations":["按依赖顺序构造多个资源","在每个可恢复失败点退出","观察关闭、析构与错误传播顺序"],"acceptance":"正常与可恢复失败出口都清理或转交已完成资源；被依赖者不会先于仍使用它的清理动作失效。","kind":"resource"},{"id":"G16","name":"每轮闭合工作不累计历史","category":"图与资源管理","boundary":"结论限于本轮所有需求确实结束；跨轮保存旧对象、未结束任务和永久根不在此前提内。","question":"每一帧或每个请求临时构造一张图，反复运行后内存会随轮数增长吗？","operations":["每轮建立临时区域和循环图","完成所有读取、回调和子任务","结束本轮后重复相同有界工作"],"acceptance":"相同有界负载下，已完成轮次不会形成无界累计保留；报告稳定峰值、回收时机及分配器缓存范围。","kind":"resource"},{"id":"G17","name":"拓扑演进尽量不改拥有边类型","category":"表达与重构","boundary":"仅比较未改变对外存活、失效、线程和身份合同的拓扑变化；独立删除可能引入真实新合同。","question":"数据结构从树改为双向链表，再加共享节点和环，业务字段与调用要改多少？","operations":["用一种连接表示实现树","增加反向边与共享子节点","增加环并复查业务操作"],"acceptance":"记录实际需要修改的字段类型、API、容器和调用处；在同一合同范围内可以沿用连接与访问方式，变化成本可见。","kind":"ergonomics"},{"id":"G18","name":"两个别名可顺序修改同一节点","category":"表达与重构","boundary":"不要求允许两个长期相交的独占地址借用；顺序使用与同时借用要分开评估。","question":"a 和 b 可能指向同一节点，先 a.value++ 再 b.value++ 能自然表达吗？","operations":["创建可能相等的两个连接","通过 a 完成一次修改","结束该访问后通过 b 再修改"],"acceptance":"在不依赖 a、b 必定不同的前提下，两次顺序访问合法并得到正确结果；需要的短借用或运行协议被明确列出。","kind":"ergonomics"},{"id":"G19","name":"抽成 helper 不占用无关字段","category":"表达与重构","boundary":"未知别名和不透明方法可能仍需保守处理；局部字段拆分不自动等于跨函数精确效果。","question":"同一个对象的 left、right 可以分别修改，抽成方法后为何开始冲突？","operations":["直接分别访问两个不交字段","把其中一个操作抽成 helper","保留另一字段的活动访问并调用 helper"],"acceptance":"helper 的合同能够表达或推导实际字段范围，或通过明确的小范围参数维持可组合性；额外改动和限制均可见。","kind":"ergonomics"},{"id":"G20","name":"独立值没有意外共享修改","category":"表达与重构","boundary":"容器值独立不保证其中的身份对象也深复制；必须说明比较的是哪层值。","question":"把配置或数组赋给新变量后修改它，原变量是否应保持原值？","operations":["创建包含集合的值 a","获得承诺独立的值 b","修改 b 的元素并观察 a"],"acceptance":"在声明的独立值范围内，b 的修改不改变 a 的可观察值；如果成员仍共享对象，明确展示该例外而不是隐含深复制。","kind":"expressiveness"},{"id":"G21","name":"返回视图而不复制内容","category":"表达与重构","boundary":"需要覆盖底层存储的真实有效性；同一父对象存活不足以允许其缓冲任意替换。","question":"解析函数只想返回输入的一段字符串或数组视图，怎样避免复制又不悬空？","operations":["接收调用方输入","选择并返回一个子区间视图","调用方使用视图并尝试改变原存储"],"acceptance":"返回值共享原内容存储且不产生内容复制；系统表达并维护来源关系，冲突失效被限制或受控。","kind":"expressiveness"},{"id":"G22","name":"懒迭代组合少重复写合同","category":"表达与重构","boundary":"省略注解不等于免除捕获、返回来源、跨挂起与模块接口的真实关系。","question":"把 filter、map、take 串起来，再返回惰性迭代器，需要逐层手写哪些寿命和效果？","operations":["从借用集合建立惰性迭代器","叠加带捕获回调的多个适配器","返回并在稍后消费迭代器"],"acceptance":"实际示例可组合且保留所需依赖；列出必须手写的注解/类型与能推导的部分，不以未经验证的简写作为已实现结论。","kind":"ergonomics"},{"id":"G23","name":"同步短回调无需强制堆装箱","category":"运行与成本","boundary":"避免强制装箱不代表捕获值自身不分配，也不保证一定内联或没有间接调用。","question":"给排序或遍历传一个只在本次调用中使用的小闭包，能直接借用栈变量吗？","operations":["定义捕获局部变量的短回调","传给同步、不保存回调的函数","完成调用并检查环境表示"],"acceptance":"存在可用的无强制堆环境路线，且借用寿命正确；以实际表示或分配测量确认，动态调用成本另列。","kind":"performance"},{"id":"G24","name":"布局变化后保留逻辑字段接口","category":"表达与重构","boundary":"不承诺 ABI、地址或旧二进制不变；若外部公开了表示，兼容范围会缩小。","question":"节点从内嵌字段改为间接缓冲或其他布局，调用方的逻辑字段访问能保留多少？","operations":["用公开逻辑字段/访问器操作对象","替换其内部存储布局","重新编译调用方并检查行为"],"acceptance":"在公开抽象合同允许范围内复用访问逻辑，明确哪些源码、ABI 或地址使用必须调整；不能把布局变化隐藏成零成本保证。","kind":"ergonomics"},{"id":"G25","name":"同步与挂起执行复用业务形状","category":"任务与一致性","boundary":"复用程度要给出实际语法；真实阻塞、挂起、重入、帧与取消行为仍然存在。","question":"同一段读取和处理逻辑，怎样同时用于阻塞工具与事件循环应用？","operations":["写一次依赖读取能力的业务算法","提供阻塞执行实现","提供挂起执行实现并比较调用代码"],"acceptance":"明确展示可共享的正文与必须变化的签名/调用处；不同执行方式的真实效果、资源和完成合同都被保留。","kind":"ergonomics"},{"id":"G26","name":"借用在挂起后仍有效","category":"任务与一致性","boundary":"存活、稳定地址、访问权限和任务完成关系都要满足；不能只保留任务对象。","question":"异步函数持有一个切片并 await，恢复后继续读取，原对象能在期间被改坏吗？","operations":["取得输入视图或内部地址","挂起并允许调度其他任务","恢复后使用视图"],"acceptance":"帧和拥有者覆盖挂起期间，所需地址不失效，冲突访问被限制；取消或丢弃任务时也遵守实际外部访问结束合同。","kind":"safety"},{"id":"G27","name":"共享读取的结构化并行","category":"任务与一致性","boundary":"不是某一种语言独有；只读共享还依赖对象的线程安全与内部可变性合同。","question":"几个子任务同时分析同一份大数据，能共享读取并在父方退出前全部结束吗？","operations":["创建只读输入","启动多个借用输入的任务","汇总结果并结束任务范围"],"acceptance":"子任务不复制整份输入且遵守共享读协议；所有相关任务完成后才允许父输入失效，错误路径也收口。","kind":"expressiveness"},{"id":"G28","name":"不交分区可并行写","category":"任务与一致性","boundary":"没有全图锁不等于绝对无同步；不同图根也不证明实际写入足迹不相交。","question":"两个任务分别修改数组两半或已证明独立的图分区，是否仍必须锁整个图？","operations":["建立可证明或可验证的不交分区","启动各自的写任务","等待任务完成并合并观察"],"acceptance":"写入范围真实不交时存在无需全局互斥的安全路线；分区证明/检查、局部锁和调度成本明确计入。","kind":"performance"},{"id":"G29","name":"取消不会提前释放仍在使用的资源","category":"任务与一致性","boundary":"发出取消与对方停止访问是不同事件；有同步取消保证的接口须明确其合同。","question":"请求取消异步 I/O 后，可以立即销毁传给设备的缓冲吗？","operations":["向外部提交带缓冲的异步任务","在执行中发出取消","等待合同规定的完成确认并清理"],"acceptance":"所有可能仍访问资源的任务或设备结束后才回收；中间状态不会把尚在使用的缓冲暴露为已可释放。","kind":"safety"},{"id":"G30","name":"取消在明确时间上界内结束","category":"任务与一致性","boundary":"仅内存安全或结构化 join 推不出时间界；调度、阻塞调用和设备协议都需有界。","question":"用户点击停止后，能否保证任务在固定期限内真正结束，而不只是收到取消标志？","operations":["定义取消截止时间及负载上界","覆盖循环、回调、阻塞与设备路径","测量并论证最坏完成时间"],"acceptance":"在明确执行环境和最坏前提下给出完整时间界；任一不可控路径缺少上界时应标为条件不满足或无保证。","kind":"performance"},{"id":"G31","name":"多步更新保持业务原子性","category":"任务与一致性","boundary":"无 UAF、无数据竞争和单次原子字段写入都不自动保证跨对象事务。","question":"转账、移动树节点或更新多个索引时，观察者会不会看到一半完成的状态？","operations":["准备涉及多个对象的更新","注入中途失败或并发观察","提交并发送通知"],"acceptance":"所有对外允许观察的状态满足指定业务不变量；失败、回滚/补偿与通知顺序有明确协议。","kind":"expressiveness"},{"id":"G32","name":"热访问无需逐次保活记账","category":"运行与成本","boundary":"只讨论选定的静态热路径；分配、查找、弱身份解析、断边和调度仍有真实成本。","question":"遍历稳定图的每个字段时，能否不反复增加引用计数、查世代或登记租约？","operations":["建立寿命已受保护的稳定数据范围","运行大量字段读取/更新","检查该路径的生成代码或计数开销"],"acceptance":"存在在此前提下不做逐次保活记账的路径；保留必要边界、权限或算法操作，不能由一条 load 推断全应用比例。","kind":"performance"},{"id":"G33","name":"热点采用直接调用与静态派发","category":"运行与成本","boundary":"存在静态派发路线不等于所有接口都静态；特化会产生代码量和构建成本。","question":"泛型或接口调用在热循环里使用已知具体类型时，能否直接调用并内联？","operations":["定义通用算法及两个具体实现","让热路径在编译期知道具体类型","查看调用目标和优化结果"],"acceptance":"存在可确认的直接派发路线，或编译器确实消除了该调用的间接性；动态类型未知时的行为和成本另列。","kind":"performance"},{"id":"G34","name":"等价机器工作可共享代码","category":"编译与工具","boundary":"相同尺寸或满足同一接口都不够；如果共享需要传字典，其调用开销需同时展示。","question":"几十种类型使用同一泛型骨架，哪些实例真的需要分别生成，哪些能够复用？","operations":["实例化多种布局和操作组合","识别机器需求等价的实例","检查生成函数、体积与调用方式"],"acceptance":"具有依据的等价实例被复用，或差异通过显式参数表达；报告共享范围和性能权衡，不把尚未实现的设计算已实现。","kind":"performance"},{"id":"G35","name":"局部修改不重查无关部分","category":"编译与工具","boundary":"常量求值、内联、ABI 和推导合同都是可能的真实依赖，不能以“私有”一概排除。","question":"只改一个私有 helper 的正文后，为什么无关模块也重新检查？","operations":["完成一次基准构建","修改局部且不影响相关接口结果的实现","记录失效、重查与代码生成范围"],"acceptance":"缓存按真实依赖复用未受影响结果；使用构建日志或受控实验展示实际粒度，不以模块化语法代替证据。","kind":"performance"},{"id":"G36","name":"完整构建反馈更快","category":"编译与工具","boundary":"必须在同语义、同任务和清楚的冷/热条件下比较；设计目标不能记为实测达标。","question":"改完代码到获得可运行程序，需要等待多久，时间主要花在哪里？","operations":["准备同规模与同语义工作负载","分别计时冷构建和典型增量","包含检查、生成、链接和必要构建步骤"],"acceptance":"给出可复现的端到端时间、环境、模式及分阶段数据；若只完成部分编译步骤，明确不能与完整构建相等比较。","kind":"performance"},{"id":"G37","name":"复杂类型与分析可明确停止","category":"编译与工具","boundary":"有资源限制不意味着接受所有安全程序，也不等于对整个编译器做了终止证明。","question":"递归泛型或编译期计算意外无限增长时，编译器会怎样结束并解释问题？","operations":["提交递归实例化或超长编译期计算","触发配置或规范中的资源限额","观察错误与已发布产物"],"acceptance":"在声明覆盖范围内给出资源限制或可靠拒绝，不将超时结果当作已证成功；限制来源和触发链可定位。","kind":"resource"},{"id":"G38","name":"宏和编译期代码可复现且受检查","category":"编译与工具","boundary":"卫生、依赖追踪、沙盒与类型检查是不同属性，不能因其中一项成立就全标支持。","question":"生成器读取配置并生成代码，配置改变后会正确重算，生成的非法代码会被拒绝吗？","operations":["生成引用调用方变量的代码","改变输入文件或环境依赖","让生成结果包含类型或权限错误"],"acceptance":"分别核对绑定规则、输入追踪和正常检查；明确有哪些属性由语言、构建系统或使用纪律提供。","kind":"ergonomics"},{"id":"G39","name":"接口重构的兼容影响可判断","category":"编译与工具","boundary":"兼容性范围需声明为源码、ABI、行为或证明合同；签名字面不变不代表语义未变。","question":"参数和返回类型没有变，但函数开始保存输入或可能挂起，调用方是否仍兼容？","operations":["记录消费者实际依赖的接口性质","修改函数来源、保留或效果合同","重新判断消费者合法性与缓存有效性"],"acceptance":"受影响消费者被识别并重新检查，不受影响者在已支持范围内可复用；隐式推导变化也进入接口判断。","kind":"ergonomics"},{"id":"G40","name":"规则与证明失败可解释可核验","category":"编译与工具","boundary":"图示、状态标签和测试通过都不能替代形式证明；诊断能力与独立核验需分别说明。","question":"编译器拒绝了一段图操作，能指出哪条来源、失效或访问冲突导致失败吗？","operations":["运行包含具体冲突的短程序","查看参与的对象、操作与合同链","核对诊断或独立检查结果与真实代码"],"acceptance":"能将结论追溯到具体输入、规则和责任边界；若有独立核验，明确其检查对象、覆盖范围和信任前提。","kind":"ergonomics"},{"id":"G41","name":"完整应用运行性能可比较","category":"运行与成本","boundary":"单操作成本和局部 microbenchmark 不能推出全应用达到 Rust 的某个百分比。","question":"同样的编辑器或图服务工作量，语言方案在吞吐、尾延迟和内存上究竟差多少？","operations":["定义等价功能、数据量与失败行为","测量完整应用吞吐/延迟/峰值内存","纳入分配、清理、任务和编译配置"],"acceptance":"提供可复现多指标结果及语义对齐证据；没有完整实测时只记录结构性成本分析和待验目标。","kind":"performance"},{"id":"G42","name":"无需要的资源最终回收","category":"图与资源管理","boundary":"安全可以允许泄漏；强环、永久根、长期活任务与无界等待都需要额外前提。","question":"程序虽然不悬空也不崩溃，为什么已无业务用途的对象或文件仍可能一直占用？","operations":["构造强环、缓存根或被任务持有的资源","结束所有声明需要的业务使用","解除路线要求的根/边并等待规定的回收条件"],"acceptance":"逐项说明最终回收所需前提与触发机制，并检查满足前提后资源确实可结束；不能把内存安全直接标成无泄漏保证。","kind":"resource"}],"languages":[{"id":"zil","name":"ZIL","color":"#6d5efc","summary":"共享描述、有限操作合同与准确清理；显式存储策略；#编译入口和分阶段属性。","scope":"当前 _zil_design.md；不默认通用世代/租约，不采用自动归属提升与自动退役规划。","maturity":"规范路线；实现、证明和产品验收分开。","sources":["SRC-ZIL-CURRENT"]},{"id":"rust","name":"Rust","color":"#b76037","summary":"拥有与借用静态检查；图可选集中 owner + 索引键、Rc/Arc 或受审计容器，机制按路线组合。","scope":"安全 Rust + 标准库；slotmap、Tokio 明确标为生态库，unsafe/FFI 单列可信边界。","maturity":"成熟语言与生态；具体现成路线不等于所有程序被接受或没有泄漏。","sources":["SRC-RUST-OWN","SRC-RUST-BORROW","SRC-RUST-SLOTMAP"]},{"id":"zig","name":"Zig","color":"#d08b19","summary":"显式 allocator 与手工生命周期；comptime 泛型、错误联合和 defer；std.Io 统一执行接口。","scope":"固定 "],"steps":["核对传入指针可合法保留","固定或复制所需数据","C 完成后解固定/释放"]},{"goal":"G09","language":"go","status":"available","mechanism":"普通指针图 + GC","summary":"struct 指针直接支持共享和环，无根环可由追踪回收处理。","rules":["R01","R16"],"premises":["普通托管数据","并发修改另有同步","遵守 Go 内存模型，无未同步数据竞争；多字表示的竞争不在本安全保证内"],"cost":"指针扫描、屏障和回收工作","limit":"strong 根/全局 map 持有时不会因“业务删除”自动消失。","sources":["SRC-GO-SPEC","SRC-GO-GC","SRC-GO-MEM"],"steps":["创建节点指针","连接共享与回边","用根保持所需图可达"]},{"goal":"G10","language":"go","status":"available","mechanism":"删除 map 成员后旧指针保活","summary":"调用者保存的指针让被移出成员表的对象继续存在，旧使用不依赖 map 成员资格。","rules":["R09","R16"],"premises":["删除仅撤成员资格","内部资源仍有效","遵守 Go 内存模型，无未同步数据竞争；多字表示的竞争不在本安全保证内"],"cost":"保留对象及可达依赖","limit":"不能删除成员后立即 Close 文件再声称旧对象完整可用。","sources":["SRC-GO-SPEC","SRC-GO-GC","SRC-GO-MEM"],"steps":["取得节点指针","delete 成员项","旧指针用完后允许收集"]},{"goal":"G11","language":"go","status":"conditional","mechanism":"清强入口 + GC 进展","summary":"节点不再由根、图边、goroutine 或闭包到达后可以回收。","rules":["R10","R16"],"premises":["所有强入口已解除","收集器正常推进","遵守 Go 内存模型，无未同步数据竞争；多字表示的竞争不在本安全保证内"],"cost":"扫描及回收延迟","limit":"delete 一个 map 项不能保证其他入边消失；不承诺即时返还 OS 内存。","sources":["SRC-GO-GC","SRC-GO-MEM"],"steps":["删除根与入边","结束旧使用","由 GC 回收不可达存储"]},{"goal":"G12","language":"go","status":"available","mechanism":"不复用业务 ID + map 准入","summary":"把长期身份设计为独立 ID，活 map 查找成功才取得对应指针。","rules":["R08","R14","R19"],"premises":["ID 不混淆实例","并发 map 操作同步"],"cost":"ID、查表与锁","limit":"普通指针是强引用，不是会失效的弱身份；业务 ID 需明确复用策略。","sources":["SRC-GO-SPEC","SRC-GO-MEM"],"steps":["分配唯一实例 ID","持锁查询当前成员","缺失返回 ok=false"]},{"goal":"G13","language":"go","status":"available","mechanism":"返回根指针 + GC 可达图","summary":"返回根指针会保持内部完整图可达，局部创建作用域结束不释放仍用节点。","rules":["R16"],"premises":["图节点均托管","外部资源有清理入口","遵守 Go 内存模型，无未同步数据竞争；多字表示的竞争不在本安全保证内"],"cost":"堆分配、扫描和回收","limit":"返回地址不意味着相关资源永远业务有效。","sources":["SRC-GO-SPEC","SRC-GO-GC","SRC-GO-MEM"],"steps":["创建相互引用节点","返回根指针","运行时保留仍可达节点"]},{"goal":"G14","language":"go","status":"conditional","mechanism":"有界缓存/队列 + GC 内存目标","summary":"容量限制可约束活数据；GC 配置帮助控制运行时内存目标。"
