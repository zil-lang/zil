成直接目标，可内联；虚函数采用另一条分发路线。","rules":["R23","R25"],"premises":["选择静态目标或已完成去虚拟化"],"cost":"实例化、后端与代码体积","limit":"不同模板实例未必自动共享所有代码。","sources":["SRC-CPP-TEMPLATE"],"steps":["解析模板实参","实例化具体实现","直接调用或内联"]},{"goal":"G34","language":"cpp","status":"conditional","mechanism":"类型擦除共享体 + 特化外壳","summary":"把可共享操作写为统一 ABI/回调核心，可跨类型共用一份正文；模板保留表示差异。","rules":["R23","R25","R26"],"premises":["完整语义可由参数/回调表达"],"cost":"间接调用与优化损失","limit":"同类型 COMDAT 去重不等于不同类型从未重复实例化；自动 ICF 也有观察边界。","sources":["SRC-CPP-TEMPLATE","SRC-CPP-GUIDE"],"steps":["识别公共机器工作","用显式参数表示差异","为必要热点保留静态特化"]},{"goal":"G35","language":"cpp","status":"available","mechanism":"分离编译 + modules/构建依赖","summary":"私有实现留在独立编译单元或模块边界，未改接口的无关单元可复用。","rules":["R23","R27"],"premises":["真实头文件/BMI/生成依赖完整"],"cost":"依赖扫描、模块产物和链接","limit":"头文件内模板/内联体会扩大重编译范围；modules 不自动消除全部依赖。","sources":["SRC-CLANG-MODULE","SRC-CPP-TEMPLATE"],"steps":["隔离公开声明与私有正文","追踪模块依赖","只重编受影响单元"]},{"goal":"G36","language":"cpp","status":"empirical","mechanism":"完整 C++ 构建基准","summary":"头文件解析、模板实例化、优化与链接须一并测量，PCH/modules 配置明确。","rules":["R26","R27","R36"],"premises":["同产物、优化与缓存条件"],"cost":"所有编译与链接成本","limit":"不凭传统印象直接给当前项目构建速度排名。","sources":["SRC-CLANG-MODULE","SRC-CPP-TEMPLATE"],"steps":["固定工具链与配置","测冷构建/局部重建","报告端到端时间"]},{"goal":"G37","language":"cpp","status":"available","mechanism":"编译器模板/constexpr 限额","summary":"Clang 等实现提供模板深度、constexpr 步数等限制，超限给明确诊断。","rules":["R25","R31"],"premises":["使用对应实现支持的限额"],"cost":"可能拒绝正确但复杂的元程序","limit":"不覆盖任意 build 脚本或所有优化阶段的硬时限。","sources":["SRC-CLANG-LIMIT","SRC-CPP-CONST"],"steps":["设定实现资源限额","执行实例化/常量求值","超限报告失败"]},{"goal":"G38","language":"cpp","status":"conditional","mechanism":"constexpr 受检 + 外部生成输入管理","summary":"常量求值服从语言规则；宏/外部代码生成须另外控制卫生与文件环境输入。","rules":["R23","R29","R31"],"premises":["生成输入被构建系统追踪","产物重新编译"],"cost":"预处理、常量执行和编译","limit":"C 预处理宏不卫生，__DATE__/外部脚本等可破坏可复现性。","sources":["SRC-CPP-CONST","SRC-CPP-GUIDE"],"steps":["固定生成与常量输入","完成展开/求值","编译检查最终程序"]},{"goal":"G39","language":"cpp","status":"conditional","mechanism":"声明/concept 检查 + ABI 审查","summary":"编译器核类型与约束，模块和库工具可识别接口影响，ABI/行为需专门审查。","rules":["R25","R27","R34"],"premises":["消费者与 ABI 边界已知"],"cost":"重编、ABI 比对和回归测试","limit":"公开签名相同可能仍改变布局、内联行为或异常保证。","sources":["SRC-CLANG-MODULE","SRC-CPP-GUIDE"],"steps":["比较声明与布局","重编相关消费者","验证二进制和行为兼容"]},{"goal":"G40","language":"cpp","status":"conditional","mechanism":"编译诊断 + 静态分析/动态检测","summary":"模板诊断、生命周期规则和运行检查能定位部分失败义务。","rules":["R02","R04","R23"],"premises":["工具覆盖所用语义","测试触发代表路径"],"cost":"分析、插桩与运行成本","limit":"Core Guidelines 是指导规范；未发现错误不构成全程序安全证明。","sources":["SRC-CPP-GUIDE","SRC-CLANG-LIMIT"],"steps":["追踪模板/类型错误","检查生命周期和范围","区分规范建议与工具已核部分"]},{"goal":"G41","language":"cpp","status":"empirical","mechanism":"语义对齐后的完整应用测量","summary":"比较性能必须同样计入回收、异常、锁、图表示与分配，不能靠 UB 换速度。","rules":["R23","R24","R26","R36"],"premises":["相同身份、失败和清理合同"],"cost":"所有直接及抽象层成本","limit":"无基准结果，不给 Rust/C++ 固定比例或臆造总分。","sources":["SRC-CPP-GUIDE","SRC-CPP-TEMPLATE"],"steps":["对齐实现语义","测真实应用负载","报告时间、内存及尾延迟"]},{"goal":"G42","language":"cpp","status":"conditional","mechanism":"shared_ptr 最后释放与任务收口","summary":"所有使用者结束且没有残余强环时，最后 shared_ptr 释放执行资源析构。","rules":["R10","R11","R15","R21"],"premises":["所有共享持有采用同一控制块","没有永久根或未处理强环","依赖的线程/设备使用已结束"],"cost":"析构、join 与 allocator 工作","limit":"语言容许泄漏、死锁和永久根；内存安全路线不等于必然结束。","sources":["SRC-CPP-GUIDE","SRC-CPP-SHARED","SRC-CPP-JOIN"],"steps":["关闭持久拥有入口","结束线程和旧使用","析构最终拥有者"]}],"examples":[{"id":"E01","name":"同样是赋值，转移的东西不同","goals":["G02","G20"],"intent":"先建立 a，再赋值给 b，最后修改 b；观察 a 是否还能使用、是否跟着变化。","code":{"rust":"let a = vec![1, 2];\nlet mut b = a; // 移动 Vec 的拥有责任\nb[0] = 9;\n// 此后不能再使用 a。\n// 若要保留 a，应将赋值改为 let mut b = a.clone();","zil":"let a = Buffer::\u003ci32\u003e.new(alloc)?\nlet b = a // Describe：同一资源入口，不复制头和责任\nb.push(9)?\n// 普通拥有包的按值传递仍移动责任；\n// 独立内容复制必须显式clone。","ts":"const a = { n: 1 };\nconst b = a;\nb.n = 9;\nconsole.log(a.n); // 9，同一个对象","go":"a := []int{1, 2}\nb := a // 复制切片描述符，共享底层数组\nb[0] = 9\nfmt.Println(a[0]) // 9","swift":"var a = [1, 2]\nvar b = a // Array 具有值语义\nb[0] = 9\nprint(a[0]) // 1","cpp":"std::vector\u003cint\u003e a{1, 2};\nauto b = a; // 复制 vector 内容\nb[0] = 9;\n// a[0] 仍为 1；std::move(a) 选择移动路线","zig":"// []T 赋值复制指针和长度，不转移独立释放权。\nconst b = a;\nb[0] = 9;\n// 若 a 与 b 指向同一底层数组，a[0] 也变为 9。","hylo":"// 机制示意：显式复制后得到独立可变值\nvar a = (left: 1, right: 2)\nvar b = a.copy()\n\u0026b.left = 9\n// a.left 仍为 1。普通赋值可能消费来源；\n// 这里是显式 copy，不表示所有赋值自动复制。"},"note":"ZIL为规范示例，未在生产编译器执行；各语言展示机制差异，不作为同语义性能或行数基准。"},{"id":"E02","name":"共享与成环：边不必等于拥有关系","goals":["G09","G13","G17"],"intent":"建立 a → b → a，并让 root2 也指向 b；节点的业务连接与最终清理策略分别讨论。","code":{"ts":"type Item = { next: Item | null };\nconst a: Item = { next: null };\nconst b: Item = { next: a };\na.next = b;\nconst root2 = b;\n// 普通对象可形成共享环；脱离全部强根后具备回收条件。","rust":"struct Node { next: Option\u003cusize\u003e }\nlet nodes = vec![\n    Node { next: Some(1) },\n    Node { next: Some(0) },\n];\nlet root2 = 1; // 同一 Vec 拥有两个节点\n// 非拥有索引描述边；独立删除另需身份策略","zil":"let graph = StableStore::\u003cNode\u003e.new(alloc)?\nlet a = graph.insert(Node { next: None })?\nlet b = graph.insert(Node { next: Some(a) })?\na.next = Some(b)\nlet root2 = b // 复制描述，不复制清理责任","go":"type Node struct { Next *Node }\na := \u0026Node{}\nb := \u0026Node{Next: a}\na.Next = b\nroot2 := b\n_ = root2","swift":"// class 引用可以成环，但 ARC 不自动回收强环。\nfinal class Node { var next: Node? }\nlet a = Node(), b = Node()\na.next = b; b.next = a\n// 须按语义设计 weak 边，或改为容器拥有+索引。","cpp":"// 代表性路线：vector 统一拥有，整数只描述连接。\nstruct Node { std::size_t next; };\nstd::vector\u003cNode\u003e nodes{{1}, {0}};\nauto root2 = std::size_t{1};\n// 指针/下标有效性和删除重排仍需设计。","zig":"// 代表性路线：ArenaAllocator 拥有节点存储。\n// a.next = b; b.next = a;\n// 最后 arena.deinit() 整体释放。\n// 程序员仍需保证 deinit 后不使用 a / b。","hylo":"// 可用“值容器 + 索引”描述拓扑。\n// 这不自动等于共享可变身份对象。\n// 本版未核实可直接复用的完整动态图容器，\n// 不提供伪造的 Hylo 图 API。"},"note":"ZIL为规范示例，未在生产编译器执行；各语言展示机制差异，不作为同语义性能或行数基准。"},{"id":"E03","name":"两个参数指向同一对象，按顺序修改","goals":["G07","G18"],"intent":"调用 bump(n, n)，要求两次递增按顺序发生；不要求同时保留两份相交的独占地址借用。","code":{"rust":"use std::cell::Cell;\nfn bump(a: \u0026Cell\u003ci64\u003e, b: \u0026Cell\u003ci64\u003e) {\n    a.set(a.get() + 1);\n    b.set(b.get() + 1);\n}\nbump(\u0026n, \u0026n);","zil":"fn bump(a: Ref\u003cNode\u003e, b: Ref\u003cNode\u003e) {\n    a.value += 1\n    b.value += 1\n}\nbump(n, n) // 同上下文短操作；无冲突持续窗口","ts":"function bump(a, b) {\n  a.value += 1;\n  b.value += 1;\n}\nbump(n, n);","go":"func bump(a, b *Node) {\n    a.Value++\n    b.Value++\n}\nbump(n, n) // 本例没有并发 goroutine","swift":"// Node 为 class；按顺序访问同一实例。\nfunc bump(_ a: Node, _ b: Node) {\n    a.value += 1\n    b.value += 1\n}\nbump(n, n)","cpp":"void bump(Node\u0026 a, Node\u0026 b) {\n    ++a.value;\n    ++b.value;\n}\nbump(n, n); // 顺序执行，不涉及并发","zig":"fn bump(a: *Node, b: *Node) void {\n    a.value += 1;\n    b.value += 1;\n}\nbump(n, n);","hylo":"// 同一值不能同时占据两个相交的 inout 参数位置。\n// bump2(\u0026n, \u0026n) 不满足该独占访问要求。\n// 以下改写 API：每次调用结束后才开始下一次访问。\nfun bump(_ x: inout Int) { \u0026x += 1 }\nbump(\u0026n)\nbump(\u0026n)\n// 这实现两次递增，不是原始双参数调用原样通过。"},"note":"ZIL为规范示例，未在生产编译器执行；各语言展示机制差异，不作为同语义性能或行数基准。"},{"id":"E04","name":"从容器删除之后，旧对象能否继续使用","goals":["G10","G11","G12"],"intent":"先取得对象，再从业务容器移除它，最后读取先前取得的对象。必须明确删除的是成员关系、对象寿命还是全部物理存储。","code":{"ts":"const p = graph.get(id);\nif (p === undefined) throw new Error(\"missing item\");\ngraph.delete(id);\nconsume(p);\n// 假设 Map 保存对象；p 仍强引用该对象。\n// delete 只移除成员关系，不等同显式 dispose。","rust":"let p = graph.get(\u0026id)?.clone();\n// 假设 graph 存放 Rc\u003cNode\u003e：clone 复制强持有。\ngraph.remove(\u0026id);\nconsume(p);\n// 与借用 \u0026Node 后 remove(\u0026mut self) 是不同路线。","zil":"let p = nodes.resolve(key)?\nlet removed = nodes.detach(key)?\nconsume(p.value)\nclose(removed)\n// 只有detach保持实际地址并转交完整责任时成立；\n// 不自动把destroy改成延期清理。","go":"p := graph[id] // map 保存 *Node\ndelete(graph, id)\nconsume(p)\n// p 仍指向对象；不等于对象立即回收。","swift":"let p = graph[id] // 字典值为 class 引用\ngraph.removeValue(forKey: id)\nconsume(p)\n// p 的强持有维持对象存活。","cpp":"auto p = graph.at(id);\n// graph 的值是 shared_ptr\u003cNode\u003e；这里复制强持有。\ngraph.erase(id);\nconsume(p);\n// 不是拿裸指针后让唯一 owner 直接销毁。","zig":"// 要保留旧对象，需要显式移交或延期释放责任。\n// const p = graph.get(id);\n// removeMembership(id); // 只删成员资格\n// consume(p);\n// 最后按已设计的 allocator / owner 协议释放。","hylo":"// 必须先明确容器删除与所得值/投影的关系。\n// 若仍持有相交投影，不能凭“值语义”\n// 推断容器可任意删除而投影仍有效。\n// 本版未核实通用的隐式退役方案。"},"note":"ZIL为规范示例，未在生产编译器执行；各语言展示机制差异，不作为同语义性能或行数基准。"},{"id":"E05","name":"只修改一个字段的 helper","goals":["G19","G22"],"intent":"遍历 messages 时更新 statistics，要求 helper 不把 messages 的借用一并阻断。","code":{"rust":"fn record(stats: \u0026mut Stats, msg: \u0026Message) {\n    stats.count += msg.weight;\n}\nfor msg in \u0026self.messages {\n    record(\u0026mut self.statistics, msg);\n}","zil":"fn record(engine: Ref\u003cEngine\u003e, msg: \u0026Message) {\n    engine.statistics.count += msg.weight\n}\nfor msg in \u0026engine.messages {\n    record(engine, msg)\n}\n// helper发布statistics足迹，不隐式借走全部engine。","ts":"for (const msg of this.messages) {\n  this.record(msg);\n}\n// 通常不做字段借用排他检查。","go":"for _, msg := range s.messages {\n    s.record(msg)\n}\n// 不意味着编译器证明 helper 只写 statistics。","swift":"// 用明确的字段值/窄参数安排访问范围。\n// 若将整个 self 作为重叠 inout，\n// 仍必须满足 Swift 的独占访问规则。","cpp":"for (const auto\u0026 msg : messages) {\n    record(statistics, msg);\n}\n// 参数可以手工变窄；编译器不提供 Rust 式借用证明。","zig":"for (self.messages) |msg| {\n    record(\u0026self.statistics, msg);\n}\n// 字段指针范围可以写窄，存活与别名纪律需维护。","hylo":"// 字段投影可表达所需部分。\n// 当前资料不足以把“任意 helper 自动摘要”\n// 登记为已实现；应与局部字段拆分分开。"},"note":"ZIL为规范示例，未在生产编译器执行；各语言展示机制差异，不作为同语义性能或行数基准。"},{"id":"E06","name":"返回零复制的缓冲视图","goals":["G05","G21","G24"],"intent":"返回输入缓冲的前 n 项，观察返回值如何依赖输入；同时考虑扩容、释放和边界语义。","code":{"rust":"fn prefix(x: \u0026[u8], n: usize) -\u003e \u0026[u8] {\n    \u0026x[..n]\n}\n// 单来源生命周期可以省略；越界会 panic。","zil":"fn prefix(x: \u0026[u8], n: usize) -\u003e \u0026[u8]\ncontract { result(from(x)); } {\n    return \u0026x[0..n]\n}\n// 单输入关系可推导；这里展示显式固定合同。","ts":"function prefix(x: Uint8Array, n: number) {\n  return x.subarray(0, n);\n}\n// 共享底层缓冲；边界会按 JS 规则调整。","go":"func prefix(x []byte, n int) []byte {\n    if n \u003c 0 || n \u003e len(x) { panic(\"prefix range\") }\n    return x[:n]\n}\n// 切片共享底层数组。原生 x[:n] 的上界是 cap(x)；\n// 这里显式检查 len(x)，限定为当前输入范围的前缀。","swift":"func prefix(_ x: Array\u003cInt\u003e, _ n: Int) -\u003e ArraySlice\u003cInt\u003e {\n    x.prefix(n)\n}\n// 切片可能保留更大底层存储；修改遵循值语义。","cpp":"std::span\u003cconst std::byte\u003e prefix(\n    std::span\u003cconst std::byte\u003e x, std::size_t n) {\n    return x.first(n);\n}\n// 调用方必须保证范围和底层存活。","zig":"fn prefix(x: []const u8, n: usize) []const u8 {\n    return x[0..n];\n}\n// 返回切片；底层 lifetime 由程序员保证。","hylo":"// Hylo 的范围下标可产生基对象上的切片投影。\n// subscript 在 yield 时让出访问；使用结束后恢复清理。\n// 投影可以读写已有位置，不是独立 owner。\n// 不能把它等同任意可逃逸的 Rust 引用返回值。"},"note":"ZIL为规范示例，未在生产编译器执行；各语言展示机制差异，不作为同语义性能或行数基准。"},{"id":"E07","name":"调用期使用闭包，不一定需要拥有式堆装箱","goals":["G23","G33","G34"],"intent":"helper 在返回前用完回调。区分环境存放在哪里、能否逃逸，以及调用是否间接分派。","code":{"rust":"fn visit(xs: \u0026[i32], f: \u0026mut dyn FnMut(i32)) {\n    for \u0026x in xs { f(x); }\n}\nvisit(\u0026xs, \u0026mut |x| total += x);\n// 借用环境 + 间接调用；也可选择泛型静态分派。","zil":"fn visit\u003cF: FnMut(i32)-\u003evoid\u003e(xs: \u0026[i32], f: \u0026mut F) {\n    for x in xs { f(x) }\n}\nvar each = (x: i32) =\u003e { total += x }\nvisit(xs, \u0026mut each)\n// 重复调用仍检查Call状态闭合；fn指针不能存捕获环境。","ts":"function visit(xs, f) {\n  for (const x of xs) f(x);\n}\nvisit(xs, x =\u003e total += x);\n// 是否分配/内联由实现决定，源码不保证无堆分配。","go":"func visit(xs []int, f func(int)) {\n    for _, x := range xs { f(x) }\n}\nvisit(xs, func(x int) { total += x })\n// 环境逃逸和分配由具体编译器分析。","swift":"func visit(_ xs: [Int], _ f: (Int) -\u003e Void) {\n    for x in xs { f(x) }\n}\nvisit(xs) { total += $0 }\n// 函数参数默认非逃逸；非逃逸不保证所有代码零分配。","cpp":"template\u003cclass F\u003e\nvoid visit(std::span\u003cconst int\u003e xs, F\u0026\u0026 f) {\n    for (auto x : xs) f(x);\n}\nvisit(xs, [\u0026](int x) { total += x; });\n// 可特化和内联，主体可能按类型物化。","zig":"// 手工回调表示：环境指针 + 函数入口。\nconst Callback = struct {\n    ctx: *anyopaque,\n    call: *const fn (*anyopaque, i32) void,\n};\n// 使用：callback.call(callback.ctx, x);\n// caller 提供适配函数并保证 ctx 在调用期间有效。\n// comptime 参数可走另一条特化路线。","hylo":"// 参数约定、捕获和调用能力共同约束闭包。\n// 当前片段未核实统一的无装箱 ABI，\n// 不将“可变值语义”直接推成每种闭包都零分配。"},"note":"ZIL为规范示例，未在生产编译器执行；各语言展示机制差异，不作为同语义性能或行数基准。"},{"id":"E08","name":"拥有模式相同，不制造比较差异","goals":["G02","G13","G39"],"intent":"双方输入和输出均为按值转交的拥有包，不与借入Ref混比。","code":{"zil":"fn pick(first: bool, a: OwnedNode, b: OwnedNode)\n    -\u003e (OwnedNode, OwnedNode) {\n    if first { return (a, b) }\n    return (b, a)\n}","rust":"fn pick(first: bool, a: OwnedNode, b: OwnedNode)\n    -\u003e (OwnedNode, OwnedNode) {\n    if first { return (a, b); }\n    (b, a)\n}"},"note":"假设OwnedNode为相同责任语义的拥有包；这一类转交基本持平。"},{"id":"E09","name":"#编译入口不与属性冲突","goals":["G38","G39"],"intent":"定界符区分求值与附着请求；属性类别决定消费阶段。","code":{"zil":"#[repr(C)]\n#[align(16)]\nstruct Packet { code: u32; size: u32 }\n\nlet n = #(square(12))\nlet xs = #([1, 2])\n// #[1,2]不能当编译期数组。"},"note":"统一的是#入口与基础设施，不是任意编译器访问权限。"},{"id":"E10","name":"顺序进入公开安全合同","goals":["G01","G02","G18","G39"],"intent":"参数模式相同但操作顺序不同，允许的同源绑定也不同。","code":{"zil":"fn before(a: Ref\u003cNode\u003e, b: Ref\u003cNode\u003e) {\n    inspect(a.value)\n    b.destroy()\n}\nfn after(a: Ref\u003cNode\u003e, b: Ref\u003cNode\u003e) {\n    b.destroy()\n    inspect(a.value)\n}\nbefore(x, x) // 可接受\nafter(x, x)  // 拒绝"},"note":"当前管理资格、无残余地址窗口与真实函数效果必须成立；不是按名字推断安全。"},{"id":"E11","name":"组默认接收者与词法成员","goals":["G20","G39"],"intent":"签名先定receiver，缩短重复，不依正文猜能力。","code":{"zil":"struct Point { x: i32; y: i32 }\nimpl Point(self: \u0026Self) {\n    fn sum() -\u003e i32 =\u003e .x + .y\n    fn shift(self: \u0026mut Self, dx: i32) { .x += dx }\n}\nimpl Point { fn origin() -\u003e Self =\u003e Point { x: 0, y: 0 } }"},"note":"ZIL-RECEIVER；规范样本，未由生产编译器执行。"},{"id":"E12","name":"自动捕获与显式快照","goals":["G22","G23"],"intent":"捕获、调用能力、目标状态三者分开。","code":{"zil":"var n = 1\nlet snapshot = move () =\u003e n\nn = 2\nlet old = snapshot() // 1\nvar add = (x: i32) =\u003e { n += x }\nadd(3)\n// 直接Desc写目标并不自动变成长\u0026mut。"},"note":"所有源码放在正常函数内；move地址不延寿。"},{"id":"E13","name":"记录与一元管道","goals":["G20","G38"],"intent":"省略类型与调用糖保持确定求值和清理。","code":{"zil":"struct Point { x: i32; y: i32 }\nfn shift(p: Point) -\u003e Point =\u003e ({ ...p, x: p.x + 1 })\nfn total(p: Point) -\u003e i32 =\u003e p.x + p.y\nfn main() -\u003e i32 {\n    let p: Point = { x: 1, y: 2 }\n    return p |\u003e shift |\u003e total\n}"},"note":"不可Copy base在spread时移动；没有默认clone、插参或错误传播。"},{"id":"E14","name":"返回静态闭包环境","goals":["G13","G22"],"intent":"隐藏具体类型，不隐藏借用和责任合同。","code":{"zil":"fn add_by(n: i32) -\u003e impl Fn(i32)-\u003ei32 {\n    return move (x: i32) =\u003e x + n\n}\nfn main() -\u003e i32 {\n    let f = add_by(5)\n    return f(2) + f(3)\n}"},"note":"设计示例：C1尚不支持闭包返回或opaque callable。一个返回槽对应一个隐藏具体类型；不自动Box或合并不同闭包。"}],"settings":[{"language":"zil","variable":"V01","state":"known","values":["value","identity"],"summary":"普通值与共享身份分开；资源描述复制只复制入口，独立内容复制显式。","scope":"当前规范的设计选择；不表示生产实现、完整证明或性能已通过。","sources":["SRC-ZIL-CURRENT"]},{"language":"zil","variable":"V02","state":"known","values":["implicit-copy","affine-move","explicit-clone","shared-owner-copy","description-copy"],"summary":"Value按Copy/Move，Managed按责任转交，Desc复制入口；共享拥有与clone均显式。","scope":"当前规范的设计选择；不表示生产实现、完整证明或性能已通过。","sources":["SRC-ZIL-CURRENT"]},{"language":"zil","variable":"V03","state":"known","values":["whole-construction","definite-assignment","staged-publication","raw-storage"],"summary":"强更新需要精确One；预留、部分初始化、发布和真实清理分别核验。","scope":"当前规范的设计选择；不表示生产实现、完整证明或性能已通过。","sources":["SRC-ZIL-CURRENT"]},{"language":"zil","variable":"V04","state":"known","values":["static-range","checked-access","checked-view","caller-range-contract"],"summary":"范围与对齐按整次访问核验；受检分区显式返回保证，raw边界受审计。","scope":"当前规范的设计选择；不表示生产实现、完整证明或性能已通过。","sources":["SRC-ZIL-CURRENT"]},{"language":"zil","variable":"V05","state":"known","values":["accurate-carrier","unique-owner","region-owner","shared-owners"],"
