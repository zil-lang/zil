uire 只解决相应 CPU 同步；DMA map/unmap、方向、cache 和设备屏障由平台适配器保证。 任意原始设备字节必须经过初始化/类型有效性转换才能成为 bool、enum、引用。\n\nFFI 导入只给布局和符号。wrapper 说明 noescape/retained、线程、重入、取消、完成、异常与实际资源责任。 当前有限同步借入 profile 使用 `provides(noescape(parameter)); effects(ffi);`，地址参数必须完整、唯一列出；它要求不保留地址、无跨界异常或挂起并遵守范围/可变权限；默认无回调/重入，只有显式 `provides(static_callbacks());` 才允许下述有限静态回调。`ffi` 不表示纯性、无 IO 或无阻塞；声明真实性仍是显式 unsafe 承诺，不能制造来源、活性、初始化或独占资格。该 profile 不支持地址返回和异步 retained。\n\n有限外部值 profile（schema15）：仅在 x86_64-unknown-linux-gnu 与 x86_64-pc-windows-msvc、64位、小端、LLVM、checked算术目标开放。c_handle 是Copy不透明指针宽度令牌，c_null()构造空值；只支持值传递、存储、相等/不等，无解引用、算术、整数转换或Address/Desc转换，也不证明OS资源活性或唯一释放。允许借用保存handle的槽。c_wstr 是只读程序静态UTF16字符串指针或NULL；c_wstr(\"字面量\")编码合法UTF16并追加唯一末尾NUL，内嵌NUL拒绝，c_wstr_null()表示NULL。编码单元按实际数量收费；它可由外部留存但不可写，不可从借出地址/整数/handle制造，不可作为外部结果或可变C载荷字段。空字符串不是NULL。\n\nextern \"C\" fn(...) -\u003e T 是独立ForeignCallback类型；c_callback(静态普通函数符号)仅指向实际定义、无环境、非foreign、非teardown、非closure入口的精确签名目标。参数仅i32/i64/c_handle，结果再加Unit；代码地址可以留存，没有数据环境，不能普通CallIndirect或转普通FunctionPointer。c_*构造无外部效果且裸名称不可被值/函数遮蔽；外部调用仍需unsafe。static_callbacks()同时允许传入/留存静态回调与外部反调已注册回调；直接或共享载荷含回调的声明必须标记它。回调不得访问本次借出的ZIL存储，外部本身仍可按声明权限读写该存储。外部不得将借出地址传给回调或留存，也不得跨边界unwind/longjmp/挂起。该合同不引入全局注册表，不放宽栈借用或赋予原始令牌释放权限。\n\n本有限C值ABI接受u8/u16/i32/i64/c_handle/c_wstr/上述静态callback参数，返回仅Unit/u8/u16/i32/i64/c_handle；窄整数使用真实目标C ABI。单层共享Address载荷允许这些静态值及递归非空数组/非空Record，可变载荷仅允许全位模式有效的u8/u16/i32/i64/c_handle及递归非空数组/Record。Bool/Unit/enum/普通函数指针/资源/Package/嵌套Address拒绝。此Record子集按声明顺序、自然C对齐和尾部补齐布局，只通过地址借入；无按值聚合、packing、union、bitfield和变参ABI。padding不是语言字段值，外部仅可读取已初始化声明字段，可以在对象范围内写padding。所有地址仍需完整唯一noescape索引，并独立核验同期活性、来源、初始化及读写冲突；静态字段可被复制留存不等于其外层record地址可留存。新外部值、回调和嵌套组合不进入本片CT执行；u16按普通整数规则执行CT。外部违反合同属于可信边界破坏，与 Rust 同类；不宣称静态语言隔离恶意外部任意写。\n\n浮点C ABI接续（344）：显式普通C参数/结果与现有POD字段可含f32/f64，布局分别4字节/对齐4及8字节/对齐8，实际调用使用目标float/double ABI而非整数寄存器。既有noescape、静态回调、地址返回限制和可信外部义务保持；静态callback的有限签名不会因普通scalar辅助函数扩宽而自动扩大。外部调用必须遵守§2.4浮点环境合同，不能改变后续语言的舍入/渐进下溢语义。平台结果必须绑定真实目标验证。\n\n### 12.4.1 同线程结构化外部回调\n\n`unsafe { c_with_callback(register_name, close_name, \u0026mut f, body) }` 是有外部效果的结构化调用，裸名称保留，不是可遮蔽的普通构造函数。结果为普通`(bool,i32)`；前两项引用静态外部声明，不开放一般foreign函数值。f须为实际具体、自含的Fn或FnMut(i32)-\u003ei32，以真实活位置独占借入；body须为具体零参数i32闭包并可一次消费，不得经直接使用、捕获或别名访问该f。普通不相交借用仍须独立核验。源顺序求值，每项仅一次；该profile仅同线程Direct事件循环，不开放跨线程、Suspend或可脱离调用返回的登记值。\n\nregister签名精确为`(extern \"C\" fn(c_handle,i32)-\u003ei64,c_handle)-\u003ec_handle`，标记`provides(static_callbacks(),scoped_callback_register());effects(ffi);`；close签名为`(c_handle)-\u003eUnit`，标记`provides(static_callbacks(),scoped_callback_close());effects(ffi);`。二者角色只可由组合器调用，不能作普通ForeignCall。角色是unsafe外部承诺，不能制造实际来源、初始化、独占或自含资格。register返回null须保证所有同步反调完成且无未来入口；close返回须保证该登记全部入口/访问已经结束且不会再开始，不能以active=0替代。无法兑现时不得返回释放栈槽，可abort；跨界unwind/longjmp、挂起、外部伪造userdata或跨线程均违反合同。\n\n进入register前建立稳定context栈槽，绑定实际f位置、Closing与active；不产生隐式heap、RC、锁或全局表。同线程回调在无让出窗口内检查Open且非active并登记active后，才沿既有FnMut路径调用f；退出先归还访问再清active。成功返回i64的高32位0、低32位原样承载i32结果；Closing或重入返回高32位1、低32位0。register失败不调用body，清理其未消费环境并返回(false,0)；成功则一次消费body并完成其剩余清理，保存完整结果，置Closing后调用close。close期间反调只拒入；保证no-future后才释放f借入并返回(true,result)。body的可恢复错误在body内部处理；本profile的Trap/panic固定abort，不展开已公布槽，不承诺abort后的清理。\n\nTypedIR/LIR `WithForeignCallback { register, close, callback, body, region }` 保留实际声明、活独占Closure地址、一次消费body以及真实unsafe区；result须为Tuple[Bool,I32]。Types/Analyze和独立Verify各自重建资格、地址/别名、消费及真实签名/角色，候选注解和同ClosureId不证明同值/不同值；CT不得执行此指令。runtime schema/Wire/fingerprint32同批绑定角色和指令，CT artifact schema1不变。旧无新能力路径的语义费用保持，新增工作使用当前请求余额且预付；Wire新增角色字节按真实新格式计费，默认额度不增。\n\n公共泛型wrapper的实际角色流将此指令表示为`F* (epsilon | B F*)`：F可反复调用，B仅登记成功时调用一次；失败不调用B，但两路均完成其拥有责任。事件按实际调用模式记录F=FnMut、B=FnOnce，角色声明保持原kind并沿既有支持关系核验；Fn可供FnMut调用，但不降低F的实际独占窗口，FnOnce不可充当F。组合后的每个Once角色须分别证明不可重复，不能因另一个角色允许循环而放过包含该Once角色的环；该流不替代实际来源、别名与清理核验。\n\n\u003ca id=\"ZIL-LOWERING\"\u003e\u003c/a\u003e\n\n## 13. 目标表示：规定主路径，不让每个后端重新发明\n\n普通值内联，稳定描述用原始指针或既定索引，不默认 RC/世代/租约。只有真实管理接口传路由；管理参数和结果路由的 ABI 固定。具体闭包内联环境，dyn 才保存实际入口。包从当前基址解析内部关系。\n\n主原生路径采用在工具链清单中锁定的 LLVM 目标语义。普通 Desc 不转换成带活对象保证的 Rust \u0026T，不默认 noalias/dereferenceable。实际读取时才有相应动态范围证据。Dormant 不比较、哈希、序列化、恢复身份；只是不可解引用的 opaque 描述。LLVM 对不解引用指针有独立规则。\n\nC profile 不接受其未证明合法的失效原生指针搬运；这是后端支持范围，不是全语言能力的虚构完成。若要扩展必须提供合法 typed encoding，不能把 LLVM 规则套用到 C。Cranelift/Wasm 同理按 profile 验证。\n\nLIR 必须显式保留初始化、责任转交、所有结果清理、真实同步和帧固定；优化不能根据普通 Desc 附加排他属性。强窗口首先产生精确范围证据，没有充分目标映射时宁可保留较弱优化。noalias 的使用需要目标专项规则，源程序安全本身不依赖优化成功。\n\n无堆/无任务 profile 不链接无关 runtime。必要越界/对齐检查不会因关闭优化变成 UB；目标缺原子/异常/栈保护能力明确报告，不伪造语义一致。\n\n### 13.1 机器生成策略与源语义解耦\n\nLLVM 文本、LLVM API 或其它受支持后端必须消费同一已核 LIR 和同一份显式目标/ABI/优化配置。调用 LLVM API 不是安全证明；LLVM IR verifier 只负责 LLVM 结构约束，不能替代 ZIL 的来源、借用和责任核验。\n\n错误必须关闭产物发布：LLVM 结构核验失败、对象生成失败、链接失败或取消时，不返回可运行的新产物，也不把旧成功文件当本次结果。优化级别、是否输出 IR、CGU 数和线程数不得改变语言规则。\n\nDebug/Release可以选择不同实例和分区策略，但必须保持类型选择、溢出/错误语义、责任与析构顺序。运行时类型信息共享泛型体属于明确机器策略，不属于另一种 trait 选择规则。当前不将存在化/类型擦除设置为默认；引入前先证明无隐式堆分配、布局和管理 ABI 正确，并把实际间接调用/栈空间/类型信息成本计入验收。\n\n\u003ca id=\"ZIL-MODULE\"\u003e\u003c/a\u003e\n\n## 14. 类型、模块、comptime 和工具\n\n名义类型、唯一 impl、具名关联类型、有限 life 模板、lending/HRTB 支持按声明检查。类型关系与机器布局分离；纯品牌和效果不独立实例化。具体类型、常量、Drop、帧或真实调用不同仍有相应代码实体。\n\n完整类型证据由规则核验器检查；不能因为 trait 求解器返回 true 就授予原语权限。unsafe impl/同步原语属于显式审计点。表面宏只产生未核 AST，不能制造 VerifiedProgram。\n\n文件即模块，默认私有，明确导入，包依赖无环；普通递归在模块内可用。公开合同区分输入条件、may 行为、must 后置、管理路由和真实 ABI。替换不得加强前提、扩大破坏、削弱保证或错配布局。改变 alias 顺序可能仅改语义；新增返回管理路由可能改 ABI。\n\ncomptime 执行有逻辑配额和显式输入，不从未完成安全查询反向修改 impl。IDE/check/build 共享同一判定；不完整代码可以显示未知，不把未知变为安全。自动修复不重排有副作用语句，不收窄真实效果以消除错误。\n\n\n\n\u003ca id=\"ZIL-SYNTAX\"\u003e\u003c/a\u003e\n\n## 15. 固定源面与歧义消除\n\n### 15.1 词法、语句和名字\n\n源文件为 UTF-8，标识采用 Unicode XID_Start/XID_Continue 加 `_`，ASCII 关键字保留，名字区分大小写且不作隐式规范化合并。允许 `//` 行注释与可嵌套 `/*…*/` 块注释；`#` 不是注释起始符。数值默认十进制，`0x/0o/0b` 为显式基数；`010` 是十进制十。分隔下划线不得首尾或连续出现。值先解析为目标类型合法数值，再发射规范表示，不把原始数字拼写直接交给目标 C。\n\n分号和逻辑换行均可终止语句。圆括号、方括号或模板参数列表内的换行不是终止符。行末为二元运算符、`,`、`.`、`=`、`-\u003e`、`=\u003e`、前缀 `\u0026`/`give` 或 `|\u003e` 时视为续行；行首的 `(`、`[`、`.` 不反向拼接上一条已经完整的语句。需要跨行后缀调用/索引时将完整表达式放入圆括号。`return` 与其操作数必须在同一逻辑行开始；`return` 后换行就是无值返回，后续表达式不是隐含返回值。普通具名函数块无隐式尾表达式返回，使用 `return`；闭包块仅按第9章的值位置规则处理尾值，编译期块使用 `yield`。\n\n`import std.io as io` 使用点分隔的逻辑模块路径，每段为标识符；值或类型成员同样使用 `.`。不接受路径字符串、斜杠分隔、相对路径段或 glob。逻辑名不按物理文件名解释：`import a.zil` 表示 `a`、`zil` 两段，不会剥去末尾段。文件即模块，默认私有。导入在模块声明区固定，不由任意运行代码改变。\n\n逻辑模块 `a.b` 从项目根解析到 `a/b.zil` 或目录入口 `a/b/mod.zil`；二者同时存在时拒绝歧义，不设隐式优先级。目录只有显式入口文件才成为可导入模块，不扫描、合并或自动导出目录内其它文件；入口通过普通导入与公开声明组成接口。解析后的真实路径不得逃出项目根；指向同一真实文件的导入共享模块身份。默认别名取最后一段。\n\n类型实参用 `Buffer\u003cu8\u003e`；表达式中的显式泛型调用统一写 `make::\u003cu8, 32\u003e(alloc)`，`::` 在此只引入值位置的泛型实参，不作为另一种模块路径写法。解析无需查询类型即可区分它与 `\u003c`/`\u003e` 比较。类型上下文的连续 `\u003e\u003e` 可拆成两个闭合 `\u003e`；表达式上下文仍是移位。泛型类型的静态方法和构造在表达式位置同样写 `Buffer::\u003cu8\u003e.new(alloc)`、`Pair::\u003cu8\u003e { ... }`，不因看到 `\u003c` 就试探类型再回退比较。\n\n普通源标准库接续（345）：`std.utf8`、`std.text_edit`、`std.string`等已登记模块以随编译器版本固定的真实ZIL源分发。每个导入按普通模块图、完整源码/节点预算及parse/Expand/Types/Analyze/Verify处理；模块名不授予权限。源码内容进入项目、CT依赖和缓存身份，不允许同名磁盘文件劫持。手工ProjectSources只能以实际登记源字节提供保留模块，字节验证在比较前计费；未知std模块不静默回退本地文件。std.meta/std.syntax沿原CT协议。String私有拥有UTF8存储，公开视图保持真实借用根，事务编辑失败保持原值；接口不能通过值复制或隐藏宿主实现规避拥有/别名规则。完整库与平台验收仍由实际消费者判定。\n\n### 15.2 绑定、模式和表达式\n\n`let` 不允许重新绑定普通位置；普通 Value 的直接内容写入和 `\u0026mut` 要求 `var`。已有资源描述可通过当前执行资格操作其目标，不从 `let` 推导目标只读。Managed 位置的完整替换也要求该位置可写。不存在 `:=`、隐式 clone 或“移动失败改借用”的第二套解释。\n\n`=` 为语句，不产生值。目标接收者与索引从左到右各求值一次，再计算 RHS，RHS 成功后写入并按规则处理旧值。复合赋值先确定目标并读取原值，再求 RHS、计算和提交；短读不制造两个同时独占窗口。目标预约不能跨未知重入、挂起或相交失效，需要时先将 RHS 显式计算为局部值。\n\n`T?` 是 Option；`E!T` 是错误联合；表达式后缀 `?` 只沿实际错误出口传播。数组类型 `[T; N]`、切片类型 `[T]`、数组值 `[a, b]`、索引 `a[i]`、半开范围 `a[lo..hi]` 各按上下文唯一解析。`\u0026[T]`/`\u0026mut [T]` 是地址窗口。`a ? b : c` 不属于语法，使用 `if` 表达式。`a[]` 非法，完整切片写 `a[..]`；区间端点采用非区间表达式，复杂比较或逻辑端点须用括号。`if/while/for/match/with` 的控制头在顶层遇到 `{` 即开始主体；头部需要结构构造字面量时写成 `(Node { ... })`，不得依赖类型查询判断大括号归属。\n\n借用模式接续（340）：`ref`/`ref mut`必须取得实际活动位置的地址，不能复制载荷到临时值后声称借到原值。Enum路径保存每层活动variant和实际field投影；取地址时及独立核沿控制流验证活动tag、初始化和父loan。有效窗口阻止相交移动、替换、tag失效或不合法可变别名；同一活动payload真正不相交字段可按真实投影证明分离。嵌套/聚合可变借用在完整失效模型和机器表示完成前不得放行，模式表示存在不等于完成。\n\n实际地址及字段接续（340/342）：借入Enum必须从真实输入地址观察tag及取得payload地址，不能将整个Enum复制到临时位置后声称引用原输入。Copy Tuple/Record字段使用真实本地字段位置及有界inline投影，借入一个字段后读取另一个字段不重载整个父值；父移动、整体替换及清理与每个子区间相交。闭包捕获、保存引用及重借须保留真实投影和父存储依赖，不能因public Hold较粗而丢失权限。临时RHS只求值一次后建立真实本地位置，其ref mut不赋予既有不可变位置写权限。\n\n从`\u0026Package`/`\u0026mut Package`投影Managed资源头可形成保留来源的Desc，绝不复制Managed责任；共享头来源只能执行已证明只读的操作，独占来源也仍受实际活跃view和may效果约束。源函数转发、返回、捕获和间接调用必须保留并核验父根/权限，不能通过DescribeAddress洗掉只读或获得销毁权限。Task及外部登记头的特殊生命周期不由普通资源描述投影自动开放。\n\n拥有Tuple及混合选择性移动（340）保留实际结构Type::Tuple。MakeOwnedTuple转入各实际责任，UnpackTuple原子转移完整槽到互异空槽，DropTuple仅清理仍初始化的叶。TakeTupleField与TakeVariantField使用非空有界PlaceProjection路径，Field进入真实inline Tuple/Package字段，Variant同时核当前判别与字段；不得跨Managed/地址/外部稳定存储边界。每次选择性Take只转移其初始化子树，父仍保留判别/存储及其余责任；之后整体Take要求完整初始化。两核独立从实际CFG重建每个子树的状态、父子借用相交、重复/前缀路径冲突和清理，backend在真实local GEP和实际活标志上执行；不使用public Plan中的权限位或把Tuple改名Package替代。\n\n混合位置借入与判别（340）追加BorrowPlaceLocal（119）和PlaceTagLocal（120）。前者的非空有界PlaceProjection路径直接指向真实局部inline存储的已初始化子树，逐步保留Field、Variant和ErrorArm(bool is_error)祖先，不物化临时父借用；后者允许空路径观察根，最终节点必须是真实Enum/ErrorUnion，返回Enum序号或ErrorUnion的i32（0成功、1错误）。ErrorArm使用独立路径step2，不把ErrorUnion冒充名义Enum；TakeVariantField（118）同样可从真实Enum/ErrorUnion根选择性转交。每个Variant/ErrorArm祖先都重新检查实际活动tag及所经子树未整体取空；只取走部分载荷的存活父头仍可读取判别。tag读取只访问真实header区间，不授予载荷读取、父替换或移动权限。模式先完成全部判别/守卫，再建立引用或转移字段，失败模式不得提前消费；地址范围、父子相交、剩余初始化/清理和路径增长由两核分别重建并预付，不使用候选权限位。\n\n\n有限记录式枚举变体与具名match模式（329）：普通有限Copy枚举允许`V { field: Type, ... }`载荷、`E.V { field: expr, ... }`构造，以及match中的`E.V { field: pattern, ... }`。构造沿既有record grammar允许`{field}`读取同名值；构造表达式按源码字段顺序各求值一次，再按声明顺序形成既有Enum载荷；字段名及具体声明身份在正规化前完整核验，未知、重复、遗漏字段与tuple/record形式混用均拒绝。模式可重排具名字段，但首片要求全部字段显式`field:pattern`，不开放shorthand、rest或新ref权限；绑定和权限沿既有有限Copy模式规则。记录字段继承枚举载荷可见性，独立pub/default/manages标记首片Unsupported，不擦除。泛型与未用定义同核；允许枚举直接普通类型参数Copy前提并逐实参含phantom核验，不从bound推导整个枚举Copy，不开放任意trait/where前提。复用已有Core/Typed Enum表示与机器判别/字段序，AST具名标签必须通过CT生成、卫生与有界遍历保留到字段解析；不支持的CT路径显式拒绝，不丢标签放行。\n\n有限借入切片 profile（schema16）：一层 `\u0026[T]`/`\u0026mut [T]` 从已有固定数组或切片窗口建立，T 为现有有限 Copy 值；裸 `[T]` 不可按值加载、存储或传递。`\u0026a[lo..hi]`/`\u0026mut a[lo..hi]` 按对象、显式 lo、显式 hi 的顺序各求值一次，缺省端点为0/当前长度，先核 `0 \u003c= lo \u003c= hi \u003c= len` 再计算偏移。空区间合法，索引仍要求 `0 \u003c= i \u003c len`。`\u0026*s`/`\u0026mut *s` 可整体重借。切片地址的零实参 `.len()` 返回 i64，仍要求窗口活性和访问资格；其它接收者同名调用不改义。共享复制、独占转交/重借、普通跨模块函数参数与参数来源返回沿现有地址规则；来源保守覆盖整个后备对象，不推导区间互斥。子范围投影不制造新的独占资格，显式重借才建立父子关系。机器表示为指针与 i64 长度，不分配；只开放既有 x64 小端 checked LLVM Linux/Win64 profile。切片进入闭包捕获、callable/helper 借出结果、聚合/错误载荷、FFI 或 CT 执行仍关闭；显式同步参数的有限入口见下段；资源/地址/拥有元素、无来源制造、局部窗口逃逸、动态分配/扩容和外部长期留存不能由此获得许可。所有 raw 类型、范围 operand、来源、预算与权限由 Verify 独立检查。\n\n同步显式切片参数 profile（193，复用既有 Address/Slice 表示）：允许一层 `\u0026[T]`/`\u0026mut [T]` 作为 callable 的显式参数或非逃逸同步 helper 的附加参数，T 仍限既有有限 Copy 值，包含此入口的调用签名和 helper 结果必须为 Copy。环境 Fn/FnMut/FnOnce 模式与显式参数的 shared/exclusive 资格分别核验；无状态 Fn 可以接收独占切片实参，但不由此获得修改环境的资格。实际调用期间把显式实参、捕获窗口与 Desc 效果按真实后备对象联合核验，即使当次是最后一次调用也不得省略；不同区间不自动证明不相交。保持对象和端点单次求值、范围检查、父子重借与原指针/i64表示，不新增分配、捕获、跨调用留存、显式借参返回、FFI或CT许可；裸Slice、嵌套Address和非Copy元素继续拒绝。Types、Analyze和Verify各自核查形状、来源、权限与工作额度，不能把前置Unsupported当作借用安全证明。该规范入口的完成状态由193实际冻结源码、原始反例与独立验收决定。\n\n在明确期望类型`E!T`的上下文中，表达式本身已是同一联合类型时直接传递；否则表达式类型恰好与E/T中的一侧相同时注入该侧。两侧同时匹配或均不匹配时拒绝，不以运行值猜测分支。没有其它明确类型约束的整数字面量仍采用默认i32，错误联合的两个备选分支不各自反向试探并选择类型。`?`要求操作数为错误联合，且错误类型与所在函数的错误类型相同；成功时得到T，错误时先确定待返回载荷，再按真实责任和退出顺序清理并返回。不隐式转换错误类型，也不把普通`return`一律解释为成功分支。\n\n错误联合的显式tag模式为`.ok(pattern)`和`.err(pattern)`，分别选择真实成功/错误分支，仅适用于实际ErrorUnion。前导点是模式语法，不解析为用户类型名或凭名字造出Enum；parser不查询类型，AST/Core保留明确is_error与子模式。泛型定义可据此选择分支，不要求证明E与T不同。既有`TypeName(pattern)`仍须在定义期按完整实际成员类型证明唯一，Copy或两个不同的形参名字不证明类型不等；不能只检查已见具体实例。显式tag模式不放宽既有隐式注入、类型合法性及同型歧义规则。仅在匹配tag后读取/借入/转交活动载荷；子模式可按普通规则组合ref/ref mut、Tuple及其它嵌套模式，保留真实ErrorArm路径、初始化、父loan及剩余清理，不能复制父值冒充原位置。穷尽检查区分两tag及其子模式覆盖，重复/遗漏与非ErrorUnion目标按普通模式错误处理。目标只求值一次，新增遍历从现有剩余额度先费后长。\n\n闭包的产生式见第9章；参数和调用能力在类型/合同阶段决定，parser 不猜捕获。元组为 `()`、`(x,)`、`(x,y)`，`(x)` 只分组；元组投影写 `.0`、`.1` 等非负十进制整数字面量，不把它识别成浮点小数。\n\n从高到低的运算优先级为：字段/调用/索引/`?`，前缀 `! - ~ * \u0026 \u0026mut give`，乘除余，和差（含 wrapping），移位，位与/异或/或，范围，比较/相等，`\u0026\u0026`，`||`，管道 `|\u003e`。闭包箭头体延伸到当前表达式边界；其优先级低于管道，在管道右侧直接使用匿名函数时加括号。二元运算按组左结合；比较和范围不允许隐式连锁。`#(...)`、`#{...}` 是原子表达式，不改变外层优先级。\n\n`T?`与内建`Option\u003cT\u003e`表示同一完整有序类型参数的选项族，固定变体为`Option.None`和`Option.Some(value)`，模式使用同一限定名；可由已确定的期望Option类型提供T，未有依据时不得猜测。完整T（含名义/模块/phantom身份）进入内建族身份；用户声明或同名枚举不得伪造内建族。后端可规范化为卫生的普通tagged Enum，None无载荷、Some恰一个T，不以零位模式或空地址推断None。构造、解构、借入、移动、替换和清理使用普通完整Sum责任；Some拥有载荷只转交/清理一次，None不得访问非活动载荷。无隐式装箱、隐式Some包装或隐式unwrap；表达式后缀?仍沿真实错误出口传播，不按Option类型偷换意义。ref/ref mut模式保留真实place路径、活动tag和最后使用窗口，不能复制责任或绕过相交独占检查。\n\n匿名`A|B`是安全的带tag结构Sum，不是C raw union。先解析完整实际类型并展平嵌套匿名Sum，再按稳定完整类型身份规范排序；重复成员类型拒绝，同布局而名义/模块/phantom身份不同仍为不同成员。已确定匿名Sum期望上下文可接收相同Sum原值，或把唯一精确成员类型的值注入对应tag；不得试探数值转换或为未约束字面量回溯选择成员。模式`TypeName(binding)`按实际完整成员类型选择，复杂成员可通过普通类型别名命名；要求穷尽或通配。仅活动载荷可读/借/移出，替换受到借入tag和真实存储窗口限制；Copy当且仅当全部成员Copy，拥有分支的丢弃/通配按活动载荷清理一次。可以规范化为卫生的普通Enum，但不能合并不同身份或跳过任何来源/清理核验。原始union重解释仍属于独立unsafe边界。\n\n匿名Sum的CT artifact值阶段（344）独立使用schema/envelope3，program/provider/dependency及独立function/value身份域同升v3，旧v2字节不能由当前reader接受。CtRecordSchema与CtEnumSchema公开完整有序arguments（CtSchemaArgument::Type(CtTypeRef)或Scalar(Constant)），包括phantom与const参数；Type参数复用有界、规范的完整类型DAG，保存函数指针、借入函数指针关系等phantom身份，不以可序列化值类型CtTy替代类型元数据。实际字段和值仍遵守CtTy的纯值资格，完整TypeRef不制造运行时指针值、声明访问或构造权限；独立核按真实声明及具体实例验证数目、种类、类型和身份，拒绝循环依赖。schema表编号、字段布局或同名不能代替名义身份。CtTy::AnonymousSum与CtValue::AnonymousSum保存完整已展平成员身份、活动索引及实际载荷；成员至少两个、严格规范有序且互异，active须在界内且payload与该精确成员类型相符。MakeAnonymousSum只做精确类型注入，VariantTag/VariantField按实际活动tag和唯一字段0读取。跨CT/runtime桥接重新规范化完整Type并按成员Type映射tag，不复制内部索引或凭hash排序。完整键排序、比较、复制、递归图和Wire栈分配先扣当前请求余额；raw数据不授予声明、反射、Syntax来源或运行时权限。该公共合同须完成生产消费者和独立复核后才成为实际验收范围。\n\n\n### 15.3 函数与合同的唯一承载形式\n\n函数头顺序固定为：可见性、`fn`、名字、泛型参数、参数表、可选 `-\u003e` 返回类型、可选 `where`、可选 `contract`、正文或外部声明分号。返回类型不采用冒号同义写法。正文可为普通块、`=\u003e { ... }` 块或 `=\u003e expr`；箭头后遇大括号固定取块，表达式形式等价于 `return expr`，并按声明的返回类型检查。函数省略返回类型仍为 void，表达式体不会反向改变签名。未写返回类型表示 `void`；没有 `!` 表示无可恢复错误。完整声明示例：\n\n```zil\npub fn pick(a: Ref\u003cNode\u003e, b: Ref\u003cNode\u003e, first: bool) -\u003e Ref\u003cNode\u003e\ncontract {\n    result(from(a, b));\n    provides(manage(result));\n} {\n    return if first { a } else { b }\n}\n```\n\n合同正文是有限声明 DSL，不执行普通表达式：`result(create)`、`result(give)`、`result(from(paths...))` 三种互斥结果模式；`requires(read(path), write(path), manage(path), apart(a,b), state(path,Tag))` 给前提；`provides(manage(result))` 要求导出管理路由；`effects(alloc,io,block,suspend,spawn,ffi,reenter,panic,call(f),cleanup(T))` 给已核上界；`resume(local)`/`resume(transfer)` 固定恢复上界。参数/结果路径必须在接口有限投影表中，不能是任意运行表达式。没有声明的其它关键字拒绝。\n\n有正文定义可推导合同，导出的推导结果是可观察 API；显式 `contract` 的各项是必须核验的固定上界。无正文/dyn/FFI/递归形状环需足够合同，遗漏不解释为空行为。已固定合同不因正文改动悄悄加强前提；要求更精细的导出属于接口变更。不得同时提供另一套尾随 `from(...) effects(...)` 作为规范写法；迁移工具可转换，编译器默认仅接受这一套。\n\n`trait` 方法中的 `self` 模式、关联类型、常量和合同槽在签名中确定；实现可减少效果、减少前提、增强保证，不能改变已发布实际 ABI。安全错误不会触发改选另一重载。\n\n\n\u003ca id=\"ZIL-RECEIVER\"\u003e\u003c/a\u003e\n\n### 15.4 接收者默认值与 `.name`\n\n接收者在读正文前确定：方法显式首参数 `self: Type` / `give self: Type` 优先；其次是 inherent impl 的组默认；trait impl 则从对应 trait 签名继承；其余为静态关联函数。没有按正文是否使用字段决定 receiver 的路径。receiver 类型别名展开后只接受 `Self`、`\u0026'a Self`、`\u0026'a mut Self`、`Ref\u003cSelf\u003e`（life 可省）；`give self` 只用于实际 Managed 资源 Self。其它包装类型需要普通关联函数显式传参，不根据首参数名把任意 i32 等类型变成该类型的方法。\n\n```zil\nstruct Point { x: i32; y: i32 }\nimpl Point(self: \u0026Self) {\n    fn sum() -\u003e i32 =\u003e .x + .y\n    fn shift(self: \u0026mut Self, dx: i32) { .x += dx }\n}\nimpl Point {\n    fn origin() -\u003e Self =\u003e Point { x: 0, y: 0 }\n}\ntrait Measure { fn measure(self: \u0026Self) -\u003e i32; }\nimpl Measure for Point {\n    fn measure() -\u003e i32 =\u003e .x + .y\n}\n```\n\n组默认写 `impl Type(self: ReceiverType)`，也可 `impl Type(give self: Self)`。它只补入缺省的首参数，不改变参数类别。组内方法显式 receiver 覆盖组默认，静态函数写在无组默认的 impl 中；无组默认的 impl 仍允许显式 self 方法。trait 定义显式声明每个 receiver，trait impl 不接受组默认，省略 self 时只能继承接口；显式写出必须与接口模式、ABI和可替换合同一致。\n\n`.name` 在名称绑定阶段直接成为当前实例方法 `self.name` 的同一绑定，不是运行时 this。普通字段用法、访问资格和自动借入与显式 self 完全相同；匿名闭包沿用这一词法 binding，随后使用第9章捕获规则。self 为接收者保留名字，局部/闭包参数不得遮蔽；普通块不允许声明具名 fn，提取 helper 用模块函数或闭包。静态函数/顶层没有 receiver 时 `.name` 报错。\n\n前导点不表示 enum 变体、管道输入或 with 对象。枚举值使用 `Alignment.Center`；若当前 receiver 确实有名为 Center 的成员，`.Center` 仍是普通成员访问。\n\n`object.method(args)` 降为关联函数调用，receiver 求值一次且先于普通参数。只在已确定的 receiver 类型允许时自动产生短地址借入；不尝试多种权限直到安全检查成功。冲突 trait 候选使用显式 `Trait.method(receiver, args)` 指定，未消歧时报名字错误。\n\n`Type.method` 是含显式首参数的无绑定函数项；`object.method` 若指方法本身而非数据字段则拒绝取值。绑定回调显式写 `(args) =\u003e object.method(args)`，让捕获、存储和逃逸使用同一套闭包规则。具名 callable 字段可以普通取值。同一名义类型的固有字段与固有方法禁止重名，所有 impl 合并后检查；若字段与已导入 trait 方法同名，点号先解析现有字段，调用非 callable 字段会报类型错误，不回退 trait。调用该 trait 方法使用 `Trait.method(object, args)`；多个 trait 候选冲突也需显式路径。\n\n\u003ca id=\"ZIL-RECORD\"\u003e\u003c/a\u003e\n\n### 15.5 记录构造与更新\n\n`Point { x: 1, y: 2 }` 为名义类型构造；`let p: Point = { x: 1, y: 2 }` 可从已经确定的期望类型省略类型名。参数、字段和返回位置同理。没有期望名义类型的 `let p = { x: 1 }` 拒绝，不能按字段集合搜索结构或悄悄创建匿名结构类型。\n\n只有表达式位置允许无名记录字面量；函数/闭包 `=\u003e { ... }` 始终为块，返回记录写 `=\u003e ({ x: 1, y: 2 })` 或 `=\u003e .{ x: 1, y: 2 }`。`.{...}` 明确引入记录，仍必须有已确定的期望名义类型，与裸记录使用相同的字段、布局、初始化与清理规则，不创建匿名结构类型。独立块、控制主体不因存在冒号而变成记录。字段简写 `{x,y}` 引用当前同名绑定，重复或未知字段拒绝，隐私规则正常生效。显式字段从左到右求值一次；遗漏字段必须有合法声明默认值，默认值在显式字段成功后按字段声明序求值，不能读取未完成 self。\n\n更新写 `Point { ...base, x: 4 }` 或有期望类型的 `{ ...base, x: 4 }`。仅允许一个位于第一项的 spread；base 和目标为相同名义类型/实参，覆盖字段各一次。更新不新增字段、不更换名义类型、不访问私有字段，未提及字段来自 base；不重新执行它们的默认值。\n\n求值顺序固定：先将 base 依既定 Copy/Move 规则取得到一个临时完整值，再从左到右求覆盖表达式，全部准备成功后装配结果。不可 Copy base 在第一步即移出；其后读取原 base 拒绝，要复用数据须先显式取出。已准备但未提交的字段和临时 base 在失败时依第7章清理，已发生副作用不回滚。被覆盖的旧字段在提交期间依原声明序清理一次，未覆盖字段各转交一次；清理失败/重入须纳入 CFG 和合同。\n\n通用 spread 限于没有自定义整体 teardown 的普通 struct。resource、package、含 manages 字段的载体和自定义整体 Drop 类型使用构造器、replace 或已核 decompose；不能靠 spread 重复或隐式分拆真实管理责任。普通 struct 中已有不可 Copy Value 字段仍可整体移动并按字段规则清理，不引入 clone 或新堆分配。\n\n\u003ca id=\"ZIL-PIPE\"\u003e\u003c/a\u003e\n\n### 15.6 管道与元组展开\n\n`left |\u003e target` 先求 left 一次，再求 target 一次，然后将前者作为唯一实参调用后者；管道左结合。target 是可产生一元 callable 的表达式，不是函数调用的占位模板。`x |\u003e f(a)` 的含义是先取得 `f(a)` 的结果，再用 x 调用这个结果；如果该结果不是一元 callable 则类型错误，不改写为 `f(x,a)` 或 `f(a,x)`。\n\n```zil\nlet n = raw |\u003e parse |\u003e normalize\nlet m = raw |\u003e ((x) =\u003e adjust(x, limit))\nlet pair = (left(), right())\nlet sum = add(...pair)\n```\n\n管道左侧取得遵守目标已确定参数模式：Value 的 Copy/Move、Desc 复制、Address 重借和显式 give 各按原规则。对需要借入的 place 保存一次求值的定位，不为了临时名无条件移动或延长到作用域结束。RHS 求值若重入/挂起/失效这个定位，必须按同一预约与窗口规则拒绝；必要时用户先显式准备 callable 或独立值。不得用错误求值顺序规避这种冲突。\n\n管道不自动展开 tuple、不传播错误、不插入 await、不柯里化、不 clone，也不把 `.name` 绑定到左侧。错误传播写 `(raw |\u003e parse)?`；`raw |\u003e parse?` 的后缀属于 parse 表达式。匿名函数 target 加括号，`x |\u003e (v) =\u003e ...` 为语法错误。\n\n调用实参允许 `...tuple` 显式展开：按源顺序求 tuple 一次，按索引序产生确定个数的实参。元组形状在类型阶段已知，Value/Desc/Address/Managed 模式逐元素核验；没有数组、迭代器或运行长度 variadic 展开。展开不是复制；不可 Copy 元组值移出，部分失败清理真实已准备元素。单参 tuple 默认仍是一个实参。\n\n\u003ca id=\"ZIL-SCRIPT\"\u003e\u003c/a\u003e\n\n### 15.7 运行入口与托管扩展边界\n\nNative 源文件保持同一模块文法；`zil run path.zil` 是驱动的检查、构建和执行入口，不改变绑定、捕获、责任或 import 语义。模块顶层只声明，不执行任意语句；程序从唯一显式 `fn main()` 开始。声明的 main 返回 void、i32 或相应错误联合；成功的void映射为进程退出码0，成功的i32映射为该整数退出码，错误联合的错误结果映射为退出码1且入口不隐式打印。错误退出先完成合法清理。没有隐式 module initializer，也不把导入模块的变量变成全局脚本环境。需要脚本式短程序仍写 main，后续前端糖必须明确降为同一入口。\n\n托管宿主/GC 不进入 Native 默认模型。本语言的第一施工闭环覆盖 Native CLI 与显式宿主 ABI；请求尚未实现的 managed profile 返回 Unsupported，不能悄悄改为 GC/RC。未来托管扩展必须明确自己的对象类型、根注册、可移动性和暂停点、跨界值/地址转换、异常、回调注销及线程合同，并通过同一 verifier 可表达的桥接；不能把普通 Ref 重新解释成自动保活引用。\n\nGC 存活不代替文件/锁/订阅等责任结算，不代替原生地址窗口、并发资格或完成根。新增 managed profile 是单独的语言/运行时变更，当前 Native 的安全和产品验收不以它为隐含前提。\n\n\u003ca id=\"ZIL-COMPTIME\"\u003e\u003c/a\u003e\n\n## 16. `#` 编译期入口\n\n`#` 是显式编译指令族的共同前缀，不是可变全局编译器对象，也不为其内部表达式提供额外安全权限。相邻语法由其后的定界符或保留字确定；这里的统一是阶段入口和基础设施统一，不要求全部形式都调用同一函数执行器。\n\n| 形式 | 输入、结果和位置 |\n|---|---|\n| `#(expr)` | 表达式或类型位置求编译期值；Syntax 结果仅是数据，不自动插入 |\n| `#{ statements; yield value }` | 编译期块表达式；`yield` 只结束本块，不能 return 外层运行函数 |\n| `#[name(args)]` | 附着于下一声明/字段/参数的属性请求，规则见第17章 |\n| `fn fixed\u003cT, #N: usize\u003e(...)` | 显式编译期值参数；使用 N 时不重复写 # |\n| `#if (cond) { ... } else { ... }` | 声明或语句位置的编译期分支；两支均词法/语法正确，只物化并检查选中分支 |\n| `#for (x in values) { ... }` | 声明或语句位置的有限生成；按迭代序发射，导出同名冲突报错 |\n| `#emit expr` | 插入带卫生与类别信息的声明或语句列表；完整产物重新检查 |\n| `#splice(expr)` | 显式物化对应类别的表达式或类型Syntax；不改变#求值结果的含义 |\n\n不接受裸 `#call()`、把 `#[1,2]` 当数组、空 `#[]` 或 `#![...]`。编译期数组写 `#([1, 2])`。`#` 后的分发 token 必须在同一逻辑行，定界符内部允许换行。普通字符串中的 `#` 无特殊含义。编译期表达式不隐式发射语法，普通函数运行成功也不授予已核 IR 的构造权。\n\n```zil\nfn square(x: u64) -\u003e u64 { return x * x }\nlet n = #(square(12))\nlet table = #{\n    let x = square(8)\n    yield [x, x + 1]\n}\nfn repeat\u003cT, #N: usize\u003e(value: T) -\u003e [T; N] where T: Copy {\n    return array_repeat::\u003cT, N\u003e(value)\n}\n```\n\n### 16.1 编译期类型、执行和产物\n\n`Type` 与 `Syntax\u003cCategory\u003e` 是编译期数据类别，不能作为任意运行值。类型可作编译期参数和结果；名义身份由生成器声明、规范化参数和生成位置构成，不按字段相同合并。可读反射遵守可见性：形状查询依赖字段/接口，布局查询另依赖 target/ABI，二者不混成全包哈希。\n\n编译期函数使用同一语言的已核控制流和数值规则，以受限 CTIR/VM 执行。宿主 usize/浮点和机器地址不能自动代替目标语义。临时分配受预算，允许输出可序列化常量、TypeRef、卫生 Syntax、明确可重定位静态数据；禁止泄出 VM 临时地址、运行时资源身份、权限和 Debt。\n\n纯编译期不读网络、时钟、系统随机、未声明环境或任意文件；构建驱动提供显式资产与配置快照。记录输入内容、实际查询、生成器实现、目标相关信息和规则版本。逻辑步骤、临时字节、生成节点、嵌套与实例数分别计量。预算不足为 ResourceLimit，不改变到运行时执行，不把部分生成声明授信。\n\n普通受约束泛型依据符号 bound 检查；反射器按具体形状生成的不同代码分别完整检查。生成器检查通过不代表所有产物通过。品牌/纯证明不独立生成机器实例；实际布局、调用、常量、Drop 或 SABI 不同仍有真实实例成本。\n\n### 16.2 阶段依赖与封闭 impl 集\n\n调度状态至少区分 TokensReady、ConfigReady、ShapeReady、ImplIndexReady、LayoutReady、ContractReady、VerifiedCTBody。查询只读取已完成且获允许的层级。句法扩展不需要类型；类型辅助生成可读取完成形状；trait 求解不能回入生成器改变当前候选 impl 集。\n\n`derive(Debug)` 可读取已完成的原类型字段并生成普通 impl，然后统一检查；不得先假设本类型实现 Debug，再据此运行生成器证明 Debug。生成与自身布局相互依赖时报告阶段环。任务按实际依赖 DAG 分批，不要求全项目全部展开，也不允许靠反复重试未完成查询形成隐式固定点。\n\n每批生成后封存对应声明/impl 索引供其消费者检查。改变输入允许启动新批次并使真实依赖失效，但活动查询不得看到可变候选集。VM、原生展开器和缓存命中必须遵守相同可观察结果及逻辑配额；来源位置和调试信息可以另行更新。\n\n\n### 16.3 已封闭纯标量条件的源级 `#if`（219）\n\n声明和语句 `#if` 的分支大括号仅界定待物化列表，不新增运行期词法作用域。条件得到真实编译期 bool 后，选中列表按原顺序物化到接收列表当前位置；名字、shadowing、defer、return、break/continue 和拥有清理与该位置手写同一列表一致。两支均须词法/语法正确；仅选中列表进入名字、类型与安全检查。未选中条件及语句不执行，不用运行期 `if(true)` 代替源选择。\n\n首个有限 profile 支持现有 Unit/bool/u8/u16/i32/i64 纯标量计算，以及无条件、非泛型、无捕获、已封闭的普通纯标量函数和有限 helper 依赖。跨模块沿普通无条件 import 和 public 可见性解析。源码快照保留真实函数体，不以替代常量或 stub 宣布纯度；实际调用、分支、短路、循环与递归仍经 CTIR、独立 verify_ct/verify_ct_program 与受预算 VM。运行期资源、地址、闭包、FFI 不由本 profile 进入 VM。\n\n选择先于完整泛型/项目正规化。所有查询读取同一不可变 ConfigReady 声明快照；本批已选中的新声明不反向改变条件函数候选。依赖条件发射的声明、尚含生成指令的函数体、布局或可变 trait/impl 集合时，依据实际依赖给阶段未就绪诊断，不反复重试。普通未知名字仍为名字错误；普通函数递归按 VM 深度/步数限制，不假称为生成阶段环。条件 import、任意 CT 全局常量/反射、泛型 CT 值绑定、#for/#emit、Type/Syntax 生成仍需各自实现，不由此开放。\n\n所有条件与同请求/项目后续普通 `#(...)` 共用实际 CT 步数与生成节点余额；不在每个条件处重置默认限额。AST、依赖/索引、复制、选择轨迹及输出增长均先计费。选择用量随原始展开快照缓存；命中也扣除实际逻辑费用，缓存键绑定源、封闭依赖、规则、target 与 limits。预算耗尽为 ResourceLimit，不当作 false、不回退运行期、不交付部分输出。\n\n输出仍是未核源/Core，保留条件、选中节点的实际源位置与选择轨迹，后续完整经过普通 Types、Analyze、独立 Verify 与机器生成。源码生成不产生已核权限；schema/Wire27、默认限额与产品门不因本片放宽。必须验证跨模块纯函数条件、两种配置、语句列表可见性/清理、未选中语义错误与两支语法、短路/失败、累计配额/缓存以及 O0/O2 原生及实际失败清理，才可接受有限 profile。\n\n### 16.4 有限源级 `#for`（222）\n\n声明和语句 `#for` 接受有限半开整数范围及显式纯标量数组。222首片声明模板仅生成普通函数；228按§16.5扩展有限struct及type alias，230按§16.6扩展有限Unit/Tuple enum；trait/impl及一般Type/Syntax生成仍明确Unsupported；语句模板沿已支持普通语句。普通既有TypeRef中的标量常量位置（例如数组长度）允许按词法作用域替换迭代绑定，替换后仍完整检查普通类型规则，不把运行期同名局部当编译期常量。范围端点为同一种u8/u16/i32/i64类型，降序及相等范围为空；数组为同质Unit/bool/u8/u16/i32/i64值。端点/元素复用§16.3不可变ConfigReady、已有纯标量CTIR、独立CT核验和VM；不使用宿主求值替代目标整数语义。按迭代顺序发射，零迭代不执行模板语义，模板仍必须语法正确。迭代绑定仅在体内可见，按词法作用域替换为真实已核常量；内层绑定正常遮蔽。\n\n每轮私有声明/局部取得源不可拼写、确定性的卫生身份，public导出保留名称并由普通重复规则拒绝冲突。不额外产生运行期作用域，return/defer/break/continue及清理按接收列表中实际生成语句解释。生成代码仍完整经过普通名称、Types、Analyze、独立Verify及机器生成，不产生安全权限。\n\n嵌套生成与#if和后续普通CT共用累计步数/节点余额，所有复制、替换、名字、依赖和轨迹增长前计费，缓存命中继续扣费。源位置与真实依赖保留，生成声明不反向改变当前ConfigReady。#emit、Type/Syntax、条件import、CT全局或新增CT权限不随本片开放。schema/Wire27、默认额度和产品门保持；源码正反例、卫生/影子/阶段、N/N−1/fresh/暖缓存及O0/O2失败清理必须真实通过。\n\n### 16.5 有限生成类型声明（228）\n\n声明位置的`#for`可生成无泛型参数、无方法的普通`struct`与有明确右侧类型的无泛型普通`type`别名，并与同批普通函数组合。各字段、字段默认值、别名右侧、函数签名及类型实参内的既有标量常量位置按迭代绑定替换；产物仍是未核AST，完整通过普通Expand、Types、Analyze、独立Verify及机器生成，不产生Copy、拥有或借用权限。此范围不开放resource/package/enum/trait/impl、关联类型、泛型类型声明、Type/Syntax值、反射或`#emit`；普通类型系统既有拒绝与未实现边界仍适用。\n\n每轮先绑定完整同批声明，再改写引用，允许普通源本已支持的向前引用。类型名、类型构造路径与值名使用各自词法命名空间；值局部不能劫持类型引用，函数泛型类型参数正常遮蔽同拼写生成类型。每轮私有类型取得确定且源不可拼写的独立名义身份，同布局不合并；公开名称保留，轮内或跨轮重复按普通声明规则拒绝，重复私名不能被卫生改名拆成合法不同声明。嵌套生成保留内外实际绑定，外部不能猜取生成私名。生成前仍执行普通源的声明保留名约束，不能通过卫生名隐藏i32、ByteBuffer、Store、Copy等原本禁止的声明。\n\nConfigReady继续使用本批开始前的不可变声明快照；新类型及其布局不得回流参与本批CT条件。新增命名空间、名称复制、类型遍历、替换与节点增长均在工作前从同一请求余额扣费；无类型声明的旧生成路径费用保持。验收须包括类型/值遮蔽、泛型遮蔽、私有名义隔离、公开冲突、嵌套生成、保留名、递归拒绝、阶段环、N/N−1/fresh及暖缓存，并以O0/O2真实机器消费者与普通手写展开源对照。登记只冻结合同，不代表实现、完整1.4或ZUI验收。\n\n### 16.6 有限生成普通枚举（230）\n\n在§16.5同批类型生成上开放无泛型参数、仅Unit/Tuple变体的普通enum，可与同批struct、type alias及普通函数组合。Tuple载荷满足普通枚举实际已核资格；239–244同批将其扩至§8.1.5的有限完整拥有形状，显式manages字段标记在生成、卫生重写和类型替换中完整保留。生成仅产生普通未核AST，不能把裸资源名/Desc升级为Managed，也不授予借用或递归by-value权限。record变体、泛型enum、resource/package/trait/impl、一般Type/Syntax及#emit不在本片范围。\n\n每轮预绑定全部同批名义类型，私有enum取得确定且彼此独立的卫生身份；构造器、匹配模式、别名、函数签名与载荷类型中的引用一致重写，变体名保持原名。值局部与泛型type binder的遮蔽、真实模块限定路径、重复变体和公开重名沿普通规则。载荷类型中的既有标量常量位按迭代绑定替换，属性仍经过普通校验。ConfigReady不回流、零迭代、冷暖缓存及请求累计预算沿§16.5；新增变体扫描在工作前收费，无enum的旧路径费用保持。须用生成源与普通展开源的O0/O2机器对照、跨轮名义隔离、构造/匹配/遮蔽、非法载荷、raw/Wire及N/N−1/fresh证明有限实现。新增拥有载荷还须生成/手写相同源码语义、多个轮次名义隔离、真实活动分支清理与失败路径的O0/O2对照；原bare ByteBuffer载荷非法反例保持，不以接受拥有形状为由升级默认资源模式。\n\n### 16.7 Type、Syntax 与具名扩展（257–262）\n\nType与Syntax使用普通函数、局部、分支、循环和调用语法，只在CT域传返；不建立第二种函数语言。Type/Syntax/Ident/TokenTree/Text及反射描述均为有界CT数据，无运行期ABI、地址、资源或验证权限。既有纯标量CT路径继续有效；新值由独立CTIR核验后执行同一目标数值规则，不能借宿主求值或Unit擦除伪装为已核标量程序。\n\n构造写`quote\u003cExpr|Type|StmtList|ItemList\u003e{…}`，模板洞写`$(ct_expr)`；quote是此固定外形的上下文词，`$`只在模板洞位置有效。洞按表达式、类型、列表或名字槽核类别，列表洞不隐式增加块；字符串内的符号不作洞。嵌套quote有自己的洞层。`#splice(expr)`在表达式/类型位置分别显式消费Syntax\u003cExpr\u003e/Syntax\u003cType\u003e；原`#(expr)`的Syntax结果仍只是数据。类型位置`#(expr)`只消费Type。`#emit expr`在语句/声明位置分别消费Syntax\u003cStmtList\u003e/Syntax\u003cItemList\u003e，空列表合法，各类别不隐式转换。全部产物仍是未核语法，进入普通Expand、Types、Analyze、独立Verify与机器生成。\n\n类型名可在CT值位置解析为Type；真实值词法绑定优先，不按文本或布局猜名义身份。`import std.meta as meta`与`import std.syntax as syntax`选择固定的CT标准接口，按真实模块身份识别，不按局部变量字符串授信。meta提供类型构造、只读field/shape/impl/layout查询；syntax提供literal/type_ref/name_expr、fresh/export、保留来源的token遍历及四类别parse。接口通过显式导入使用，无任意文件、时钟、网络或运行期资源访问。标准模块名保留，用户同名文件不得冒充。\n\n输入名字保留真实调用点绑定；模板新声明及其引用在每次物化取得确定的新作用域；自由库引用按模板定义点身份解析。Ident是CT名字句柄；fresh产生新绑定，export仅表达目标声明命名空间的导出意图，不能读取调用点环境。成员名保留owner身份。复用一个Syntax值必须重新实例化其新绑定槽，输入/定义点身份保持；两个生成位置的同布局声明不合并名义身份。来源/预览不是权限，原始ID、scope、span和模板洞都必须按实际源码与项目索引检查。\n\n`syntax use path as alias`绑定锁清单中的具名provider；alias!选择明确default，alias.entry!选择具名入口，每入口固定输出类别及允许定界符。provider使用普通已核CT函数接收无损TokenTree并返回对应Syntax，可跨模块、多provider组合；不按导入顺序抢占token。锁包含逻辑模块/导出、源实现内容哈希、语法版本/哈希及CT规则版本；缺失、重复、过期或与实际源码不符时拒绝，不自动更新锁。CLI以显式`--syntax-lock PATH`提供锁，内存项目由请求选项提供同等数据；锁内容进入构建输入。未知扩展保留原token用于诊断、格式化输入及展开预览。\n\nType传递不携可见性授权。反射按执行函数的真实词法定义上下文查询不可变快照；shape只含可见字段并明确是否完整，隐藏字段不能当不存在或作为Copy证明。layout另绑定target/ABI，成员偏移只对应获准成员。Config/Shape/ImplIndex/Layout/Contract/VerifiedCTBody分别就绪；本批发射的声明和impl不反向修改本批已查询集合。尚未就绪或依赖环明确拒绝，不循环重试；普通未知名仍是名字错误。后期生成import/syntax use不能暗改已封存发现图。ItemList可生成普通手写源码已支持的声明，不另设仅函数/单节点白名单，也不扩大手写语言权限。\n\nCT artifact使用独立schema与编码版本1，普通runtime schema/Wire31不变。解析/反序列化仅产生raw；VerifiedCTArtifactProgram只能由独立核构造，运行期Verify不依赖CT生成器的证明。新路径在增长前扣同一请求余额：步骤、临时字节、生成节点、深度、实例及核验工作分别计量。默认上限分别取现有Limits的max_ct_steps、max_source_bytes、max_nodes、max_call_depth、max_functions、max_analysis_steps；live cells上限取max_values。旧路径默认值与精确费用不变，各阶段传剩余额度，不按provider/模块/调用重置。缓存键绑定实际源码、锁/实现、真实查询依赖、规则、额度和必要target；命中仍扣原逻辑费用。发射先完成类别、名字、结构和预算预检，再原子发布；失败不留下半个声明、impl或可运行产物。\n\n验收覆盖Type传返/构造/反射、四类别、多模块多provider、名字影子/一次求值/名义不合并、可见性与阶段环、CT-only与类别反例、raw编码及独立核、冷暖N/N−1/fresh，以及生成与手写等价程序的O0/O2和真实失败清理。单provider表达式纵切仅用于早期联通，不替代本节完整范围。\n\n\u003ca id=\"ZIL-ATTRIBUTE\"\u003e\u003c/a\u003e\n\n## 17. `#[...]` 属性与编译阶段\n\n### 17.1 语法和作用对象\n\n一个属性段只包含一个属性：`#[path]`、`#[path(args)]` 或 `#[doc = string]`；多个属性逐段书写。`path` 使用命名空间点号，不是字符串。属性只附着到紧随其后的声明、字段、enum变体或形参；具体许可目标由 `spec/attributes.json` 固定。不能悬空、不能附着任意值表达式、不能改变相邻语句的含义。模块级策略由 `zil.toml` 和显式模块声明提供，不使用内属性 `#![]`。\n\n```zil\n#[repr(C)]\n#[align(16)]\nstruct Packet {\n    code: u32\n    size: u32\n}\n\n#[cfg(target.os == \"windows\")]\nextern \"C\" fn platform_open(code: u32) -\u003e i32;\n\n#[derive(Debug, Eq)]\nstruct Point { x: i32; y: i32 }\n\n#[inline]\nfn square(x: u32) -\u003e u32 { return x * x }\n```\n\n`repr` 的 C/transparent 是注册表规定的枚举参数，`derive` 的 Debug/Eq 是 trait 路径，`align` 的参数是可编译期求值整数。它们不是任意无类型函数调用。属性参数所在位置自动要求编译期已知，不必再套 `#(...)`；嵌套 # 求值若使用，按同一规则处理而不增加权限。\n\n裸 `[Attr]` 不作为属性写法，保留给数组、切片、下标和其它既定类型语法。与 `#(...)` 没有语法冲突：`#` 后是 `[` 进入属性产生式，是 `(` 进入求值，是 `{` 进入块。\n\n### 17.2 分类、阶段和重复规则\n\n| 类别 | 例子 | 消费阶段及限制 |\n|---|---|---|\n| 配置裁剪 | `cfg` | 仅读取构建/目标/feature 的封闭配置表达式；在名称、类型和生成之前裁剪 |\n| 句法变换 | 显式导入的 `ui.component` | 读定界 Syntax；只输出未核 CoreAST，不能读取当前未完成类型 |\n| 类型辅助生成 | `derive` | 读完成的原声明形状；只能追加生成项，不回写原类型字段/基类 |\n| 表示约束 | `repr`、`align` | 类型与目标布局检查，失败即拒绝；不会自动保证外部 ABI 合同 |\n| 生成提示 | `inline` | 已核代码的生成提示，不改变源程序安全接受集或实际语义 |\n| 文档、lint、测试登记 | `doc`、`allow`、`test` | 只作用于注册的元数据/诊断/测试入口，不能关闭安全错误 |\n\n所有属性先做词法、定界及参数结构解析。配置裁剪为 false 的项不进入名字/类型/其他属性解析执行；不能因此接受未闭合 token。未知属性只在保留的项上解析报错。重复 cfg 逻辑与；doc 按源码顺序拼接；其他单次属性重复报错，即使参数相同。derive 列表中的重复 trait 报错。\n\n同一阶段内，句法变换按源码顺序接收上一次结果并保留未消费属性；阶段先后由注册表决定，不依赖把 `#[derive]` 写在 `#[repr]` 上面还是下面。生成属性读取同一个冻结形状，产物汇总后检查重名与 impl 冲突；不让生成器先后顺序决定 trait 成功。生成的新项重新进入相应阶段，配额计入且依赖环拒绝。\n\n`#[inline(always)]` 是尽力提示，不是安全事实；`#[inline(never)]` 与其他 inline 同附着时冲突。align 必须满足目标的正二次幂和最大对齐限制；repr(C) 不验证某个 C 头与声明完全一致。未知属性、错误目标、错误参数类型、冲突属性都有不同错误码。\n\n### 17.3 属性不等于任意编译器访问\n\n第三方属性清单必须预注册：输入类别、作用目标、阶段、可查询接口、输入依赖、输出类别与资源预算。导入清单是构建输入，不由属性执行偷偷加载。\n\n不存在 safe `#[alive]`、`#[unique]`、`#[noalias]`、`#[trusted]` 来直接授予事实；标准低层符号/段/内联汇编属性若需要外部承诺，必须在显式 unsafe/FFI 合同中接受审计。`#[allow(...)]` 仅接受 lint 注册表中的名称，安全错误码不属于 lint。\n\n默认不把自定义属性实例保留到运行时，不强制生成反射表。程序确需运行时元数据时，由显式生成或库接口选择相应存储，计入二进制和初始化成本。\n\n\n\u003ca id=\"ZIL-TRAIT\"\u003e\u003c/a\u003e\n\n## 18. trait 与语法扩展的固定边界\n\n### 18.1 普通抽象\n\n一个名义 trait 系统统一方法、关联类型、常量和有限关联合同。impl 头为一阶名义模式；要求 trait 或 Self 的最外层名义定义归本包，且已发布实现不重叠。普通 wrapper 不作为绕过所属检查的隐形特例。默认不提供按安全失败回溯、负条件试探或 impl specialization；代码生成专门化不改变 impl 选择。\n\n```zil\ntrait Measure {\n    fn length(self: \u0026Self) -\u003e usize;\n}\nimpl Measure for Point {\n    fn length() -\u003e usize { return 2 }\n}\nfn measured\u003cT: Measure\u003e(value: \u0026T) -\u003e usize {\n    return value.length()\n}\n```\n\n匹配 impl 头只找到候选配方，全部前提满足后才发布证据。候选关联等式不得证明自身前提。泛型正文使用独立已有 bound 支持的符号投影；不要求为常见迭代器组合写手工字典。名义字段递归在声明身份停止；实际关联展开环错误，非重复增长按确定配额停止。\n\nlending 使用 `\u003clife a\u003e` 和 `\u0026'a T`，每次调用绑定与环境固定依赖分开。可写字段与相关内容参数不变型，不能通过缩短表面借期把短命对象写入长命容器。结构性质 Copy/Transfer/Share 由结构规则或明确审计点建立，空 impl 不造权限。\n\n有限显式 life 来源合同（322）：普通 Direct 函数及具体 inherent 方法可声明仅由 `\u003clife a, life b\u003e` 组成的 life binder，以一层共享地址参数和返回类型的 `\u0026'a T` 关联真实来源。binder 属于当前函数，最终接收者占真实参数索引0；返回标注必须对应至少一个实际共享地址输入，同名 life 只规定允许的来源集合，不证明对象相同、独占或不相交。实际 CFG 的每个借用返回根必须属于该声明上界；局部逃逸、窗口冲突、清理和所有既有完整性责任仍独立核验。\n\n未标注返回的有正文函数继续按已有真实来源推导，不因多输入机械误拒。未声明/重复 binder 与错误来源拒绝；未实现的混合类型/可调用泛型、FP/HRTB、where life 偏序、借用存储位置及 trait lending 保持显式 Unsupported，不能擦除标注放行。Self正规化、跨模块、CT/生成后的重建保留相同声明与实际索引。Core保存原binder及参数映射，Types产生未核返回参数上界；Analyze与Verify各自从真实CFG重建并检查，不能共享证明。上界入Typed/Wire/指纹和接口签名；对调用方仍发布独立核得的实际来源，正文变化沿现有依赖失效。新元数据在复制或扩张前计费，默认额度不变；无life路径保持旧语义。该profile不授权可变存储缩短借期或空trait制造权限。\n\n有限普通类型与life参数组合（331）：普通自由Direct函数可在同一binder中声明一个直接`T:Copy`普通类型参数与若干life参数，次序任意。普通类型实参仅计T，`::\u003ci32\u003e`与实际参数推导等价；具体化只替换T，保留函数自己的life binder及真实参数/返回映射。未使用模板先按声明Copy资格和life来源上界符号检查，不能靠i32等实例补证明；调用处life关系按真实输入位置代换，不把跨函数同拼写标签当作相同对象或关系。type与life词法作用域分别维护，life名字不遮蔽外部类型/别名。实例化、模块、CT重建、接口及缓存保留322合同并继续两核独立CFG核验；合法无life路径保持既有推导语义。首片不开放混合F/StoreElement/const、泛型方法、HRTB/FP、where life/storage或其它新trait lending权限；新增遍历、映射与克隆先费后长且累计现有请求限额。\n\n有限具体泛型 trait 实例（323）：在已有静态名义trait范围，trait可声明有限普通类型参数，其具体有序实参、定义模块及真实Self共同确定impl身份。首片为具体本地非泛型Self的完整impl和普通泛型函数inline/where bound消费；trait参数的直接Copy前提须在未用定义与实际实例分别核验，未声明的嵌套义务不能等i32特化补证。无调用定义、所有方法签名及Self/参数替换同样完整检查。相同Self的不同trait实参不构成重复impl；bound已选定的实例可定位其独立静态方法目标，直接方法调用有多个候选时在调用处诊断歧义，不把不同实例合并成同名方法。模块/名义/phantom完整身份、所属、可见性、预算和既有保留Copy/Transfer/Share等边界保持；泛型impl、impl where、关联项、默认/泛型方法和supertrait尚不由此profile开放。\n\n有限trait默认方法（330）：在现有具体静态trait/impl profile内，非泛型、无where/额外合同的方法可给普通默认体。所有默认体包含未使用定义，先按真实trait声明、Self及声明参数bound做符号检查；Self仅有声明给出的trait方法资格，不获得具体字段、Copy或额外impl权限。缺省成员在具体impl中取得唯一普通静态目标，显式完整实现优先；完整trait声明/有序实参/Self身份决定委托目标，同Self不同实例不可串目标。默认体继承trait声明处词法模块/可见性，不被impl模块同名私有项劫持；签名/方法集、所属与coherence规则不变。普通递归成为函数调用边，不递归内联展开。别名、实例、模块正规化、默认成员注入、静态收集及发布消费同一剩余预算，所有重复扫描与克隆先付费；无参默认方法也不能回落到默认新额度。首片默认体不开放新局部借用创建；未用定义期必须显式Unsupported而非擦除。借用结果仅能来自按真实绑定核得的引用输入（含共享/独占Self）或有依据的声明方法委托；按值Self、局部对象的显式或隐式借用不得冒充输入来源，无法证明的来源/局部shadow情形暂Unsupported。源保留self绑定规则不因生成helper改名而放松。本片不开放泛型方法、关联项、supertrait或安全失败回溯；合法但尚未支持的默认体借用组合仍为终态待实现义务。\n\n有限默认体静态函数值（336）：330默认体允许按实际词法定义上下文引用一个有明确结果标注、无环境、非泛型的普通函数符号作为薄函数指针；局部值绑定仍优先。该函数的完整声明参数/结果必须独立满足既有普通Copy函数指针资格，不能借调用方同名类型binder或expected类型补证。定义期比较完整实际签名、名义身份和符号trait参数，未用或被覆盖的错误默认体同样拒绝；模块私有名不泄露、实现模块同名项不劫持。缺少结果标注、泛型函数值、借用/拥有或foreign等未贯通签名仍明确Unsupported，不把合法未来功能登记为永久反例。新增索引访问、签名检查和复制预付同一请求预算；不新增IR/运行时字典或隐式分配。\n\n有限可变life返回（337）：在322的life-only普通Direct函数和具体inherent方法中允许一层`\u0026'a mut T`输入/结果，T沿既有有限地址载荷（含已支持Copy/片）资格。life只声明真实地址输入来源的上界集合；相同标签不授予可变权限、不证明分离，也不能把共享输入升级为独占输入。Types保存引用模式并核对源码类型资格；Analyze与Verify从各自实际CFG重建来源并核对上界，mutable结果的实际输入根必须具有真实mutable输入权限。Analyze产生未核CandidatePlan，不代替Verify对真实指令类型、返回模式和调用处独占窗口的完整独立核验；可变返回仍保持独占，最后一次使用、重借、分支、局部逃逸和清理责任不减。共享/独占参数可属于同一来源上界，但每条实际返回路径必须有真实合法权限。CoreLifeContract/Typed返回参数上界及Wire34表示保持，原始Core、缓存恢复和CT重建重新核验完整合同。带普通类型参数的mutable life不在本片开放：未用模板的符号独占证明尚待实现；331共享T/life能力保持。无life普通可变返回既有能力不重记为本片新增。\n\n泛型可变借用终态接续（342）：所有普通泛型定义（含未调用和无life模板）均按真实形参模式建立符号根、重借父链、活性/最后使用、调用实参同时窗口及分支/回边状态；不能等具体实例化才发现定义期独占冲突。Copy只授予复制已核Copy值，不授予字段、数值或相交可变别名权限。完成上述符号证明后，331的CopyT与life组合可包含一层可变地址输入/返回；337的实际mutable根与声明来源上界分离规则不变，实例仍由Analyze/Verify分别完整核真实CFG与调用窗口。共享或可变模板的返回根必须有真实参数许可，地址返回不可由局部/已失效路径取得。所有新增符号根、loan、集合和join在增长前按同一请求额度计费；旧合法最后使用、真正不相交参数与所有安全拒绝必须保留。\n\n高阶借用薄函数指针接续（342）：`for\u003clife a\u003e fn(\u0026'a T)-\u003e\u0026'a T`等一层Direct地址签名使用函数局部、规范化密集binder关系。公开FunctionLifeContract保存binder_count、实际参数顺序的parameter_lives与result_life，不以词法名字、Span或已有调用身份作为关系。关系只约束地址形参/结果，结果标签必须对应非空真实地址输入集合；可变结果仍要求实际可变输入权限。同一个薄代码地址可复制，但不复制载荷责任。静态目标必须无环境、foreign、teardown或Suspend，完整实际参数/结果/可变模式一致，并由独立核得的实际返回根证明属于指针声明上界。每次间接调用对真实当前实参重新实例化关系，同时核全部参数窗口；返回来源保守取已声明允许输入的实际根，保留重借父链直到真实最后使用，不能借建指针时的对象或其它调用的life取得权限。此地址关系本身不证明嵌套存储/lending或固定环境依赖；这些需要相应独立投影与Hold事实。\n\n借用薄指针的普通省略形式`fn(\u0026T,...)-\u003eR`把所有实际地址输入映射到一个新调用局部上界binder；借用结果必须来自该非空集合，显式`for\u003clife ...\u003e`可声明更窄关系。此上界不证明各输入别名或分离，可变权限仍从实际根取得。CT Type DAG用BorrowedFunctionPointer节点保留完整FunctionLifeContract与参数/结果节点ID，反射、编码及物化不能退化成无life FunctionPointer。binder、map与DAG边均先计费，拒绝不规范关系及环。旧有限无借用指针边界的拒绝用例仅在实际完整消费者成立时按本合同迁移。\n\n可调用参数的高阶life关系（342）：`F: for\u003clife a\u003e Fn(\u0026'a T)-\u003e\u0026'a T`把FunctionLifeContract保留在CoreCallableParameter及Typed CallableRole，约束每次真实调用的输入/返回关系，固定环境Hold仍独立保留。未用定义须按声明关系验证，具体闭包的实际CFG返回根须在该次声明允许的输入集合内；固定捕获根不能洗为新调用binder。参数顺序、可变模式、密集binder、非空返回来源及同时活动窗口由两个核分别重建。源/Core签名依赖、JSON接口、Wire及缓存身份均包含关系，旧候选不能复用旧核验结论。新字段使旧无life角色字节也改变，因此该候选使用Typed/Wire36、typed module域V36、CallableParameterContract域5；CT artifact域2和CallableReturnContract域3在字节不变时保持。现有Type编码未变，不由角色字段自动更改Type身份域。只有完整消费者与独立证据完成后才升级实际接收版本，登记不算通过。\n\n普通有限借入存储共同合同（342，共同Wire39）：`BorrowedStorage{storage,life}`保留有限Record/Package/Tuple/Enum/ErrorUnion的完整底层布局与相对存储叶关系，不制造实际目标或权限。`StorageLifeShape`以声明顺序记录`StorageLifeSlot{path,binder,mode}`；路径仅含真实内联Field/Variant/ErrorArm，完整覆盖每个实际Address/Desc叶恰一次，保留实际tag与初始化。binder按真实语义遍历首次出现规范密集编号；无任何真实关系的空wrapper、重复、漏项、错误模式、无用尾类、直接双wrapper及相互不一致的嵌套关系拒绝。可写/只读描述模式只是访问上界；Copy/StoreElement/capture/Transfer/Share、拥有叶责任与raw pointee资格仍分别证明。机器布局可擦除关系，语义身份不可擦除。\n\n`StorageLifeContract`把持久Fixed与每次新鲜Invocation分域，绑定到真实Parameter/Capture/Result及其完整位置。Fixed须从实际保留的载体类（capture、存储载体或dyn环境port）独立建立，不限语法Capture位置，但裸新调用输入/结果不能凭空引入Fixed。满足已有Fixed的调用不得缩短、重命名为新类或选择较短交集；结果只能引用已实际建立的类。声明同类不证明对象相同、不相交或可变权限。参数空路径选实际外层Address；非空物理路径最多在入口解开一次外层Address，不能隐式穿过存储Address/Desc。合同路径独立为`ContractProjection::Place`及终端`RetainedPort`/`RetainedClass`；RetainedPort只在真实保留载体选择已核typed port，不是GEP、物理字段或加载权限。RetainedClass只绑定真实固定类，不可作为Read/Write/Manage/Call或加载路径。dyn值须保持接收者和映射到的实际目标根。\n\n`LoadStoredBorrow`（129）从实际storage Address和物理路径取得叶。CopyShared分离结果与指针槽epoch/短载体借用，保留真实目标拥有者、父loan链和不变Fixed上界；指针槽可换成仍满足同上界的另一合法目标。若旧目标实际由载体拥有，该拥有依赖不得被分离。CopyDescription的有效权限为实际存储事实、声明上界和实际base权限之交；共享载体或可变借入载体都不能将原只读描述升级。描述实际拥有Managed字段仍用既有DescribeAddress/DescribePackageField，不能与加载存储描述混同。Reborrow保留槽epoch/载体借用并建立真实子loan。Take转交实际许可、使原槽未初始化，保留目标祖先与Fixed上界；refill不使已转交许可失效，但第二次Take、重复独占目标或不完整整体move/call/return均拒绝。\n\n`StoreStoredBorrow`（130）要求真实独占storage、活的初始化祖先、精确叶类型/模式及同一不变上界；同时支持初始化叶替换和空槽refill。新Hold准备并核验后才结束旧权限/清理，所有相交call/result loan仍受保护。借入外部\u0026mut载体在每条普通/错误返回须恢复声明的完整状态，或实际转入合法空enum分支；跨调用部分状态须另有真实状态协议，不能交还一个被假定完整的残缺值。部分本地清理只处理真实剩余责任；本合同不引入隐式Box、RC、pin或运行时借用检查。\n\nCore/Typed函数、ClosureDefinition及ScalarFunction保留完整storage_life关系；涉及存储的签名以它为唯一声明关系，旧flat life若保留须是精确核验的导出投影，矛盾双合同拒绝。未调用定义、实际CFG、目标/alias/权限、导出与缓存分别由现有独立核检查。所有新扫描、路径比较、映射、clone、join、固定点及分配先从同一请求剩余额度付费；先界定深度/尺寸再递归分类。function/closure、完整类型和module表共同使用Typed/Wire39及TypedModule/TypeIdentity域V39；callable独立域仅在其既有字节不变时保持。恢复候选仍重新核验，不复用旧权限结论。\n\n名义life实参的AST `GenericArg::Lifetime`须保留真实参数种类、声明序号、词法scope及联合规范关系，字符串只为语法。普通`SliceIter\u003clife s,T:Copy\u003e`与`Option\u003c\u0026's T\u003e`及trait方法为真实库消费者，不设Iterator内建特权。CT BorrowedStorage节点16/构造器12保存实际storage子节点及完整shape，codec界定类数、路径、增长、分配和DAG边。全名义phantom/lifetime实参仍须有封闭数值scope引用、参数位置及种类核验；不能丢弃实参或使用自由life名字冒充完成，在该消费者落地前显式Unsupported并继续施工。\n\nTask\u003cT\u003e的结果类型不代表隐藏frame依赖；Create后尚未首次poll的入口PC0也保留全部实参/捕获/子frame依赖。仅有result类型而缺少retained shape的Task公共形状不许可借入frame导出或线程转移，除非独立证明没有外部frame依赖；一般借入Task需真实可检查的固定port及完整类型关系后继续开放。request_cancel或Ready不提前释放保留依赖，只有实际关闭排空才归还；Ready转出的借用继续保护实际目标和父链。storage签名单独增加行不能为无port的Task创造可检查的隐藏环境权限。\n\n存储关系的共同固定域包含三类不同事实：`slots`只对应物理Address/Desc叶；`retained`把嵌套qualified载体的每个固定类映射一次；`nominal_arguments`保留完整名义实参中每个life位置，包括无物理字段的phantom。多个port共享一个类时只映射该类一次，不能逐port重新新鲜化。规范顺序来自实际声明及完整实参：先名义life实际位置，再物理叶及嵌套载体的规范类；嵌套载体在边界停止物理展平。所有实际类和出现位置恰好覆盖，冗余、缺项、冲突映射拒绝。只有phantom出现的类有意义，空物理slots不能擦除此类；phantom本身不产生目标根、loan或任何访问权限。\n\n`LifeTypeProjection`的TypeArgument/Pointee/Element/Parameter/Result/Port/AssociatedType只遍历真实语义构造及完整名义/签名信息，不是物理路径。`Pair\u003clife a,life b\u003e{d:\u0026'a dyn Reader\u003c'b\u003e,p:\u0026'b i32}`保留d的外层地址类a和其interface类映射b，不能合并成单一d来源；`Phantom\u003cTag\u003c'b\u003e\u003e`通过真实完整TypeArgument及名义life位置保留b。尚不能完整表达的任意类型实参内借用不得擦除或猜测，须补齐消费者后开放。\n\n完整名义Type实参中的借用关系必须保存，即使该参数无物理字段。例如`Phantom\u003c\u0026'b T\u003e`可在真实Type实参元数据位置使用`BorrowedStorage{storage:Address\u003cT\u003e,life:...}`表示语义类型；这不是运行时holder。只有独立核从实际声明完整参数表证明当前位置是Type实参后，才进入元数据类型上下文。实际局部、值、参数、捕获或物理字段不得因相同wrapper取得此上下文；直接Address/Desc运行时wrapper与直接双wrapper继续拒绝，元数据例外也不自动开放Desc。根借用叶、模式、完整嵌套类与scope映射仍须精确核验，不能从phantom创建目标根、loan或可返回地址。若Type实参经真实字段/签名recipe成为物理位置，关系须同时代换到包围它的实际存储/签名合同并重新核验实际叶，不得复制元数据专用wrapper成为物理holder或擦除关系；完整消费者落地前该形式显式Unsupported。\n\nCore/Typed module的`life_declarations`及`life_instances`承载实际声明身份、Record/Package/Resource/Enum种类、完整有序Type/Const/Lifetime参数及实际向量。`LifeDeclarationId{module,node,compiler}`仅为可重定位引用；跨请求语义身份须解析实际package、module_path、declaration_path、generation_path以及完整实参关系。原始SourceIndex/Origins与CT FrozenReadView保留真实声明沿选择和生成的对应，不以Span、生成名解析或同名代替。消费者独立核验唯一完整实例、精确种类/arity/常量域、实际type及真实参数序号；compiler位亦不能伪造内建声明。表不能证明trait、Copy、可见性、Transfer或Share。raw引用的Type::fingerprint不能单独成为导出/缓存语义身份。\n\nopaque载体共同`RetainedLifeShape`保留binder_count、完整typed ports、嵌套类映射及名义life实参。port有完整借用叶、mode和固定binder；其真实来源映射为`RetainedPortBinding`，独立核验完整实际位置、叶类型、上界与真实目标，不由表项制造权限。Dyn固定interface的完整泛型实参、关联类型/常量、有限方法实例、CallKind、签名、错误/恢复及life/effect合同；普通dyn别名可显式列`type Item=T; const COUNT:usize=3; fn pick::\u003ci32\u003e;`，未列的泛型方法实例不由调用点隐式生长。关联常量的首个表示只覆盖真实Constant标量；完整CT常量仍需实际表示。DynReceiver独立描述被擦除的接收者param0，不制造interface自引用物理边；CallDynSlot显式receiver不重复列入普通args。Unknown合同不可当作空。表ID须随module/function relocation一致更新，稳定键使用解析后的完整上下文。\n\n`Task{result,retained_life}`保留共同固定域、typed ports及结果内嵌套关系。空shape只声明原封闭frame profile，仍须从实际PC0实参/捕获、所有保存PC的local/SSA、活动child及结果独立重建。TaskCreate传递实际worker及已求值的有序参数，输入准备、分配失败、成功转交各自守恒并保持真实清理顺序。内部child借入父frame的拥有存储建立真实frame loan，不伪造外部port；父释放等待child关闭排空。Ready结果若借入frame，真实loan须阻止Destroy至最后使用。显式Task\u003cT\u003e注解不能擦除推断的隐藏shape；跨函数/模块保存、move和返回保留完整上下文身份。裸C/SABI的借入frame输出须有可独立检查的实际边界，不由结果T推断。\n\nCT4以一份联合`life_context`表达名义应用完整的Type/Const/Lifetime实参及关系。`CtLifetimeArgument{owner,binder}`引用实际词法包围的binder拥有者，数值owner为语义反向引用，不是物理DAG边；分别核验物理图与词法scope、域和范围，同形兄弟owner不可替代祖先。节点复制/重编号连同owner一致变换，键以已核相对scope/域/序号表示。带context的schema Type实参必须为同一图内的`TypeInContext`并选择对应实际参数，禁止独立Type图逐参新鲜化后丢掉相等关系；无context时仅接纳实际封闭Type图。提取Type参数保留真实scope handle；当前返回形状无法表达时显式Unsupported并继续补齐，不能新建自由life名或空wrapper。Task/Dyn的完整CT节点和上下文桥仍须另外实现，不由运行时表示自动开放。\n\n共同形状和module记录改变字节后，公共schema/Wire统一为39，TypedModule/TypeIdentity域V39；CT schema及相关artifact/program/provider/dependency/function/value域为4。历史Wire38/CT3不复用新版布局。所有新表、路径、端口叶、上下文键、映射和clone在扫描/增长前从同一请求剩余额度预费；数字owner不能触发无界递归。codec只证明有限运输，独立实际根、权限、清理及源码/机器消费者仍必须分别落地。未接通的旧消费者显式拒绝新形状，不能默默忽略非空元数据。\n\n\n有限普通 Copy 泛型 profile（194）：直接 `T: Copy` 是编译器按实际结构检查的保留能力约束，当前入口限已支持有限普通 Copy Value：标量、元组、固定数组、名义记录/枚举、Copy错误联合及受支持无环境函数指针。Desc、Managed、Package、Closure、Address、裸Slice及递归/未支持形状不由此获得普通Copy类型实参资格；显式`\u0026T`/`\u0026mut T`沿既有地址规则，T自身仍须合格。定义期只可使用Copy所授予的复制与普通传递，不授予数值运算、公开字段、任意trait方法或callable能力；未使用的模板同样检查，用户同名空trait或impl不能制造该结构事实。实例化再次按实际形状、名义身份及原工作/深度额度核验。\n\n普通 Struct 的直接 Copy 参数约束（320）：在已有普通泛型 Struct 范围，类型参数可声明直接保留 `Copy` bound；每个 bound 只约束其具名参数，其余无 bound 参数保持原规则，不据此推断整个 Struct 为 Copy。字段声明及嵌套泛型应用在定义期核验，未使用的声明同样检查；内层 Copy obligation 须由当前真实 binder 的已声明约束证明，不能等实际 i32 特化后补证。实际实例逐一验证受约束参数的完整普通 Copy 资格，包含未出现在字段中的 phantom 参数；透明别名正规化、名义身份与完整实例键沿现有规则。此片不开放 aggregate where、任意 trait bound、Package/Resource 的新约束、方法或默认字段；既有字段资格保持。新增遍历/类型比较在增长前累计收费，默认额度不变，源正反例、实例身份和预算以及原生结果须实际核回。\n\n有限`where Copy`正规化（229）：普通自由函数可把已有直接`T:Copy`约束写为`fn f\u003cT\u003e(...) ... where T:Copy`，其含义与内联约束完全相同。首片仅接受同一函数直接声明的普通类型参数作为单段主体、无类型实参的保留Copy约束；函数泛型参数仅限普通类型，已有内联约束为空或Copy。相同Copy约束在内联与where或多个where子句重复时幂等合并，不制造额外权限；不同直接类型参数分别归并，绑定以当前函数声明为准。未知主体、投影/复合主体、lifetime/const、非Copy bound、callable/StoreElement及方法/impl/外部声明的where不随本片开放，不能通过丢弃不支持的子句放行。\n\n正规化在既有普通别名和泛型符号检查之前进行。未调用定义也完整核验正文；当前函数普通类型参数必须遮蔽同名外部名义类型，不能借该外部类型的字段、布局或构造器取得未声明能力。实际实例仍独立核Copy资格，未被调用的错误、非Copy实参、名义身份和跨模块私有规则不放宽。不增加求解器、schema、运行时操作或默认额度。新增预检、克隆、名字/子句比较及归并必须预费，并向后续别名正规化与泛型展开传递实际剩余预算，不为每个函数或阶段重置；无where且未触及上述既有同名误绑定缺陷的旧路径保持原精确费用。修复该具名缺陷的普通内联和where路径允许按实际新增词法保护工作收费，须同时保留原输入、原费用、原误接受及修后N/N−1/fresh，不能以保留旧数字跳过核验。需实际源正反例、跨模块、重复约束、未调用定义、N/N−1/fresh、冷/暖路径及O0/O2机器对照后才能记为实现。\n\n有限名义trait的where正规化（231）：在229直接普通类型参数范围内，普通自由函数的where可使用已有普通内联bound支持的无类型实参、无supertrait及无关联项名义trait，并可与Copy和其它已支持名义trait组合。模块阶段真实解析主体与bound，函数本地type binder遮蔽外部同名类型；不能只按路径末段、类型别名或同拼写推定trait身份。实例及未调用定义继续沿现有名义trait资格、方法权限和impl选择检查，不额外授予Copy、字段或callable能力。同一名义trait重复出现（含内联与where两处）沿现有内联规则拒绝；Copy重复仍按229幂等。方法/impl/extern、投影或复合主体、lifetime/const、带参trait、StoreElement/Fn族不由此开放。\n\n231不新增求解器、schema或运行时操作；新增模块解析、索引、声明和子句扫描须先收费并传递同一剩余预算。无where旧路径及未增加模块解析工作的纯Copy旧路径费用保持；跨模块where若新增真实解析工作，保留旧输入/费用并记录N/N−1/fresh迁移。必须覆盖跨模块公开/私有/缺失trait、名称遮蔽、无impl或错误impl、未调用定义、重复约束、内联等价、冷暖预算及O0/O2机器行为。\n\n模块卫生改名不得将Send、Sync、Drop、Fn族等既有保留trait声明变为用户名义trait。对模块阶段实际生成的`$module\u003c十进制编号\u003e_`前缀，仅为保留名排除识别其原声明名；真正名义匹配仍使用完整规范身份，不能按末段制造相等。该排除同时覆盖既有inline和where名义入口，非模块名字及其它用户拼写不按任意下划线拆分。原误接受、修后最近反例与实际新增检查费用独立保留（changes/231-reserved-module-traits.md）。\n\n跨模块普通trait实现实施边界（233）：当前项目实际解析并导入的公开、无类型实参、无supertrait及无关联项普通trait，可在另一个模块为该模块定义的具体非泛型Struct或已支持用户资源Self提供实现。Self归属以真实声明为准，不开放外来Self或泛型impl。接收者从真实trait签名继承，或显式提供等价的既有Self/共享/独占形式；资源Self仍只准入原共享接收者。方法沿既有有限签名，无方法泛型、where、默认体或新增关联项。导出方法须同时满足本地Self公开及trait真实公开；私有访问、同名身份混淆、重复impl、字段/inherent碰撞及签名不符继续拒绝，inline/where消费同一名义关系。保留trait排除同样适用于不经过泛型bound的普通声明/impl路径。复用现有Core/Typed表示和静态调用，不新增运行时字典、schema、隐式权限或默认额度；新索引与解析工作先收费。\n\n该有限profile允许同步helper含唯一callable类型F与唯一直接`T:Copy`参数，声明次序任意；F仍仅有一个既定F/\u0026F/\u0026mut F环境实参。普通实参或明确结果上下文确定T后，先按规范化实际T生成独立模板并完整代入正文、参数、结果及F bound，再保留唯一F进入既有具体环境实例化。实例身份必须包含模板声明和完整实际T，即使T不在F签名中也不可省略；同布局不同名义类型不能合并，透明别名按同一实际类型归一。每个独立声明沿正常lowering取得新Core节点身份，不能把多个T共用未特化模板或靠布局猜类型。嵌套helper按代入后的符号签名和真实普通参数bound检查；仅本片不开放多环境角色、F/G双callable、State\u003cT,F\u003e混合拥有形状或单环境混合调用模式。公开单环境合同、独立Analyze/Verify、当前调用权限及清理义务保持；具体准入完成状态以194精确冻结和非作者验收为准。\n\n\n有限混合拥有State profile（197）：在194的唯一F与唯一直接函数`T:Copy`基础上，允许一个无聚合bound的`package State\u003cT,F\u003e`或`State\u003cF,T\u003e`保存唯一直接callable字段及有限Copy数据，继续满足既有Package资源字段、完整责任与清理规则。State外壳也可提供普通T推导约束；参数求值一次，F身份只由实际环境确定。原始名义声明和完整规范化普通T决定数据族，真实ClosureId决定具体环境；phantom T、不同模块同名或同布局名义类型不能合并，相同实际T的透明别名和不同词法F/G应归一。普通T所有复制、遍历、键构造及字段扫描在原额度中先计费。未调用定义也检查Copy能力；Copy不授予字段、数值或callable操作。State整体不获得Copy，多callback字段、多个环境角色的拥有State、aggregate上的一般bound及动态擦除不由本片开放。192真实sibling字段权限、FnOnce责任和独立Analyze/Verify保持。\n\n有限多角色同步helper profile（196）：允许至多两个直接F、\u0026F或\u0026mut F环境形参，可来自同一callable泛型或分别F/G，普通Copy T沿194规则。每个真实形参位置是独立角色；相同ClosureId仅表示类型/布局，不表示同一运行时实例或apart。相同泛型的角色使用一致bound和传递模式；不同F/G可有各自已核模式。实例键按callable泛型声明顺序包含全部实际ClosureId，不能按角色到达或布局猜类型。角色表按真实形参位置严格排序且唯一，完全覆盖环境参数；一份联合有序Finite/Flow调用语言记录`{parameter, kind}`事件，保留分支相关性、先后顺序及Return/Trap/无返回前缀。各角色独立的计数或轨迹笛卡尔积不能替代联合合同。\n\nTypes、Analyze和Verify分别从实际参数、值/局部传播、CFG及每个静态child调用点的实参替换重建角色事实与联合轨迹；Verify不调用前两阶段求证。每次普通调用按源顺序准备所有实参，并同时检查全部实际窗口；重借或自身窗口豁免只对当前角色成立，不能联合角色权限。写上界、Hold/Call和Owned/Borrowed清理按真实角色环境分别代入；未知或混合来源不能当空集合。有限无回边路径逐角色限制FnOnce至多一次，有可达回边且存在FnOnce角色仍Unsupported。首片多角色限同步不逃逸及Copy结果；多角色lending/拥有State投影、dyn、async与持久保存不由本片开放。所有角色、事件、来源集合、实例键和child替换/队列/复制在分配或扩张前按现有额度收费；默认额度不提高。公共表示变更发布schema/Wire25和新指纹域，旧版本明确拒绝。上述两profile的实际准入完成状态以精确实现和非作者验收为准，登记不等于实现。\n\n\n有限同F双字段拥有State profile（200）：沿197的单callable类型身份，允许一个完整Package保存一或两个直接、自含、同F的callable字段，普通Copy T仍沿194/197规则。唯一F类型绑定不合并两个实际环境值；相同ClosureId的不同字段始终是独立位置与责任。新增拥有构造入口可按值接收至多两个同F且同声明模式的直接实参，返回该完整State；新增双输入入口的其余形参仅限既有有限Copy值或直接Managed值，不引入额外State、Desc或地址参数；既有单输入入口保持原规则；以实际签名、字段与转交行为识别，不依赖函数名。既有单State参数操作保持，首片不由此开放State加replacement F、两个State参数、F/G State或嵌套callable字段。\n\n两个实参按源顺序各准备一次；构造只消费实际转入的责任，失败只结算已获得的责任。完整返回、移动和清理继续服从Package实际字段及部分状态规则，不能去重相同ClosureId后漏查或漏清理第二份。Fn/FnMut直接字段调用沿199的实际位置；FnOnce及较强实际环境到声明FnOnce的适配仍消费对应字段。普通T名义族、透明别名、phantom参数、未调用定义检查及原预算保持。\n\n该拥有构造是有限自含值边界，不是196的同步不逃逸helper；不得伪造空Call合同或把字段号编码成参数角色。Types分别核两个输入的实际同F身份；Analyze与Verify独立从真实类型、指令和责任核拥有构造，不消费前端分类证明。自含条件、实际移动、字段初始化、窗口失效与清理须分别覆盖每个输入/字段。现有公开表示仅在这些责任可独立表达时复用；缺必要事实则显式拒绝并补足接口，不放宽安全检查。所有字段扫描、输入准备、类型键及实例计划在现有额度内预先收费，默认额度不变。Store的元素资格、dyn、async、外部保留及多F/G持久存储不由本片开放。准入完成仍由原探针、相邻责任反例、raw/Wire、机器故障清理及非作者冻结验收决定。\n\n静态目标保持直接路径；`dyn` 明确固定实际参数、结果、环境、管理路由、错误和恢复 ABI。不兼容的泛型方法不能塞入 vtable。实例共享须保持合法值、布局、Drop、错误、调用和别名合同；同尺寸不是等价证明。语义检查一次不等于所有机器生成都只发生一次。\n\n### 18.2 可替换的表面层\n\n```zil\nsyntax use zui.syntax as ui\nlet panel = ui! { column { text(\"Ready\") } }\n```\n\n固定 parser 识别命名扩展的外层定界，扩展内部规则由锁定清单提供。没有全局 token 抢占和导入顺序改变优先级。第三方只能生成未核 Syntax/CoreAST；新分配、回收、挂起或权限语义不是糖，不能通过扩展绕过核。\n\n名字使用作用域身份：输入保持调用点绑定，新名字带新卫生作用域，引用库声明使用定义点身份。扩展必须提供源映射、展开预览和格式化输入；未知扩展仍保留原 token，不吞掉源码。\n\n标准糖可以由受限 VM、预编译或编译器内置展开器实现。替换要求规范化 CoreAST 的绑定、求值次数、效果顺序、退出边和错误类别一致，临时 ID 与位置编码单独归一化。普通未使用扩展的代码不启动扩展 VM。展开产物仍按正常流程检查；内置化不绕过验证，也不代表任意生成程序零成本。\n\n\n\u003ca id=\"ZIL-ARCH\"\u003e\u003c/a\u003e\n\n## 19. Rust 编译器架构与依赖约束\n\n编译器主实现为 Rust，稳定工具链与依赖精确锁定，不使用 rustc_private，不把 ZIL 转成 Rust 后用宿主借用检查器代替本语言核。Cargo workspace 管理编译器自身构建；ZIL 的模块、包清单、缓存与目标是独立产品接口。\n\n主要数据使用类型化 ID、紧凑表、不可变阶段快照。每张大表有唯一写入阶段；禁止跨模块共享任意可写 CompilerContext。内部普通调用不因为解耦增加 RPC、JSON 或逐操作虚派发。crate 按可信边界、独立状态、替换点和重依赖划分，小算法先用 module。\n\n| 模块 | 主要职责与输出 | 禁止项 |\n|---|---|---|\n| base / ir | ID、span、诊断及 Core/TypedCFG/合同/证据/LIR schema | 不含求解、driver 或平台状态 |\n| syntax / expand | 无损树、固定语法、卫生、未核 CoreAST | 不构造 Verified，不调用安全求解 |\n| ct | 已核 CTIR 的受限执行 | 不递归进入未完成类型/impl 查询 |\n| types | 名字、类别、trait、有限投影与类型证据 | 不按安全失败换目标 |\n| analyze | 来源、One/Many、绑定、前缀合同、窗口与责任计划 | 不展开运行时堆，不读私有 callee 正文 |\n| verify | 独立核验转移、证据、调用与所有控制边 | 不依赖 types/analyze 的求证实现 |\n| lower | 实际布局、ABI、初始化、清理和帧 | 不按 parser 关键字补安全语义 |\n| backend | 消费共同 LIR 与合法目标属性 | 不擅添 noalias 或降低错误合同 |\n| db / driver | 查询、结果指纹、阶段调度与组件组合 | 叶模块不得反向依赖 driver |\n| runtime | 内存、同步、完成根、平台适配 | 不依赖编译器、ZUI 或业务对象 |\n| cli / ide | 同一语义查询入口 | 不维护第二个安全检查器 |\n\n允许的内部依赖见 `policy/dependencies.json`。verify 强制 `forbid(unsafe_code)`；其他 unsafe 限于申明并审计的原语/FFI。模式求解和独立核验可以共享 schema、格式解码和算术定义，不共享得出安全结论的求证函数。\n\n阶段数据流为 Syntax→CoreAST→TypedCFG→候选计划→VerifiedIR→LIR→目标产物。crate 依赖不是这条流水线的简单串联；driver 传入已完成形状快照，以避免 expand/types/ct 互相递归 import。\n\n语义、ABI、私有实现、源位置和真实构建输入分别产生结果指纹。私有体变化不重查未使用其语义变化的调用方；内联、comptime、布局、真实特化依赖必须传播。序列化成功与内容哈希只证明完整性，不证明对象码与接口语义一致。\n\n必需判定与可选优化分开计费。记录源码操作、事实/边、来源节点与展开条目、trait目标、实例、证书、核验、生成与链接成本；不得预建 CFG×来源×对象的笛卡尔积。未知普通 safe 行为不能降为默认动态保活。\n\n\n### 19.1 查询粒度：先建立语义边界，再选择调度库\n\n查询的逐步目标为：文件 Parse → 声明形状/名字与导出 → 单项类型/合同 → 必要的递归强连通分量 → 单函数候选/核验 → 实例/LIR/代码生成单元。声明递归或效果互相依赖时使用真实 SCC，不强行把环拆成独立查询，也不把整个项目长期视为一个查询。\n\n返回值变化只传播到真实依赖相应指纹的消费者。存在 Semantic/ABI/Private 等枚举，不等于实现已具备这种粒度；必须用无关私有体修改、公开合同修改、布局/CT/内联修改和插入未用声明的对照测试证明失效范围。\n\n查询执行期间输入不可变；取消/超预算不发布半成品，未知和诊断不能被缓存为已核成功。驱动、IDE与CLI共用这些查询和同一规则。缓存命中不得绕过规范要求的预算与资格检查。反向依赖队列、逐项结果比对和缓存淘汰策略属于可测实现选择，不以“换一个框架”代替粒度修复。\n\n### 19.2 独立核验不要求复制不可变数据\n\nTypedCFG、名义声明和候选计划可以由不可变共享快照承载。Verify 必须独立计算/核对安全事实，但不必为了独立性深复制这些原始输入。快照不得含可在核验后被另一个阶段修改的内部状态；capability 绑定精确快照、规则、目标与已核合同。\n\n当前每次完整请求独立 Verify 的要求保持。反序列化、指纹相同或对象缓存命中，都不能直接构造 Verified。共享原始表示与共用安全求证实现是两件事：前者允许，后者禁止。\n\n可另行研究“检查归纳证书而非重复搜索固定点”：候选提供有限块不变量；检查器独立核验入口覆盖、全部控制边的转移闭合、每个实际操作的安全前提，以及调用/递归合同的一致性。缺失错误、取消、清理或不返回前缀都必须拒绝。满足这些条件的归纳上界不必是最小固定点，但必须足以证明当前程序安全。\n\n该证书路径在与现有独立重算核对之前不是生产捷径。证书大小、解码、逐边核验、摘要绑定和预算全部计入成本；禁止假设证书验证总比重算便宜，也不能把分析器给出的安全结论直接当证书。\n\n### 19.3 稳定编译身份与结构化 CGU\n\n区分局部紧凑 ID、稳定声明身份、泛型/闭包实例身份、运行时资源实例和当前验证授权。跨请求符号不能仅由遍历中的全局递增序号决定；插入无关私有声明不应机械地改写所有已有符号。\n\n稳定声明身份基于包/模块/声明绑定及必要的生成/名义来源；实例身份另含真正影响实现的类型、常量和选择。源码字节偏移、内存地址、随机 HashMap 顺序不能单独承担跨请求身份。匿名项匹配歧义或名义身份变化时保守失效，不能为了命中缓存合并不同实体。\n\n代码生成单元从结构化实体/符号引用图形成，再分别输出文本或 API Module。引用图包括调用、取地址、全局初始化、函数表、Drop/closure helper和必要数据；本地链接属性与身份一致性必须保持。导入别的单元的声明不要求传递导入被调函数的所有正文依赖；内联/LTO实际消费正文时另计。\n\n分区首先满足语义与链接要求，再在稳定性、负载均衡和优化质量间作可测选择。不把按函数大小重排的贪心分箱直接当细粒度增量方案。旧文本扫描分区可保留为过渡与差分基线；遇未知格式仍保守回退，不把临时扫描器扩张成第二套 LLVM 语义实现。\n\n### 19.4 验证授权、对象 action key 与产物身份分离\n\n完整验证授权绑定当前程序，是允许生成/发布的条件；机器码复用键描述一个单元实际读到的代码生成输入；产物内容哈希描述输出字节。三者不可互换。全局验证摘要不应仅以诊断注释的形式污染所有单元的机器输入身份，但不能删除其与当前请求的授权绑定。\n\n规范化不得抹去求值、捕获字段、析构、效果和链接可观察的顺序；只消除已证无关的表示差异。语义查询命中时，诊断和调试来源仍须绑定当前快照，不复用过期源码位置。\n\n对象 action key 至少覆盖规范化单元 LIR、实际布局/ABI与被消费依赖、目标三元组/CPU/features/data-layout、算术/异常模式、编译器与后端版本、优化 pipeline、调试/重定位/代码模型和相关运行时输入。链接键覆盖对象内容、顺序与链接器/选项/运行库。常量、CT、内联或LTO依赖按实际消费补入，不能只对函数正文哈希。\n\n缓存来自明确可信的构建环境，损坏或不匹配时按 miss 重建；错误、取消和半成品不缓存。内容哈希不能证明不可信对象文件与 LIR 语义一致。共享/远端缓存的真实性与权限必须单独纳入供应链可信边界；不因有 SHA256 就默认信任任意缓存对象。\n\n每次请求先满足当前语言核验，再按正确机器键复用对象。缓存命中不恢复一张过期安全许可，不抹掉当前源码的错误。局部机器输入未变而全局验证摘要变化，可以在上述条件下合法复用。\n\n### 19.5 LLVM API 的独立边界与分阶段接入\n\n后端入口接收不可变、已绑定核验结果的 CodegenUnit/目标配置，输出对象或结构化失败。安全核与前端不接触原生 LLVM 指针。LLVM FFI放在明确登记、最小化并审计的后端边界；现有 workspace 禁 unsafe 的实现设置必须显式处理，不能在随意模块解除。\n\n并行单元各自管理 Context/Module/Builder 生命周期，不能跨 Context 搬用值或共享可变原生句柄。统一初始化、目标支持、诊断回传、取消、释放和错误产物清理由适配层负责。进程隔离是可评估方案，不要求为每条指令引入 RPC；生产接口粒度为单元/对象，不是逐语句远程调用。\n\n迁移顺序为：对象/链接接口对齐 → 同 LLVM 版本的文本解析 API 对照 → 逐类 LIR 直接 Builder → 功能/运行质量/完整成本门通过后的产品默认推荐。按209用户指示，研发命令行入口可在有限支持profile的功能与失败回归通过后提前默认使用LLVM API；此项只改变研发构建策略，不表示运行质量、完整成本、完整语言或产品门已经通过。文本解析 API仍支付文本生成和解析，不得称其已完成直接 Builder。原文本/Clang路径保留为回归对照，不将后端接入设为类型化分区或对象缓存的硬前置。\n\n不复制外部项目的宿主目标假设、逐次创建开销或仅打印 verifier 错误后继续生成的路径。O0分块和O2整体/ThinLTO分别验证；冷启动、常驻、串行、并行、缓存命中和失效分别报告。\n\n### 19.6 泛型、traits 与控制效果的取舍\n\n保留第18章名义 trait 与固定 impl 选择。需要多个算法策略时优先使用普通显式策略参数/包装类型，不为追求隐式语法引入另一套作用域实例搜索；任何未来改变 coherence 的方案单独立项。\n\n可借鉴按需求传播“泛型真正需要的布局/操作”来减少无意义实例，不据同尺寸合并不同 Drop、名义身份、错误或调用合同。存在化可作为后续独立开发构建实验，不和当前 ZUI 所需语言缺口捆绑交付，也不预设比单态化更快。\n\n访问/失效效果分析与用户可捕获/恢复的代数效应不是同一功能。这里仅规定前者及现有高阶合同，不引入隐式协程栈、多次恢复或新的动态分派。若未来引入后者，必须与第12章的存储、取消、清理、重入及帧责任共同证明。\n\n\u003ca id=\"ZIL-ACCEPT\"\u003e\u003c/a\u003e\n\n## 20. 规范拒绝边界与产品验收\n\n### 20.1 不得由实现放宽的边界\n\nSafeReject、ResourceLimit、Unsupported、基础设施失败是不同结果；未完成必需检查不得生成可运行产物。支持矩阵可以声明某实现尚未提供的 profile，但不得把原始目标自动删为非目标。错误例不得通过隐藏 RC、锁、装箱、全局表或延期关闭变成成功。\n\n下面是规范验收族；实例、输入和工具链由测试夹具定义，工单仅引用 ID，不复制或放宽这里的条件。\n\n| 验收ID | 必须成立的正例与最近反例 | 所依据规则 |\n|---|---|---|\n| V01 | 普通值、Copy/Move/Describe/Create/Give 明确；拒绝未转交责任复制与临时描述逃逸 | ZIL-MODES |\n| V02 | 选择/字段/闭包来源完整；拒绝 family singleton 强更新和跨轮身份合并 | ZIL-ORIGIN |\n| V03 | 同源先读后关接受，先关后读拒绝；隐藏 Drop 和不返回前缀不遗漏 | ZIL-CONTRACT |\n| V04 | 跨模块选择返回的 payload/route/authority 对应；缺 route、错记录、释放后写 flag 拒绝 | ZIL-ROUTE |\n| V05 | 稳定环、包返回、移动和内部回调成立；旧字段捕获不重定向新实例 | ZIL-PACKAGE |\n| V06 | 自动捕获、move/give、函数值、opaque返回、短回调及容器合法；拒绝隐式夺责、错误重调、丢失Hold与悬垂返回 | ZIL-CAPTURE |\n| V07 | 分支/loop/递归与错误出口保持责任；必须拒绝未初始化发布及坏回边 | ZIL-CFG |\n| V08 | `#(...)`/`#{...}`/`#[...]` 唯一解析；错误附着、非法阶段、重复/冲突属性拒绝 | ZIL-COMPTIME,ZIL-ATTRIBUTE |\n| V09 | 生成的常量/类型/impl 统一重检；生成—求解环、伪造 Cap、未声明输入拒绝 | ZIL-COMPTIME |\n| V10 | 常见泛型/关联投影/lending 可组合；候选等式自证、未完成布局和隐式派发拒绝 | ZIL-TRAIT |\n| V11 | receiver补入、词法点号、记录/管道/展开与Native入口确定；同义前端保持绑定、求值、清理与错误 | ZIL-SYNTAX,ZIL-RECEIVER,ZIL-RECORD,ZIL-PIPE,ZIL-SCRIPT,ZIL-TRAIT |\n| V12 | 稳定追加、分区地址与正确失效；跨 realloc、变体和 detach 的错误窗口拒绝 | ZIL-ACCESS |\n| V13 | 一般 Drop 与部分构造准确，记录自身寿命合法；重入关闭与漏失败清理拒绝 | ZIL-CLEANUP |\n| V14 | 静态帧、显式递归间接、PendingExit 与结果一次转交；提前展开/回收拒绝 | ZIL-ASYNC |\n| V15 | 发布前登记、准入线性化、全部用户静止；cancel、active=0、旧通知不得单独授予释放 | ZIL-ASYNC,ZIL-CONCURRENCY |\n| V16 | 共享读、不交写、真实同步与迁移；普通原子/Pin 不授予额外权限 | ZIL-CONCURRENCY |\n| V17 | 同一已核 LIR 保持布局、清理、指针与同步；C/LLVM profile 不混同 | ZIL-LOWERING |\n| V18 | 缓存变更依赖准确、损坏重建、CLI/IDE一致；不可反序列化伪造已核值 | ZIL-MODULE,ZIL-ARCH |\n| V19 | 静态路径没有强制动态管理层，构造/清理/转换全部计费，Rust基线同语义 | ZIL-TARGET,ZIL-LOWERING |\n| V20 | 冷检查/构建/增量/元程序/核验/宿主构建分别测，n/2n/4n记录真实工作量 | ZIL-TARGET,ZIL-ARCH |\n| V21 | 多类完整演进同时计应用、库、适配和可信代码；普通拥有输入与借入描述不得错比 | ZIL-TARGET |\n| V22 | 空测试、零命中、错误基线、过期证据、未支持或超时都不能记为通过 | ZIL-ACCEPT |\n\n### 20.2 性能与演进的唯一计量源\n\n`validation/product-gates.json` 是数值预算和场景协议的权威来源。目标规则、输入规模、错误/资源合同、候选与基线版本、工具链、线程和分配器必须在取结果前固定。来源记录表明预算来自何处，不代表已经达到。\n\n运行比较包含构造、访问、关系维护、删除/暂存、转换、析构、任务和取消；分别报告吞吐、P50/P95、峰值、稳定态、保留时间、分配与同步。Rust 使用预先固定的合理最快已知实现，并可另列同布局归因；未验证更快实现不能冒称全局最快。\n\n编译分别测冷 check、冷开发 build、私有编辑、公开合同编辑、布局/生成输入变化和发布优化；Rust 构建 ZIL 本身另列。计入生成器首次准备、核验证书、缓存哈希与序列化，不把成本移出计时区。最小值可附录，主判据不得只取五次最小。\n\n演进固定树到环、独立删除、指针到索引/SoA、并行、同步到挂起、helper到泛型/dyn等完整起点；原来无需改变的业务不应因为内部选择受到无关重写。语义确实变化的身份、失败、地址、同步和ABI边界必须修改，不承诺只改一行。\n\n### 20.3 证据状态\n\n规定、手工论证、模型执行、手工 lowering、生产前端贯通、目标实现和产品验收为不同等级。证据绑定源码、规则版本、工具链、profile、输入、实际产物及命令结果。未执行不能记为 Pass；有限穷举只说明给定域，SC调度不替代弱内存和真实driver证明。\n\n独立核验器、业务oracle和测试生成器不得共用被测安全求证实现以自证。可以复用数据格式，但共享错误的测试侧代码必须单列信任范围。对可信原语的声明必须有实现审计与目标义务，不由标准库名字授信。\n\n\n### 20.4 Ante-R1 的新增近邻反例（沿用原验收族）\n\n以下为必须新增的验证规格，**不是本次已执行测试**；不新增或降低产品数值门槛。\n\n| 所属族 | 必须接受的合法情形 | 必须拒绝或明确未支持的近邻 |\n|---|---|---|\n| V02/V12 | 独立 stats 字段更新不破坏 items 读取 单重写条件 |\n| 量化预算与场景协议 | `validation/product-gates.json`及批准manifest | 只引用profile，不抄出第二套阈值 |\n| 阶段和覆盖分工 | `_zil_goal.md` | 引用阶段和工单 |\n| 阶段schema与生产者/消费者 | `spec/interfaces.json` | 具体schema与artifact ID |\n| 工单状态、写集、交付与裁决 | 主树`.task/\u003cID\u003e.md` | worktree只持派工快照 |\n| 规范源样本、未来协议夹具 | `conformance/index.json`、`validation/task-test-plans.json` | case ID，不把登记当执行 |\n| 实际执行证据 | `out/runs/`原始运行，`evidence/`精简收据与反例 | 绑定提交/输入/工具链/profile，大型原始产物独立归档 |\n| 变更原因与历史 | `changes/`和Git | 不覆盖当前规范正文 |\n| 当前工程决策 | `.agent/` | 一点一文件，只留当前规则与边界 |\n| 编号实施切片和往来 | 主树`.task/impl/\u003c号\u003e.md` | 只引用正式父任务，不替代其Done门 |\n| 冷启动摘要 | 生成的`data/handoff.json` | 快照而非权威；接续时重新运行handoff检查 |\n\n## 2. 输入快照和工单状态\n\n正式状态为Planned→Ready→Doing→Review→Done；返修回Doing，取消必须记录原因及能力的新承接者。本仓已有实际编译器与标量证据，完整公共schema仍由B0交接；状态只从主树工单读取，设计检查和独立准备代码均不触发整单完成。\n\n`spec_hash`是设计正文原始字节的SHA256。`normative_hash`覆盖`spec/interfaces.json`列出的全部规范输入，算法为按路径排序后拼接`path + NUL + SHA256(file bytes) + LF`，再对UTF-8结果取SHA256；`python3 tools/check-plan.py --print-hashes`输出当前值。派工还记录任务revision、实际Git基线和案例/工具链输入哈希。\n\nReady必须有实际base_revision、当前两个hash、明确产物与写集、全部Done前置和所需接口；Planned允许空基线。Doing/Review不能因等待期间的规范变更自行猜测新语义。完成状态只能由验收方根据真实结果和集成裁决回写。已合入实施切片保留当时的规范摘要；handoff从精确implementation_commit读取接口声明的必需规范集合，核对注册表集合完全一致，并逐项读取全部输入字节核验，不能把旧hash追改成新规范。在途切片仍锁当前规范，变更须由集成者记录迁移与影响范围。正式任务仍以当前规范维护；其整单完成门没有因子切片合入解除。\n\n## 3. 任务字段与交接\n\n`required_artifacts`引用已完成生产者的交接项，`provided_artifacts`由本单唯一生产；接口字段和消费者在interfaces中登记。交接包含实际源码提交、输入摘要、schema版本和验证证据，artifact名字本身不证明存在实现。\n\n`case_ids`指向已有`.zil`规范样本；`plan_case_ids`指向本单必须实现的测试夹具要求。后者的required_fixture路径和观察要求在task-test-plans中给出。工单的test_commands固定统一runner的调用契约，done_when细化交付判据，不能新增或放宽规范。\n\n规范表面语法、类型/捕获、分析、核验和lowering必须对同一节点有真实消费者。stage接口不允许用同名mock冒充；测试可以使用夹具，但证据注明等级。所有缺失必需阶段返回Unsupported并停止生成可运行产物。\n\n## 4. 并行与写权\n\n一单一枝一树，正式任务使用`task/\u003cID\u003e`，编号实施切片以编号命名分支、目录`../zil-\u003c号\u003e`。每树使用独立target、缓存和临时产物；共享仅限只读下载缓存。验收方独占发号、状态、集成及根共享配置，施工方只写分派范围和本单证据。\n\nB0串行持有建立正式最小链所需的临时广写权；完成后移交各模块，不能仍与模块施工并行修改。T01/T02/T04/T05在接口冻结后互不相交，可并行；后继任务只有在前驱Done后接手相交功能目录。`tools/check-plan.py`对无祖先关系的任务保守检查写集重叠；冲突时缩小写集或显式串行，不能忽略告警。\n\n公共schema、根Cargo/锁、工具链和共享模块注册入口由集成者单写。改变接口先提交影响生产者/消费者、最近反例和迁移步骤，再同批发布新快照；不要求整仓停工，未受影响任务继续。T08/T09虽然横跨多个crate，也只在所列功能分区接手；对父级注册文件的修改由集成者提交。\n\n## 5. 统一runner与证据\n\n现有`tools/run-cases.py --task ID --manifest PATH --out-root evidence/ID`支持conformance/index和task-test-plans两个manifest，创建新的RunId目录，不覆盖旧日志。只把真实执行结果用于裁决，不把登记的预期或空选择改成Pass。\n\n`expected.exit_code`只比较真实main进程退出状态；`expected.entry`加`expected.return_value`由原生harness调用具名函数并读取完整类型值，包括超过255的值。二者不得互换，也不能以常量解析代替执行。\n\n每次至少记录任务/提交/规范和输入hash、精确命令、工具链与profile、实际选择/执行/断言数量、逐case预期与实际、stdout/stderr、退出码及阶段/机器产物hash。预期拒绝需要匹配注册的阶段和理由；任何编译器崩溃或工具失败都不能代替正确拒绝。零选择、缺fixture、零执行/断言、Unsupported、ResourceLimit、超时和基础设施失败均非Pass。\n\nDone需要`acceptance_record`及真实result.json定位；所有规定case都有实际执行。不同证据等级分别记录：规范、模型、合成工具输入、手工lowering、生产源贯通、目标机器行为、产品比较；不得相互冒充。模型/压力调度不替代弱内存和真实OS/驱动证据。\n\n## 6. 复核、合入与复用\n\n施工方执行限定测试并提交请验报告，不自行合入或跑正式全量。验收方固定候选提交，先核输入/写集/依赖，再按风险跑受影响闭包；规范、schema、安全核、清理、构建规则改变属于高风险。普通局部cargo check不因全量锁而全部串行。\n\n复用证据必须说明源码、测试输入、feature、target、规则、工具链和产物依赖未变或已证明不受影响；“刚测过”不是依据。相交分支依次集成，后合分支吸收已合变化后才固定候选。正式计时独占资源，不与构建/压力测试竞争。\n\n验收方更新主树工单状态；worktree里的工单副本不读不改，派工信息提供主树权威位置。未派工任务保持Planned，施工方不得自己把缺实现状态标Done。已有旧证据归档到对应旧版本；新规范下不沿用旧截图/检查计数冒充本次执行。\n\n## 7. 变更和阻塞\n\n不改变接受性/行为的文字澄清可以轻量处理；影响模式、错误、求值/清理顺序、来源、ABI或支持范围的变更必须在changes列出具体差异和最近反例，同批更新规范、接口和案例。性能数字不得在排期或工单另改。\n\n发现冲突只暂停受影响任务，引用具体规则/案例与最小复现；集成者在既有授权范围内修正规范或实现，明确发布revision。未完成的终态能力仍有责任单，不能通过取消任务或标Unsupported把它从发布条件中删除。\n\n## 8. Codex冷启动与编号切片\n\n先运行`node tools/handoff.mjs --check`。脚本从Git工作树中查找main，输出当前主树位置和相对工单路径；不依赖工单内保存的旧机器绝对路径。无法唯一定位时显式传`--main-tree PATH`，并验证它属于同一仓库的main分支。只有源码ZIP也可直接构建；要核验历史和继续原分支，另取配套历史bundle，使用其实际路径执行`git clone --branch main \u003chistory.bundle路径\u003e zil-checkout`，再从恢复的checkout接续。主源码包只含按 Git 收录规则导出的源码、测试、工具和文档，不放证据、执行产物或 Git 目录；精简审计与可恢复历史另置附件，详见交付 manifest 和 docs/DELIVERY.md。\n\n切片首行状态为施工、待验、退回、已合入或卡住，与JSON一致；JSON保存编号、正式父任务、完整基线、规范摘要、写集、实施者、交付提交、独立审核和合入提交。正文只由集成者调整。末节只追加开工、交付、退回/验收、合入的必要往来，不复制完整对话。\n\n待验必须有`implementation_author`、`implementation_commit`和结构化evidence引用。已合入还要求`review = {reviewer, verdict: \"Pass\", implementation_commit, evidence}`，审核者与实施者不同、审核绑定精确交付提交，且`implementation_commit`和`integration_commit`都已进入main历史。本轮使用`git merge --no-ff`保留已审核原提交，保证仅携带main/HEAD的bundle也能恢复审核对象。至少一份审核JSON须包含与工单一致的reviewer、verdict和implementation_commit。证据必须是主树已提交的JSON结果，或交付提交中可读取的JSON结果；聊天、未跟踪日志和文件名本身不构成证据。合入后的工单记录也须提交。\n\nhandoff检查记录完整性，不验证审核者身份真实性、审查质量或语言安全，不替代check-plan和正式测试。Git子进程使用临时文件描述符捕获输出以兼容受限环境；任何进程基础设施错误都明确失败，即使同时报告退出状态零。施工只运行本单限定测试；独立审核由另一代理承担；全量由集成者统一执行。当前会话不搬入Cursor专用常驻监听机制，等待和重派由当前可用协作工具管理。\n\n主树集成完成后执行`node tools/handoff.mjs`生成`data/handoff.json`；分树只允许`--check`。摘要不保存绝对工作目录，记录受测提交与实际当前HEAD而不要求它们相等，避免文档/证据提交造成自身哈希循环。接续时重新检查实时记录，不能用旧摘要直接判断完成。之后仍按`python3 tools/check-plan.py --self-test`与工单命令执行相应门。\n","syntax":"# 语法与属性实施入口\n\n规范性解释见完整规范第15—18章。以下附件由同一构建过程嵌入，不是另一套语法。\n\n## 文法产生式\n\n```ebnf\n(* ZIL-LANG-1.3 normative surface. This EBNF fixes productions, not a soundness proof.\n   ZIL-SYNTAX fixes lexical NEWLINE, control-head braces and arrow-block priority.\n   IDENT includes contextual words; self binding is checked by ZIL-RECEIVER.\n   A bare identifier or balanced parameter-list followed by =\u003e or -\u003e selects Closure, without a type query.\n   TUPLEINDEX is an unsigned decimal integer token after a dot, not a float. *)\nModule = { ImportDecl | SyntaxImport | Item | MetaItem | Terminator } ;\nImportDecl = \"import\", ModulePath, [\"as\", IDENT], End ;\nSyntaxImport = \"syntax\", \"use\", ModulePath, \"as\", IDENT, End ;\nModulePath = IDENT, {\".\", IDENT} ;\nQualified = IDENT, {\".\", IDENT} ;\nItem = {Attribute}, [\"pub\"], (Function | Struct | Resource | Package | Enum | Trait | Impl | TypeAlias | ConstDecl | ExternDecl) ;\nStruct = \"struct\", IDENT, [Generics], \"{\", {Field | Method | Terminator}, \"}\" ;\nResource = \"resource\", IDENT, [Generics], \"{\", {Field | Method | Terminator}, \"}\" ;\nPackage = \"package\", IDENT, [Generics], \"{\", {ManagedField | Field | Method | Terminator}, \"}\" ;\nManagedField = {Attribute}, \"manages\", IDENT, \":\", Type, [\"=\", Expr], FieldEnd ;\nField = {Attribute}, [\"pub\"], IDENT, \":\", Type, [\"=\", Expr], FieldEnd ;\nFieldEnd = \",\" | Terminator | BeforeClose ;\nEnum = \"enum\", IDENT, [Generics], \"{\", {Variant | Terminator}, \"}\" ;\nVariant = {Attribute}, IDENT, [(\"(\", VariantTypes, \")\") | (\"{\", {Field}, \"}\")], FieldEnd ;\nVariantTypes = [[\"manages\"], Type, {\",\", [\"manages\"], Type}, [\",\"]] ;\nTrait = \"trait\", IDENT, [Generics], [\":\", Bounds], \"{\", {Method | Associated | Terminator}, \"}\" ;\nImpl = InherentImpl | TraitImpl ;\nInherentImpl = \"impl\", [Generics], Type, [ReceiverDefault], [Where], ImplBody ;\nTraitImpl = \"impl\", [Generics], Type, \"for\", Type, [Where], ImplBody ;\nReceiverDefault = \"(\", [\"give\"], \"self\", \":\", Type, \")\" ;\nImplBody = \"{\", {Method | Associated | Terminator}, \"}\" ;\nAssociated = \"type\", IDENT, [Generics], [\":\", Bounds], [\"=\", Type], End\n           | \"const\", IDENT, \":\", Type, [\"=\", Expr], End ;\nMethod = {Attribute}, [\"pub\"], Function ;\nFunction = \"fn\", IDENT, [Generics], \"(\", [Parameters], \")\", [\"-\u003e\", ReturnType], [Where], [Contract], FunctionBody ;\nFunctionBody = Block | \"=\u003e\", Block | \"=\u003e\", Expr, End | \";\" ;\nExternDecl = \"extern\", STRING, Function ;\nParameters = Parameter, {\",\", Parameter}, [\",\"] ;\nParameter = {Attribute}, [\"give\"], IDENT, \":\", Type ;\nGenerics = \"\u003c\", GenericParameter, {\",\", GenericParameter}, [\",\"], \"\u003e\" ;\nGenericParameter = IDENT, [\":\", Bounds] | \"life\", IDENT | \"#\", IDENT, \":\", Type ;\nWhere = \"where\", BoundClause, {\",\", BoundClause} ;\nBoundClause = Type, \":\", Bounds | LIFEIDENT, \":\", LIFEIDENT ;\nBounds = Type, {\"+\", Type} ;\nTypeList = Type, {\",\", Type}, [\",\"] ;\nReturnType = \"impl\", Bounds | Type ;\nType = ForeignFunctionType | FunctionType | ErrorType ;\nForeignFunctionType = \"extern\", STRING, \"fn\", \"(\", [TypeList], \")\", \"-\u003e\", Type ;\nFunctionType = \"fn\", \"(\", [TypeList], \")\", \"-\u003e\", Type ;\nErrorType = UnionType, [\"!\", Type] ;\nUnionType = OptionalType, {\"|\", OptionalType} ;\nOptionalType = TypePrimary, [\"?\"] ;\nCallableName = \"Fn\" | \"FnMut\" | \"FnOnce\" ;\nCallableType = CallableName, \"(\", [TypeList], \")\", \"-\u003e\", Type ;\n(* Reserved callable-family names require CallableType, not Qualified TypeArgs. *)\nTypePrimary = CallableType | Qualified, [TypeArgs]\n            | \"\u0026\", [LIFEIDENT], [\"mut\"], TypePrimary\n            | \"[\", Type, [\";\", Expr], \"]\"\n            | TupleType\n            | \"dyn\", (CallableType | Qualified, [TypeArgs])\n            | \"for\", \"\u003c\", \"life\", IDENT, \"\u003e\", TypePrimary\n            | MetaEval | MetaBlock | MetaSplice ;\nTupleType = \"(\", \")\" | \"(\", Type, \")\" | \"(\", Type, \",\", [TypeList], \")\" ;\nTypeArgs = \"\u003c\", GenericArg, {\",\", GenericArg}, [\",\"], \"\u003e\" ;\nGenericArg = Type | NUMBER | \"true\" | \"false\" ;\nTypeAlias = \"type\", IDENT, [Generics], \"=\", Type, End ;\nConstDecl = \"const\", IDENT, [\":\", Type], \"=\", Expr, End ;\nContract = \"contract\", \"{\", {ContractClause, End}, \"}\" ;\nContractClause = (\"result\" | \"requires\" | \"provides\" | \"effects\" | \"resume\"), \"(\", [ContractTerms], \")\" ;\nContractTerms = ContractTerm, {\",\", ContractTerm}, [\",\"] ;\nContractTerm = Qualified, [TypeArgs], [(\"(\", [ContractTerms], \")\") | (\"[\", ContractTerm, \"]\")] ;\nBlock = \"{\", {Statement | MetaStatement | Terminator}, \"}\" ;\nStatement = Binding | Return | Yield | Break | Continue | Defer | IfStmt | WhileStmt | ForStmt | LoopStmt | MatchStmt | WithStmt | UnsafeBlock | (Expr, [AssignOp, Expr], End) ;\nBinding = (\"let\" | \"var\"), Pattern, [\":\", Type], \"=\", Expr, End ;\nPattern = IDENT | Literal | \"_\" | \".\", (\"ok\" | \"err\"), \"(\", Pattern, \")\" | \"ref\", [\"mut\"], Pattern | \"(\", [PatternList], \")\" | Qualified, \"(\", [PatternList], \")\" | Qualified, \"{\", [RecordPatternFields], \"}\" ;\nRecordPatternFields = IDENT, \":\", Pattern, {\",\", IDENT, \":\", Pattern}, [\",\"] ;\nPatternList = Pattern, {\",\", Pattern}, [\",\"] ;\nReturn = \"return\", [Expr], End ;\nYield = \"yield\", Expr, End ;\nBreak = \"break\", End ;\nContinue = \"continue\", End ;\nDefer = \"defer\", Block ;\nIfStmt = \"if\", Condition, Block, [\"else\", (Block | IfStmt)] ;\nCondition = Expr | \"let\", Pattern, \"=\", Expr ;\nWhileStmt = \"while\", Condition, Block ;\nForStmt = \"for\", Pattern, \"in\", Expr, Block ;\nLoopStmt = \"loop\", Block ;\nMatchStmt = \"match\", Expr, \"{\", {Pattern, \"=\u003e\", (Block | Expr), FieldEnd}, \"}\" ;\nWithStmt = \"with\", IDENT, \"=\", Expr, Block ;\nUnsafeBlock = \"unsafe\", Block ;\nAssignOp = \"=\" | \"+=\" | \"-=\" | \"*=\" | \"/=\" | \"%=\" | \"\u0026=\" | \"|=\" | \"^=\" ;\nExpr = Closure | Pipeline ;\nClosure = [\"move\"], (IDENT | \"(\", [ClosureParams], \")\"), [\"-\u003e\", Type], \"=\u003e\", (ClosureBlock | Expr) ;\n(* ZIL-CAPTURE normalizes closure tails and final if/else branches to Return; ordinary Block is unchanged. *)\nClosureBlock = Block ;\nClosureParams = IDENT, [\":\", Type], {\",\", IDENT, [\":\", Type]}, [\",\"] ;\nPipeline = Or, {\"|\u003e\", Or} ;\nOr = And, {\"||\", And} ;\nAnd = Compare, {\"\u0026\u0026\", Compare} ;\nCompare = Range, [(\"==\" | \"!=\" | \"\u003c\" | \"\u003c=\" | \"\u003e\" | \"\u003e=\"), Range] ;\nRange = BitOr, [\"..\", BitOr] ;\nBitOr = BitXor, {\"|\", BitXor} ;\nBitXor = BitAnd, {\"^\", BitAnd} ;\nBitAnd = Shift, {\"\u0026\", Shift} ;\nShift = Add, {(\"\u003c\u003c\" | \"\u003e\u003e\"), Add} ;\nAdd = Multiply, {(\"+\" | \"-\" | \"+%\" | \"-%\"), Multiply} ;\nMultiply = Prefix, {(\"*\" | \"/\" | \"%\" | \"*%\"), Prefix} ;\nPrefix = (\"!\" | \"-\" | \"~\" | \"*\" | \"give\"), Prefix | \"\u0026\", [\"mut\"], Prefix | Postfix ;\nPostfix = Primary, {(\".\", Member) | (\"::\", TypeArgs) | (\"(\", [Arguments], \")\") | (\"[\", SliceIndex, \"]\") | \"?\"} ;\nMember = IDENT | TUPLEINDEX ;\nSliceIndex = BitOr, [\"..\", [BitOr]] | \"..\", [BitOr] ;\nArguments = Argument, {\",\", Argument}, [\",\"] ;\nArgument = [\"...\"], Expr ;\nPrimary = Literal | IDENT | GroupOrTuple | ArrayValue | Construct | ContextRecord | ReceiverMember | IfExpr | MetaEval | MetaBlock | MetaSplice | Quote | SyntaxIsland ;\nLiteral = NUMBER | STRING | CHAR | \"true\" | \"false\" ;\nGroupOrTuple = \"(\", \")\" | \"(\", Expr, \")\" | \"(\", Expr, \",\", [ExprList], \")\" ;\nExprList = Expr, {\",\", Expr}, [\",\"] ;\nArrayValue = \"[\", [ExprList], \"]\" ;\nValueTypePath = IDENT, {(\".\", IDENT) | (\"::\", TypeArgs)} ;\nConstruct = ValueTypePath, RecordBody ;\nContextRecord = [\".\"], RecordBody ;\nRecordBody = \"{\", [RecordFields], \"}\" ;\nRecordFields = \"...\", Expr, [\",\", FieldValues] | FieldValues ;\nFieldValues = FieldValue, {\",\", FieldValue}, [\",\"] ;\nFieldValue = IDENT, [\":\", Expr] ;\nReceiverMember = \".\", IDENT ;\nIfExpr = \"if\", Expr, \"{\", Expr, \"}\", \"else\", \"{\", Expr, \"}\" ;\nAttribute = \"#\", \"[\", Qualified, [(\"(\", [AttrArguments], \")\") | (\"=\", STRING)], \"]\" ;\nAttrArguments = Expr, {\",\", Expr}, [\",\"] ;\nMetaEval = \"#\", \"(\", Expr, \")\" ;\nMetaSplice = \"#\", \"splice\", \"(\", Expr, \")\" ;\nQuote = \"quote\", \"\u003c\", SyntaxCategory, \"\u003e\", \"{\", QuoteBody, \"}\" ;\nSyntaxCategory = \"Expr\" | \"Type\" | \"StmtList\" | \"ItemList\" ;\nQuoteBody = (* the selected ordinary category with typed QuoteHole slots; nested quotes own their holes *) ;\nQuoteHole = \"$\", \"(\", Expr, \")\" ;\nMetaBlock = \"#\", Block ;\nMetaItem = MetaIfItems | MetaForItems | MetaEmit ;\nMetaStatement = MetaIfStatements | MetaForStatements | MetaEmit ;\nMetaIfItems = \"#\", \"if\", \"(\", Expr, \")\", \"{\", {Item | MetaItem | Terminator}, \"}\", [\"else\", \"{\", {Item | MetaItem | Terminator}, \"}\"] ;\nMetaIfStatements = \"#\", \"if\", \"(\", Expr, \")\", Block, [\"else\", Block] ;\nMetaForItems = \"#\", \"for\", \"(\", IDENT, \"in\", Expr, \")\", \"{\", {Item | MetaItem | Terminator}, \"}\" ;\nMetaForStatements = \"#\", \"for\", \"(\", IDENT, \"in\", Expr, \")\", Block ;\nMetaEmit = \"#\", \"emit\", Expr, End ;\nSyntaxIsland = Qualified, \"!\", TokenTree ;\nTokenTree = \"(\", {Token | TokenTree}, \")\" | \"[\", {Token | TokenTree}, \"]\" | \"{\", {Token | TokenTree}, \"}\" ;\nToken = NonDelimiterToken ;\nEnd = Terminator | BeforeClose ;\nTerminator = \";\" | NEWLINE ;\nBeforeClose = (* zero-width boundary immediately before '}', after a complete statement *) ;\n\n(* Finite Direct execution root; semantically reserved, never ordinary shadowable call. *)\nScopedThreadExpr = \"thread_scope\", \"(\", Qualified, \",\", Expr, \",\", Expr, \")\" ;\n\n```\n\n## 属性注册表\n\n```json\n{\n  \"schema_version\": 1,\n  \"source_section\": \"ZIL-ATTRIBUTE\",\n  \"attributes\": [\n    {\n      \"name\": \"cfg\",\n      \"kind\": \"configuration\",\n      \"phase\": 0,\n      \"targets\": [\n        \"item\",\n        \"field\",\n        \"variant\",\n        \"parameter\"\n      ],\n      \"repeat\": \"and\",\n      \"args\": \"config-expression\",\n      \"output\": \"keep-or-remove\"\n    },\n    {\n      \"name\": \"repr\",\n      \"kind\": \"layout\",\n      \"phase\": 3,\n      \"targets\": [\n        \"struct\",\n        \"enum\",\n        \"package\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"enum(C,transparent)\",\n      \"output\": \"layout-constraint\"\n    },\n    {\n      \"name\": \"align\",\n      \"kind\": \"layout\",\n      \"phase\": 3,\n      \"targets\": [\n        \"struct\",\n        \"enum\",\n        \"package\",\n        \"field\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"positive-power-of-two-const\",\n      \"output\": \"layout-constraint\"\n    },\n    {\n      \"name\": \"derive\",\n      \"kind\": \"generate\",\n      \"phase\": 2,\n      \"targets\": [\n        \"struct\",\n        \"enum\",\n        \"package\"\n      ],\n      \"repeat\": \"merge-unique-traits\",\n      \"args\": \"trait-path-list\",\n      \"output\": \"unchecked-items\"\n    },\n    {\n      \"name\": \"inline\",\n      \"kind\": \"codegen\",\n      \"phase\": 5,\n      \"targets\": [\n        \"fn\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"optional-enum(always,never)\",\n      \"output\": \"hint\"\n    },\n    {\n      \"name\": \"doc\",\n      \"kind\": \"metadata\",\n      \"phase\": 1,\n      \"targets\": [\n        \"item\",\n        \"field\",\n        \"variant\",\n        \"parameter\"\n      ],\n      \"repeat\": \"concat\",\n      \"args\": \"string\",\n      \"output\": \"documentation\"\n    },\n    {\n      \"name\": \"allow\",\n      \"kind\": \"diagnostic\",\n      \"phase\": 4,\n      \"targets\": [\n        \"item\",\n        \"field\",\n        \"variant\",\n        \"parameter\"\n      ],\n      \"repeat\": \"union\",\n      \"args\": \"registered-lint-list\",\n      \"output\": \"lint-policy\"\n    },\n    {\n      \"name\": \"test\",\n      \"kind\": \"test\",\n      \"phase\": 4,\n      \"targets\": [\n        \"fn\"\n      ],\n      \"repeat\": \"error\",\n      \"args\": \"none\",\n      \"output\": \"test-entry\"\n    }\n  ],\n  \"custom\": {\n    \"must_be_declared\": true,\n    \"qualified_name\": true,\n    \"allowed_kinds\": [\n      \"syntax\",\n      \"generate\",\n      \"metadata\"\n    ],\n    \"cannot_produce_verified_ir\": true\n  },\n  \"incompatible\": \"duplicate nonrepeatable attributes fail; no safe capability-granting attribute\"\n}\n\n```\n","changes":"# 收尾裁决与施工审查\n\n日期：2026-10-22。本文解释来源和决策；当前规则只读 `_zil_design.md` 与具名附件。\n\n## 1. 恢复基线\n\n实际下载并读取上一轮 `zil-design-workflow-complete.zip`，包内规范为 ZIL-LANG-1，含 design→goal→14工单→worktree、文法/属性附件及离线 designer。单独同名 zil-design-final.md 的日期早于这个 ZIP，因此不将该同名旧文档当最新基线。\n\n原私有会话网址不能作为公开网页完整抓取；交付之后的意见由会话上下文检索恢复，覆盖自动捕获、撤回强制捕获表/Copy快照、词法 .name、组默认 receiver，以及记录/管道/脚本候选。本包没有声称逐字读取整轮冗长对话。末轮意见原本仍是讨论；以下是按本次“确定设计并准备施工”的要求作出的明确裁决。\n\n保留当前描述/执行资格/责任核心、四目标、Rust实现架构和产品预算；不导入更早版本的通用世代、隐式保活、自动归属提升或已完成历史成绩。\n\n## 2. 最终选择及理由\n\n| 主题 | 选择 | 原因与边界 |\n|---|---|---|\n| 闭包捕获 | 正文用途推导；move显式按值 | 避免要求用户重写编译器能局部得出的捕获清单；逃逸失败不反向改变模式 |\n| Copy | 普通闭包默认只读借入；move拍快照 | 保留“观察原变量”与“固定值”的区别，避免默认偷偷记旧值 |\n| Desc | 继续复制描述 | 不将ZIL图操作重新变为默认长地址借用；访问进入Call合同 |\n| Managed | move实际载体或正文give推导转交 | 复制alias不夺取owner，close不等于give；责任在创建时落实 |\n| 调用能力 | 环境访问与目标状态分开 | 拥有捕获可重复只读；外部close仍可能因状态阻止二次调用 |\n| 接收者 | impl Type(self:...)、显式覆盖、trait继承 | 节省重复首参，又在读正文前确定合同；保持普通关联函数内核 |\n| .name | 词法self成员 | 不引入运行时this、不复用作enum标签或管道占位 |\n| 函数值 | fn指针无环境；Fn族具体闭包；受限opaque返回 | 补齐捕获闭包跨函数接口，避免默认Box或擦除依赖 |\n| 记录 | 期望类型省略；单base首位spread | 不引入结构类型搜索；Copy/Move及失败清理可确定 |\n| 管道 | 左先右后，一元调用 | 不通过插参、柯里化、传播错误改变原调用的含义 |\n| 脚本 | Native统一main/run；托管扩展单独协议 | 当前施工不承担隐含GC，未来桥接也不能绕过原生责任 |\n\n保留 `-\u003e` 作为返回类型标记，支持 `=\u003e` 表达式体；不导入讨论示例中偶见的冒号返回同义拼写。箭头后裸大括号固定为块；函数指针箭头取得完整返回类型；方法名与字段名冲突、普通调用Fn选择、Address捕获截断都已明确，避免实现者按各自直觉补完。\n\n## 3. 修复的工程阻断\n\n- W1原本包含闭包保存，T08又依赖W1：将闭包保存归T08/W2，W1只闭合资源管理纵切片。\n- B0原本要源码到退出码但无修改相关模块的写权：授予一次性正式引导写集，随后移交模块。\n- T03的CT执行依赖独立核验器却未依赖T05：补齐任务和产物前置。\n- T02补全名字/类别/trait到TypedCFG；T08/T09取得真实跨types/analyze/verify/lower功能目录，防止无人承接。\n- 所有工单补充具体输入、输出、写集、正反例要求、命令契约、完成条件；公共schema仍由集成者单写。\n- 输入摘要覆盖正文及全部具名附件；检查器不再要求施工期间永远Planned。\n- Verified包装的构造权放在verify crate私有字段，schema在ir中可序列化但不能反序列化得到已核对象。\n\n## 4. 证据边界\n\n三个独立审查任务分别检查闭包、接收者/文法、施工依赖，再进行了跨主题一致性复核。这是设计审查，不能作为形式化证明或实际编译器验收。\n\n87条源码预期与63项后续夹具要求都明确标记未执行/未实现。旧包的浏览器截图、运行日志和下载缓存不沿用为当前证据。当前实际检查、浏览器复测限制和全部未验证事项统一见 `evidence/REPORT.md`。\n\n未访问用户现有Windows仓库；本计划以新Rust实现的实际B0基线为起点。复用旧Zig代码、指定准确工具链/LLVM版本、性能测量及生产安全证明由相应施工门实际完成，不能在此捏造提交、日期或成绩。\n","verification":"# 检查范围\n\n文档与阅读系统检查记录由构建生成，不代表语言实现。"}</script>
<script>(() => {
'use strict';
const $ = id => document.getElementById(id);
const D = JSON.parse($('atlas-data').textContent);

const E = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ARR = x => Array.isArray(x) ? x : x == null ? [] : [x];
const byId = (k,id) => D[k].find(x => x.id === id);

const rawCov = (g,l) => D.coverage.find(x => x.goal === g && x.language === l);
const cov = (g,l) => { const base=rawCov(g,l);const id=state.routeChoices?.[g+':'+l];const alternative=base?.alternatives?.find(a=>a.id===id);return alternative?{...base,...alternative,goal:g,language:l}:base; };
const setting = (v,l) => D.settings.find(x => x.variable === v && x.language === l);
const textOf = x => typeof x === 'string' ? x : x?.label || x?.name || x?.meaning || JSON.stringify(x);
const statusNames = {available:'已有方案',conditional:'有条件 / 局部',proposal:'规范路线（未验收）',unsupported:'当前路线不提供',unknown:'尚未核实',empirical:'需实测判断'};
