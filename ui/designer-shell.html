<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="topbar">
  <a class="brand" href="#scenes/G09" aria-label="语言设计图谱首页"><span class="brand-mark" aria-hidden="true">λ</span><span>语言设计图谱<small>从目标理解选择</small></span><span class="edition">D2</span></a>
  <nav class="primary-nav" aria-label="主要导航">
    <button data-view="scenes">场景目标</button><button data-view="basics">基础规则</button><button data-view="compare">语言对照</button><button data-view="docs">设计与来源</button>
  </nav>
  <button class="quiet top-download" data-action="download-spec">下载语言设计 <span aria-hidden="true">↓</span></button>
</header>
<section id="language-bar" class="language-bar" aria-label="多选比较语言"></section>
<main id="main" tabindex="-1"></main>
<footer class="footer"><span>语言设计图谱 D2 · 2026-10-19</span><span>条件、机制与证据共同决定结论。</span><button class="text-button" data-action="about">阅读口径</button></footer>
<dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span class="eyebrow">定义与关系</span><button id="dialog-close" class="icon-button" aria-label="关闭详情">×</button></div><div id="dialog-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script id="atlas-data" type="application/json">{}</script>
<script id="atlas-docs" type="application/json">{}</script>
<script>(() => {
'use strict';
const $ = id => document.getElementById(id);
const D = JSON.parse($('atlas-data').textContent);
const DOCS = JSON.parse($('atlas-docs').textContent);
const E = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ARR = x => Array.isArray(x) ? x : x == null ? [] : [x];
const byId = (k,id) => D[k].find(x => x.id === id);
const lang = id => byId('languages',id);
const rawCov = (g,l) => D.coverage.find(x => x.goal === g && x.language === l);
const cov = (g,l) => { const base=rawCov(g,l);const id=state.routeChoices?.[g+':'+l];const alternative=base?.alternatives?.find(a=>a.id===id);return alternative?{...base,...alternative,goal:g,language:l}:base; };
const setting = (v,l) => D.settings.find(x => x.variable === v && x.language === l);
const textOf = x => typeof x === 'string' ? x : x?.label || x?.name || x?.meaning || JSON.stringify(x);
const statusNames = {available:'已有方案',conditional:'有条件 / 局部',proposal:'设计目标',unsupported:'当前路线不提供',unknown:'尚未核实',empirical:'需实测判断'};
const stateNames = {known:'有明确选择','not-applicable':'此项不适用',unknown:'尚未核实','not-enforced':'不强制检查'};
const kindNames = {safety:'安全义务',expressiveness:'表达能力',ergonomics:'使用与重构',resource:'资源与进展',performance:'编译与性能'};
const defaults = {view:'scenes',goal:'G09',basic:'variables',variable:'V01',rule:'R01',compare:'variables',doc:'guide',chapter:'0',selected:['zil','rust','ts'],filter:'all',includeConditional:false,includeProposals:false,category:'all',search:'',differences:false,sceneMode:'flow',focus:'all',variableFilter:'',catalogOpen:false,routeChoices:{}};
let state = {...defaults};
try { const s=JSON.parse(localStorage.getItem('language-atlas-d2')||'null'); if(s) state={...state,...s,search:'',catalogOpen:false}; } catch {}
const selected = () => D.languages.filter(x => state.selected.includes(x.id));
const statusBadge = s => `<span class="status ${E(s)}">${E(statusNames[s] || s)}</span>`;
const empty = (title,message,button='') => `<div class="empty"><h3>${E(title)}</h3><p>${E(message)}</p>${button}</div>`;
const ruleButton = id => { const r=byId('rules',id); return r ? `<button data-rule="${E(id)}"><span class="id">${E(id)}</span>${E(r.name)}</button>` : ''; };
const variableButton = id => { const v=byId('variables',id);return v?`<button data-variable="${E(id)}"><span class="id">${E(id)}</span> ${E(v.name)}</button>`:''; };
const relatedVars = rules => D.variables.filter(v => ARR(v.relatedRules).some(id => rules.includes(id)));
const allSources = ids => ARR(ids).map(id => D.sources.find(s => s.id === id)).filter(Boolean);
function sourceLinks(ids){return `<div class="source-links">${allSources(ids).map(s=>s.url?.startsWith('http')?`<a href="${E(s.url)}" target="_blank" rel="noopener noreferrer" title="${E(s.note||s.title)}">${E(s.title)}</a>`:`<button class="text-button" data-action="open-spec">${E(s.title)}</button>`).join('')}</div>`;}
function safeColor(c){return /^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#5267b6';}
function btn(action,label,cls=''){return `<button data-action="${E(action)}" class="${E(cls)}">${E(label)}</button>`;}
function pillTabs(values,key){return `<div class="segmented">${values.map(([id,label])=>`<button data-set="${E(key)}" data-value="${E(id)}" class="${state[key]===id?'active':''}" aria-pressed="${state[key]===id}">${E(label)}</button>`).join('')}</div>`;}
function heading(kicker,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${E(kicker)}</div><h1>${E(title)}</h1><p>${E(description)}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;}
function legend(){return `<div class="legend"><span>阅读口径</span>${['available','conditional','proposal','unsupported','unknown','empirical'].map(statusBadge).join('')}${btn('about','查看定义','text-button')}</div>`;}
function writeHash(){
 const id=state.view==='scenes'?state.goal:state.view==='basics'?(state.basic==='variables'?state.variable:state.basic==='rules'?state.rule:'foundations'):state.view==='compare'?state.compare:state.doc==='spec'?'spec-'+state.chapter:state.doc;
 const p=new URLSearchParams();p.set('langs',state.selected.join(','));if(state.filter!=='all')p.set('filter',state.filter);if(state.includeConditional)p.set('conditional','1');if(state.includeProposals)p.set('proposals','1');if(state.variableFilter)p.set('var',state.variableFilter);if(Object.keys(state.routeChoices||{}).length)p.set('routes',JSON.stringify(state.routeChoices));
 const hash=`#${state.view}/${id}?${p}`;try{if(location.hash!==hash)history.replaceState(null,'',hash);}catch{}
 try{localStorage.setItem('language-atlas-d2',JSON.stringify(state));}catch{}
}
function readHash(){
 if(!location.hash)return;
 const [route,query='']=location.hash.slice(1).split('?');const [view,id]=route.split('/');
 if(!['scenes','basics','compare','docs'].includes(view))return;state.view=view;
 if(view==='scenes'&&byId('goals',id))state.goal=id;
 if(view==='basics'){if(id==='foundations')state.basic='foundations';else if(byId('variables',id)){state.basic='variables';state.variable=id;}else if(byId('rules',id)){state.basic='rules';state.rule=id;}}
 if(view==='compare'&&['variables','goals'].includes(id))state.compare=id;
 if(view==='docs'){if(id?.startsWith('spec-')){state.doc='spec';state.chapter=id.slice(5);}else if(['guide','sources','changes','verification'].includes(id))state.doc=id;}
 const p=new URLSearchParams(query);if(p.has('langs'))state.selected=p.get('langs').split(',').filter(x=>lang(x));
 if(p.has('filter')&&lang(p.get('filter')))state.filter=p.get('filter');else state.filter='all';
 state.includeConditional=p.get('conditional')==='1';state.includeProposals=p.get('proposals')==='1';state.variableFilter=byId('variables',p.get('var'))?p.get('var'):'';if(p.has('routes'))try{const choices=JSON.parse(p.get('routes'));state.routeChoices={};for(const [key,id]of Object.entries(choices)){const[g,l]=key.split(':');if(rawCov(g,l)?.alternatives?.some(a=>a.id===id))state.routeChoices[key]=id;}}catch{}
}
function renderLanguages(){
 $('language-bar').innerHTML=`<span class="language-label">并排比较</span><div class="language-choices">${D.languages.map(l=>`<label class="language-choice ${state.selected.includes(l.id)?'selected':''}" style="--lang:${safeColor(l.color)}" title="${E(l.scope||l.summary)}"><input type="checkbox" name="language" value="${E(l.id)}" ${state.selected.includes(l.id)?'checked':''}><span>${E(l.name)}</span>${l.id==='zil'?'<span class="mini">设计</span>':l.id==='hylo'?'<span class="mini">研发中</span>':''}</label>`).join('')}</div><div class="language-actions"><span class="count">已选 ${selected().length} / ${D.languages.length}</span>${btn('select-all','全选','text-button')}${btn('select-default','常用三种','text-button')}${btn('clear-selection','清空','text-button')}</div>`;
 document.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view===state.view;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false');});
}
function goalMatches(g){
 const q=state.search.trim().toLowerCase();const fields=[g.id,g.name,g.question,g.category,g.acceptance,g.boundary,...ARR(g.operations)];
 if(q&&!fields.join(' ').toLowerCase().includes(q))return false;
 if(state.category!=='all'&&g.category!==state.category)return false;
 if(state.variableFilter){const v=byId('variables',state.variableFilter);if(v&&!D.coverage.some(c=>c.goal===g.id&&c.rules.some(r=>v.relatedRules.includes(r))))return false;}
 if(state.filter==='all')return true;const c=cov(g.id,state.filter);return c&&(c.status==='available'||state.includeConditional&&c.status==='conditional'||state.includeProposals&&c.status==='proposal');
}
function groupedNav(items,type,active){
 let out='';for(const category of [...new Set(items.map(x=>x.category))]){out+=`<div class="group-heading">${E(category)}</div>`;out+=items.filter(x=>x.category===category).map(x=>`<button class="nav-item ${x.id===active?'active':''}" data-nav-type="${type}" data-id="${E(x.id)}" ${x.id===active?'aria-current="true"':''}><span class="id">${E(x.id)}</span><span>${E(x.name)}</span></button>`).join('');}return out;
}
function sceneSidebar(list){return `<aside class="sidebar ${state.catalogOpen?'':'collapsed'}" aria-label="场景目录"><div class="sidebar-top"><div class="sidebar-title"><span>场景目标</span><span class="muted">${list.length} / ${D.goals.length}</span></div><input id="catalog-search" class="search" placeholder="搜索场景，如删除、回调…" value="${E(state.search)}" aria-label="搜索场景"><label class="filter-label" for="language-filter">按已有方案筛选场景</label><select id="language-filter"><option value="all">全部场景目标</option>${D.languages.map(l=>`<option value="${l.id}" ${state.filter===l.id?'selected':''}>${E(l.name)} · 已有方案</option>`).join('')}</select>${state.filter!=='all'?`<label class="check-line"><input type="checkbox" id="include-conditional" ${state.includeConditional?'checked':''}>同时包含有条件 / 局部方案</label>${state.filter==='zil'?`<label class="check-line"><input type="checkbox" id="include-proposals" ${state.includeProposals?'checked':''}>同时包含 ZIL 设计目标</label>`:''}`:''}<label class="filter-label" for="category-filter">目标分类</label><select id="category-filter"><option value="all">全部分类</option>${[...new Set(D.goals.map(g=>g.category))].map(c=>`<option ${state.category===c?'selected':''}>${E(c)}</option>`).join('')}</select>${state.variableFilter?`<div class="filter-chip"><span>关联 ${E(byId('variables',state.variableFilter)?.name)}</span>${btn('clear-variable-filter','×','text-button')}</div>`:''}</div><button class="mobile-catalog" data-action="toggle-catalog">${state.catalogOpen?'收起':'展开'}场景目录（${list.length}）</button><div class="sidebar-list">${list.length?groupedNav(list,'goal',state.goal):'<div class="empty"><p>当前筛选没有匹配目标。</p></div>'}</div></aside>`;}
function noLanguages(){return empty('选择要比较的语言','勾选顶部的多个语言，方案、变量和关系图会同时更新。',btn('select-default','选择 ZIL、Rust、TypeScript/JS'));}
function renderScenes(){
 const list=D.goals.filter(goalMatches);if(list.length&&!list.some(g=>g.id===state.goal))state.goal=list[0].id;const g=byId('goals',state.goal);
 let detail='';
 if(!list.length){detail=state.filter==='zil'&&!state.includeProposals?empty('ZIL 当前按设计规范登记','“已有方案”不包含尚未完成的设计目标。可以查看规范提出的目标及其成立条件。',btn('include-zil-proposals','查看 ZIL 设计目标')):empty('没有匹配的场景','可清空搜索、分类或语言筛选，返回全部场景目标。',btn('clear-filters','显示全部场景'));}
 else detail=`<section class="panel"><div class="scene-head"><div><div class="kicker"><span class="scene-id">${E(g.id)}</span><span>${E(kindNames[g.kind]||g.category)}</span></div><h2>${E(g.name)}</h2><p class="scene-question">${E(g.question)}</p></div>${btn('copy-link','复制定位链接','quiet')}</div><div class="scene-steps"><div><h4>要完成的操作</h4><ul>${ARR(g.operations).map(o=>`<li>${E(textOf(o))}</li>`).join('')}</ul></div><div><h4>怎样才算满足这个目标</h4><p>${E(g.acceptance)}</p></div></div><div class="boundary"><b>判断边界：</b>${E(g.boundary)}</div></section>${selected().length?`<div class="section-heading"><h3>同一个目标，不同语言的方案</h3>${pillTabs([['flow','关系图'],['cards','方案并排'],['rules','规则明细表']],'sceneMode')}</div>${state.sceneMode==='flow'?flowDiagram(g):state.sceneMode==='rules'?sceneRuleTable(g):''}${state.sceneMode==='flow'?'<div class="section-heading"><h3>方案细节与代价</h3><span class="small muted">同一列中的规则和前提需要共同成立</span></div>':''}<div class="route-scroll"><div class="route-grid">${selected().map(l=>routeCard(cov(g.id,l.id),l)).join('')}</div></div>${examplesFor(g.id)}`:noLanguages()}`;
 return heading('目标 → 方案 → 规则组合','从一个目标，看清语言的设计选择','先选你想完成的场景，再比较各语言如何实现。顶部多选语言可同步改变方案、关系图和对照表。',btn('show-goal-matrix','查看全部目标矩阵','quiet'))+`<div class="workspace">${sceneSidebar(list)}<div class="content">${detail}</div></div>`;
}
function routeCard(c,l){
 if(!c)return empty(l.name,'此目标尚未登记。');const vars=relatedVars(c.rules),base=rawCov(c.goal,l.id),key=c.goal+':'+l.id;
 const choices=base.alternatives?.length?`<label class="filter-label" style="margin:0 0 6px">选择该语言的路线</label><select data-route-choice="${E(key)}" aria-label="${E(l.name)}的实现路线" style="width:100%;margin-bottom:12px"><option value="primary">${E(base.mechanism)}</option>${base.alternatives.map(a=>`<option value="${E(a.id)}" ${state.routeChoices?.[key]===a.id?'selected':''}>${E(a.mechanism||a.name)}</option>`).join('')}</select>`:'';
 return `<article class="route-card" style="--lang:${safeColor(l.color)}"><div class="route-lang"><strong>${E(l.name)}</strong>${statusBadge(c.status)}</div>${choices}<h3>${E(c.mechanism)}</h3><p class="summary">${E(c.summary)}</p><div class="route-section"><h4>采用的规则组合</h4><div class="rule-chips">${c.rules.length?c.rules.map(ruleButton).join(''):'<span class="muted">尚无已核实组合</span>'}</div></div><div class="route-section"><h4>这些规则怎样共同起作用</h4><ol class="step-text">${ARR(c.steps).map(x=>`<li>${E(x)}</li>`).join('')}</ol></div><div class="route-section"><h4>前提与适用范围</h4><ul>${ARR(c.premises).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div class="route-section"><h4>实际代价</h4><p class="cost">${E(c.cost)}</p><h4 style="margin-top:11px">限制</h4><p>${E(c.limit)}</p></div><details class="route-section"><summary>关联的设计变量（${vars.length}）</summary><div class="variable-chips">${vars.map(v=>variableButton(v.id)).join('')}</div><p class="small muted" style="margin-top:9px">变量页展示该语言提供的选项；本方案实际采用的机制以上文为准。</p></details>${sourceLinks(c.sources)}<button class="detail-button" data-route="${E(c.goal+':'+c.language)}">展开这条方案</button></article>`;
}
function wrapText(s,n){const a=Array.from(String(s));const out=[];for(let i=0;i<a.length;i+=n)out.push(a.slice(i,i+n).join(''));return out;}
function svgLines(text,x,y,n=18,lineHeight=17,maxLines=3,attrs=''){
 const lines=wrapText(text,n);return `<text x="${x}" y="${y}" ${attrs}>${lines.slice(0,maxLines).map((t,i)=>`<tspan x="${x}" dy="${i?lineHeight:0}">${E(t)}${i===maxLines-1&&lines.length>maxLines?'…':''}</tspan>`).join('')}</text>`;

function flowDiagram(g){

function inlineMD(text){

function markdown(text){

 while(i<lines.length){const l=lines[i];if(!l.trim()||/^<a id=/.test(l)){i++;continue;}if(/^```/.test(l)){let b=[];const kind=l.slice(3).trim();i++;while(i<lines.length&&!/^```/.test(lines[i]))b.push(lines[i++]);i++;out+=`<pre><code>${E(b.join('\n'))}</code></pre>`;continue;}
 const h=/^(#{1,6})\s+(.+)$/.exec(l);if(h){const level=Math.min(h[1].length,4);out+=`<h${level}>${inlineMD(h[2])}</h${level}>`;i++;continue;}

 if(/^[-*]\s/.test(l)){let li='';while(i<lines.length&&/^[-*]\s/.test(lines[i]))li+=`<li>${inlineMD(lines[i++].slice(2))}</li>`;out+=`<ul>${li}</ul>`;continue;}
 if(/^\d+\.\s/.test(l)){let li='';while(i<lines.length&&/^\d+\.\s/.test(lines[i]))li+=`<li>${inlineMD(lines[i++].replace(/^\d+\.\s/,''))}</li>`;out+=`<ol>${li}</ol>`;continue;}

 }return out;
}

 const chapter=specChapters.find(c=>c.id===state.chapter)||specChapters[0],index=specChapters.indexOf(chapter);
 content=`<div class="workspace"><aside class="sidebar docs-sidebar ${state.catalogOpen?'':'collapsed'}"><div class="sidebar-top"><div class="sidebar-title"><span>ZIL R2 原始规范</span><span class="muted">${specChapters.length-1} 章</span></div><p class="small muted">设计合同，非实现进度。</p></div><button class="mobile-catalog" data-action="toggle-catalog">${state.catalogOpen?'收起':'展开'}完整章节目录</button><div class="sidebar-list">${specChapters.map(c=>`<button class="nav-item ${c.id===chapter.id?'active':''}" data-chapter="${c.id}">${E(c.title)}</button>`).join('')}</div></aside><article class="panel content"><div class="doc-toolbar"><p>保留最新找回的 R2 原文；展示体系的修改不改写语言合同。</p>${btn('download-spec','下载完整 Markdown')}</div><div class="doc">${markdown(chapter.text)}</div><div class="doc-nav-actions">${index?`<button data-chapter="${specChapters[index-1].id}">← ${E(specChapters[index-1].title)}</button>`:'<span></span>'}${index<specChapters.length-1?`<button data-chapter="${specChapters[index+1].id}">${E(specChapters[index+1].title)} →</button>`:''}</div></article></div>`;
 }else if(state.doc==='sources')content=`<div class="notice">语言能力按这里列出的官方文档、规范或研究资料登记。ZIL 来自本次找回的 R2 设计；其他语言的方案判断是对来源的归纳，不等于本轮逐语言编译与性能实测。</div><div class="source-grid">${D.sources.map(s=>`<article class="panel source-card"><span class="eyebrow">${E(s.id)} · ${E(s.kind||'官方资料')}</span><h3>${s.url?.startsWith('http')?`<a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title)}</a>`:`<button class="text-button" data-action="open-spec">${E(s.title)}</button>`}</h3><p>${E(s.note)}</p><div class="source-url">${E(s.url||'本包中的 zil-language-design.md')}</div></article>`).join('')}</div>`;
 else content=`<article class="panel doc">${markdown(DOCS[state.doc]||'暂无内容。')}</article>`;
 return heading('可追溯 / 可离线阅读','语言设计、判断口径与来源','完整规范随 HTML 内嵌，也单独放在压缩包中。来源按具体方案和语言设置关联，不把设计目标显示成已有实现。')+nav+content;
}
function render(options={}){
 const focused=document.activeElement;const restore=focused?.id&&['INPUT','SELECT'].includes(focused.tagName)?{id:focused.id,start:focused.selectionStart,end:focused.selectionEnd}:null;
 renderLanguages();$('main').innerHTML=state.view==='scenes'?renderScenes():state.view==='basics'?renderBasics():state.view==='compare'?renderCompare():renderDocs();
 document.title=(state.view==='scenes'?byId('goals',state.goal)?.name:state.view==='basics'?'基础规则':state.view==='compare'?'多语言对照':'语言设计与来源')+' · 语言设计图谱';writeHash();
 if(restore){const el=$(restore.id);if(el){el.focus({preventScroll:true});if(restore.start!=null&&el.setSelectionRange)try{el.setSelectionRange(restore.start,restore.end);}catch{}}}
 if(options.top)window.scrollTo({top:0,behavior:'instant'});
}
let returnFocus=null;
function openDialog(html){const dialog=$('detail-dialog');if(!dialog.open)returnFocus=document.activeElement;$('dialog-body').innerHTML=html;if(!dialog.open){if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');}$('dialog-close').focus({preventScroll:true});}
function closeDialog(){const d=$('detail-dialog');if(typeof d.close==='function')d.close();else d.removeAttribute('open');if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
function openRule(id){const r=byId('rules',id);if(r)openDialog(ruleDetail(r,true));}
function openVariable(id){const v=byId('variables',id);if(v)openDialog(variableDetail(v,true));}
function openRoute(key){const [g,l]=key.split(':'),c=cov(g,l),language=lang(l);if(!c||!language)return;openDialog(`<div class="kicker"><span class="scene-id">${E(g)}</span><span>${E(byId('goals',g).name)}</span></div><h2 id="dialog-title">${E(language.name)} · ${E(c.mechanism)}</h2><div style="margin-top:12px">${statusBadge(c.status)}</div><p style="margin-top:15px">${E(c.summary)}</p><div class="route-section"><h4>规则必须共同成立</h4><div class="rule-chips">${c.rules.map(ruleButton).join('')}</div></div><div class="route-section"><h4>推导步骤</h4><ol>${ARR(c.steps).map(x=>`<li>${E(x)}</li>`).join('')}</ol></div><div class="route-section"><h4>适用前提</h4><ul>${ARR(c.premises).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div class="route-section"><h4>实际代价</h4><p>${E(c.cost)}</p></div><div class="boundary"><b>边界：</b>${E(c.limit)}</div><div class="route-section"><h4>关联设计变量</h4><div class="variable-chips">${relatedVars(c.rules).map(v=>variableButton(v.id)).join('')}</div></div>${sourceLinks(c.sources)}`);}
function openAbout(){openDialog(`<h2 id="dialog-title">能力状态怎样判断</h2><p style="margin-top:13px">判断单位是“某种语言的一条具体方案，在这个场景的条件下能做什么”。一项语言可以提供多种路线，表中展示的是有来源支持的代表性方案。</p><div class="definition-section"><div class="table-wrap"><table><thead><tr><th>状态</th><th>含义</th></tr></thead><tbody><tr><td>${statusBadge('available')}</td><td>已有语言、标准库或明确库机制可以满足所列场景，仍需遵守该方案正常前提。不是本次运行该语言测试的标记。</td></tr><tr><td>${statusBadge('conditional')}</td><td>只覆盖子集，或需要额外人工协议、可信封装；不能视为语言自动保证了全部要求。</td></tr><tr><td>${statusBadge('proposal')}</td><td>设计文档提出了目标和约束；尚无本轮确认的完整实现证据。</td></tr><tr><td>${statusBadge('unsupported')}</td><td>本表所选路线不提供该项要求，不代表理论上不能用其他方案实现。</td></tr><tr><td>${statusBadge('unknown')}</td><td>资料不足以判断，不能当作“不支持”。</td></tr><tr><td>${statusBadge('empirical')}</td><td>必须定义同语义、同工作量的测量；不能凭设计机制宣布性能已达标。</td></tr></tbody></table></div></div><div class="boundary">ZIL 按 R2 设计合同登记；Hylo 区分文档中的机制与研发成熟度。图中连线仅表示依赖，不是形式化证明；规则数量也不是能力分数。</div>`);}
function notify(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.remove('visible'),2500);}
function download(name,text,mime='text/plain;charset=utf-8'){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已生成 '+name);}
function csvData(){const ls=selected(),rows=comparisonRows();const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const data=[['编号','名称',...ls.map(l=>l.name)]];for(const r of rows)data.push([r.id,r.name,...ls.map(l=>{if(state.compare==='variables'){const s=setting(r.id,l.id);return [stateNames[s.state],...ARR(s.values).map(id=>r.options.find(o=>o.value===id)?.label||id),s.summary,s.scope].filter(Boolean).join('；');}const c=cov(r.id,l.id);return [statusNames[c.status],c.mechanism,c.summary,'边界：'+c.limit].join('；');})]);return '\ufeff'+data.map(row=>row.map(quote).join(',')).join('\r\n');}
function clearFilters(){Object.assign(state,{filter:'all',includeConditional:false,includeProposals:false,category:'all',search:'',variableFilter:''});}
async function handleAction(action){
 if(action==='download-spec'){download('zil-language-design.md',DOCS.spec,'text/markdown;charset=utf-8');return;}
 if(action==='export-csv'){download('language-'+state.compare+'.csv',csvData(),'text/csv;charset=utf-8');return;}
 if(action==='about'){openAbout();return;}
 if(action==='copy-link'){try{await navigator.clipboard.writeText(location.href);notify('已复制当前场景和语言选择');}catch{openDialog(`<h2 id="dialog-title">当前定位链接</h2><p style="margin:12px 0">复制下面的地址。离线文件链接需要在同一文件所在位置使用。</p><input id="share-link" class="search" value="${E(location.href)}" readonly aria-label="当前定位链接">`);$('share-link').select();}return;}
 if(action==='select-all')state.selected=D.languages.map(l=>l.id);
 if(action==='select-default')state.selected=[...defaults.selected];
 if(action==='clear-selection')state.selected=[];
 if(action==='clear-filters')clearFilters();
 if(action==='clear-variable-filter')state.variableFilter='';
 if(action==='toggle-catalog')state.catalogOpen=!state.catalogOpen;
 if(action==='include-zil-proposals')state.includeProposals=true;
 if(action==='show-goal-matrix'){state.view='compare';state.compare='goals';state.search='';}
 if(action==='open-spec'){closeDialog();state.view='docs';state.doc='spec';state.chapter='0';}
 render();
}
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-action],[data-view],[data-set],[data-nav-type],[data-rule],[data-variable],[data-route],[data-focus],[data-open-goal],[data-variable-goals],[data-chapter],[data-spec-anchor]');
 if(e.target.closest('#dialog-close')){closeDialog();return;}
 if(!target)return;const a=target.dataset;
 if(a.action){handleAction(a.action);return;}
 if(a.rule){openRule(a.rule);return;}if(a.variable){openVariable(a.variable);return;}if(a.route){openRoute(a.route);return;}
 if(a.specAnchor){e.preventDefault();const n=/^#s?(\d+)/.exec(a.specAnchor);if(n&&specChapters.some(c=>c.id===n[1])){state.view='docs';state.doc='spec';state.chapter=n[1];render({top:true});}return;}
 if(a.view){state.view=a.view;state.search='';state.catalogOpen=false;render({top:true});return;}
 if(a.set){state[a.set]=a.value;if(a.set==='basic'||a.set==='compare')state.search='';render();return;}
 if(a.navType){if(a.navType==='goal')state.goal=a.id;if(a.navType==='variable')state.variable=a.id;if(a.navType==='rule')state.rule=a.id;state.catalogOpen=false;render();return;}
 if(a.focus){state.focus=a.focus;render();return;}
 if(a.openGoal){closeDialog();state.view='scenes';clearFilters();state.goal=a.openGoal;state.catalogOpen=false;render({top:true});return;}
 if(a.variableGoals){closeDialog();state.view='scenes';clearFilters();state.variableFilter=a.variableGoals;render({top:true});return;}
 if(a.chapter){state.chapter=a.chapter;state.doc='spec';state.catalogOpen=false;render({top:true});}
});
document.addEventListener('change',e=>{
 const t=e.target;if(t.dataset.routeChoice){state.routeChoices={...state.routeChoices};if(t.value==='primary')delete state.routeChoices[t.dataset.routeChoice];else state.routeChoices[t.dataset.routeChoice]=t.value;render();return;}if(t.name==='language'){state.selected=t.checked?[...new Set([...state.selected,t.value])]:state.selected.filter(x=>x!==t.value);render();return;}
 if(t.id==='language-filter'){state.filter=t.value;state.includeConditional=false;state.includeProposals=false;render();}
 if(t.id==='category-filter'){state.category=t.value;render();}
 if(t.id==='include-conditional'){state.includeConditional=t.checked;render();}
 if(t.id==='include-proposals'){state.includeProposals=t.checked;render();}
 if(t.id==='only-differences'){state.differences=t.checked;render();}
});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){state.search=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if((e.key==='Enter'||e.key===' ')&&e.target.closest('g[role="button"]')){e.preventDefault();e.target.closest('g[role="button"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
window.addEventListener('hashchange',()=>{readHash();state.search='';render();});
$('detail-dialog').addEventListener('click',e=>{if(e.target===$('detail-dialog')){const r=$('detail-dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
globalThis.DesignAtlas={data:D,state,render,goalMatches,comparisonRows,csvData,markdown,specChapters};
state.selected=ARR(state.selected).filter(x=>lang(x));readHash();render();
})();
</script>
</body>
</html>
