[package]
name = "roam"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
resolver = "3"

[dependencies]
serde_json = "=1.0.154"
zil-base = { path = "../../crates/zil-base" }
zil-db = { path = "../../crates/zil-db" }
zil-driver = { path = "../../crates/zil-driver" }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = "debuginfo"
lto = "thin"
