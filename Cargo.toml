[workspace]
resolver = "3"
members = [
  "crates/zil-base",
  "crates/zil-ir",
  "crates/zil-semantics",
  "crates/zil-syntax",
  "crates/zil-typeck",
  "crates/zil-solve",
  "crates/zil-check",
  "crates/zil-safety-cases",
  "crates/zil-backend-llvm",
  "crates/zil-llvm-api",
  "crates/zil-db",
  "crates/zil-interp",
  "crates/zil-driver",
  "crates/zil-cli",
  "crates/zil-ide",
]
default-members = ["crates/zil-cli"]

[workspace.package]
version = "1.0.0-alpha.2"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
zil-base = { path = "crates/zil-base" }
zil-ir = { path = "crates/zil-ir" }
zil-semantics = { path = "crates/zil-semantics" }
zil-syntax = { path = "crates/zil-syntax" }
zil-solve = { path = "crates/zil-solve" }
zil-typeck = { path = "crates/zil-typeck" }
zil-check = { path = "crates/zil-check" }
zil-backend-llvm = { path = "crates/zil-backend-llvm" }
zil-llvm-api = { path = "crates/zil-llvm-api" }
zil-db = { path = "crates/zil-db" }
zil-interp = { path = "crates/zil-interp" }
zil-driver = { path = "crates/zil-driver" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
