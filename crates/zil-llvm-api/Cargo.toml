[package]
name = "zil-llvm-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Raw handles remain in private native.rs and its builder/research_prelink children.
# No front-end or verifier dependency, no exported raw native handles.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[features]
default = []
native = []
# Legacy text-to-object path is an explicit differential-test capability only.
text-reference = ["native"]
