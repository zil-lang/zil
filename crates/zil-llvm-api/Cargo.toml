[package]
name = "zil-llvm-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Explicit exception: raw handles and unsafe operations exist only in native.rs,
# native/builder.rs and the opt-in native/products.rs work-product boundary.
# No front-end or verifier dependency, no exported raw native handles.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[features]
default = []
native = []
native-products = ["native"]
# Legacy text-to-object path is an explicit differential-test capability only.
text-reference = ["native"]
