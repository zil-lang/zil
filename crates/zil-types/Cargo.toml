[package]
name = "zil-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Frozen reference crate: superseded by zil-typeck/zil-semantics/zil-solve/zil-check
# and deleted once the new pipeline passes the product gates. Lints introduced
# by Rust 1.100 are not retrofitted here (docs/guide/build.md lint scope).
[lints.rust]
unsafe_code = "forbid"
unused = { level = "allow", priority = -1 }
dead_code = "allow"
unreachable_patterns = "allow"
private_interfaces = "allow"
non_shorthand_field_patterns = "allow"
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }

[dependencies]
zil-base.workspace = true
zil-syntax.workspace = true
zil-ir.workspace = true

[dev-dependencies]
zil-expand.workspace = true
