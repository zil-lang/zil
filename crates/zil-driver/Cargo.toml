[package]
name = "zil-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Legacy crate pending port to the body IR / VerifiedModule pipeline. Lints
# introduced by Rust 1.100 are not retrofitted to the legacy code; the port
# restores the workspace lint set (docs/guide/build.md lint scope).
[lints.rust]
unsafe_code = "forbid"
unused = { level = "allow", priority = -1 }
dead_code = "allow"
unreachable_patterns = "allow"
private_interfaces = "allow"
non_shorthand_field_patterns = "allow"
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }

[dependencies]
zil-base.workspace = true
zil-syntax.workspace = true
zil-ir.workspace = true
zil-expand.workspace = true
zil-types.workspace = true
zil-analyze.workspace = true
zil-verify.workspace = true
zil-ct.workspace = true
zil-lower.workspace = true
zil-db.workspace = true
zil-backend-llvm.workspace = true

[features]
default = []
llvm-api = ["zil-backend-llvm/llvm-api"]
