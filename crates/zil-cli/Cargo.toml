[package]
name = "zil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zil-base.workspace = true
zil-driver.workspace = true

[[bin]]
name = "zil"
path = "src/main.rs"

# Explicit compiler-host experiment, matching rustc's process-wide allocator.
# It does not choose a target-program allocator or alter native optimization.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
tikv-jemalloc-sys = { version = "=0.6.1", optional = true, features = ["override_allocator_on_supported_platforms"] }

[features]
default = ["llvm-api"]
llvm-api = ["zil-driver/llvm-api"]
native-products = ["llvm-api", "zil-driver/native-products"]
host-jemalloc = ["dep:tikv-jemalloc-sys"]
