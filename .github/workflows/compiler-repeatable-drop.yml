name: Repeatable complete environment cleanup
on:
  push:
    branches: [task/repeatable-closure-drop]
    paths: [.github/workflows/compiler-repeatable-drop.yml]
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact baseline and original frozen cases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/complete-setup" .task/repeatable-drop/bench .task/repeatable-drop/neighbors
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/complete-llvm" > "$RUNNER_TEMP/complete-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/complete-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/complete-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/complete-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/complete-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin 2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852 0105b22c5116f645f4e70fbd6d192ec168aa20f1
          git worktree add --detach "$RUNNER_TEMP/complete-base" 2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852
          for f in corpus.py measure.py; do git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/bench/$f > .task/repeatable-drop/bench/$f; done
          for f in controls.py quality.py multimodule.py; do git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/$f > .task/repeatable-drop/$f; done
          for f in check.py corpus.py; do git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/neighbors/$f > .task/repeatable-drop/neighbors/$f; done
      - name: Freeze narrow cleanup specialization and native activation assertions
        run: |
          set -euo pipefail
          python3 .task/repeatable-drop/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.task/repeatable-drop/controls.py');s=p.read_text();old="       assert all('noinline' not in line for line in drops),(name,'destructor policy changed')"
          new=old+"\n       import re\n       drop_bodies=re.findall(r'define internal void @zil\\.closure\\.drop\\.[^\\n]+\\n(.*?)^}',ir,re.M|re.S)\n       assert len(drop_bodies)==n,(name,'missing real drop bodies')\n       if arm=='cand':assert all('load i1' not in body and 'br i1' not in body for body in drop_bodies),(name,'static cleanup not active')\n       else:assert all('load i1' in body and 'br i1' in body for body in drop_bodies),(name,'baseline cleanup changed')"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          PY
          rustfmt --edition 2024 crates/zil-backend-llvm/src/emit/resource_closures.rs
          python3 -m py_compile .task/repeatable-drop/*.py .task/repeatable-drop/bench/*.py .task/repeatable-drop/neighbors/*.py
          git diff --check
          git diff > "$RUNNER_TEMP/complete-setup/production.patch"
          git add crates/zil-backend-llvm/src/emit/resource_closures.rs crates/zil-backend-llvm/src/emit/resource_closures/complete_drop_tests.rs .task/repeatable-drop
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze complete repeatable byte cleanup using existing current Verify obligations'
          git rev-parse HEAD > "$RUNNER_TEMP/complete-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/repeatable-closure-drop
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/repeatable-closure-drop
          rustc -vV > "$RUNNER_TEMP/complete-setup/rustc.txt"
      - name: Entire affected backend and LLVM libraries plus strict controls
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/complete-tests"
          cargo test --locked --offline -p zil-backend-llvm --features llvm-api --lib 2>&1 | tee "$RUNNER_TEMP/complete-setup/backend.log"
          grep 'repeatable_complete_byte_drop_preserves_every_surrender_and_teardown .*ok' "$RUNNER_TEMP/complete-setup/backend.log"
          cargo test --locked --offline -p zil-llvm-api --features native --lib 2>&1 | tee "$RUNNER_TEMP/complete-setup/llvm-tests.log"
          cargo clippy --locked --offline -p zil-backend-llvm --features llvm-api --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/complete-setup/clippy.log"
          cargo fmt --all -- --check
      - name: Independent same-profile release compilers
        id: build
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/complete-base-target" cargo build --locked --offline --release --manifest-path "$RUNNER_TEMP/complete-base/Cargo.toml" -p zil-cli > "$RUNNER_TEMP/complete-setup/base-build.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/complete-candidate-target" cargo build --locked --offline --release -p zil-cli > "$RUNNER_TEMP/complete-setup/candidate-build.log" 2>&1
      - name: Both native backends with actual activation and complete failure cleanup order
        run: |
          set -euo pipefail
          python3 .task/repeatable-drop/controls.py --base "$RUNNER_TEMP/complete-base-target/release/zil" --candidate "$RUNNER_TEMP/complete-candidate-target/release/zil" --out "$RUNNER_TEMP/complete-controls" 2>&1 | tee "$RUNNER_TEMP/complete-setup/controls.log"
      - name: Every original active and inactive runtime boundary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 .task/repeatable-drop/quality.py --base "$RUNNER_TEMP/complete-base-target/release/zil" --candidate "$RUNNER_TEMP/complete-candidate-target/release/zil" --out "$RUNNER_TEMP/complete-quality" 2>&1 | tee "$RUNNER_TEMP/complete-setup/quality.log"
          python3 .task/repeatable-drop/neighbors/check.py --base "$RUNNER_TEMP/complete-base-target/release/zil" --candidate "$RUNNER_TEMP/complete-candidate-target/release/zil" --out "$RUNNER_TEMP/complete-neighbors" 2>&1 | tee "$RUNNER_TEMP/complete-setup/neighbors.log"
      - name: Complete fixed eight-case compiler wait matrix
        run: |
          set -euo pipefail
          python3 .task/repeatable-drop/bench/measure.py --base "$RUNNER_TEMP/complete-base-target/release/zil" --candidate "$RUNNER_TEMP/complete-candidate-target/release/zil" --out "$RUNNER_TEMP/complete-primary" --rounds 5 2>&1 | tee "$RUNNER_TEMP/complete-setup/primary.log"
      - name: Same dispatch and pipeline multi-module histories
        run: |
          set -euo pipefail
          python3 .task/repeatable-drop/multimodule.py --base "$RUNNER_TEMP/complete-base-target/release/zil" --candidate "$RUNNER_TEMP/complete-candidate-target/release/zil" --out "$RUNNER_TEMP/complete-multi" --rounds 5 2>&1 | tee "$RUNNER_TEMP/complete-setup/multi.log"
      - name: Existing native allocation and ownership consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/research/native-api-validation/validate.py --repo "$GITHUB_WORKSPACE" --cli "$RUNNER_TEMP/complete-candidate-target/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/complete-consumer" > "$RUNNER_TEMP/complete-setup/consumer.log" 2>&1
      - name: Preserve exact source and every favorable or unfavorable result
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,tarfile,hashlib,shutil
          t=Path(os.environ['RUNNER_TEMP']);d=Path('.task/repeatable-drop/runs')/os.environ['GITHUB_RUN_ID'];d.mkdir(parents=True);labels=['primary','multi','controls','quality','neighbors','consumer']
          for label in labels:
              source=t/('complete-'+label)
              if source.exists():
                  target=d/label;target.mkdir()
                  for name in ('summary.json','rows.jsonl','runtime.jsonl','cells.json','manifest.json','failures.json','equivalence.json','failure.json'):
                      if (source/name).exists():shutil.copyfile(source/name,target/name)
          omitted=[]
          with tarfile.open(d/'raw.tar.gz','w:gz') as tar:
              for label in ['setup']+labels:
                  path=t/('complete-'+label)
                  if path.exists():
                      for p in path.rglob('*'):
                          if not p.is_file() or any(x in p.parts for x in ('incremental','semantic','objects')):continue
                          with p.open('rb') as f:elf=f.read(4)==b'\x7fELF'
                          if elf:omitted.append({'path':label+'/'+str(p.relative_to(path)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()});continue
                          tar.add(p,arcname=label+'/'+str(p.relative_to(path)))
          (d/'omitted-elf.json').write_text(json.dumps(omitted,indent=2)+'\n')
          f=t/'complete-setup/source.txt';r={'baseline':'2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852','source':f.read_text().strip() if f.exists() else None,'recipe':os.environ['GITHUB_SHA'],'scope':'repeatable byte environment final cleanup only; existing independent Verify unchanged','status_before_preservation':os.environ['PRIOR_STATUS'],'files':{str(p.relative_to(d)):hashlib.sha256(p.read_bytes()).hexdigest() for p in d.rglob('*') if p.is_file()},'main_modified':False,'external_ai_review':False,'acceptance':'Pending full source/evidence review'}
          (d/'receipt.json').write_text(json.dumps(r,indent=2)+'\n');assert (d/'raw.tar.gz').stat().st_size<48*1024*1024
          PY
          git fetch --no-tags origin refs/heads/task/repeatable-closure-drop
          expected="$GITHUB_SHA"; if test -f "$RUNNER_TEMP/complete-setup/source.txt"; then expected="$(cat "$RUNNER_TEMP/complete-setup/source.txt")"; fi
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git add -- ".task/repeatable-drop/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve repeatable cleanup experiment $GITHUB_RUN_ID and exact failure boundaries"
          git push origin HEAD:refs/heads/task/repeatable-closure-drop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: repeatable-drop-${{ github.run_id }}
          path: .task/repeatable-drop/runs/${{ github.run_id }}
          retention-days: 30
