name: ZIL task verification
on:
  push:
    branches: ['research/136-compiled-effects', 'impl/137-byte-truncate']
permissions:
  contents: write
concurrency:
  group: zil-task-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply a hash-checked delta only to this task branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root=pathlib.Path('changes/transport')
          files=sorted(root.glob('task-*.json')) if root.exists() else []
          if len(files)>1: raise SystemExit('Only one task payload per checkpoint')
          for path in files:
              m=json.loads(path.read_text())
              subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
              patch=lzma.decompress(base64.b64decode(m['patch_xz_base64'],validate=True))
              if hashlib.sha256(patch).hexdigest()!=m['sha256']: raise SystemExit('Patch digest mismatch')
              stat=subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode()
              for line in stat.splitlines():
                  name=line.split('\t',2)[2]
                  if name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts: raise SystemExit('Unsafe path')
                  if not (name.startswith(('crates/','changes/','docs/research/','docs/IMPL137')) or name in ('_zil_design.md','spec/interfaces.json')): raise SystemExit('Outside task write scope: '+name)
                  before=subprocess.run(['git','rev-parse','--verify',m['base']+':'+name],capture_output=True)
                  now=subprocess.run(['git','rev-parse','--verify','HEAD:'+name],capture_output=True)
                  if before.returncode != now.returncode or (before.returncode == 0 and before.stdout != now.stdout): raise SystemExit('Concurrent change: '+name)
              subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
              subprocess.run(['git','apply','--index','-'],input=patch,check=True)
              subprocess.run(['git','rm','--',str(path)],check=True)
              subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Apply verified task source delta '+m['local_commit']],check=True)
          PY
          if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Pin toolchain and record exact source
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "ZIL_TEST_REPORT_DIR=$RUNNER_TEMP/native-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/receipts"
          git rev-parse HEAD | tee "$RUNNER_TEMP/receipts/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/receipts/source-tree.txt"
          git bundle create "$RUNNER_TEMP/receipts/repository.bundle" HEAD --branches --remotes
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc -vV > "$RUNNER_TEMP/receipts/toolchain.txt"
          clang --version >> "$RUNNER_TEMP/receipts/toolchain.txt"
      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/receipts/fmt.log"
      - name: Workspace tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo test --locked --workspace --no-default-features 2>&1 | tee "$RUNNER_TEMP/receipts/workspace.log"
      - name: Clippy without suppressing failures
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/receipts/clippy.log"
      - name: Evidence outside Git
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-task-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/receipts/
            ${{ runner.temp }}/native-evidence/
          retention-days: 14
          if-no-files-found: error
