name: Compiler signature dependency facets
on:
  push:
    branches: [task/G10.5.1.3]
    paths:
      - '.task/G10.5.1.3/apply.py'
      - '.github/workflows/compiler-signature-facets.yml'
permissions:
  contents: write
concurrency:
  group: compiler-signature-facets
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Prepare exact baseline, tools and frozen corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/facet-setup" .task/G10.5.1.3/bench
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/facet-llvm" > "$RUNNER_TEMP/facet-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/facet-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/facet-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/facet-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/facet-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin e69091059ed999a5279303cdd07e9f602703f079
          git worktree add --detach "$RUNNER_TEMP/facet-base" e69091059ed999a5279303cdd07e9f602703f079
          git fetch --depth=1 --no-tags origin e2ffe7033127e006342465611181367995e6115e
          for file in corpus.py measure.py; do
            git show e2ffe7033127e006342465611181367995e6115e:.task/G10.5.1.2/$file > .task/G10.5.1.3/bench/$file
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.task/G10.5.1.3/bench/corpus.py');s=p.read_text();s=s.replace("('owned32','resource',32)]", "('owned32','resource',32),('shared4096','graph',4096)]");assert 'shared4096' in s;p.write_text(s)
          p=Path('.task/G10.5.1.3/bench/measure.py');s=p.read_text();s=s.replace('906940ea78dcd5298c9168c4d17197b5983bf954','e69091059ed999a5279303cdd07e9f602703f079');p.write_text(s)
          PY
      - name: Freeze production candidate and run direct reuse controls
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .task/G10.5.1.3/apply.py .task/G10.5.1.3/bench/*.py
          if grep -q 'ZIL-FUNCTION-TYPES-2' crates/zil-types/src/incremental.rs; then
            python3 .task/G10.5.1.3/apply.py
          fi
          rustfmt --edition 2024 --config skip_children=true crates/zil-types/src/incremental.rs crates/zil-driver/src/function_incremental_tests.rs
          git diff --check
          git diff > "$RUNNER_TEMP/facet-setup/candidate.patch"
          git add -- crates/zil-types/src/incremental.rs crates/zil-driver/src/function_incremental_tests.rs .task/G10.5.1.3/bench
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bind scalar Types reuse to actual signature dependencies; pending validation'
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/facet-setup/source.txt"
          rustc -vV > "$RUNNER_TEMP/facet-setup/rustc.txt"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/facet-tests"
          cargo test --locked --offline -p zil-driver --lib function_types -- --nocapture 2>&1 | tee "$RUNNER_TEMP/facet-setup/direct-controls.log"
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/facet-setup/direct-controls.log"
          cargo test --locked --offline -p zil-types -p zil-driver --lib 2>&1 | tee "$RUNNER_TEMP/facet-setup/full-libraries.log"
          cargo clippy --locked --offline -p zil-types -p zil-driver --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/facet-setup/clippy.log"
          cargo fmt --all -- --check
      - name: Build separate identical-profile release compilers
        id: build
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/facet-base-target" cargo build --locked --offline --release --manifest-path "$RUNNER_TEMP/facet-base/Cargo.toml" -p zil-cli > "$RUNNER_TEMP/facet-setup/base-build.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/facet-candidate-target" cargo build --locked --offline --release -p zil-cli > "$RUNNER_TEMP/facet-setup/candidate-build.log" 2>&1
      - name: Paired full compiler and runtime matrix
        id: paired
        shell: bash
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.3/bench/measure.py --base "$RUNNER_TEMP/facet-base-target/release/zil" --candidate "$RUNNER_TEMP/facet-candidate-target/release/zil" --out "$RUNNER_TEMP/facet-data" --rounds 5 2>&1 | tee "$RUNNER_TEMP/facet-setup/paired.log"
      - name: Existing native resource and allocation-failure controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research/native-api-validation/validate.py --repo "$GITHUB_WORKSPACE" --cli "$RUNNER_TEMP/facet-candidate-target/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/facet-consumer" 2>&1 | tee "$RUNNER_TEMP/facet-setup/consumer.log"
      - name: Preserve exact source, all failures and complete observed results
        if: ${{ always() }}
        shell: bash
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,os,shutil,hashlib,tarfile
          P=pathlib.Path;t=P(os.environ['RUNNER_TEMP']);out=P('.task/G10.5.1.3/runs')/os.environ['GITHUB_RUN_ID'];out.mkdir(parents=True)
          src=t/'facet-data'
          for name in ('manifest.json','summary.json','rows.jsonl','cells.json','failures.json','equivalence.json','runtime.jsonl'):
              if (src/name).exists():shutil.copyfile(src/name,out/name)
          if (t/'facet-consumer/summary.json').exists():shutil.copyfile(t/'facet-consumer/summary.json',out/'consumer.json')
          with tarfile.open(out/'raw.tar.gz','w:gz') as tar:
              for p,label in [(t/'facet-setup','setup'),(src/'logs','logs'),(src/'runtime-logs','runtime-logs'),(src/'corpus','corpus')]:
                  if p.exists():tar.add(p,arcname=label)
          if (out/'raw.tar.gz').stat().st_size>48*1024*1024:raise RuntimeError('archive too large; do not silently drop evidence')
          f=t/'facet-setup/source.txt'
          receipt={'status_before_preservation':os.environ['PRIOR_STATUS'],'baseline':'e69091059ed999a5279303cdd07e9f602703f079','recipe':os.environ['GITHUB_SHA'],'measured_source':f.read_text().strip() if f.exists() else None,'files':{p.name: {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.iterdir() if p.is_file()},'external_ai_review_requested':False,'main_modified':False,'merge_allowed':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PY
          git fetch --no-tags origin refs/heads/task/G10.5.1.3
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- ".task/G10.5.1.3/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve signature-facet experiment $GITHUB_RUN_ID without main integration"
          git push origin HEAD:refs/heads/task/G10.5.1.3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: compiler-signature-facets-${{ github.run_id }}
          path: |
            .task/G10.5.1.3
            ${{ runner.temp }}/facet-setup
          retention-days: 30
