name: Exact equivalence position recheck
on:
  push:
    branches: [task/compiler-merge-order]
    paths: [.github/workflows/compiler-merge-position-recheck.yml]
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reuse exact pinned install and unmodified screening commands
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap,os
          s=Path('.github/workflows/compiler-merge-position.yml').read_text();marks=list(re.finditer(r'^      - (?:name|uses):',s,re.M));out=Path(os.environ['RUNNER_TEMP'])/'position-commands';out.mkdir();count=0
          for i,mark in enumerate(marks):
              chunk=s[mark.start():marks[i+1].start() if i+1<len(marks) else len(s)]
              if not chunk.startswith('      - name:') or '        run: |\n' not in chunk:continue
              (out/f'{count}.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]));count+=1
          assert count==6,count
          PY
          bash "$RUNNER_TEMP/position-commands/0.sh"
      - name: Correct only extra normalization pass options to match standard LLVM23
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old='function(sroa,early-cse,instcombine,simplifycfg),mergefunc,default<O2>'
          new='function(sroa,early-cse,instcombine<max-iterations=1;no-verify-fixpoint>,simplifycfg),mergefunc,default<O2>'
          for name,count in [('crates/zil-llvm-api/src/research_position.rs',2),('.task/merge-order/pipelines.json',1),('.task/merge-order/positions.py',1)]:
              p=Path(name);s=p.read_text();assert s.count(old)==count,(name,s.count(old));p.write_text(s.replace(old,new))
          # This matches default<O2>'s printed InstCombine settings. Current
          # language Verify and LLVM module verification before/after stay on.
          PY
          rustfmt --edition 2024 crates/zil-llvm-api/src/lib.rs
          python3 -m py_compile .task/merge-order/*.py .task/merge-order/bench/*.py
          git diff --check
          git diff > "$RUNNER_TEMP/position-setup/research.patch"
          git add crates/zil-llvm-api/src/research_position.rs .task/merge-order/pipelines.json .task/merge-order/positions.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Match default bounded InstCombine policy in extra normalization probe; preserve first abort'
          git rev-parse HEAD > "$RUNNER_TEMP/position-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/compiler-merge-order
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/compiler-merge-order
          rustc -vV > "$RUNNER_TEMP/position-setup/rustc.txt"
      - name: Real external-address identity in every candidate pipeline
        run: bash "$RUNNER_TEMP/position-commands/2.sh"
      - name: One release compiler for all unchanged screen arms
        run: bash "$RUNNER_TEMP/position-commands/3.sh"
      - name: Full original equal and unequal handler screen
        run: bash "$RUNNER_TEMP/position-commands/4.sh"
      - name: Preserve all source variants and the first aborted run
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: bash "$RUNNER_TEMP/position-commands/5.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: merge-position-recheck-${{ github.run_id }}
          path: .task/merge-order/positions-runs/${{ github.run_id }}
          retention-days: 30
