name: Normalized early function equivalence acceptance
on:
  push:
    branches: [task/compiler-normalized-merging]
    paths: [.github/workflows/compiler-normalized-merging.yml]
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact current baseline and original test sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normalized-setup" .task/normalized-merging/bench .task/normalized-merging/neighbors
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/normalized-llvm" > "$RUNNER_TEMP/normalized-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/normalized-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/normalized-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/normalized-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/normalized-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin 2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852 0105b22c5116f645f4e70fbd6d192ec168aa20f1
          git worktree add --detach "$RUNNER_TEMP/normalized-base" 2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852
          for f in corpus.py measure.py; do git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/bench/$f > .task/normalized-merging/bench/$f; done
          for f in controls.py quality.py multimodule.py; do git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/$f > .task/normalized-merging/$f; done
          for f in check.py corpus.py; do git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/neighbors/$f > .task/normalized-merging/neighbors/$f; done
      - name: Freeze fixed production policy and exact comparison commands
        run: |
          set -euo pipefail
          python3 .task/normalized-merging/apply.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.task/normalized-merging')
          for name in ['bench/measure.py','quality.py','multimodule.py','neighbors/check.py','controls.py']:
              p=root/name;s=p.read_text();old="'--function-merging','after'";assert s.count(old)==1,(name,s.count(old))
              condition="arm=='cand' and backend=='llvm-api'" if name=='controls.py' else "arm=='cand'"
              s=s.replace(old,"'--function-merging','before-and-after' if "+condition+" else 'after'")
              p.write_text(s)
          # Complete the absent multi-module Check lane without changing inputs.
          p=root/'multimodule.py';s=p.read_text();assert s.count("['O0','O2']")==3
          s=s.replace("['O0','O2']","['check','O0','O2']")
          old="           row,stdout,stderr=m.timed(argv,out/'logs'/str(len(rows)),timeout=180)"
          new="           if mode=='check':argv=[tools[arm],'check',work/'main.zil','--json','--semantic-cache',work/'semantic']\n"+old
          assert s.count(old)==1;s=s.replace(old,new)
          old='           for data in inputs:';assert s.count(old)==1;s=s.replace(old,"           for data in (inputs if mode!='check' else []):")
          old="row['text_sha256']=m.text_hash(exe)";assert s.count(old)==1;s=s.replace(old,"row['text_sha256']=m.text_hash(exe) if mode!='check' else None")
          assert s.count('len(SNAPS)*5')==1;s=s.replace('len(SNAPS)*5','len(SNAPS)*7');p.write_text(s)
          PY
          rustfmt --edition 2024 crates/zil-llvm-api/src/lib.rs crates/zil-cli/tests/function_merging_research.rs
          python3 -m py_compile .task/normalized-merging/*.py .task/normalized-merging/bench/*.py .task/normalized-merging/neighbors/*.py
          git diff --check
          git diff > "$RUNNER_TEMP/normalized-setup/production.patch"
          git add crates/zil-llvm-api/src/lib.rs crates/zil-llvm-api/src/native.rs crates/zil-cli/tests/function_merging_research.rs docs/guide/function-merging.md .task/normalized-merging
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze normalized early merging and complete comparative request protocol'
          git rev-parse HEAD > "$RUNNER_TEMP/normalized-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/compiler-normalized-merging
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/compiler-normalized-merging
          rustc -vV > "$RUNNER_TEMP/normalized-setup/rustc.txt"
      - name: All affected LLVM and backend tests plus real CLI cache boundary
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/normalized-tests"
          cargo test --locked --offline -p zil-llvm-api --features native,text-reference 2>&1 | tee "$RUNNER_TEMP/normalized-setup/llvm.log.tests"
          grep 'merging_preserves_distinct_addresses_exports_and_current_validation .*ok' "$RUNNER_TEMP/normalized-setup/llvm.log.tests"
          cargo test --locked --offline -p zil-backend-llvm --features llvm-api --lib 2>&1 | tee "$RUNNER_TEMP/normalized-setup/backend.log"
          cargo test --locked --offline -p zil-cli --test function_merging_research 2>&1 | tee "$RUNNER_TEMP/normalized-setup/cli-policy.log"
          cargo clippy --locked --offline -p zil-llvm-api --features native,text-reference --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/normalized-setup/clippy.log"
          cargo fmt --all -- --check
      - name: Separate same-profile release compilers
        id: build
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/normalized-base-target" cargo build --locked --offline --release --manifest-path "$RUNNER_TEMP/normalized-base/Cargo.toml" -p zil-cli > "$RUNNER_TEMP/normalized-setup/base-build.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/normalized-candidate-target" cargo build --locked --offline --release -p zil-cli > "$RUNNER_TEMP/normalized-setup/candidate-build.log" 2>&1
      - name: Real both-backend allocation-failure and exact cleanup observations
        run: |
          set -euo pipefail
          python3 .task/normalized-merging/controls.py --base "$RUNNER_TEMP/normalized-base-target/release/zil" --candidate "$RUNNER_TEMP/normalized-candidate-target/release/zil" --out "$RUNNER_TEMP/normalized-controls" 2>&1 | tee "$RUNNER_TEMP/normalized-setup/controls.log"
      - name: All original active and inactive runtime cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 .task/normalized-merging/quality.py --base "$RUNNER_TEMP/normalized-base-target/release/zil" --candidate "$RUNNER_TEMP/normalized-candidate-target/release/zil" --out "$RUNNER_TEMP/normalized-quality" 2>&1 | tee "$RUNNER_TEMP/normalized-setup/quality.log"
          python3 .task/normalized-merging/neighbors/check.py --base "$RUNNER_TEMP/normalized-base-target/release/zil" --candidate "$RUNNER_TEMP/normalized-candidate-target/release/zil" --out "$RUNNER_TEMP/normalized-neighbors" 2>&1 | tee "$RUNNER_TEMP/normalized-setup/neighbors.log"
      - name: Complete original eight-case weighted matrix
        run: |
          set -euo pipefail
          python3 .task/normalized-merging/bench/measure.py --base "$RUNNER_TEMP/normalized-base-target/release/zil" --candidate "$RUNNER_TEMP/normalized-candidate-target/release/zil" --out "$RUNNER_TEMP/normalized-primary" --rounds 5 2>&1 | tee "$RUNNER_TEMP/normalized-setup/primary.log"
      - name: Complete multi-module Check O0 O2 and edit histories
        run: |
          set -euo pipefail
          python3 .task/normalized-merging/multimodule.py --base "$RUNNER_TEMP/normalized-base-target/release/zil" --candidate "$RUNNER_TEMP/normalized-candidate-target/release/zil" --out "$RUNNER_TEMP/normalized-multi" --rounds 5 2>&1 | tee "$RUNNER_TEMP/normalized-setup/multi.log"
      - name: Native resource consumer regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/research/native-api-validation/validate.py --repo "$GITHUB_WORKSPACE" --cli "$RUNNER_TEMP/normalized-candidate-target/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/normalized-consumer" > "$RUNNER_TEMP/normalized-setup/consumer.log" 2>&1
      - name: Preserve all source variants, raw flags and complete input histories
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,tarfile,hashlib,shutil
          t=Path(os.environ['RUNNER_TEMP']);d=Path('.task/normalized-merging/runs')/os.environ['GITHUB_RUN_ID'];d.mkdir(parents=True);labels=['primary','multi','controls','quality','neighbors','consumer']
          for label in labels:
              source=t/('normalized-'+label)
              if source.exists():
                  target=d/label;target.mkdir()
                  for name in ('summary.json','rows.jsonl','runtime.jsonl','cells.json','manifest.json','failures.json','equivalence.json','failure.json'):
                      if (source/name).exists():shutil.copyfile(source/name,target/name)
          omitted=[]
          with tarfile.open(d/'raw.tar.gz','w:gz') as tar:
              for label in ['setup']+labels:
                  path=t/('normalized-'+label)
                  if path.exists():
                      for p in path.rglob('*'):
                          if not p.is_file() or any(x in p.parts for x in ('incremental','semantic','objects')):continue
                          with p.open('rb') as f:elf=f.read(4)==b'\x7fELF'
                          if elf:omitted.append({'path':label+'/'+str(p.relative_to(path)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()});continue
                          tar.add(p,arcname=label+'/'+str(p.relative_to(path)))
          (d/'omitted-elf.json').write_text(json.dumps(omitted,indent=2)+'\n')
          f=t/'normalized-setup/source.txt';r={'baseline':'2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852','source':f.read_text().strip() if f.exists() else None,'recipe':os.environ['GITHUB_SHA'],'screen':42931006690,'comparison':'explicit baseline after versus fixed normalized candidate before-and-after; default/off/after unchanged','status_before_preservation':os.environ['PRIOR_STATUS'],'files':{str(p.relative_to(d)):hashlib.sha256(p.read_bytes()).hexdigest() for p in d.rglob('*') if p.is_file()},'main_modified':False,'external_ai_review':False,'acceptance':'Pending source and numerical review, not automatic'}
          (d/'receipt.json').write_text(json.dumps(r,indent=2)+'\n');assert (d/'raw.tar.gz').stat().st_size<48*1024*1024
          PY
          git fetch --no-tags origin refs/heads/task/compiler-normalized-merging
          expected="$GITHUB_SHA"; if test -f "$RUNNER_TEMP/normalized-setup/source.txt"; then expected="$(cat "$RUNNER_TEMP/normalized-setup/source.txt")"; fi
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git add -- ".task/normalized-merging/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve fixed normalized equivalence acceptance $GITHUB_RUN_ID with all outcomes"
          git push origin HEAD:refs/heads/task/compiler-normalized-merging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: normalized-merging-${{ github.run_id }}
          path: .task/normalized-merging/runs/${{ github.run_id }}
          retention-days: 30
