name: Closure resource order algorithm
on:
  push:
    branches: [task/G10.5.1.5]
    paths: [.github/workflows/compiler-resource-order.yml]
permissions:
  contents: write
concurrency:
  group: compiler-resource-order
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Frozen sources and pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/order-setup" .task/G10.5.1.5/bench
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/order-llvm" > "$RUNNER_TEMP/order-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/order-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/order-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/order-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/order-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin 8b5989dd19d9ffa7549ec3de282aafc431c13593
          git worktree add --detach "$RUNNER_TEMP/order-base" 8b5989dd19d9ffa7549ec3de282aafc431c13593
          git fetch --depth=1 --no-tags origin 95af0f0c205a0892e6087f5304ad9981461a7fed
          for f in corpus.py measure.py; do git show 95af0f0c205a0892e6087f5304ad9981461a7fed:.task/G10.5.1.3/bench/$f > .task/G10.5.1.5/bench/$f; done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.task/G10.5.1.5/bench/measure.py');s=p.read_text().replace('e69091059ed999a5279303cdd07e9f602703f079','8b5989dd19d9ffa7549ec3de282aafc431c13593')
          s=s.replace("arms=['base','cand','rust'] if mode=='O2' else ['base','cand']","arms=['base','cand','rust'] if mode=='O2' and case['group']=='resource' else ['base','cand']")
          s=s.replace("arms=['base','cand','rust'];random.Random","arms=(['base','cand','rust'] if case['group']=='resource' else ['base','cand']);random.Random")
          p.write_text(s)
          PY
      - name: Freeze and push source before validation
        id: source
        run: |
          set -euo pipefail
          if ! grep -q 'later: order::Order' crates/zil-analyze/src/resources.rs; then python3 .task/G10.5.1.5/apply.py; fi
          rustfmt --edition 2024 crates/zil-analyze/src/resources.rs
          git diff --check
          git diff > "$RUNNER_TEMP/order-setup/candidate.patch"
          git add -- crates/zil-analyze/src/resources.rs crates/zil-analyze/src/resources/order.rs crates/zil-analyze/src/resources/order/tests.rs .task/G10.5.1.5/bench
          if ! git diff --cached --quiet; then git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze exact packed resource-order candidate; acceptance pending'; fi
          git rev-parse HEAD > "$RUNNER_TEMP/order-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/G10.5.1.5
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/G10.5.1.5
          rustc -vV > "$RUNNER_TEMP/order-setup/rustc.txt"
      - name: Exhaustive oracle and complete affected library tests
        id: controls
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/order-tests"
          cargo test --locked --offline -p zil-analyze --lib 2>&1 | tee "$RUNNER_TEMP/order-setup/analyze.log"
          grep 'every_four_vertex_relation_preserves_union_forget_and_successors .*ok' "$RUNNER_TEMP/order-setup/analyze.log"
          cargo test --locked --offline -p zil-driver --features llvm-api --lib 2>&1 | tee "$RUNNER_TEMP/order-setup/driver.log"
          cargo test --locked --offline -p zil-driver --features llvm-api --test resource_cleanup_pipeline --test resource_closure_cleanup --test resource_closure_lifecycle --test owned_state_replacement_budget --test owned_store_leaf_capture_budget --test persistent_mutable_closure_state --test product_capture_cleanup_raw --test product_capture_cleanup_machine 2>&1 | tee "$RUNNER_TEMP/order-setup/consumers-tests.log"
          cargo clippy --locked --offline -p zil-analyze --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/order-setup/clippy.log"
          cargo fmt --all -- --check
      - name: Identical-profile independent release compilers
        id: build
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/order-base-target" cargo build --locked --offline --release --manifest-path "$RUNNER_TEMP/order-base/Cargo.toml" -p zil-cli > "$RUNNER_TEMP/order-setup/base-build.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/order-candidate-target" cargo build --locked --offline --release -p zil-cli > "$RUNNER_TEMP/order-setup/candidate-build.log" 2>&1
      - name: Unchanged default-limit scale lane
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.5/scale.py --base "$RUNNER_TEMP/order-base-target/release/zil" --candidate "$RUNNER_TEMP/order-candidate-target/release/zil" --out "$RUNNER_TEMP/order-scale" 2>&1 | tee "$RUNNER_TEMP/order-setup/scale.log"
      - name: Complete frozen weighted matrix and machine equality
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.5/bench/measure.py --base "$RUNNER_TEMP/order-base-target/release/zil" --candidate "$RUNNER_TEMP/order-candidate-target/release/zil" --out "$RUNNER_TEMP/order-data" --rounds 5 2>&1 | tee "$RUNNER_TEMP/order-setup/measure.log"
      - name: Native resource and allocation-failure control
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/research/native-api-validation/validate.py --repo "$GITHUB_WORKSPACE" --cli "$RUNNER_TEMP/order-candidate-target/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/order-consumer" 2>&1 | tee "$RUNNER_TEMP/order-setup/native.log"
      - name: Preserve exact observations and failed runs
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,json,tarfile,hashlib,shutil
          P=pathlib.Path;t=P(os.environ['RUNNER_TEMP']);dst=P('.task/G10.5.1.5/runs')/os.environ['GITHUB_RUN_ID'];dst.mkdir(parents=True)
          data=t/'order-data'
          for name in ('manifest.json','summary.json','rows.jsonl','cells.json','failures.json','equivalence.json','runtime.jsonl'):
              if (data/name).exists():shutil.copyfile(data/name,dst/name)
          for folder,name in [('order-scale','scale.json'),('order-consumer','consumer.json')]:
              if (t/folder/'summary.json').exists():shutil.copyfile(t/folder/'summary.json',dst/name)
          with tarfile.open(dst/'raw.tar.gz','w:gz') as tar:
              for path,label in [(t/'order-setup','setup'),(t/'order-scale','scale'),(data/'logs','logs'),(data/'runtime-logs','runtime-logs'),(data/'corpus','corpus')]:
                  if path.exists():tar.add(path,arcname=label)
          assert (dst/'raw.tar.gz').stat().st_size<48*1024*1024
          source=t/'order-setup/source.txt'
          receipt={'baseline':'8b5989dd19d9ffa7549ec3de282aafc431c13593','source':source.read_text().strip() if source.exists() else None,'recipe':os.environ['GITHUB_SHA'],'status':os.environ['PRIOR_STATUS'],'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dst.iterdir()},'main_modified':False,'external_ai_review':False,'acceptance':'Pending source/evidence audit; no automated merge'}
          (dst/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PY
          git fetch --no-tags origin refs/heads/task/G10.5.1.5
          expected="$GITHUB_SHA"; if test -f "$RUNNER_TEMP/order-setup/source.txt"; then expected="$(cat "$RUNNER_TEMP/order-setup/source.txt")"; fi
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git add -- ".task/G10.5.1.5/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve complete resource-order evidence $GITHUB_RUN_ID without main merge"
          git push origin HEAD:refs/heads/task/G10.5.1.5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: closure-resource-order-${{ github.run_id }}
          path: .task/G10.5.1.5
          retention-days: 30
