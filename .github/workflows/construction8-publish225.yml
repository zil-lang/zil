name: Publish exact stage 225
on:
  push:
    branches: [chore/construction8-resume]
    paths: [.github/workflows/construction8-publish225.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5be89dfb36b1f927524008526ae647f3c4a03e59
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact edited bytes and Git identity before publishing isolated branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          encoded=''''''
          records=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
          base='5be89dfb36b1f927524008526ae647f3c4a03e59'
          root=pathlib.Path.cwd()
          for record in records:
              raw=record['raw']
              assert '\nparent '+base+'\n' in raw
              for path,before,ops,after in record['edits']:
                  p=root/path
                  assert p.resolve().is_relative_to(root) and (path.startswith('crates/') or path.startswith('examples/mainline/product_store_capture225/'))
                  old=p.read_bytes() if p.exists() else b''
                  assert hashlib.sha256(old).hexdigest()==before,path
                  lines=old.decode().splitlines(keepends=True)
                  for start,end,text in reversed(ops): lines[start:end]=[text]
                  data=''.join(lines).encode()
                  assert hashlib.sha256(data).hexdigest()==after,path
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              subprocess.run(['git','add','--all'],check=True)
              tree=subprocess.check_output(['git','write-tree'],text=True).strip()
              assert raw.startswith('tree '+tree+'\n')
              sha=subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'],input=raw,text=True).strip()
              assert sha==record['sha']
              subprocess.run(['git','reset','--hard',sha],check=True)
              base=sha
          assert base=='bd802f3a6a59e5e83c9b5c7ebf188371fef6cc0c'
          ref='refs/heads/impl/225-product-store-capture'
          current=subprocess.check_output(['git','ls-remote','origin',ref],text=True).strip()
          assert not current or current.split()[0]==base,'Branch has different work'
          if not current: subprocess.run(['git','push','--force-with-lease='+ref+':','origin',base+':'+ref],check=True)
          assert subprocess.check_output(['git','ls-remote','origin',ref],text=True).split()[0]==base
          print('Published isolated author candidate',base,'not merged or independently reviewed')
          PY
