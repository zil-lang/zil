name: Import exact construction 8 checkpoints
on:
  push:
    branches: [sync/construction8-history]
    paths: [.github/workflows/import-construction8.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify full bundle and publish original evidence history
        shell: bash
        run: |
          set -euo pipefail
          cat .construction8-history/part-*.bin > "$RUNNER_TEMP/history.bundle"
          echo "c252966555c21f284c44f2896b1b85bba514501035af060e1fa597610e61f70b  $RUNNER_TEMP/history.bundle" | sha256sum --check
          git bundle verify "$RUNNER_TEMP/history.bundle"
          git fetch "$RUNNER_TEMP/history.bundle" refs/heads/impl/222-ct-for:refs/import/construction8/0
          test "$(git rev-parse refs/import/construction8/0)" = "a54b7cd5ad8bad0f2022b15aeb58eb38a7429056"
          git merge-base --is-ancestor a8e8831a9e28ac2ec83be6eac740a8f04a00af7d a54b7cd5ad8bad0f2022b15aeb58eb38a7429056
          git fetch "$RUNNER_TEMP/history.bundle" refs/heads/impl/223-product-store:refs/import/construction8/1
          test "$(git rev-parse refs/import/construction8/1)" = "9ca5d5b0ecc6ad531d497217df3b90b77616f5ef"
          git merge-base --is-ancestor a8e8831a9e28ac2ec83be6eac740a8f04a00af7d 9ca5d5b0ecc6ad531d497217df3b90b77616f5ef
          git fetch "$RUNNER_TEMP/history.bundle" refs/heads/impl/224-readonly-product:refs/import/construction8/2
          test "$(git rev-parse refs/import/construction8/2)" = "2b799ed7f405c89c7725b86978286c144070e87f"
          git merge-base --is-ancestor a8e8831a9e28ac2ec83be6eac740a8f04a00af7d 2b799ed7f405c89c7725b86978286c144070e87f
          git push --atomic origin a54b7cd5ad8bad0f2022b15aeb58eb38a7429056:refs/heads/impl/222-ct-for 9ca5d5b0ecc6ad531d497217df3b90b77616f5ef:refs/heads/impl/223-product-store 2b799ed7f405c89c7725b86978286c144070e87f:refs/heads/impl/224-readonly-product
          git ls-remote origin refs/heads/impl/222-ct-for refs/heads/impl/223-product-store refs/heads/impl/224-readonly-product
