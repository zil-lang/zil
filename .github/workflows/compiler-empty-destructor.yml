name: Empty-aware destructor validation
on:
  push:
    branches: [task/G10.5.1.8]
    paths: [.github/workflows/compiler-empty-destructor.yml]
permissions:
  contents: write
concurrency:
  group: compiler-empty-destructor
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Pin source, tools and unchanged neighboring inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-setup" .task/G10.5.1.8/bench .task/G10.5.1.8/neighbors
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/empty-llvm" > "$RUNNER_TEMP/empty-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/empty-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/empty-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/empty-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/empty-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin fc6620a3b975258643eb8f9c3ee77d868ff67a69 63aefac97d5cded7ceb3627337626f0b8edb199e db8696d23270d35d015d20928e75c355a0092627
          git worktree add --detach "$RUNNER_TEMP/empty-base" fc6620a3b975258643eb8f9c3ee77d868ff67a69
          for f in corpus.py measure.py; do git show 63aefac97d5cded7ceb3627337626f0b8edb199e:.task/G10.5.1.7/bench/$f > .task/G10.5.1.8/bench/$f; done
          for f in quality.py controls.py; do git show 63aefac97d5cded7ceb3627337626f0b8edb199e:.task/G10.5.1.7/$f > .task/G10.5.1.8/$f; done
          for f in check.py corpus.py; do git show db8696d23270d35d015d20928e75c355a0092627:.task/destructor-neighbors/$f > .task/G10.5.1.8/neighbors/$f; done
      - name: Freeze new production source before validation
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.8/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/zil-backend-llvm/src/emit/resource_closures/destructor_boundary.rs');s=p.read_text().replace('Some("empty")','Some("is.empty")').replace('condition: local("empty")','condition: local("is.empty")');p.write_text(s)
          p=Path('.task/G10.5.1.8/controls.py');s=p.read_text()
          old="       assert len(drops)==n,(name,len(drops),n)\n       outlined=sum('noinline' in line for line in drops)\n       assert outlined==(n if arm=='cand' and n>=16 else 0),(name,'destructor policy did not match frozen threshold',outlined)"
          new="       workers=[line for line in drops if '@zil.closure.drop.allocated.' in line]\n       fronts=[line for line in drops if '@zil.closure.drop.allocated.' not in line]\n       assert len(fronts)==n and all('noinline' not in line for line in fronts),(name,'inline entry missing')\n       assert len(workers)==(n if arm=='cand' and n>=16 else 0) and all('noinline' in line for line in workers),(name,'allocated worker missing')"
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          PY
          rustfmt --edition 2024 crates/zil-backend-llvm/src/emit/resource_closures.rs
          python3 -m py_compile .task/G10.5.1.8/*.py .task/G10.5.1.8/bench/*.py .task/G10.5.1.8/neighbors/*.py
          git diff --check
          git diff > "$RUNNER_TEMP/empty-setup/patch.diff"
          git add crates/zil-backend-llvm/src/emit/resource_closures.rs crates/zil-backend-llvm/src/emit/resource_closures/destructor_boundary.rs .task/G10.5.1.8
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze empty-aware destructor and exact retained counterexamples; validation pending'
          git rev-parse HEAD > "$RUNNER_TEMP/empty-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/G10.5.1.8
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/G10.5.1.8
          rustc -vV > "$RUNNER_TEMP/empty-setup/rustc.txt"
      - name: Full affected libraries and strict checks
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/empty-tests"
          cargo test --locked --offline -p zil-backend-llvm --features llvm-api --lib 2>&1 | tee "$RUNNER_TEMP/empty-setup/backend.log"
          grep 'allocated_boundary_preserves_the_entire_original_worker .*ok' "$RUNNER_TEMP/empty-setup/backend.log"
          cargo test --locked --offline -p zil-llvm-api --features native --lib 2>&1 | tee "$RUNNER_TEMP/empty-setup/llvm.log.tests"
          cargo clippy --locked --offline -p zil-backend-llvm --features llvm-api --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/empty-setup/clippy.log"
          cargo fmt --all -- --check
      - name: Equal-profile release builds
        id: build
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/empty-base-target" cargo build --locked --offline --release --manifest-path "$RUNNER_TEMP/empty-base/Cargo.toml" -p zil-cli > "$RUNNER_TEMP/empty-setup/base-build.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/empty-candidate-target" cargo build --locked --offline --release -p zil-cli > "$RUNNER_TEMP/empty-setup/candidate-build.log" 2>&1
      - name: Previously failing inactive neighbors first
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.8/neighbors/check.py --base "$RUNNER_TEMP/empty-base-target/release/zil" --candidate "$RUNNER_TEMP/empty-candidate-target/release/zil" --out "$RUNNER_TEMP/empty-neighbors" 2>&1 | tee "$RUNNER_TEMP/empty-setup/neighbors.log"
      - name: Allocation failures and cleanup order in both native backends
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.8/controls.py --base "$RUNNER_TEMP/empty-base-target/release/zil" --candidate "$RUNNER_TEMP/empty-candidate-target/release/zil" --out "$RUNNER_TEMP/empty-controls" 2>&1 | tee "$RUNNER_TEMP/empty-setup/controls.log"
      - name: Active long-loop runtime guard
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.8/quality.py --base "$RUNNER_TEMP/empty-base-target/release/zil" --candidate "$RUNNER_TEMP/empty-candidate-target/release/zil" --out "$RUNNER_TEMP/empty-quality" 2>&1 | tee "$RUNNER_TEMP/empty-setup/quality.log"
      - name: Complete frozen eight-case matrix
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.8/bench/measure.py --base "$RUNNER_TEMP/empty-base-target/release/zil" --candidate "$RUNNER_TEMP/empty-candidate-target/release/zil" --out "$RUNNER_TEMP/empty-data" --rounds 5 2>&1 | tee "$RUNNER_TEMP/empty-setup/measure.log"
      - name: Existing resource consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/research/native-api-validation/validate.py --repo "$GITHUB_WORKSPACE" --cli "$RUNNER_TEMP/empty-candidate-target/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/empty-consumer" > "$RUNNER_TEMP/empty-setup/consumer.log" 2>&1
      - name: Preserve all outcomes without automatic acceptance
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,json,hashlib,tarfile,shutil
          P=pathlib.Path;t=P(os.environ['RUNNER_TEMP']);dst=P('.task/G10.5.1.8/runs')/os.environ['GITHUB_RUN_ID'];dst.mkdir(parents=True);data=t/'empty-data'
          for n in ('manifest.json','summary.json','rows.jsonl','cells.json','failures.json','equivalence.json','runtime.jsonl'):
              if (data/n).exists():shutil.copyfile(data/n,dst/n)
          for folder,name in [('empty-controls','controls.json'),('empty-quality','quality.json'),('empty-neighbors','neighbors.json'),('empty-consumer','consumer.json')]:
              if (t/folder/'summary.json').exists():shutil.copyfile(t/folder/'summary.json',dst/name)
          with tarfile.open(dst/'raw.tar.gz','w:gz') as tar:
              for path,label in [(t/'empty-setup','setup'),(t/'empty-controls','controls'),(t/'empty-quality','quality'),(t/'empty-neighbors','neighbors'),(data/'logs','logs'),(data/'runtime-logs','runtime-logs'),(data/'corpus','corpus')]:
                  if path.exists():
                      for p in path.rglob('*'):
                          if p.is_file() and 'incremental' not in p.parts:tar.add(p,arcname=label+'/'+str(p.relative_to(path)))
          assert (dst/'raw.tar.gz').stat().st_size<48*1024*1024
          f=t/'empty-setup/source.txt';receipt={'baseline':'fc6620a3b975258643eb8f9c3ee77d868ff67a69','source':f.read_text().strip() if f.exists() else None,'recipe':os.environ['GITHUB_SHA'],'prior_rejected_candidate':'01d2ee433873b298e7e5982339b16d0b8d667713','counterexample_run':42800092569,'status_before_preservation':os.environ['PRIOR_STATUS'],'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dst.iterdir()},'main_modified':False,'acceptance':'Pending current-source audit and full numerical quality checks'}
          (dst/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git fetch --no-tags origin refs/heads/task/G10.5.1.8
          expected="$GITHUB_SHA"; if test -f "$RUNNER_TEMP/empty-setup/source.txt"; then expected="$(cat "$RUNNER_TEMP/empty-setup/source.txt")"; fi
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git add -- ".task/G10.5.1.8/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve exact empty-aware destructor experiment $GITHUB_RUN_ID and all failures"
          git push origin HEAD:refs/heads/task/G10.5.1.8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: empty-destructor-${{ github.run_id }}
          path: .task/G10.5.1.8/runs/${{ github.run_id }}
          retention-days: 30
