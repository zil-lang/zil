name: Construction 8 exact dispatch
on:
  push:
    branches: [chore/construction8-resume]
    paths: [.github/workflows/construction8-dispatch.yml]
permissions:
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 42ce8081a2aa5722a14fea53f23f819f46685a60
          fetch-depth: 0
          persist-credentials: true
      - name: Restore exact author dispatch and advance only unchanged main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess,os
          encoded=''''''
          root=pathlib.Path.cwd()
          edits=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
          allowed=['.task/','changes/','data/','spec/interfaces.json','_zil_design.md','_zil_goal.md','docs/log/zil施工8.md','evidence/planning/225-227/']
          for path,before,ops,after in edits:
              p=root/path
              assert p.resolve().is_relative_to(root) and any(path.startswith(x) for x in allowed)
              old=p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(old).hexdigest()==before,path
              lines=old.decode().splitlines(keepends=True)
              for start,end,text in reversed(ops): lines[start:end]=[text]
              data=''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest()==after,path
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          subprocess.run(['python3','tools/check-plan.py','--self-test'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='ed73220eda3eeb1fd89a3fb747e0ca9a4082a179',tree
          env=os.environ.copy()
          env.update(GIT_AUTHOR_NAME='zil-construction8',GIT_AUTHOR_EMAIL='construction8@zil.invalid',GIT_AUTHOR_DATE='2026-10-31T00:11:26Z',GIT_COMMITTER_NAME='zil-construction8',GIT_COMMITTER_EMAIL='construction8@zil.invalid',GIT_COMMITTER_DATE='2026-10-31T00:19:28Z')
          base='42ce8081a2aa5722a14fea53f23f819f46685a60'
          sha=subprocess.check_output(['git','commit-tree',tree,'-p',base],input='plan: freeze construction 8 stages 225-227 and audited cleanup [skip ci]\n',env=env,text=True).strip()
          assert sha=='5be89dfb36b1f927524008526ae647f3c4a03e59',sha
          current=subprocess.check_output(['git','ls-remote','origin','refs/heads/main'],text=True).split()[0]
          assert current==base,'Main changed; do not overwrite'
          subprocess.run(['git','push','--force-with-lease=refs/heads/main:'+base,'origin',sha+':refs/heads/main'],check=True)
          print('Published exact dispatch',sha)
          PY
