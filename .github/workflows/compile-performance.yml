name: Compile performance research

on:
  push:
    branches: ['research/compile-performance']
    paths:
      - 'tools/research/compile-performance/compile4-run.json'
      - 'tools/research/compile-performance/compile4_ci.py'
      - '.github/workflows/compile-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zil-compile-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile4:
    if: github.ref == 'refs/heads/research/compile-performance'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the committed run manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compile4-setup"
          git rev-parse HEAD > "$RUNNER_TEMP/compile4-setup/commit.txt"
          python3 tools/research/compile-performance/compile4_ci.py --validate-only \
            2>&1 | tee "$RUNNER_TEMP/compile4-setup/manifest-validation.log"
      - name: Install the exact research toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/compile4-setup/apt-update.log"
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g \
            2>&1 | tee "$RUNNER_TEMP/compile4-setup/apt-install.log"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt \
            2>&1 | tee "$RUNNER_TEMP/compile4-setup/rustup.log"
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/compile4-llvm-23.1.4" \
            2>&1 | tee "$RUNNER_TEMP/compile4-setup/llvm-install.log"
      - name: Build both compilers and test candidate then measure serially
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research/compile-performance/compile4_ci.py \
            --out "$RUNNER_TEMP/compile4-evidence" \
            --work "$RUNNER_TEMP/compile4-work" \
            --llvm-prefix "$RUNNER_TEMP/compile4-llvm-23.1.4" \
            --budget-seconds 3600 \
            2>&1 | tee "$RUNNER_TEMP/compile4-setup/run.log"
      - name: Package raw evidence without compiler caches
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/compile4-evidence" ]; then
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/compile4-evidence.tar.gz" compile4-evidence
            sha256sum "$RUNNER_TEMP/compile4-evidence.tar.gz" > "$RUNNER_TEMP/compile4-evidence.sha256"
          fi
      - name: Retain completed and failed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-compile4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/compile4-setup/
            ${{ runner.temp }}/compile4-evidence.tar.gz
            ${{ runner.temp }}/compile4-evidence.sha256
            ${{ runner.temp }}/compile4-llvm-23.1.4/install-receipt.json
            ${{ runner.temp }}/compile4-llvm-23.1.4/installation-logs/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
