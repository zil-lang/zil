name: Closure growth private-entry refinement
on:
  push:
    branches: [task/G10.5.1.4]
    paths: [.github/workflows/compiler-closure-refine.yml]
permissions:
  contents: write
concurrency:
  group: compiler-closure-growth
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Prepare pinned baseline and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refine-setup" "$RUNNER_TEMP/refine-bench"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/refine-llvm" > "$RUNNER_TEMP/refine-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/refine-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/refine-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/refine-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/refine-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin cadc656c0caefa70827f7ec1e608a04291c8ae9f
          git worktree add --detach "$RUNNER_TEMP/refine-base" cadc656c0caefa70827f7ec1e608a04291c8ae9f
          git fetch --depth=1 --no-tags origin 95af0f0c205a0892e6087f5304ad9981461a7fed
          for file in corpus.py measure.py; do
            git show 95af0f0c205a0892e6087f5304ad9981461a7fed:.task/G10.5.1.3/bench/$file > "$RUNNER_TEMP/refine-bench/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])/'refine-bench'
          p=root/'corpus.py';s=p.read_text();s=re.sub(r'^SPECS=.*$',"SPECS=[('owned8','resource',8),('owned32','resource',32)]",s,flags=re.M);s=re.sub(r'^GROUP_WEIGHTS=.*$',"GROUP_WEIGHTS={'resource':1.0}",s,flags=re.M);p.write_text(s)
          p=root/'measure.py';s=p.read_text().replace('e69091059ed999a5279303cdd07e9f602703f079','cadc656c0caefa70827f7ec1e608a04291c8ae9f')
          s=s.replace("MODES=('check','O0','O2')","MODES=('O2',)")
          s=re.sub(r'^MODE_WEIGHTS=.*$',"MODE_WEIGHTS={}",s,flags=re.M)
          s=s.replace("if not eq:raise AssertionError('planner-only optimization changed emitted text')","# Backend refinement may legitimately change resource machine code.")
          s=s.replace('iterations>=16384','iterations>=65535').replace('iterations*=4','iterations=min(iterations*4,65535)')
          p.write_text(s)
          PY
      - name: Freeze distinct production refinement and direct controls
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.4/refine.py
          rustfmt --edition 2024 --config skip_children=true crates/zil-backend-llvm/src/emit/byte_buffer.rs crates/zil-backend-llvm/src/emit/byte_buffer/reserve_tests.rs
          git diff --check
          git diff > "$RUNNER_TEMP/refine-setup/refinement.patch"
          git add -- crates/zil-backend-llvm/src/emit/byte_buffer.rs crates/zil-backend-llvm/src/emit/byte_buffer/reserve_tests.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Use already-checked private grow entry; correctness and runtime acceptance pending'
          git rev-parse HEAD > "$RUNNER_TEMP/refine-setup/source.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/refine-setup/source.tar.gz"
          rustc -vV > "$RUNNER_TEMP/refine-setup/rustc.txt"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/refine-tests"
          cargo test --locked --offline -p zil-backend-llvm --features llvm-api --lib > "$RUNNER_TEMP/refine-setup/backend-tests.log" 2>&1
          cargo test --locked --offline -p zil-llvm-api --features native --lib > "$RUNNER_TEMP/refine-setup/llvm-tests.log" 2>&1
          cargo clippy --locked --offline -p zil-backend-llvm --features llvm-api --lib --tests -- -D warnings > "$RUNNER_TEMP/refine-setup/clippy.log" 2>&1
          cargo fmt --all -- --check
      - name: Independent release compilers
        id: build
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/refine-base-target" cargo build --locked --offline --release --manifest-path "$RUNNER_TEMP/refine-base/Cargo.toml" -p zil-cli > "$RUNNER_TEMP/refine-setup/base-build.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/refine-candidate-target" cargo build --locked --offline --release -p zil-cli > "$RUNNER_TEMP/refine-setup/candidate-build.log" 2>&1
      - name: Current allocation, failure, cleanup and pre-reserved hot-path controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .task/G10.5.1.4/controls.py --base "$RUNNER_TEMP/refine-base-target/release/zil" --candidate "$RUNNER_TEMP/refine-candidate-target/release/zil" --out "$RUNNER_TEMP/refine-controls" > "$RUNNER_TEMP/refine-setup/controls.log" 2>&1
      - name: Targeted closure screening; no global weighted claim
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/refine-bench/measure.py" --base "$RUNNER_TEMP/refine-base-target/release/zil" --candidate "$RUNNER_TEMP/refine-candidate-target/release/zil" --out "$RUNNER_TEMP/refine-data" --rounds 5 > "$RUNNER_TEMP/refine-setup/matrix.log" 2>&1
      - name: Existing native resource consumer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research/native-api-validation/validate.py --repo "$GITHUB_WORKSPACE" --cli "$RUNNER_TEMP/refine-candidate-target/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/refine-consumer" > "$RUNNER_TEMP/refine-setup/consumer.log" 2>&1
      - name: Preserve exact distinct source and all observations
        if: ${{ always() }}
        shell: bash
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,json,shutil,tarfile,hashlib,statistics
          P=pathlib.Path;t=P(os.environ['RUNNER_TEMP']);dst=P('.task/G10.5.1.4/runs')/os.environ['GITHUB_RUN_ID'];dst.mkdir(parents=True,exist_ok=False)
          for name in ('manifest.json','summary.json','rows.jsonl','cells.json','failures.json','equivalence.json','runtime.jsonl'):
              p=t/'refine-data'/name
              if p.exists():shutil.copyfile(p,dst/name)
          for folder,name in [('refine-controls','extra-controls.json'),('refine-consumer','consumer.json')]:
              p=t/folder/'summary.json'
              if p.exists():shutil.copyfile(p,dst/name)
          quality=[]
          if (dst/'runtime.jsonl').exists():
              rows=[json.loads(x) for x in (dst/'runtime.jsonl').read_text().splitlines()]
              for c in ['owned8','owned32']:
                  for s in ['base','private']:
                      v={a:[x['wall_ms'] for x in rows if x['case']==c and x['snapshot']==s and x['arm']==a and not x['warmup']] for a in ['base','cand','rust']}
                      if all(len(x)==5 for x in v.values()):
                          med={a:statistics.median(x) for a,x in v.items()};quality.append({'case':c,'snapshot':s,'median_ms':med,'ratio':med['cand']/med['base'],'screen_pass':med['cand']<=med['base']*1.10,'values_ms':v})
          (dst/'quality.json').write_text(json.dumps({'scope':'targeted screen, not complete weighted acceptance','cases':quality,'runtime_screen_pass':len(quality)==4 and all(x['screen_pass'] for x in quality)},indent=2)+'\n')
          with tarfile.open(dst/'raw.tar.gz','w:gz') as a:
              for p,label in [(t/'refine-setup','setup'),(t/'refine-controls','controls'),(t/'refine-bench','bench'),(t/'refine-data/logs','logs'),(t/'refine-data/runtime-logs','runtime-logs'),(t/'refine-data/corpus','corpus')]:
                  if p.exists():a.add(p,arcname=label)
          assert (dst/'raw.tar.gz').stat().st_size<48*1024*1024
          frozen=t/'refine-setup/source.txt'
          receipt={'baseline':'cadc656c0caefa70827f7ec1e608a04291c8ae9f','measured_source':frozen.read_text().strip() if frozen.exists() else None,'recipe':os.environ['GITHUB_SHA'],'status_before_preservation':os.environ['PRIOR_STATUS'],'scope':'second production refinement, targeted resource screen only; no full workspace or full weighted acceptance claimed','files':{p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in dst.iterdir() if p.is_file()},'main_modified':False,'merge_allowed':False}
          (dst/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2));print(json.dumps(quality,indent=2))
          PY
          git fetch --no-tags origin refs/heads/task/G10.5.1.4
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- ".task/G10.5.1.4/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve private-entry refinement $GITHUB_RUN_ID with original runtime gate"
          git push origin HEAD:refs/heads/task/G10.5.1.4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: closure-refinement-${{ github.run_id }}
          path: .task/G10.5.1.4/runs/${{ github.run_id }}
          retention-days: 30
