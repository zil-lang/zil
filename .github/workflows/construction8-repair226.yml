name: Publish exact 226 diagnostic repair
on:
  push:
    branches: [chore/construction8-resume]
    paths: [.github/workflows/construction8-repair226.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1748b767c3fd3ab1408c84ce8a9dc0f2ae34b8cd
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          encoded=''
          records=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
          base='1748b767c3fd3ab1408c84ce8a9dc0f2ae34b8cd';assert len(records)==1
          record=records[0];assert '\nparent '+base+'\n' in record['raw']
          for path,before,ops,after in record['edits']:
              assert path=='crates/zil-driver/tests/impl175_store_views.rs'
              p=pathlib.Path(path);old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==before
              lines=old.decode().splitlines(keepends=True)
              for start,end,text in reversed(ops):lines[start:end]=[text]
              data=''.join(lines).encode();assert hashlib.sha256(data).hexdigest()==after;p.write_bytes(data)
          subprocess.run(['git','add','--all'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip();assert record['raw'].startswith('tree '+tree+'\n')
          sha=subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'],input=record['raw'],text=True).strip()
          assert sha==record['sha']=='b4eef0b533d088829abfc7785bc716c48c89d889'
          ref='refs/heads/impl/226-shared-product-capture'
          assert subprocess.check_output(['git','ls-remote','origin',ref],text=True).split()[0]==base
          subprocess.run(['git','push','--force-with-lease='+ref+':'+base,'origin',sha+':'+ref],check=True)
          print('Published exact test-only diagnostic repair',sha)
          PY
