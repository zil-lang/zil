name: Research 131 effect retraction
on:
  push:
    branches: [research/131-effect-retraction]
    paths:
      - tools/research/131/*.rs
      - tools/research/131/source-cases.tsv
      - .github/workflows/research-131.yml
permissions:
  contents: read
jobs:
  finite-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact source and toolchain identities
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum tools/research/131/*.rs tools/research/131/source-cases.tsv
          rustup toolchain install 1.99.1 --profile minimal
          rustup run 1.99.1 rustc -vV
      - name: Debug and optimized algorithm tests
        run: |
          set -euo pipefail
          mkdir -p results
          for opt in 0 3; do
            rustup run 1.99.1 rustc --edition=2024 -D warnings -C opt-level=$opt --test tools/research/131/extended_tests.rs -o results/tests-$opt
            results/tests-$opt --nocapture --test-threads=1 | tee results/tests-$opt.log
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-131-logs
          path: results/*.log
          retention-days: 14
          if-no-files-found: error
