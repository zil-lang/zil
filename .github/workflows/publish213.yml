name: Retire exact archived 213 branches without changing main
on:
  push:
    branches: [task/213]
    paths:
      - '.cleanup213/**'
      - '.github/workflows/publish213.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zil-publish-213
  cancel-in-progress: false
jobs:
  cleanup-only:
    if: ${{ github.repository == 'zil-lang/zil' && github.ref == 'refs/heads/task/213' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Copy exact cleanup plan and immutable prior gate proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cleanup213" "$RUNNER_TEMP/cleanup-receipts"
          cp .cleanup213/cleanup.py .cleanup213/plan.json .cleanup213/proof.zip "$RUNNER_TEMP/cleanup213/"
          cp .cleanup213/plan.json .cleanup213/proof.zip "$RUNNER_TEMP/cleanup-receipts/"
      - name: Verify existing main and retire only exact archived heads atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cleanup213/cleanup.py" execute \
            --repo "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --transport-sha "$GITHUB_SHA" \
            --plan "$RUNNER_TEMP/cleanup213/plan.json" \
            --proof "$RUNNER_TEMP/cleanup213/proof.zip" \
            --out "$RUNNER_TEMP/cleanup-receipts"
      - name: Preserve cleanup result including both push output streams
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zil-cleanup-213-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cleanup-receipts/
          retention-days: 30
          if-no-files-found: error
