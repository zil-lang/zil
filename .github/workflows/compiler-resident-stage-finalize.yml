name: Finalize accepted resident compiler evidence
on:
  push:
    branches: [task/G10.5.1.8]
    paths: [.github/workflows/compiler-resident-stage-finalize.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reconcile failed bookkeeping before guarded goal and branch edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          original=Path('.github/workflows/compiler-resident-stage-record.yml').read_text()
          code=textwrap.dedent(original.split("python3 - <<'PY'\n",1)[1].rsplit('\n          PY',1)[0])
          assert code.count('42814194686')==2
          code=code.replace('42814194686','42814194782')
          anchor='rows={\n'
          assert code.count(anchor)==1
          supplement="""import base64
          direct=api('actions/runs/42818577639');assert direct['conclusion']=='success'
          def result_file(name):
              value=api('contents/.task/resident-cli/runs/42818577639/'+name+'?ref=task/compiler-resident-cli')
              return json.loads(base64.b64decode(value['content']))
          observed=result_file('summary.json');identity=result_file('receipt.json');life=result_file('lifetime.json')
          assert observed['failures']==0 and observed['compile_requests']==1800 and observed['text_pairs_equal']
          assert identity['production_head']==head and identity['source']=='82197c4dffae77a78a4387cc04246e2a8a8be583'
          accepted.update({'paired_run':42818577639,'earlier_adapter_run':42813461514,'paired_scope':'same release CLI directly spawned fresh versus resident; Rust actual incremental O2 only owned8/owned32; no adapter startup or estimated subtraction','compile_requests':1800,'current_verify_requests':1728,'formal_requests':1500,'native_output_checks':3672,'equal_machine_pairs':576,'runtime_measurements':216,'profiles':observed['profiles'],'weighted_reduction_range_percent':[2.3847864983447042,10.636466860066929],'memory':{'largest_case_observed_current_rss_mib':922.5,'same_case_fresh_peak_rss_mib':563.504,'raw_entries':32,'default_reset_requests':64,'hard_byte_limit':False},'retention_probe':life,'rust_resource_O2_body_edit_ms':{'owned8':{'fresh':107.912,'resident':96.500,'rust':96.301},'owned32':{'fresh':463.327,'resident':447.199,'rust':194.490}},'bookkeeping_failure_retained':42821058227})
          """
          supplement='\n'.join(line[10:] if line.startswith('          ') else line for line in supplement.splitlines())+'\n'
          code=code.replace(anchor,supplement+anchor)
          code=code.replace('最大样本RSS约906MiB，非硬字节界。直接启动同机Rust补测独立保存','直接启动复测42818577639四频率等待省2.38%–10.64%，最大样本RSS约923MiB；owned32编辑447ms/Rust194ms，差距保留')
          compile(code,'resident-stage-guarded-finalize','exec')
          exec(code,{'__name__':'__main__'})
          PY
