name: Repository documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zil-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check semantic names and delivery tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base=HEAD^; fi
          python3 tools/check-repository-layout.py --base "$base" --delivery
          python3 -m unittest discover -s tools -p test_check_repository_layout.py
      - name: Check navigation, provenance and generated views
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-documentation.py
          python3 tools/check-docs.py
          python3 tools/update_designer.py
          python3 tools/update-indexes.py
          git diff --exit-code -- data lang-designer.html
      - name: Check handoff record consumers
        run: node --test tests/handoff.test.mjs
