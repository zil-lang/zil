name: Export helper partition delivery source
on:
  push:
    branches: [task/closure-helper-partition]
    paths: [.github/workflows/compiler-helper-delivery-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Export frozen production and reusable protocol, excluding prior result payloads
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin 099d0af969a51260355437603b77d3f9030d83bc 41e9f47c28412b0019779a06eb3de69d16174ea2
          test "$(git rev-parse 41e9f47c28412b0019779a06eb3de69d16174ea2^{tree})" = 0b3f60b4aa2aaa0409602a78ff4eace4a9069848
          mkdir -p "$RUNNER_TEMP/helper-source"
          git archive --format=tar.gz 41e9f47c28412b0019779a06eb3de69d16174ea2 > "$RUNNER_TEMP/helper-source/production-source.tar.gz"
          git diff 099d0af969a51260355437603b77d3f9030d83bc 41e9f47c28412b0019779a06eb3de69d16174ea2 > "$RUNNER_TEMP/helper-source/production.patch"
          python3 - <<'PY'
          import pathlib,tarfile,hashlib,json,os
          P=pathlib.Path;out=P(os.environ['RUNNER_TEMP'])/'helper-source';root=P('.task/helper-partition')
          with tarfile.open(out/'protocol.tar.gz','w:gz') as tar:
              for p in root.rglob('*'):
                  if p.is_file() and not any(part in ('runs','public-runs','coordination','__pycache__') for part in p.relative_to(root).parts):
                      tar.add(p,arcname=str(p))
          receipt={'baseline':'099d0af969a51260355437603b77d3f9030d83bc','candidate':'41e9f47c28412b0019779a06eb3de69d16174ea2','tree':'0b3f60b4aa2aaa0409602a78ff4eace4a9069848','research_source':os.environ['GITHUB_SHA'],'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir()}}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          assert sum(p.stat().st_size for p in out.iterdir())<48*1024*1024
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: helper-partition-delivery-source
          path: ${{ runner.temp }}/helper-source
          retention-days: 30
