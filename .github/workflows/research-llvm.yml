name: Research LLVM verification
on:
  push:
    branches: [main]
    paths:
      - 'crates/zil-backend-llvm/**'
      - 'crates/zil-llvm-api/**'
      - 'tools/llvm/**'
      - 'tools/research/**'
      - '.github/workflows/research-llvm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/zil-backend-llvm/**'
      - 'crates/zil-llvm-api/**'
      - 'tools/llvm/**'
      - 'tools/research/**'
      - '.github/workflows/research-llvm.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zil-research-llvm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_STRIP: 'symbols'
      CARGO_PROFILE_DEV_STRIP: 'symbols'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reclaim unused hosted-runner toolchain space
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_TEMP,GITHUB_WORKSPACE python3 tools/ci/research_disk_space.py --apply
      - name: Cache research LLVM SDK archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-sdk-cache
          key: zil-llvm-sdk-archive-v1-${{ hashFiles('tools/llvm/release-linux-x86_64.json') }}
      - name: Build the pinned research LLVM toolchain pair
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/research/incremental-compilation/jump_threading_plugin/prepare_headers.py --release tools/llvm/release-linux-x86_64.json --cache "$RUNNER_TEMP/llvm-sdk-cache" --output "$RUNNER_TEMP/llvm-headers" 2>&1 | tee "$RUNNER_TEMP/receipts/research-headers.log"
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/llvm-23.1.4" --archive "$RUNNER_TEMP/llvm-sdk-cache/LLVM-23.1.4-Linux-X64.tar.zst" 2>&1 | tee "$RUNNER_TEMP/receipts/research-official-install.log"
          python3 tools/research/incremental-compilation/toolchain_combination/rebuild.py --repo "$PWD" --llvm-prefix "$RUNNER_TEMP/llvm-23.1.4" --headers-prefix "$RUNNER_TEMP/llvm-headers" --out "$RUNNER_TEMP/llvm-research" --jobs 2 2>&1 | tee "$RUNNER_TEMP/receipts/research-rebuild.log"
          echo "ZIL_CLANG=$RUNNER_TEMP/llvm-23.1.4/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/llvm-research/candidate/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/llvm-research/candidate/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/llvm-23.1.4/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo registry and research build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/target
          key: zil-cargo-research-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            zil-cargo-research-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            zil-cargo-research-v1-
      - name: Record exact checkout and toolchain
        id: research_toolchain_identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "ZIL_TEST_REPORT_DIR=$RUNNER_TEMP/native-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/receipts"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/receipts/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/receipts/source-tree.txt"
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustc -vV > "$RUNNER_TEMP/receipts/toolchain.txt"
          "$ZIL_CLANG" --version >> "$RUNNER_TEMP/receipts/toolchain.txt"
          python3 tools/llvm/check_toolchain.py > "$RUNNER_TEMP/receipts/llvm-api-toolchain.json"
          cp "$RUNNER_TEMP/llvm-23.1.4/install-receipt.json" "$RUNNER_TEMP/receipts/llvm-install.json"
          python3 tools/ci/research_llvm_manifest.py verify --repo "$PWD" --runner-temp "$RUNNER_TEMP"
      - name: Formatting
        id: fmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/receipts/fmt.log"
      - name: All-target Clippy
        id: clippy
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/receipts/clippy.log"
      - name: Complete workspace tests
        id: workspace_tests
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ZIL_TEST_REPORT_DIR="$RUNNER_TEMP/native-evidence/workspace" cargo test --locked --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/receipts/workspace.log"
      - name: Explicit LLVM text-reference boundary
        id: text
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p zil-llvm-api --features text-reference 2>&1 | tee "$RUNNER_TEMP/receipts/text-reference.log"
          python3 tools/llvm/test_validate_migration.py 2>&1 | tee "$RUNNER_TEMP/receipts/migration-runner.log"
      - name: Release completed workspace outputs before reference build
        if: ${{ !cancelled() && (steps.workspace_tests.outcome == 'success' || steps.workspace_tests.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/compact_results.py cleanup "$RUNNER_TEMP" workspace
      - name: Reference-only build and explicit unavailable control
        id: reference_tests
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ZIL_TEST_REPORT_DIR="$RUNNER_TEMP/native-evidence/reference" CARGO_TARGET_DIR="$RUNNER_TEMP/target-reference" cargo test --locked --workspace --no-default-features --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/receipts/reference.log"
      - name: Release completed reference outputs
        if: ${{ !cancelled() && (steps.reference_tests.outcome == 'success' || steps.reference_tests.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/compact_results.py cleanup "$RUNNER_TEMP" reference
      - name: Native API State and allocation-failure controls
        id: consumer
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          preserve_consumer_summary() {
            gate_exit=$?
            trap - EXIT
            if [ -f "$RUNNER_TEMP/native-consumer/summary.json" ]; then
              if ! cp "$RUNNER_TEMP/native-consumer/summary.json" "$RUNNER_TEMP/receipts/native-consumer.json"; then
                if [ "$gate_exit" -eq 0 ]; then gate_exit=1; fi
              fi
            elif [ "$gate_exit" -eq 0 ]; then
              gate_exit=1
            fi
            exit "$gate_exit"
          }
          trap preserve_consumer_summary EXIT
          cargo build --locked --release -p zil-cli
          python3 tools/research/native-api-validation/validate.py --repo . --cli "$CARGO_TARGET_DIR/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/native-consumer"
      - name: Test CI evidence recovery
        id: ci_test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_evidence_transport.py
          python3 tools/ci/test_compact_results.py
      - name: Summarize test results
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOME_FMT: ${{ steps.fmt.outcome }}
          OUTCOME_WORKSPACE: ${{ steps.workspace_tests.outcome }}
          OUTCOME_REFERENCE: ${{ steps.reference_tests.outcome }}
          OUTCOME_CONSUMER: ${{ steps.consumer.outcome }}
          OUTCOME_CLIPPY: ${{ steps.clippy.outcome }}
          OUTCOME_TEXT: ${{ steps.text.outcome }}
          OUTCOME_CI_TEST: ${{ steps.ci_test.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          python3 tools/ci/compact_results.py summary "$RUNNER_TEMP" "$(git rev-parse HEAD)"
      - name: Upload compact receipts
        continue-on-error: true
        if: ${{ failure() || github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-summary
          path: |
            ${{ runner.temp }}/receipts/compact-results.json
            ${{ runner.temp }}/receipts/commit.txt
            ${{ runner.temp }}/receipts/source-tree.txt
            ${{ runner.temp }}/receipts/toolchain.txt
            ${{ runner.temp }}/receipts/llvm-api-toolchain.json
            ${{ runner.temp }}/receipts/llvm-research-identity.json
            ${{ runner.temp }}/receipts/native-consumer.json
          retention-days: 14
          if-no-files-found: warn
