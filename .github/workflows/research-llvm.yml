name: Research LLVM verification
on:
  push:
    branches: [research/incremental-compilation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zil-research-llvm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_STRIP: 'symbols'
      CARGO_PROFILE_DEV_STRIP: 'symbols'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted-runner toolchain space
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_TEMP,GITHUB_WORKSPACE python3 tools/ci/research_disk_space.py --apply
      - name: Preserve pre-build disk recovery receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-disk-recovery
          path: ${{ runner.temp }}/receipts/disk-space-before-build.json
          retention-days: 30
          if-no-files-found: error
      - name: Build the pinned research LLVM toolchain pair
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/research/incremental-compilation/jump_threading_plugin/prepare_headers.py --release tools/llvm/release-linux-x86_64.json --cache "$RUNNER_TEMP/llvm-sdk-cache" --output "$RUNNER_TEMP/llvm-headers" 2>&1 | tee "$RUNNER_TEMP/receipts/research-headers.log"
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/llvm-23.1.4" --archive "$RUNNER_TEMP/llvm-sdk-cache/LLVM-23.1.4-Linux-X64.tar.zst" 2>&1 | tee "$RUNNER_TEMP/receipts/research-official-install.log"
          python3 tools/research/incremental-compilation/toolchain_combination/rebuild.py --repo "$PWD" --llvm-prefix "$RUNNER_TEMP/llvm-23.1.4" --headers-prefix "$RUNNER_TEMP/llvm-headers" --out "$RUNNER_TEMP/llvm-research" --jobs 2 2>&1 | tee "$RUNNER_TEMP/receipts/research-rebuild.log"
          echo "ZIL_CLANG=$RUNNER_TEMP/llvm-23.1.4/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/llvm-research/candidate/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/llvm-research/candidate/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/llvm-23.1.4/bin" >> "$GITHUB_PATH"
      - name: Record exact checkout and restorable source history
        id: research_toolchain_identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "ZIL_TEST_REPORT_DIR=$RUNNER_TEMP/native-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/receipts"
          git rev-parse HEAD > "$RUNNER_TEMP/receipts/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/receipts/source-tree.txt"
          git bundle create "$RUNNER_TEMP/receipts/repository.bundle" HEAD --branches --remotes
          git bundle verify "$RUNNER_TEMP/receipts/repository.bundle" 2>&1 | tee "$RUNNER_TEMP/receipts/bundle-verify.log"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc -vV > "$RUNNER_TEMP/receipts/toolchain.txt"
          "$ZIL_CLANG" --version >> "$RUNNER_TEMP/receipts/toolchain.txt"
          python3 tools/llvm/check_toolchain.py > "$RUNNER_TEMP/receipts/llvm-api-toolchain.json"
          cp "$RUNNER_TEMP/llvm-23.1.4/install-receipt.json" "$RUNNER_TEMP/receipts/llvm-install.json"
          python3 tools/ci/research_llvm_manifest.py verify --repo "$PWD" --runner-temp "$RUNNER_TEMP"
      - name: Collect research LLVM source and failure evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/research_llvm_manifest.py collect --runner-temp "$RUNNER_TEMP"
      - name: Preserve research LLVM preparation before tests
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-toolchain
          path: |
            ${{ runner.temp }}/receipts/llvm-research-evidence/
            ${{ runner.temp }}/receipts/research-*.log
            ${{ runner.temp }}/receipts/llvm-research-identity.json
            ${{ runner.temp }}/receipts/llvm-api-toolchain.json
          retention-days: 30
          if-no-files-found: error
      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/receipts/fmt.log"
      - name: Record workspace resources before tests
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            df -Pk -- "$RUNNER_TEMP"
            for path in "$RUNNER_TEMP/target" "$RUNNER_TEMP/target-reference" "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/consumer209"; do
              if [ -e "$path" ]; then du -sk -- "$path"; fi
            done
          } > "$RUNNER_TEMP/receipts/workspace-resources-before.log"
      - name: Complete workspace tests
        id: workspace_tests
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ZIL_TEST_REPORT_DIR="$RUNNER_TEMP/native-evidence/workspace" cargo test --locked --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/receipts/workspace.log"
      - name: Record workspace resources after tests
        id: workspace_resources_after
        if: ${{ always() && (steps.workspace_tests.outcome == 'success' || steps.workspace_tests.outcome == 'failure' || steps.workspace_tests.outcome == 'cancelled') }}
        shell: bash
        run: |
          set -euo pipefail
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            df -Pk -- "$RUNNER_TEMP"
            for path in "$RUNNER_TEMP/target" "$RUNNER_TEMP/target-reference" "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/consumer209"; do
              if [ -e "$path" ]; then du -sk -- "$path"; fi
            done
            sha256sum -- "$RUNNER_TEMP/receipts/workspace.log"
          } > "$RUNNER_TEMP/receipts/workspace-resources-after.log"
          python3 tools/ci/native_evidence.py capture "$RUNNER_TEMP" workspace >> "$GITHUB_OUTPUT"
      - name: Preserve workspace receipts before releasing its cache
        id: workspace_receipts
        if: ${{ always() && (steps.workspace_tests.outcome == 'success' || steps.workspace_tests.outcome == 'failure' || steps.workspace_tests.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-workspace
          path: |
            ${{ runner.temp }}/receipts/workspace.log
            ${{ runner.temp }}/receipts/workspace-resources-*.log
            ${{ runner.temp }}/receipts/workspace-native-manifest.json
            ${{ runner.temp }}/receipts/commit.txt
            ${{ runner.temp }}/receipts/source-tree.txt
            ${{ runner.temp }}/receipts/toolchain.txt
            ${{ runner.temp }}/receipts/llvm-api-toolchain.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve all workspace native evidence before releasing it
        id: workspace_native
        if: ${{ always() && steps.workspace_resources_after.outcome == 'success' && steps.workspace_resources_after.outputs.native_file_count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-workspace-native
          path: ${{ runner.temp }}/native-evidence/workspace/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Release only the archived workspace native evidence
        if: ${{ !cancelled() && steps.workspace_resources_after.outcome == 'success' && steps.workspace_receipts.outcome == 'success' && (steps.workspace_resources_after.outputs.native_file_count == '0' || steps.workspace_native.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/native_evidence.py release "$RUNNER_TEMP" workspace
      - name: Release only the archived workspace compiler cache
        if: ${{ !cancelled() && steps.workspace_resources_after.outcome == 'success' && steps.workspace_receipts.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY_CLEAN'
          from pathlib import Path
          import shutil, sys
          root = Path(sys.argv[1])
          if not root.is_absolute() or root != root.resolve():
              raise SystemExit("Runner temporary root must be absolute and canonical")
          cache = root / "target/debug"
          if cache != cache.resolve() or cache.is_symlink():
              raise SystemExit("Compiler cache path must not contain a symlink")
          if cache.exists():
              if not cache.is_dir():
                  raise SystemExit("Compiler cache path is not a directory")
              shutil.rmtree(cache)
          print("Removed only compiler cache:", cache)
          print("Free bytes after cleanup:", shutil.disk_usage(root).free)
          PY_CLEAN
      - name: Record reference resources before tests
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            df -Pk -- "$RUNNER_TEMP"
            for path in "$RUNNER_TEMP/target" "$RUNNER_TEMP/target-reference" "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/consumer209"; do
              if [ -e "$path" ]; then du -sk -- "$path"; fi
            done
          } > "$RUNNER_TEMP/receipts/reference-resources-before.log"
      - name: Reference-only build and explicit unavailable control
        id: reference_tests
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ZIL_TEST_REPORT_DIR="$RUNNER_TEMP/native-evidence/reference" CARGO_TARGET_DIR="$RUNNER_TEMP/target-reference" cargo test --locked --workspace --no-default-features --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/receipts/reference.log"
      - name: Record reference resources after tests
        id: reference_resources_after
        if: ${{ always() && (steps.reference_tests.outcome == 'success' || steps.reference_tests.outcome == 'failure' || steps.reference_tests.outcome == 'cancelled') }}
        shell: bash
        run: |
          set -euo pipefail
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            df -Pk -- "$RUNNER_TEMP"
            for path in "$RUNNER_TEMP/target" "$RUNNER_TEMP/target-reference" "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/consumer209"; do
              if [ -e "$path" ]; then du -sk -- "$path"; fi
            done
            sha256sum -- "$RUNNER_TEMP/receipts/reference.log"
          } > "$RUNNER_TEMP/receipts/reference-resources-after.log"
          python3 tools/ci/native_evidence.py capture "$RUNNER_TEMP" reference >> "$GITHUB_OUTPUT"
      - name: Preserve reference receipts before releasing its cache
        id: reference_receipts
        if: ${{ always() && (steps.reference_tests.outcome == 'success' || steps.reference_tests.outcome == 'failure' || steps.reference_tests.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-reference
          path: |
            ${{ runner.temp }}/receipts/reference.log
            ${{ runner.temp }}/receipts/reference-resources-*.log
            ${{ runner.temp }}/receipts/reference-native-manifest.json
            ${{ runner.temp }}/receipts/commit.txt
            ${{ runner.temp }}/receipts/source-tree.txt
            ${{ runner.temp }}/receipts/toolchain.txt
            ${{ runner.temp }}/receipts/llvm-api-toolchain.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve all reference native evidence before releasing it
        id: reference_native
        if: ${{ always() && steps.reference_resources_after.outcome == 'success' && steps.reference_resources_after.outputs.native_file_count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-reference-native
          path: ${{ runner.temp }}/native-evidence/reference/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Release only the archived reference native evidence
        if: ${{ !cancelled() && steps.reference_resources_after.outcome == 'success' && steps.reference_receipts.outcome == 'success' && (steps.reference_resources_after.outputs.native_file_count == '0' || steps.reference_native.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/native_evidence.py release "$RUNNER_TEMP" reference
      - name: Release only the archived reference compiler cache
        if: ${{ !cancelled() && steps.reference_resources_after.outcome == 'success' && steps.reference_receipts.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY_CLEAN'
          from pathlib import Path
          import shutil, sys
          root = Path(sys.argv[1])
          if not root.is_absolute() or root != root.resolve():
              raise SystemExit("Runner temporary root must be absolute and canonical")
          cache = root / "target-reference"
          if cache != cache.resolve() or cache.is_symlink():
              raise SystemExit("Compiler cache path must not contain a symlink")
          if cache.exists():
              if not cache.is_dir():
                  raise SystemExit("Compiler cache path is not a directory")
              shutil.rmtree(cache)
          print("Removed only compiler cache:", cache)
          print("Free bytes after cleanup:", shutil.disk_usage(root).free)
          PY_CLEAN
      - name: Native API State and allocation-failure controls
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          preserve_consumer_summary() {
            gate_exit=$?
            trap - EXIT
            if [ -f "$RUNNER_TEMP/consumer209/summary.json" ]; then
              if ! cp "$RUNNER_TEMP/consumer209/summary.json" "$RUNNER_TEMP/receipts/consumer209.json"; then
                if [ "$gate_exit" -eq 0 ]; then gate_exit=1; fi
              fi
            elif [ "$gate_exit" -eq 0 ]; then
              gate_exit=1
            fi
            exit "$gate_exit"
          }
          trap preserve_consumer_summary EXIT
          cargo build --locked --release -p zil-cli
          python3 tools/research/208/validate.py --repo . --cli "$CARGO_TARGET_DIR/release/zil" --clang "$ZIL_CLANG" --out "$RUNNER_TEMP/consumer209"
      - name: All-target Clippy
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/receipts/clippy.log"
      - name: Explicit LLVM text-reference boundary
        if: ${{ !cancelled() && steps.research_toolchain_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p zil-llvm-api --features text-reference 2>&1 | tee "$RUNNER_TEMP/receipts/text-reference.log"
          python3 tools/llvm/test_validate_migration.py 2>&1 | tee "$RUNNER_TEMP/receipts/migration-runner.log"
      - name: Small recovery artifact, never target caches
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zil-research-llvm-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: |
            ${{ runner.temp }}/receipts/
            ${{ runner.temp }}/llvm-23.1.4/install-receipt.json
            ${{ runner.temp }}/llvm-23.1.4/installation-logs/
          retention-days: 30
          if-no-files-found: error
