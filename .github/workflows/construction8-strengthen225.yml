name: Publish 225 candidate-control strengthening
on:
  push:
    branches: [chore/construction8-resume]
    paths: [.github/workflows/construction8-strengthen225.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bd802f3a6a59e5e83c9b5c7ebf188371fef6cc0c
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          encoded=''''''
          records=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
          parent='bd802f3a6a59e5e83c9b5c7ebf188371fef6cc0c'
          for record in records:
              assert '\nparent '+parent+'\n' in record['raw']
              for path,before,ops,after in record['edits']:
                  assert path=='crates/zil-driver/tests/impl225_product_store_capture.rs'
                  p=pathlib.Path(path);old=p.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==before
                  lines=old.decode().splitlines(keepends=True)
                  for start,end,text in reversed(ops):lines[start:end]=[text]
                  data=''.join(lines).encode();assert hashlib.sha256(data).hexdigest()==after;p.write_bytes(data)
              subprocess.run(['git','add','--all'],check=True)
              tree=subprocess.check_output(['git','write-tree'],text=True).strip()
              assert record['raw'].startswith('tree '+tree+'\n')
              sha=subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'],input=record['raw'],text=True).strip()
              assert sha==record['sha'];parent=sha
          assert parent=='5f47ffa58f5e8cb7bb03ac94675e9bc6bed3b9a0'
          ref='refs/heads/impl/225-product-store-capture'
          current=subprocess.check_output(['git','ls-remote','origin',ref],text=True).split()[0]
          assert current=='bd802f3a6a59e5e83c9b5c7ebf188371fef6cc0c'
          subprocess.run(['git','push','--force-with-lease='+ref+':'+current,'origin',parent+':'+ref],check=True)
          print('Published exact test-only followup',parent)
          PY
