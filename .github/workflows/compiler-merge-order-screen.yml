name: Closure dispatch merge-order screen
on:
  push:
    branches: [task/compiler-merge-order]
    paths: [.github/workflows/compiler-merge-order-screen.yml]
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Pin source and native tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/order-setup" .task/merge-order/bench
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/order-llvm" > "$RUNNER_TEMP/order-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/order-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/order-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/order-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/order-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin 0105b22c5116f645f4e70fbd6d192ec168aa20f1
          for f in corpus.py measure.py; do git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/bench/$f > .task/merge-order/bench/$f; done
          git show 0105b22c5116f645f4e70fbd6d192ec168aa20f1:.task/helper-partition/multimodule.py > .task/merge-order/multimodule.py
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/order-setup/frozen-source.tar.gz"
          rustc -vV > "$RUNNER_TEMP/order-setup/rustc.txt"
      - name: Freeze diagnostic protocol without editing production source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.task/merge-order/multimodule.py');s=p.read_text()
          assert s.count("for mode in ['O0','O2']:")==2
          s=s.replace("for mode in ['O0','O2']:","for mode in ['O2']:")
          s=s.replace("'modes':['O0','O2']","'modes':['O2']")
          old="if mode=='O2':argv+=['--incremental-o2','--function-merging','after']"
          assert s.count(old)==1
          s=s.replace(old,"if mode=='O2':argv+=['--incremental-o2','--function-merging','before-and-after' if arm=='cand' else 'after']")
          assert s.count('len(SNAPS)*5')==1;s=s.replace('len(SNAPS)*5','len(SNAPS)*3')
          s=s.replace('099d0af969a51260355437603b77d3f9030d83bc','2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852')
          p.write_text(s)
          PY
          python3 -m py_compile .task/merge-order/*.py .task/merge-order/bench/*.py
          git diff --check
          git add .task/merge-order/bench .task/merge-order/multimodule.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze direct O2 merge-order screen; original source inputs and runtime gates retained'
          git rev-parse HEAD > "$RUNNER_TEMP/order-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/compiler-merge-order
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/compiler-merge-order
      - name: Build one release compiler for both arms
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/order-target" cargo build --locked --offline --release -p zil-cli > "$RUNNER_TEMP/order-setup/build.log" 2>&1
          mkdir -p "$RUNNER_TEMP/order-tools/after" "$RUNNER_TEMP/order-tools/before"
          cp "$RUNNER_TEMP/order-target/release/zil" "$RUNNER_TEMP/order-tools/after/zil"
          cp "$RUNNER_TEMP/order-target/release/zil" "$RUNNER_TEMP/order-tools/before/zil"
          sha256sum "$RUNNER_TEMP/order-tools/after/zil" "$RUNNER_TEMP/order-tools/before/zil" > "$RUNNER_TEMP/order-setup/compilers.sha256"
      - name: Same original runtime inputs and actual private/public edit histories
        run: |
          set -euo pipefail
          python3 .task/merge-order/multimodule.py --base "$RUNNER_TEMP/order-tools/after/zil" --candidate "$RUNNER_TEMP/order-tools/before/zil" --out "$RUNNER_TEMP/order-data" --rounds 5 2>&1 | tee "$RUNNER_TEMP/order-setup/screen.log"
      - name: Preserve all screen outcomes including failures
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,tarfile,hashlib,shutil
          t=Path(os.environ['RUNNER_TEMP']);d=Path('.task/merge-order/runs')/os.environ['GITHUB_RUN_ID'];d.mkdir(parents=True)
          for n in ('summary.json','rows.jsonl','runtime.jsonl','manifest.json','failures.json'):
              p=t/'order-data'/n
              if p.exists():shutil.copyfile(p,d/n)
          omitted=[]
          with tarfile.open(d/'raw.tar.gz','w:gz') as tar:
              for path,label in [(t/'order-setup','setup'),(t/'order-data','data')]:
                  if path.exists():
                      for p in path.rglob('*'):
                          if not p.is_file() or any(x in p.parts for x in ('incremental','semantic','objects')):continue
                          if p.read_bytes()[:4]==b'\x7fELF':omitted.append({'path':label+'/'+str(p.relative_to(path)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size});continue
                          tar.add(p,arcname=label+'/'+str(p.relative_to(path)))
          (d/'omitted-elf.json').write_text(json.dumps(omitted,indent=2)+'\n')
          f=t/'order-setup/source.txt';receipt={'baseline':'2fbf51efff4ff21f7566aeb5e6e0e105ba8cc852','source':f.read_text().strip() if f.exists() else None,'recipe':os.environ['GITHUB_SHA'],'scope':'unchanged compiler binary, after vs before-and-after existing explicit O2 policies; no new production change','status_before_preservation':os.environ['PRIOR_STATUS'],'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in d.iterdir()},'main_modified':False,'external_ai_review':False}
          (d/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          assert (d/'raw.tar.gz').stat().st_size<48*1024*1024
          PY
          git fetch --no-tags origin refs/heads/task/compiler-merge-order
          expected="$GITHUB_SHA"; if test -f "$RUNNER_TEMP/order-setup/source.txt"; then expected="$(cat "$RUNNER_TEMP/order-setup/source.txt")"; fi
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git add -- ".task/merge-order/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve merge-order dispatch screen $GITHUB_RUN_ID including unfavorable observations"
          git push origin HEAD:refs/heads/task/compiler-merge-order
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: merge-order-${{ github.run_id }}
          path: .task/merge-order/runs/${{ github.run_id }}
          retention-days: 30
