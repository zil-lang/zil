name: Complete compiler consolidation evidence
on:
  push:
    branches: [task/compiler-consolidation]
    paths: [.github/workflows/compiler-consolidation-evidence.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Refresh the same read-only branch and evidence audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap,os
          s=Path('.github/workflows/compiler-consolidation-audit.yml').read_text();m=list(re.finditer(r'^      - (?:name|uses):',s,re.M));out=Path(os.environ['RUNNER_TEMP'])/'audit-commands';out.mkdir();n=0
          for i,k in enumerate(m):
              part=s[k.start():m[i+1].start() if i+1<len(m) else len(s)]
              if part.startswith('      - name:') and '        run: |\n' in part:
                  (out/f'{n}.sh').write_text(textwrap.dedent(part.split('        run: |\n',1)[1]));n+=1
          assert n==2
          PY
          bash "$RUNNER_TEMP/audit-commands/0.sh"
          bash "$RUNNER_TEMP/audit-commands/1.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os,zipfile
          t=Path(os.environ['RUNNER_TEMP']);root=t/'compiler-audit';dst=t/'complete-evidence';dst.mkdir()
          with zipfile.ZipFile(dst/'audit-with-task-evidence.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():z.write(p,str(p.relative_to(root)))
          assert (dst/'audit-with-task-evidence.zip').stat().st_size<48*1024*1024
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: compiler-consolidation-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/complete-evidence
          retention-days: 30
