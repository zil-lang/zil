name: Record signature-cache integration
on:
  push:
    branches: [task/G10.5.1.3]
    paths: [.github/workflows/compiler-signature-merge.yml]
permissions:
  contents: write
  actions: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify accepted source, preserve CI receipts and update only compiler rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,datetime,hashlib,json,os,pathlib,re,subprocess,zipfile,io
          P=pathlib.Path;repo='zil-lang/zil';merge='21b1feefc47e05d5d88a7d4738034831e8bc17f0';head='cadc656c0caefa70827f7ec1e608a04291c8ae9f';tree='b9965bfe560203e51d9b8b857162a24944bfb27b'
          def cmd(a,**kw):return subprocess.check_output(list(map(str,a)),**kw)
          def api(path):return json.loads(cmd(['gh','api','repos/'+repo+'/'+path],text=True))
          pr=api('pulls/70');assert pr['merged'] and pr['merge_commit_sha']==merge and pr['head']['sha']==head
          diff=api('compare/d6fcaeaf9a5ca9d26400b6d7de5e3c82a5c23878...'+merge)
          paths=['crates/zil-types/src/incremental.rs','crates/zil-driver/src/function_incremental_tests.rs','docs/guide/incremental-types.md']
          assert sorted(f['filename'] for f in diff['files'])==sorted(paths)
          for path in paths:assert api('contents/'+path+'?ref='+merge)['sha']==api('contents/'+path+'?ref='+head)['sha']
          out=P('.task/G10.5.1.3/merge')/os.environ['GITHUB_RUN_ID'];out.mkdir(parents=True)
          receipts=[]
          for run,artifact in [(42749689391,13733793789),(42749689454,13734520809)]:
              r=api('actions/runs/'+str(run));assert r['head_sha']==head and r['conclusion']=='success'
              data=cmd(['gh','api','repos/'+repo+'/actions/artifacts/'+str(artifact)+'/zip'])
              (out/(str(run)+'.zip')).write_bytes(data)
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  assert z.read('source-tree.txt').decode().strip()==tree
                  result=json.loads(z.read('compact-results.json'));assert all(v=='success' for v in result['steps'].values())
                  assert all(v['totals']['failed']==0 for v in result['logs'].values())
                  consumer=json.loads(z.read('native-consumer.json'));assert consumer['status']=='Pass'
              receipts.append({'run':run,'artifact':artifact,'sha256':hashlib.sha256(data).hexdigest(),'results':result,'native_builds':len(consumer['builds']),'native_observations':len(consumer['observations'])})
          row3='| G10.5.1.3 | 标量Types签名依赖分面及主线Rust对照 | 已合入 | — | Chat直接复核 · PR70 | PR70/cadc656c已合main21b1feef；两个原受测blob及incremental-types机制说明已核。官方/研究LLVM同树workspace5864/0、reference5750/0、text70/0、严格检查与原生分配失败控制通过；主线仅多出PR71测试恢复，完整保留。历史加权0.18%–0.37%不夸大，见[合入收据](records/compiler-signature-merge.json)。 |'
          row4='| G10.5.1.4 | 拥有闭包的缓冲区扩容内联边界与完整编译等待 | 进行中 | P1 | Chat编译专项 · PR72草稿 | task/G10.5.1.4冻结九类语料和四频率假设；容量快路可内联、原增长事务单独保留，当前Verify/分配失败/清理不变。首轮探针链接模式错误已保留并修正，复测42752341271与独立全工作区CI仍待验收；不得据CI状态单独判定性能通过。 |'
          parent='| G10.5.1 | 编译效率复核、加权性能与真实覆盖扩展 | 进行中 | P1 | Chat编译专项 | PR65普通分区回退及PR70实际签名依赖已合main；缩并/索引复用实验未采用，历史保全。闭包专项G10.5.1.4继续，按频率加权的绝对等待和生成程序质量验收；不关闭一般语义增量、稳定身份、Fresh及真实大型应用父门。 |'
          stamp=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat()
          record={'pr':70,'head':head,'merged_commit':merge,'tested_tree':tree,'production_blobs_equal':True,'changed_paths':paths,'ci':receipts,'review':'current Chat direct review under explicit owner authorization, not external/non-author review','main_advance':'PR71 changed tests only; retained in merge','closure_pr':72,'closure_acceptance':'Pending weighted and runtime evidence','updated_at':stamp}
          for attempt in range(3):
              cmd(['git','fetch','--depth=1','--no-tags','origin','refs/heads/goal'])
              before=cmd(['git','rev-parse','FETCH_HEAD'],text=True).strip();work=P(os.environ['RUNNER_TEMP'])/('goal-record-'+str(attempt))
              cmd(['git','worktree','add','--detach',work,before]);p=work/'goal.md';s=p.read_text()
              assert len(re.findall(r'^\| G10\.5\.1\.3 \|.*$',s,re.M))==1
              s=re.sub(r'^\| G10\.5\.1\.3 \|.*$',lambda _:row3,s,flags=re.M)
              s=re.sub(r'^\| G10\.5\.1 \|.*$',lambda _:parent,s,flags=re.M)
              if not re.search(r'^\| G10\.5\.1\.4 \|',s,re.M):s=s.replace(row3,row3+'\n'+row4,1)
              p.write_text(s);record['goal_read_before']=before
              q=work/'records/compiler-signature-merge.json';q.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
              cmd(['git','-C',work,'add','goal.md','records/compiler-signature-merge.json'])
              cmd(['git','-C',work,'-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Record accepted scalar signature dependencies and active closure experiment'])
              push=subprocess.run(['git','-C',str(work),'push','origin','HEAD:refs/heads/goal'])
              if push.returncode==0:record['goal_commit']=cmd(['git','-C',work,'rev-parse','HEAD'],text=True).strip();break
          else:raise RuntimeError('goal changed concurrently; no force push')
          read=api('contents/goal.md?ref=goal');text=base64.b64decode(read['content']).decode();assert row3 in text and 'G10.5.1.4' in text;record['goal_blob_readback']=read['sha']
          branch='task/scalar-signature-dependencies'
          reference=api('git/ref/heads/'+branch);assert reference['object']['sha']==head
          retired=subprocess.run(['gh','api','-X','DELETE','repos/'+repo+'/git/refs/heads/'+branch],capture_output=True,text=True)
          record['merged_branch_delete_exit']=retired.returncode;record['merged_branch_delete_stderr']=retired.stderr
          if retired.returncode==0:
              check=subprocess.run(['gh','api','repos/'+repo+'/git/ref/heads/'+branch],capture_output=True,text=True)
              record['merged_branch_deleted']=check.returncode!=0 and '404' in check.stderr
          else:record['merged_branch_deleted']=False
          (out/'receipt.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'goal':record['goal_commit'],'merged':merge,'deleted':record['merged_branch_deleted']},indent=2))
          PY
          git fetch --no-tags origin refs/heads/task/G10.5.1.3
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- ".task/G10.5.1.3/merge/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve signature merge receipt $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/task/G10.5.1.3
