name: Helper partition with tail dispatch locality
on:
  push:
    branches: [task/closure-helper-partition]
    paths: [.github/workflows/compiler-helper-dispatch.yml]
permissions:
  contents: write
concurrency:
  group: compiler-helper-partition
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reuse exact tool and evidence commands from the prior immutable protocol
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/helper-step.py" <<'PY'
          from pathlib import Path
          import os,sys,textwrap,subprocess
          text=Path('.github/workflows/compiler-helper-selective.yml').read_text()
          name=sys.argv[1]
          segment=text.split('      - name: '+name+'\n',1)[1].split('        run: |\n',1)[1].split('\n      - ',1)[0]
          shell=textwrap.dedent(segment)
          if name=='Freeze the policy change without modifying benchmark inputs':
              assert shell.count('.task/helper-partition/revise_imports.py')==1
              shell=shell.replace('.task/helper-partition/revise_imports.py','.task/helper-partition/preserve_dispatch.py')
              shell=shell.replace('Freeze small-source import policy and large-body invalidation control; original fixtures unchanged','Freeze structural tail-dispatch locality; all benchmark inputs and gates unchanged')
          subprocess.run(['bash','-euo','pipefail','-c',shell],check=True)
          PY
          python3 "$RUNNER_TEMP/helper-step.py" 'Pin the same baseline and native tools'
      - name: Freeze source affinity while retaining every original input
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Freeze the policy change without modifying benchmark inputs'
      - name: Full backend LLVM native and strict controls
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/helper-step.py" 'Full backend LLVM and strict controls'
          grep 'same_argument_return_dispatch_preserves_optimizer_locality_not_function_identity .*ok' "$RUNNER_TEMP/helper-setup/backend.log"
      - name: Independent same-profile release compilers
        id: build
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Independent same-profile release compilers'
      - name: Same multi-module requests and runtime quality screen
        id: screen
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Unchanged multi-module timing and runtime screen'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: helper-dispatch-screen-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/helper-multi/summary.json
            ${{ runner.temp }}/helper-multi/manifest.json
            ${{ runner.temp }}/helper-multi/rows.jsonl
            ${{ runner.temp }}/helper-multi/runtime.jsonl
            ${{ runner.temp }}/helper-multi/screen.json
            ${{ runner.temp }}/helper-setup/source.txt
          retention-days: 30
      - name: Multi-module API Clang failure and cleanup observations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Multi-module API Clang failures and cleanup order'
      - name: Original fixed eight-case weighted matrix
        if: ${{ !cancelled() && steps.screen.outputs.accepted == 'true' }}
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Original frozen weighted matrix after the runtime screen'
      - name: Original allocation-failure and cleanup controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Original allocation-failure and cleanup controls'
      - name: Original active and inactive runtime gates
        if: ${{ !cancelled() && steps.screen.outputs.accepted == 'true' }}
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Original active and inactive runtime gates'
      - name: Existing native consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 "$RUNNER_TEMP/helper-step.py" 'Existing native consumers'
      - name: Preserve all original failures and current observations without selection
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap,subprocess
          text=Path('.github/workflows/compiler-helper-partition.yml').read_text()
          tail=text.split('      - name: Preserve all outcomes and source identities\n',1)[1]
          tail=tail.split('        run: |\n',1)[1].split('      - uses: actions/upload-artifact@',1)[0]
          script=textwrap.dedent(tail)
          assert script.startswith('set -euo pipefail')
          script=script.replace("'main_modified':False,", "'prior_rejected_runs':[42850687888,42857487501],'source_import_cost_limit':32,'tail_dispatch_locality':True,'main_modified':False,")
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: helper-dispatch-${{ github.run_id }}
          path: .task/helper-partition/runs/${{ github.run_id }}
          retention-days: 30
