name: Fixed normalized pipeline full matrix recheck
on:
  push:
    branches: [task/compiler-normalized-merging]
    paths: [.github/workflows/compiler-normalized-matrix-recheck.yml]
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reuse exact prior commands without overwriting fixed source or fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap,os
          s=Path('.github/workflows/compiler-normalized-merging.yml').read_text();marks=list(re.finditer(r'^      - (?:name|uses):',s,re.M));out=Path(os.environ['RUNNER_TEMP'])/'normalized-commands';out.mkdir();count=0
          for i,mark in enumerate(marks):
              chunk=s[mark.start():marks[i+1].start() if i+1<len(marks) else len(s)]
              if not chunk.startswith('      - name:') or '        run: |\n' not in chunk:continue
              code=textwrap.dedent(chunk.split('        run: |\n',1)[1])
              if count==0:code=code.split('for f in corpus.py measure.py;',1)[0]
              (out/f'{count}.sh').write_text(code);count+=1
          assert count==10,count
          PY
          bash "$RUNNER_TEMP/normalized-commands/0.sh"
      - name: Preserve first failed code-identity assumption and freeze corrected scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:crates/zil-llvm-api/src/lib.rs)" = df19630237c945a04cff90e9bcea05ced09acaf7
          test "$(git rev-parse HEAD:crates/zil-llvm-api/src/native.rs)" = 113d27b888396f6235a2062506fa0a29f378093d
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.task/normalized-merging/bench/measure.py');s=p.read_text();old="if not eq and case['group']!='resource':raise AssertionError('unaffected machine code changed')"
          new="if not eq and mode!='O2':raise AssertionError('unaffected O0 machine code changed')"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          # Both arms still execute and validate every original native output.
          # O2 code is allowed to change because the fixed pipeline changes for
          # every O2 request. Every changed graph/trait runtime remains measured.
          PY
          python3 -m py_compile .task/normalized-merging/*.py .task/normalized-merging/bench/*.py .task/normalized-merging/neighbors/*.py
          git diff --check
          git add .task/normalized-merging/bench/measure.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Correct O2-only changed-code scope while preserving all source, output and runtime controls'
          git rev-parse HEAD > "$RUNNER_TEMP/normalized-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/compiler-normalized-merging
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/compiler-normalized-merging
          rustc -vV > "$RUNNER_TEMP/normalized-setup/rustc.txt"
      - name: Separate same-profile release compilers
        id: build
        run: bash "$RUNNER_TEMP/normalized-commands/3.sh"
      - name: Complete original eight-case and every output
        run: bash "$RUNNER_TEMP/normalized-commands/6.sh"
      - name: Complete multi-module Check O0 O2 histories
        run: bash "$RUNNER_TEMP/normalized-commands/7.sh"
      - name: Repeat exact allocation failure and cleanup observations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/normalized-commands/4.sh"
      - name: Repeat all original active and inactive runtime guards
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/normalized-commands/5.sh"
      - name: Existing native resource consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/normalized-commands/8.sh"
      - name: Preserve every original failure and current result without renormalization
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: bash "$RUNNER_TEMP/normalized-commands/9.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: normalized-matrix-recheck-${{ github.run_id }}
          path: .task/normalized-merging/runs/${{ github.run_id }}
          retention-days: 30
