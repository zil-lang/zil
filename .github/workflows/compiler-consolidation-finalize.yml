name: Finalize compiler branch consolidation
on:
  push:
    branches: [task/compiler-consolidation]
    paths: [.github/workflows/compiler-consolidation-finalize.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: compiler-branch-retirement
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Review late evidence heads and publish only source-neutral decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile .task/compiler-consolidation/finalize.py
          python3 .task/compiler-consolidation/finalize.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: compiler-consolidation-final-${{ github.run_id }}
          path: ${{ runner.temp }}/retirement
          retention-days: 30
