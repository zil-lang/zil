name: Record accepted resident compiler stage
on:
  push:
    branches: [task/G10.5.1.8]
    paths: [.github/workflows/compiler-resident-stage-record.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify accepted production and update only relevant goal records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess as s,pathlib as p,json,os,datetime
          root=p.Path.cwd();repo='zil-lang/zil'
          def run(*cmd,cwd=root,check=True):return s.run(cmd,cwd=cwd,text=True,capture_output=True,check=check)
          def api(path):return json.loads(run('gh','api',f'repos/{repo}/'+path).stdout)
          head='e19b40dc662fa1c91603acebf5e74bcb5fdce883';merged='947063a63880b375889ff30b3beba6151abf55f3';tree='53a96a7507fbedb0d00c342e1609693320f03f96'
          pr=api('pulls/78');assert pr['merged'] and pr['head']['sha']==head and pr['merge_commit_sha']==merged
          assert api('git/commits/'+merged)['tree']['sha']==tree
          for rid in [42814194622,42814194709,42814194686]:
              r=api('actions/runs/'+str(rid));assert r['head_sha']==head and r['conclusion']=='success',(rid,r['conclusion'])
          run('git','fetch','--no-tags','origin','refs/heads/main')
          main=run('git','rev-parse','FETCH_HEAD').stdout.strip()
          run('git','merge-base','--is-ancestor',merged,main)
          blobs={'crates/zil-cli/src/main.rs':'edcef8b3bc171929b6efa05aeb6624e40a93434d','crates/zil-cli/src/resident.rs':'1bd388c12161c45a91f48409a1b7dde415f765ca','crates/zil-cli/tests/resident_session.rs':'16f15eff626905ead65a9e5bc901e57be37ac1cb','docs/guide/resident-compilation.md':'caad9c0580168c29ee281b6405713ea250d35a06'}
          for path,blob in blobs.items():assert run('git','rev-parse',merged+':'+path).stdout.strip()==blob
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat()
          accepted={'task':'G10.5.1.9','pr':78,'source':head,'merged_commit':merged,'tested_tree':tree,'production_blobs':blobs,'ci_runs':[42814194622,42814194709,42814194686],'ci_each':{'workspace':5893,'reference':5779,'text':70,'failed':0},'paired_run':42813461514,'paired_scope':'same release compiler fresh process versus explicit resident, conservative Python adapter startup included; direct-spawn repeat42818577639 remains separate','compile_requests':1728,'current_verify_requests':1728,'formal_requests':1440,'native_output_checks':3456,'equal_machine_pairs':576,'runtime_measurements':192,'weighted_reduction_range_percent':[0.8784,9.9978],'memory':{'largest_case_observed_rss_mib':905.52,'raw_entries':32,'default_reset_requests':64,'hard_byte_limit':False},'retention_probe':{'requests':80,'resets':5,'fresh_comparisons':10,'max_rss_mib':56.258},'review':'current Chat direct source review and mechanical evidence audit, explicitly authorized; not external/non-author review','main_readback':main,'updated_at':now}
          rejected={'tasks':['G10.5.1.7','G10.5.1.8'],'PR77':'Not accepted: added inactive neighbors run42800092569 show10.6%-35.6% runtime regression','package_candidate':'9c86678fcff3a0a8b6ffff6c17de487d8aab928c','package_run':42814450893,'previous_unactivated_run':42809768403,'compile_requests':1800,'formal_requests':1500,'current_verify_requests':1728,'outputs':3672,'active_runtime_measurements':900,'neighbor_runtime_measurements':480,'failure_cleanup_observations':864,'weighted_reduction_range_percent':[0.998,2.838],'runtime_blocker':{'case':'owned32/base/depth0','base_ms':20.625702,'candidate_ms':24.402913,'rust_ms':24.085234,'increase_percent':18.3131},'neighbor_introduced_regression_fixed':True,'limits_or_inputs_weakened':False,'merged':False,'evidence':'https://github.com/zil-lang/zil/blob/04e6b1226e303995583a17ee3e88e9ca76587a01/.task/G10.5.1.8/RESULTS.md','updated_at':now}
          rows={
          'G10.5.1':'| G10.5.1 | 编译效率复核、加权性能与真实覆盖扩展 | 进行中 | P1 | Chat编译专项 | PR65/70/75/76及PR78已合；常驻CLI成为显式产品入口，保留当前Verify与内存代价。析构.7/.8因运行反例未采用；按实际频率/绝对等待和运行质量继续，不关闭一般语义增量、稳定身份、Fresh、Cranelift或大型应用父门。 |',
          'G10.5.1.7':'| G10.5.1.7 | 大量拥有环境的析构边界与邻近运行质量 | 实验完成·未采用 | P1 | Chat直接复核 | PR77/01d2ee43主矩阵有1.57%–3.24%收益，但42800092569的未调用/少活跃环境运行慢10.6%–35.6%，NoGo未合；完整失败与原证据保留，见[析构裁决](records/compiler-destructor-boundaries.json)。 |',
          'G10.5.1.8':'| G10.5.1.8 | 真实Package捕获的空环境内联析构入口 | 实验完成·未采用 | P1 | Chat直接复核 | 9c86678f/42814450893实际激活，1800编译及864分配失败/清理观察通过，邻近空环境退化已消除；32闭包低负载运行仍慢18.3%越过10%门，四频率省1.00%–2.84%也不合入。首轮未激活失败保留。 |',
          'G10.5.1.9':'| G10.5.1.9 | 显式常驻CLI、当前输入验证及缓存寿命 | 已合入 | — | Chat直接复核 · PR78 | main947063a6/tree53a96a75，四生产/测试/说明文件；两套完整CI各5893/5779/70通过。1728当前Verify/576机器代码相同、80编辑跨5次全会话清空；最大样本RSS约906MiB，非硬字节界。直接启动同机Rust补测独立保存，见[合入收据](records/compiler-resident-merge.json)。 |'}
          for attempt in range(3):
              run('git','fetch','--no-tags','origin','refs/heads/goal');before=run('git','rev-parse','FETCH_HEAD').stdout.strip()
              work=p.Path(os.environ['RUNNER_TEMP'])/('goal-resident-'+str(attempt));run('git','worktree','add','--detach',str(work),before)
              f=work/'goal.md';text=f.read_text();lines=text.splitlines();seen=set();out=[]
              for line in lines:
                  key=next((key for key in rows if line.startswith('| '+key+' |')),None)
                  if key:
                      assert key not in seen;seen.add(key);line=rows[key]
                  out.append(line)
              assert {'G10.5.1','G10.5.1.7'}<=seen
              index=out.index(rows['G10.5.1.7'])+1
              for key in ['G10.5.1.8','G10.5.1.9']:
                  if key not in seen:out.insert(index,rows[key]);index+=1
              f.write_text('\n'.join(out)+'\n')
              (work/'records').mkdir(exist_ok=True)
              for name,data in [('compiler-resident-merge.json',accepted),('compiler-destructor-boundaries.json',rejected)]:
                  (work/'records'/name).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
              run('git','add','goal.md','records/compiler-resident-merge.json','records/compiler-destructor-boundaries.json',cwd=work)
              run('git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Record accepted resident CLI and retained destructor runtime counterexamples',cwd=work)
              push=run('git','push','origin','HEAD:refs/heads/goal',cwd=work,check=False)
              if push.returncode==0:break
          else:raise RuntimeError('goal moved repeatedly; no force push')
          goal=run('git','rev-parse','HEAD',cwd=work).stdout.strip();run('git','fetch','--no-tags','origin','refs/heads/goal');remote=run('git','rev-parse','FETCH_HEAD').stdout.strip();run('git','merge-base','--is-ancestor',goal,remote)
          readback=run('git','show',remote+':goal.md').stdout;assert all(row in readback for row in rows.values())
          # Only the owned, completed production branch may be retired.
          branch='task/resident-compilation';ref=api('git/ref/heads/'+branch);assert ref['object']['sha']==head
          run('git','merge-base','--is-ancestor',head,main)
          deletion=run('git','push','origin',':refs/heads/'+branch,check=False)
          receipt={'accepted_main':merged,'main_read':main,'exact_production_tree':tree,'goal_read_before':before,'goal_commit':goal,'goal_readback':remote,'goal_blob':run('git','rev-parse',remote+':goal.md').stdout.strip(),'production_branch_deleted':deletion.returncode==0,'delete_stderr':deletion.stderr,'other_branches_touched':False,'updated_at':now}
          dst=root/'.task/G10.5.1.8/coordination';dst.mkdir(exist_ok=True);(dst/'resident-stage.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          run('git','fetch','--no-tags','origin','refs/heads/task/G10.5.1.8');assert run('git','rev-parse','FETCH_HEAD').stdout.strip()==os.environ['GITHUB_SHA']
          run('git','add','.task/G10.5.1.8/coordination/resident-stage.json')
          run('git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Preserve resident-stage goal and branch-cleanup receipt')
          run('git','push','origin','HEAD:refs/heads/task/G10.5.1.8');print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
