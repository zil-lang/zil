name: Resident compiler memory experiment
on:
  push:
    branches: [task/compiler-resident-session]
    paths: [.github/workflows/compiler-resident-session.yml]
permissions:
  contents: write
concurrency:
  group: compiler-resident-session
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Pinned tools and original corpus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resident-setup" .task/resident/bench
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          sudo apt-get update -qq
          sudo apt-get install -y g++ zstd binutils libzstd1 libxml2 zlib1g
          python3 tools/llvm/install.py --prefix "$RUNNER_TEMP/resident-llvm" > "$RUNNER_TEMP/resident-setup/llvm.log" 2>&1
          echo "ZIL_CLANG=$RUNNER_TEMP/resident-llvm/bin/clang" >> "$GITHUB_ENV"
          echo "ZIL_LLVM_LIB_DIR=$RUNNER_TEMP/resident-llvm/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/resident-llvm/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/resident-llvm/bin" >> "$GITHUB_PATH"
          git fetch --depth=1 --no-tags origin 95af0f0c205a0892e6087f5304ad9981461a7fed
          for f in corpus.py measure.py; do git show 95af0f0c205a0892e6087f5304ad9981461a7fed:.task/G10.5.1.3/bench/$f > .task/resident/bench/$f; done
          python3 .task/resident/prepare.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.task/resident/bench/measure.py');s=p.read_text().replace('bufsize=0)','bufsize=-1)');p.write_text(s)
          PY
          python3 -m py_compile .task/resident/*.py .task/resident/bench/*.py
          rustfmt --edition 2024 crates/zil-driver/examples/resident_session.rs
          git diff --check
          git add -- .task/resident/worker.rs .task/resident/bench crates/zil-driver/examples/resident_session.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze runnable persistent session prototype and exact paired protocol'
          git rev-parse HEAD > "$RUNNER_TEMP/resident-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/compiler-resident-session
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/compiler-resident-session
      - name: Strict example check and same-profile binaries
        id: build
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/resident-target"
          cargo clippy --locked --offline -p zil-driver --features llvm-api --example resident_session -- -D warnings 2>&1 | tee "$RUNNER_TEMP/resident-setup/clippy.log"
          cargo build --locked --offline --release -p zil-cli -p zil-driver --features zil-driver/llvm-api --bin zil --example resident_session 2>&1 | tee "$RUNNER_TEMP/resident-setup/build.log"
          rustc -vV > "$RUNNER_TEMP/resident-setup/rustc.txt"
      - name: Fresh errors, recovery and explicit memory clearing
        run: |
          set -euo pipefail
          python3 .task/resident/controls.py --cli "$RUNNER_TEMP/resident-target/release/zil" --worker "$RUNNER_TEMP/resident-target/release/examples/resident_session" --out "$RUNNER_TEMP/resident-controls" 2>&1 | tee "$RUNNER_TEMP/resident-setup/controls.log"
      - name: Full fixed eight-case protocol with memory and request latency
        run: |
          set -euo pipefail
          python3 .task/resident/bench/measure.py --base "$RUNNER_TEMP/resident-target/release/zil" --candidate "$RUNNER_TEMP/resident-target/release/examples/resident_session" --out "$RUNNER_TEMP/resident-data" --rounds 5 2>&1 | tee "$RUNNER_TEMP/resident-setup/measure.log"
      - name: Preserve all outcomes without main integration
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,json,tarfile,hashlib,shutil
          P=pathlib.Path;t=P(os.environ['RUNNER_TEMP']);dst=P('.task/resident/runs')/os.environ['GITHUB_RUN_ID'];dst.mkdir(parents=True)
          data=t/'resident-data'
          for name in ('manifest.json','summary.json','rows.jsonl','cells.json','failures.json','equivalence.json','runtime.jsonl'):
              if (data/name).exists():shutil.copyfile(data/name,dst/name)
          if (t/'resident-controls/summary.json').exists():shutil.copyfile(t/'resident-controls/summary.json',dst/'controls.json')
          with tarfile.open(dst/'raw.tar.gz','w:gz') as tar:
              for p,label in [(t/'resident-setup','setup'),(t/'resident-controls','controls'),(data/'logs','logs'),(data/'runtime-logs','runtime-logs'),(data/'corpus','corpus')]:
                  if p.exists():tar.add(p,arcname=label)
          assert (dst/'raw.tar.gz').stat().st_size<48*1024*1024
          source=t/'resident-setup/source.txt'
          receipt={'baseline_production':'3e4a2a2ae368380e86ea99da32d7f3eef68cf3b4','source':source.read_text().strip() if source.exists() else None,'recipe':os.environ['GITHUB_SHA'],'status':os.environ['PRIOR_STATUS'],'scope':'resident research client over existing raw CompilationSession; no new codegen or safety bypass','files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dst.iterdir()},'main_modified':False,'external_ai_review':False,'acceptance':'Pending full evidence audit; not production daemon'}
          (dst/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PY
          git fetch --no-tags origin refs/heads/task/compiler-resident-session
          expected="$GITHUB_SHA"; if test -f "$RUNNER_TEMP/resident-setup/source.txt"; then expected="$(cat "$RUNNER_TEMP/resident-setup/source.txt")"; fi
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git add -- ".task/resident/runs/$GITHUB_RUN_ID"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve resident experiment $GITHUB_RUN_ID including any failure"
          git push origin HEAD:refs/heads/task/compiler-resident-session
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: compiler-resident-${{ github.run_id }}
          path: .task/resident
          retention-days: 30
