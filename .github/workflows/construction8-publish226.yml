name: Publish exact stage 226
on:
  push:
    branches: [chore/construction8-resume]
    paths: [.github/workflows/construction8-publish226.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5be89dfb36b1f927524008526ae647f3c4a03e59
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact bytes, ancestry and commit before isolated publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          encoded=''''''
          records=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
          parent='5be89dfb36b1f927524008526ae647f3c4a03e59';root=pathlib.Path.cwd()
          for record in records:
              raw=record['raw'];assert '\nparent '+parent+'\n' in raw
              for path,before,ops,after in record['edits']:
                  p=root/path
                  assert p.resolve().is_relative_to(root) and (path.startswith('crates/') or path.startswith('examples/mainline/shared_product_capture226/'))
                  old=p.read_bytes() if p.exists() else b''
                  assert hashlib.sha256(old).hexdigest()==before,path
                  lines=old.decode().splitlines(keepends=True)
                  for start,end,text in reversed(ops):lines[start:end]=[text]
                  data=''.join(lines).encode();assert hashlib.sha256(data).hexdigest()==after,path
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              subprocess.run(['git','add','--all'],check=True)
              tree=subprocess.check_output(['git','write-tree'],text=True).strip();assert raw.startswith('tree '+tree+'\n')
              sha=subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'],input=raw,text=True).strip()
              assert sha==record['sha'];subprocess.run(['git','reset','--hard',sha],check=True);parent=sha
          assert parent=='35b97d2bece94a884bfc6b6edd474081f6105e3a'
          ref='refs/heads/impl/226-shared-product-capture'
          current=subprocess.check_output(['git','ls-remote','origin',ref],text=True).strip()
          assert not current or current.split()[0]==parent,'Different work already present'
          if not current:subprocess.run(['git','push','--force-with-lease='+ref+':','origin',parent+':'+ref],check=True)
          assert subprocess.check_output(['git','ls-remote','origin',ref],text=True).split()[0]==parent
          print('Published author candidate',parent,'not independent approval or merge')
          PY
