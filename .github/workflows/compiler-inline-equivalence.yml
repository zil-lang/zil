name: Inline then equivalence screen
on:
  push:
    branches: [task/compiler-inline-equivalence]
    paths: [.github/workflows/compiler-inline-equivalence.yml]
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Load the original pinned setup and measurement protocol
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap,os
          s=Path('.github/workflows/compiler-merge-position.yml').read_text();marks=list(re.finditer(r'^      - (?:name|uses):',s,re.M));out=Path(os.environ['RUNNER_TEMP'])/'inline-commands';out.mkdir();count=0
          for i,mark in enumerate(marks):
              chunk=s[mark.start():marks[i+1].start() if i+1<len(marks) else len(s)]
              if not chunk.startswith('      - name:') or '        run: |\n' not in chunk:continue
              code=textwrap.dedent(chunk.split('        run: |\n',1)[1]).replace('refs/heads/task/compiler-merge-order','refs/heads/task/compiler-inline-equivalence')
              code=code.replace('raw normalize before-inline after-inline after-cleanup default-expanded','raw inline-first inline-attrs inline-clean default-expanded')
              (out/f'{count}.sh').write_text(code);count+=1
          assert count==6,count
          PY
          bash "$RUNNER_TEMP/inline-commands/0.sh"
      - name: Freeze actual extra-inliner implementations without deleting original O2 work
        run: |
          set -euo pipefail
          python3 .task/merge-order/inline_probe.py 2>&1 | tee "$RUNNER_TEMP/position-setup/generation.log"
          rustfmt --edition 2024 crates/zil-llvm-api/src/lib.rs
          python3 -m py_compile .task/merge-order/*.py .task/merge-order/bench/*.py
          git diff --check
          git diff > "$RUNNER_TEMP/position-setup/research.patch"
          git add crates/zil-llvm-api/src/research_position.rs .task/merge-order
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze extra-inline/equivalence pipelines and exact original held-out inputs'
          git rev-parse HEAD > "$RUNNER_TEMP/position-setup/source.txt"
          git fetch --no-tags origin refs/heads/task/compiler-inline-equivalence
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/task/compiler-inline-equivalence
          rustc -vV > "$RUNNER_TEMP/position-setup/rustc.txt"
      - name: External function address identities under every candidate pipeline
        run: bash "$RUNNER_TEMP/inline-commands/2.sh"
      - name: One release compiler for all direct calls
        run: bash "$RUNNER_TEMP/inline-commands/3.sh"
      - name: Equal and unequal dispatch, pipeline and single-file closure cases
        run: bash "$RUNNER_TEMP/inline-commands/4.sh"
      - name: Preserve all observations without claiming a production result
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: bash "$RUNNER_TEMP/inline-commands/5.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: inline-equivalence-${{ github.run_id }}
          path: .task/merge-order/positions-runs/${{ github.run_id }}
          retention-days: 30
